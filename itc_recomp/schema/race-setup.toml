# One of a car object's 32-byte decals (+96 six, +288 forty; known-data's
# "car object"). The same layout as car-makers.toml's CarMakersCarDecal.
[CarDecal]
# measures from AccessorCarDecal (vehicle-accessors), merged at the integration
measures = ["sub_820CC470.ret"]
size = 32
origin = "embedded"
fields = [
  { name = "flag_scale", offset = 0, type = "f32", note = "1.0 at the reset; a build's negative +0 mirrored (+28 = 1)" },
  { name = "scale", offset = 4, type = "f32" },
  { name = "x", offset = 8, type = "f32" },
  { name = "y", offset = 12, type = "f32" },
  { name = "angle", offset = 16, type = "f32", note = "Object344::SetFloat16" },
  { name = "packed", offset = 20, type = "u32", note = "a build's halfword +22 << 16 | byte +27 << 8 | byte +31" },
  { name = "packed_high", offset = 20, type = "u16" },
  { name = "packed_byte_22", offset = 22, type = "u8" },
  { name = "packed_byte_23", offset = 23, type = "u8" },
  { name = "image", offset = 24, type = "u32", note = "an image id or car model, -1 none" },
  { name = "mirrored", offset = 28, type = "u32" },
]

# One of a car object's three 20-byte entries at +1588 (probably the vinyl
# layers): two words, three floats (converted from a spec's or build's words).
[CarLayer]
size = 20
origin = "embedded"
fields = [
  { name = "a", offset = 0, type = "u32" },
  { name = "b", offset = 4, type = "u32" },
  { name = "f8", offset = 8, type = "f32" },
  { name = "f12", offset = 12, type = "f32" },
  { name = "f16", offset = 16, type = "f32" },
]

