# The schema of docs/functions/race-setup.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race's set-up (src/race_setup/): the car object (a racer record is
# one), its parts, the routes, the race data's 77 records and their entries.
# The race data itself ([0x826C5B2C], the measure's Race and Racers), the
# stage list (Stages), the course record and the event are other areas'.

# A car object (known-data's "car object"): a garage, rival or race car,
# 3,936 bytes as a racer record (the race's words from +3904). Built by
# Car::Init, Car::Clear, Car::SetModel and Car::FromBuild, its copies of the
# spec by Car::Refresh (car-specs.md). Other areas' views of it, split by the
# measure: CarMakersCar, PhysicsCar, GarageCar (its first 1,884 bytes).
[Car]
# measures from AccessorRacerRecord (vehicle-accessors), merged at the integration
measures = ["RacerRecord"]
measure = "Car"
size = 3936
origin = "embedded"
fields = [
  { name = "fault_head", offset = 0, type = "bytes", count = 72, note = "measure fault: the parts' resets (Car::ResetSettings, Car::ResetDecals6 and 40, sub_820CCC70, given car + 16, + 96, + 288, + 1568) are filed at +0 (up to the settings' +71), as are Car::DrawUpdate's scene model (+32) and Car::TickUpdate's car slots (+0, +16)" },
  { name = "paint_pick", offset = 0, type = "u16", note = "the paint (probably): -2 for event 1's rival; a build's +2792" },
  { name = "paint_2", offset = 2, type = "u16", note = "a build's +2792 too" },
  { name = "body_class", offset = 4, type = "u16", note = "-1 after the reset" },
