# The schema of docs/functions/race-menu.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 2 mode's race menu: the screen machine where the career's races
# start (the race mode, the event, its variant, the question, then
# Career::SetUpEvent), UI movie 1 (src/race_menu/). Its page objects
# ([0x826D8404], [0x826D8408]) are PageObjects and its menu ([0x826D840C]) a
# FrontEndMenu (menu-helpers.toml; the measure's new<28>@RaceMenu::Create,
# new<28>@RaceMenu::Create#2 and new<68>@RaceMenu::Create are theirs).

# The race menu's machine: a StateMachine (game-modes.toml) with the words of
# its own after it (docs/known-data.md, "race menu").
[RaceMenu]
measure = "RaceMenu"
size = 10152
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "11 a race set up, 12 a parking area location, 20 on day 2 after the close" },
  { name = "loaded", offset = 9608, type = "u32", note = "movie 1 loaded" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: Create and WaitForMovie go to state 9 (ScreenMachine::Reenter)" },
  { name = "delete_movies", offset = 9616, type = "u32", note = "nonzero: Unload deletes movies 1 and 16 and clears `loaded`" },
  { name = "page", offset = 9640, type = "u32", note = "3 the race mode, 4 the event, 5 the variant, 6 and 8 the question, 7 back, 9 leaving, 10 starting" },
  { name = "previous_page", offset = 9644, type = "u32" },
  { name = "menu_mode", offset = 9648, type = "u32", note = "the race mode again (the menu's cursor)" },
  { name = "unknown_9652", offset = 9652, type = "u32", note = "1 after Create" },
  { name = "debug_list", offset = 9656, type = "bytes", count = 60, note = "15 words (debug only)" },
  { name = "kept_event_cursor", offset = 9716, type = "u32", note = "the event cursor kept" },
  { name = "debug_count", offset = 9720, type = "u32", note = "debug_list's count" },
  { name = "variant", offset = 9724, type = "u32", note = "the variant picked" },
  { name = "unknown_9728", offset = 9728, type = "u32" },
  { name = "page_history", offset = 9732, type = "bytes", count = 44, note = "11 page words" },
  { name = "history_depth", offset = 9776, type = "u8" },
  { name = "refresh_texts", offset = 9780, type = "u32", note = "1: Update runs Refresh" },
  { name = "takes_input", offset = 9784, type = "u32", note = "the pages take input (Draw)" },
  { name = "answered", offset = 9788, type = "u32", note = "the question answered" },
  { name = "race_set_up", offset = 9792, type = "u32", note = "1 when Race::SetUp ran, 0 a parking area location" },
  { name = "back_from_question", offset = 9796, type = "u32" },
  { name = "unknown_9800", offset = 9800, type = "u32", note = "1 when the question is asked from page 5" },
  { name = "unknown_9804", offset = 9804, type = "u32" },
  { name = "leave_message", offset = 9808, type = "u32", note = "the message LeaveToHub posts (6)" },
  { name = "transitions_set_up", offset = 9812, type = "u32", note = "the transitions' first-time set-up done" },
  { name = "unknown_9816", offset = 9816, type = "u16", note = "cleared on every page change" },
  { name = "race_mode", offset = 9820, type = "u32", note = "0 to 2" },
  { name = "previous_race_mode", offset = 9824, type = "u32" },
  { name = "event_cursor", offset = 9828, type = "u32" },
  { name = "previous_event_cursor", offset = 9832, type = "u32" },
  { name = "scroll_flag", offset = 9836, type = "u32", note = "the event list's scroll: 1 up, 2 down" },
  { name = "first_event", offset = 9840, type = "u32" },
  { name = "last_event", offset = 9844, type = "u32" },
  { name = "variant_events", offset = 9848, type = "u32", note = "the events below it have a variant" },
  { name = "events", offset = 9852, type = "bytes", count = 120, note = "15 RaceMenuEvent" },
  { name = "visible_row", offset = 9972, type = "u32", note = "0 to 2" },
  { name = "previous_visible_row", offset = 9976, type = "u32" },
  { name = "event_kinds", offset = 9980, type = "bytes", count = 120, note = "15 RaceMenuEventKind" },
  { name = "variant_cursor", offset = 10100, type = "u32" },
  { name = "previous_variant_cursor", offset = 10104, type = "u32" },
  { name = "answered_no", offset = 10108, type = "u32", note = "1 after a no" },
  { name = "player_name", offset = 10112, type = "bytes", count = 20, note = "player 0's save +8 to +27" },
  { name = "money", offset = 10132, type = "u32" },
  { name = "day", offset = 10136, type = "u32", note = "at most 999" },
  { name = "weekday", offset = 10140, type = "u32" },
  { name = "save", offset = 10144, type = "u32", note = "player 0's save data (SaveData::Of)" },
  { name = "progress_bits", offset = 10148, type = "u32", note = "the save's +0x199E0: 0x20, 0x4 or 0x8, 0x10 open more events" },
]

# One of the machine's 15 event pairs (+9852): the measure meets them only
# by index into RaceMenu.
[RaceMenuEvent]
size = 8
origin = "embedded"
fields = [
  { name = "type", offset = 0, type = "u32", note = "0 to 14: StartEvent's location by it" },
  { name = "badge", offset = 4, type = "u32", note = "0 to 2" },
]

# One of the machine's 15 event kind pairs (+9980).
[RaceMenuEventKind]
size = 8
origin = "embedded"
fields = [
  { name = "kind", offset = 0, type = "u32" },
  { name = "variant_kind", offset = 4, type = "u32", note = "-1 none" },
]

# The type 2 mode (type2-mode.md) as the race menu's handlers see it (r4):
# only its message ring, which they post to.
[RaceMenuMode]
measures = ["RaceMenu::EventPage.r4", "RaceMenu::AskConfirm.r4", "RaceMenu::LeaveToHub.r4"]
size = 812
origin = "embedded"
storage = "dual"
fields = [
  { name = "messages", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (id, two words)" },
  { name = "message_count", offset = 804, type = "u32" },
  { name = "message_start", offset = 808, type = "u32", note = "the ring's first slot" },
]

[globals]
pages = { address = 0x826D8404, type = "ptr", to = "PageObject", note = "VirtualAlloc'ed by Create, freed by Destroy" }
pages2 = { address = 0x826D8408, type = "ptr", to = "PageObject", note = "a second page object: Draw runs Back when its page is 7" }
menu = { address = 0x826D840C, type = "ptr", to = "FrontEndMenu", note = "a front-end menu, first and last item 0" }
fade_out_counts = { address = 0x826A50E4, type = "u32", note = "the screen fades' fade-out counts (0 once done)" }
fade_in_counts = { address = 0x826A50DC, type = "u32", note = "the screen fades' fade-in counts (0 once done)" }
fade_in_passes = { address = 0x82001BEC, type = "u32", note = "ScreenFades::FadeIn's pass count (Start)" }
fade_out_passes = { address = 0x82001BF0, type = "u32", note = "ScreenFades::FadeOut's pass count" }
sound_manager = { address = 0x826C5C80, type = "u32", note = "the sound manager (sound-cues.md): slots 13 StopCue, 14 IsCuePlaying" }
boot_movie_list = { address = 0x826C5BAC, type = "bytes", count = 32, note = "the boot movies' list (boot-mode.md), set by Destroy on day 2" }
float_zero = { address = 0x82000A34, type = "u32", note = "0.0 (copied as bits onto the nodes)" }
float_2228 = { address = 0x82002228, type = "u32", note = "a float copied as bits onto the nodes' +12" }
float_a134 = { address = 0x8200A134, type = "u32", note = "a float copied as bits onto the nodes' +16" }
float_c34 = { address = 0x82000C34, type = "u32", note = "a float copied as bits onto the nodes' +12" }
scene_time = { address = 0x82001FB0, type = "f32", note = "the animation time Update tests for the scene's animation" }
variant_time = { address = 0x82001FD8, type = "f32", note = "the animation time Update tests for the variant's animation" }
