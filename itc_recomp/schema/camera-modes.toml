# The schema of docs/functions/camera-modes.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The camera modes (src/camera_modes/): the camera director (the race mode's
# member at +10512), its six views' cameras, the viewports they drive, the
# TV camera's paths, the cutscene and the camera animations.
#
# Measure splits left to other areas (not described here): the vehicle
# (car-physics' Vehicle: +336 the rigid body, +5712 the spec's handle) is met
# as TvCamera.+16, IntroCamera.+16, ViewCamera2.+16, IntroCamera.+4,
# IntroCamera::MakeShot.r5, CameraTarget::Track.r4, CutsceneShot.+8 and
# Racers::NearestHumanVehicle.ret; RouteRange::Advance.r4 is track-zones'
# RouteRange; CameraPath::OnLoaded.r6 is game-modes' Buffer28;
# ScenePools::FindModel.ret is a scene model (+48 its index).

# One player's viewport (1,872 bytes, [[0x826C2CE8] + 4 x player]; cameras.md and known-data.md).
# IntroCamera.+0 is the shot's viewport (the measure joins IntroCamera with its 20-byte shots).
[Viewport]
measure = "Viewport"
measures = ["Cutscene.+20", "TvCamera.+20", "ViewCamera1.+20", "ViewCamera2.+20", "IntroCamera.+0", "new<12>@Viewports::Init.+4"]
size = 1872
origin = "file"
fields = [
  { name = "entries", offset = 0, type = "bytes", count = 1600, note = "twenty 80-byte entries (ViewportEntry)" },
  { name = "eye", offset = 1600, type = "bytes", count = 16, note = "the eye (Viewport::Set, LookAt)" },
  { name = "eye_x", offset = 1600, type = "f32" },
  { name = "eye_y", offset = 1604, type = "f32" },
  { name = "eye_z", offset = 1608, type = "f32" },
  { name = "eye_w", offset = 1612, type = "f32" },
  { name = "target", offset = 1616, type = "bytes", count = 16, note = "the look-at target" },
  { name = "target_x", offset = 1616, type = "f32" },
  { name = "target_y", offset = 1620, type = "f32" },
  { name = "target_z", offset = 1624, type = "f32" },
  { name = "target_w", offset = 1628, type = "f32" },
  { name = "up", offset = 1632, type = "bytes", count = 16, note = "the up vector" },
  { name = "up_x", offset = 1632, type = "f32" },
  { name = "up_y", offset = 1636, type = "f32" },
  { name = "up_z", offset = 1640, type = "f32" },
  { name = "up_w", offset = 1644, type = "f32" },
  { name = "look", offset = 1648, type = "bytes", count = 16, note = "a fourth vector: the look point" },
  { name = "look_x", offset = 1648, type = "f32" },
  { name = "look_y", offset = 1652, type = "f32" },
  { name = "look_z", offset = 1656, type = "f32" },
  { name = "look_w", offset = 1660, type = "f32" },
  { name = "view1_target", offset = 1664, type = "bytes", count = 16, note = "the target view mode 1 uses; the cameras' look offset" },
  { name = "view1_target_x", offset = 1664, type = "f32" },
  { name = "view1_target_y", offset = 1668, type = "f32" },
  { name = "view1_target_z", offset = 1672, type = "f32" },
  { name = "view1_target_w", offset = 1676, type = "f32" },
  { name = "base_eye", offset = 1680, type = "bytes", count = 16, note = "the camera's eye offset (ChaseCamera::Place, MakeShot)" },
  { name = "base_eye_x", offset = 1680, type = "f32" },
  { name = "base_eye_y", offset = 1684, type = "f32" },
  { name = "base_eye_z", offset = 1688, type = "f32" },
  { name = "base_eye_w", offset = 1692, type = "f32" },
  { name = "base_target", offset = 1696, type = "bytes", count = 16, note = "the camera's target offset" },
  { name = "base_target_x", offset = 1696, type = "f32" },
  { name = "base_target_y", offset = 1700, type = "f32" },
  { name = "base_target_z", offset = 1704, type = "f32" },
  { name = "base_target_w", offset = 1708, type = "f32" },
  { name = "base_up", offset = 1712, type = "bytes", count = 16, note = "the camera's up vector, (0, 1, 0, 1)" },
  { name = "base_up_x", offset = 1712, type = "f32" },
  { name = "base_up_y", offset = 1716, type = "f32" },
  { name = "base_up_z", offset = 1720, type = "f32" },
  { name = "base_up_w", offset = 1724, type = "f32" },
  { name = "unknown_1728", offset = 1728, type = "bytes", count = 16, note = "a working vector" },
  { name = "base_look", offset = 1744, type = "bytes", count = 16, note = "the camera's look offset (ChaseCamera::Place)" },
  { name = "base_look_x", offset = 1744, type = "f32" },
  { name = "base_look_y", offset = 1748, type = "f32" },
  { name = "base_look_z", offset = 1752, type = "f32" },
  { name = "base_look_w", offset = 1756, type = "f32" },
  { name = "last_view", offset = 1760, type = "bytes", count = 48, note = "entry 0's last eye, target and up (Viewport::UpdateEntries)" },
  { name = "unknown_1808", offset = 1808, type = "bytes", count = 32, note = "working vectors" },
  { name = "next_eye", offset = 1840, type = "bytes", count = 16, note = "the TV camera's eye at the next spot (TvCamera::Step)" },
  { name = "next_eye_x", offset = 1840, type = "f32" },
  { name = "next_eye_y", offset = 1844, type = "f32" },
  { name = "next_eye_z", offset = 1848, type = "f32" },
  { name = "next_eye_w", offset = 1852, type = "f32" },
  { name = "far_18", offset = 1856, type = "f32", note = "8,000.0: entry 18's far plane" },
  { name = "view_mode", offset = 1860, type = "u32", note = "the view (0-5; 1 and 2 enable pass 3, the car overlays read it)" },
  { name = "zoom", offset = 1864, type = "f32", note = "entry 0's zoom at set-up (Viewport::Init)" },
  { name = "near", offset = 1868, type = "f32", note = "pass 0's near plane at set-up" },
]

# A viewport's entry (80 bytes, twenty at the viewport's +0; the measure sees them as the viewport's).
[ViewportEntry]
size = 80
origin = "embedded"
fields = [
  { name = "unknown_0", offset = 0, type = "u32", note = "0 at set-up" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "eye", offset = 16, type = "bytes", count = 16, note = "the eye" },
  { name = "eye_x", offset = 16, type = "f32" },
  { name = "eye_y", offset = 20, type = "f32" },
  { name = "eye_z", offset = 24, type = "f32" },
  { name = "eye_w", offset = 28, type = "f32" },
  { name = "target", offset = 32, type = "bytes", count = 16, note = "the target" },
  { name = "target_x", offset = 32, type = "f32" },
  { name = "target_y", offset = 36, type = "f32" },
  { name = "target_z", offset = 40, type = "f32" },
  { name = "target_w", offset = 44, type = "f32" },
  { name = "up", offset = 48, type = "bytes", count = 16, note = "the up vector (CameraPass::FromViewport)" },
  { name = "up_x", offset = 48, type = "f32" },
  { name = "up_y", offset = 52, type = "f32" },
  { name = "up_z", offset = 56, type = "f32" },
  { name = "up_w", offset = 60, type = "f32" },
  { name = "roll", offset = 64, type = "f32", note = "Viewport::SetRoll" },
  { name = "zoom", offset = 68, type = "f32", note = "Viewport::SetZoom: probably a focal length in pixels" },
  { name = "far", offset = 72, type = "f32", note = "the far plane" },
]

# The two viewports ([0x826C2CE8], 12 bytes, Viewports::Init).
[Viewports]
measure = "new<12>@Viewports::Init"
size = 12
origin = "allocated"
fields = [
  { name = "first", offset = 0, type = "ptr", to = "Viewport", note = "player 1's viewport" },
  { name = "second", offset = 4, type = "ptr", to = "Viewport", note = "player 2's viewport" },
  { name = "split", offset = 8, type = "u32", note = "not 0 in split screen" },
]

# The camera director: the race mode's member at +10512 (CameraDirector::Start, Update).
[CameraDirector]
measure = "CameraDirector"
size = 77412
origin = "embedded"
fields = [
  { name = "machine", offset = 16, type = "bytes", count = 4, note = "its StateMachine (game-modes.toml; CameraDirector::InitStates)" },
  { name = "state", offset = 9620, type = "u32", note = "1 at set-up, 3 by SetState3" },
  { name = "start_view", offset = 9624, type = "u32", note = "the view picked at the race's start (from the save data's camera setting)" },
  { name = "view", offset = 9628, type = "u32", note = "the view shown (0-5), also each viewport's +1860" },
  { name = "view_kept", offset = 9632, type = "u32", note = "the view to go back to after views 3-5" },
  { name = "followed", offset = 9636, type = "u32", note = "the player the views follow" },
  { name = "view2_camera", offset = 9648, type = "bytes", count = 1104, note = "view 2's camera (ViewCamera2)" },
  { name = "view2_camera2", offset = 10752, type = "bytes", count = 1104, note = "player 2's view 2 camera in split screen (ViewCamera2)" },
  { name = "view1_camera", offset = 11856, type = "bytes", count = 1104, note = "view 1's camera (ViewCamera1)" },
  { name = "view1_look_angle", offset = 12960, type = "f32", note = "view 1's camera's look angle (its +1104, from the camera stick)" },
  { name = "view0_camera", offset = 12976, type = "bytes", count = 372, note = "view 0's camera (ChaseCamera)" },
  { name = "view0_angle", offset = 13348, type = "u32", note = "view 0's camera's angle index (its +372): 2 at the start" },
  { name = "view0_state", offset = 13356, type = "u32", note = "view 0's camera's +380: set by the camera button" },
  { name = "tv_camera", offset = 13360, type = "bytes", count = 43524, note = "view 4's camera (TvCamera)" },
  { name = "cutscene", offset = 56896, type = "bytes", count = 10768, note = "view 5's camera (Cutscene)" },
  { name = "intro_camera", offset = 67760, type = "bytes", count = 760, note = "view 3's camera (IntroCamera)" },
  { name = "camera", offset = 68528, type = "u32", note = "the view's camera object" },
  { name = "camera2", offset = 68532, type = "u32", note = "player 2's in split screen" },
  { name = "followed_input", offset = 77408, type = "u32", note = "the player whose input record the update reads (its low byte)" },
]

# Any view's camera object: the head the six share (vtable, vehicle,
# viewport, tracker), for the helpers every camera uses.
[CameraObject]
size = 340
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "a view camera's vtable" },
  { name = "vehicle", offset = 16, type = "u32", note = "the vehicle followed" },
  { name = "viewport", offset = 20, type = "ptr", to = "Viewport" },
  { name = "tracker", offset = 32, type = "bytes", count = 308, note = "the target tracker (CameraTarget, with its track position at +224)" },
]

