# The schema of docs/functions/race-overlays.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race overlays: the effects drawn around each car in a race (layouts in
# known-data.md's "car overlays" and the rows after it; src/race_overlays/).
# The children (Trail, Smoke, Sparks, ParticlesB, ParticlesC, Marker,
# LightSprite, ModelSprite) aren't in the measure (allocated through
# VirtualAlloc, reached through the car overlays' words): described from the
# hand port and the docs.

# The race overlays' list: 25 overlay pointers at the race scene owner's +9608
# (game-modes.toml's RaceOverlaysMachine +9608).
[RaceOverlays]
measure = "RaceOverlays"
size = 100
origin = "embedded"
fields = [
  { name = "overlay_0", offset = 0, type = "ptr", to = "CarOverlays", note = "overlay 0: loads the texture set the others share" },
  { name = "others", offset = 4, type = "bytes", count = 96, note = "overlays 1 to 24 (pointers; in races 1 to 6 are CarOverlays, the rest 0)" },
]

# The overlays' vtable (CarOverlays' 0x82008524 and the children's).
[OverlayVtable]
measure = "CarOverlays.+0"
measures = ["sub_8215E6C0.r3@+9608.+8.+0"]
size = 32
origin = "image"
fields = [
  { name = "deleting_destructor", offset = 0, type = "fn", note = "slot 0 (r4 bit 0: free)" },
  { name = "unknown_4", offset = 4, type = "fn" },
  { name = "unknown_8", offset = 8, type = "fn" },
  { name = "reset", offset = 12, type = "fn", note = "slot 3" },
  { name = "update", offset = 16, type = "fn", note = "slot 4, once a tick" },
  { name = "record", offset = 20, type = "fn", note = "slot 5 (the car overlays': each child's slot 7)" },
  { name = "init", offset = 24, type = "fn", note = "slot 6: r4 a set-up (CarOverlays: 28 bytes; the children: 12), r5 a capacity" },
  { name = "record_child", offset = 28, type = "fn", note = "slot 7: a child's recording, r4 the camera pass index (sprites.md)" },
]

# OverlayView's vtable (0x82010B5C).
[OverlayViewVtable]
measure = "CarOverlays.+4.+0"
size = 4
origin = "image"
fields = [
  { name = "deleting_destructor", offset = 0, type = "fn", note = "slot 0" },
]

# One car's overlays (848 bytes, CarOverlays::CarOverlays sub_82123350).
[CarOverlays]
measure = "CarOverlays"
measures = ["sub_8215E6C0.r3@+9608.+8"]
size = 848
origin = "allocated"
vtable = 0x82008524
# In host memory since E5 step 4 (2026-11-24): made by RaceOverlays::Create
# (the lifted original's two VirtualAlloc(848) calls, overlay 0 at 0x8215E258
# and the others at 0x8215E2B0), freed by RaceOverlays::DeleteAll (its
# VirtualFree at 0x8215DFD0, which returned 1) after the destructor (slot 0,
# r4 = 0: not freed by it). The race overlays' list (the race mode's +9608)
# holds the handles; the handle is also the archive load's callback context
# (CarOverlays::LoadTextures, handed back to OnTexturesLoaded as r6). Its base
# class Overlay (+0, +104, +108) is read through Overlay's dual view; the
# viewport binding at +796 (CarOverlays::BindViewport's out) stays a guest
# view whose stores resolve the interior handle.
storage = "host"
host_alloc = [0x8215E258, 0x8215E2B0]
host_free = [{ call = 0x8215DFD0, reg = "r3", returns = 1 }]
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82008524 (OverlayVtable)" },
  { name = "views", offset = 4, type = "bytes", count = 100, note = "25 OverlayView pointers, one a view slot (0 none)" },
  { name = "textures", offset = 104, type = "u32", note = "the texture table (42 textures, loaded by overlay 0 and shared)" },
  { name = "texture_set", offset = 108, type = "u32" },
  { name = "loaded", offset = 112, type = "u32" },
  { name = "viewport_entry", offset = 116, type = "u32", note = "an index into the 12-byte entries at 0x82008558 (the set-up's +0)" },
  { name = "second_index", offset = 120, type = "u32", note = "an index into the pairs at 0x820085A0 (the set-up's +4)" },
  { name = "unknown_124", offset = 124, type = "u32" },
  { name = "view_slot", offset = 128, type = "u32", note = "the slot of the car's own view" },
  { name = "race_word_4", offset = 132, type = "u32", note = "[0x826C5B2C] + 4 at the set-up" },
  { name = "race_word_28", offset = 136, type = "u32", note = "[0x826C5B2C] + 28 at the set-up; the effects update with 0 or 3" },
  { name = "race_word_32", offset = 140, type = "u32", note = "[0x826C5B2C] + 32 at the set-up" },
  { name = "params", offset = 144, type = "ptr", to = "CarOverlaysParams", note = "the effects' parameter table 0x82616F50" },
  { name = "trails", offset = 148, type = "bytes", count = 16, note = "4 Trail pointers, one a wheel" },
  { name = "smokes", offset = 164, type = "bytes", count = 16, note = "4 Smoke pointers, one a wheel" },
  { name = "unknown_180", offset = 180, type = "bytes", count = 20, note = "five words cleared by CreateChildren" },
  { name = "light_sprites", offset = 200, type = "bytes", count = 16, note = "4 LightSprite pointers (model points 4-7)" },
  { name = "unknown_216", offset = 216, type = "bytes", count = 56, note = "14 words cleared by CreateChildren" },
  { name = "unknown_272", offset = 272, type = "bytes", count = 56, note = "14 words cleared by CreateChildren" },
  { name = "sparks", offset = 328, type = "bytes", count = 32, note = "8 Sparks pointers" },
  { name = "particles_b", offset = 360, type = "bytes", count = 16, note = "4 ParticlesB pointers (model points 4-7)" },
  { name = "marker", offset = 376, type = "ptr", to = "Marker", note = "the marker above the car" },
  { name = "particles_c", offset = 380, type = "bytes", count = 16, note = "4 ParticlesC pointers (model points 14-17; probably the exhausts)" },
  { name = "model_sprites", offset = 396, type = "bytes", count = 36, note = "9 ModelSprite pointers" },
  { name = "wheels", offset = 432, type = "embed", to = "CarOverlaysWheel", count = 4, note = "12 bytes a wheel" },
  { name = "unknown_480", offset = 480, type = "bytes", count = 48, note = "cleared by the reset (with the rates after it)" },
  { name = "smoke_rates", offset = 528, type = "bytes", count = 192, note = "+48 x wheel: the wheel's smoke rate accumulator (f32), the rest of each 48 bytes cleared by the reset" },
  { name = "vehicle_word_2252", offset = 720, type = "u32", note = "the vehicle's word +2252" },
  { name = "unknown_748", offset = 748, type = "f32", note = "1.0 at construction" },
  { name = "unknown_752", offset = 752, type = "bytes", count = 12, note = "probably a vector, 1.0 at construction" },
  { name = "unknown_764", offset = 764, type = "f32", note = "1.0 at construction" },
  { name = "color_r", offset = 768, type = "f32", note = "0.0 at construction and reset" },
  { name = "color_g", offset = 772, type = "f32", note = "0.0 at construction and reset" },
  { name = "color_b", offset = 776, type = "f32", note = "0.0 at construction and reset" },
  { name = "color_a", offset = 780, type = "f32", note = "1.0 at construction and reset" },
  { name = "view_mode", offset = 784, type = "u32", note = "the viewport's +1860: 1 and 2 turn some effects off" },
  { name = "unknown_788", offset = 788, type = "u32", note = "6 at construction and reset" },
  { name = "viewport_record", offset = 796, type = "u32", note = "the bound viewport's camera entry (CarOverlays::BindViewport's out +0)" },
  { name = "camera_pass", offset = 800, type = "u32", note = "the bound camera pass (its eye at +400)" },
  { name = "viewport_pair", offset = 804, type = "bytes", count = 8, note = "the two words at 0x820085A0 + 8 x the second index" },
  { name = "sparks_updating", offset = 812, type = "u32", note = "1 during UpdateSparks (0 again in view modes 1 and 2)" },
  { name = "marker_shown", offset = 816, type = "u32" },
  { name = "unknown_820", offset = 820, type = "u32", note = "0 at the set-up; read by the marker's and model sprites' kinds" },
  { name = "unknown_824", offset = 824, type = "u32", note = "0 at the set-up; read by the marker's kind" },
  { name = "unknown_828", offset = 828, type = "u32", note = "0 at the set-up; read by the marker's and model sprites' kinds" },
  { name = "last_vehicle", offset = 832, type = "u32" },
  { name = "racer_id", offset = 836, type = "s32", note = "-1 none" },
]

# A wheel's counters (CarOverlays +432 + 12 x wheel).
[CarOverlaysWheel]
size = 12
origin = "embedded"
# Host since E5 step 4: only inside CarOverlays (its wheels embed).
storage = "host"
fields = [
  { name = "trail_counter", offset = 0, type = "u32", note = "counts the slipping ticks against the table's +156 and +160" },
  { name = "smoke_counter", offset = 4, type = "u32", note = "up to 25 on surface 8, then counts down while smoke is emitted" },
  { name = "trail_added", offset = 8, type = "u32", note = "whether the last tick added a trail point" },
]

# CarOverlays' parameter table (0x82616F50: rates and thresholds of the trails and smoke).
[CarOverlaysParams]
size = 164
origin = "image"
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "debug_rate_scale", offset = 4, type = "f32", note = "scales the smoke rates when DebugSwitchOff is set" },
  { name = "marks_rate", offset = 8, type = "f32", note = "smoke on marking surfaces: this plus +12 x slip" },
  { name = "marks_rate_slip", offset = 12, type = "f32" },
  { name = "marks_size", offset = 16, type = "f32", note = "the size draw on marking surfaces" },
  { name = "smoke_slip_threshold", offset = 20, type = "f32", note = "WheelSlip's threshold for the smoke" },
  { name = "surface8_rate", offset = 24, type = "f32", note = "times the rate on surface 8" },
  { name = "counter_rate", offset = 28, type = "f32", note = "times the rate while the wheel's smoke counter runs" },
  { name = "unknown_32", offset = 32, type = "bytes", count = 12 },
  { name = "surface8_size", offset = 44, type = "f32", note = "the size draw on surface 8 and while the counter runs" },
  { name = "unknown_48", offset = 48, type = "bytes", count = 20 },
  { name = "surface12_rate", offset = 68, type = "f32", note = "times the rate on surfaces 1-2" },
  { name = "unknown_72", offset = 72, type = "bytes", count = 8 },
  { name = "surface12_size", offset = 80, type = "f32", note = "the size draw on surfaces 1-2" },
  { name = "unknown_84", offset = 84, type = "bytes", count = 68 },
  { name = "trail_slip_threshold", offset = 152, type = "f32", note = "WheelSlip's threshold for the trails" },
  { name = "trail_least_count", offset = 156, type = "u32", note = "a trail point is due from this many slipping ticks" },
  { name = "trail_most_count", offset = 160, type = "u32", note = "up to this many (the counter capped at twice it)" },
]

# A child overlay class's parameter table (0x82616E64 to 0x82616EE8, 16 bytes each).
[OverlayParams]
size = 16
origin = "image"
fields = [
  { name = "life", offset = 0, type = "u32", note = "in ticks" },
  { name = "size", offset = 4, type = "f32" },
  { name = "alpha", offset = 8, type = "f32", note = "the alpha or brightness (the trails: the base width)" },
  { name = "fade_ticks", offset = 12, type = "u32", note = "fades over this many ticks of life left" },
]

# A view (16 bytes, CarOverlays::NewView): a vehicle, its scene model and a viewport.
[OverlayView]
measures = ["OverlayView", "CarOverlays.+4"]
size = 16
origin = "allocated"
vtable = 0x82010B5C
# In host memory since E5 step 4 (2026-11-24): made by CarOverlays::NewView
# (the lifted original's VirtualAlloc(16) at 0x82126694), freed by
# CarOverlays::FreeView (its VirtualFree at 0x821265C4, all slots, and
# 0x82126610, one slot; both returned 1) after its slot 0 (the shared empty
# base's destructor, r4 = 0). The car overlays' view slots (+4) hold the
# handles.
storage = "host"
host_alloc = [0x82126694]
host_free = [{ call = 0x821265C4, reg = "r3", returns = 1 }, { call = 0x82126610, reg = "r3", returns = 1 }]
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82010B5C (OverlayViewVtable)" },
  { name = "vehicle", offset = 4, type = "u32" },
  { name = "model", offset = 8, type = "u32", note = "its scene model (0 none)" },
  { name = "viewport", offset = 12, type = "u32" },
]

# A view's description on RaceOverlays::Bind's stack (ViewDesc::Clear clears +0 and +4).
[ViewDesc]
measures = ["ViewDesc", "OverlayView::Set.r4"]
size = 12
origin = "embedded"
fields = [
  { name = "vehicle", offset = 0, type = "u32" },
  { name = "model", offset = 4, type = "u32" },
  { name = "viewport", offset = 8, type = "u32" },
]

# CarOverlays::BindViewport's out (the car overlays' +796).
[OverlayViewportBinding]
size = 16
origin = "embedded"
fields = [
  { name = "record", offset = 0, type = "u32", note = "[[0x826C2CE8] + 4 x entry.0] + 80 x entry.1" },
  { name = "camera_pass", offset = 4, type = "u32", note = "0x826BAC00 + 592 x entry.2" },
  { name = "pair_0", offset = 8, type = "u32" },
  { name = "pair_1", offset = 12, type = "u32" },
]

# An entry of the table at 0x82008558 (12 bytes; pairs of words follow from 0x820085A0).
[OverlayViewportEntry]
size = 12
origin = "image"
fields = [
  { name = "viewport", offset = 0, type = "u32", note = "an index into [0x826C2CE8]" },
  { name = "record", offset = 4, type = "u32", note = "an 80-byte record of the viewport" },
  { name = "camera_pass", offset = 8, type = "u32", note = "an index of the 592-byte camera passes at 0x826BAC00" },
]

# The overlays' base class.
[Overlay]
measure = "Overlay"
size = 112
origin = "embedded"
vtable = 0x820085D8
# Dual since E5 step 4: the base of CarOverlays (host) and of the children
# (guest, VirtualAlloc'd). No embed field in CarOverlays: its fields there
# (+0, +104, +108) are CarOverlays' own vtable, textures and texture_set, the
# same words in the same order, so the view reads the host struct directly.
storage = "dual"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x820085D8 for the base class" },
  { name = "textures", offset = 104, type = "u32", note = "SetTextures104 (the car overlays' texture table; particle effect C's texture)" },
  { name = "textures_108", offset = 108, type = "u32", note = "SetTextures108 (the texture holder of the trails, smoke, sparks and particle effect B)" },
]

# A wheel's trail (64,160 bytes, Trail::Trail sub_8212A140; probably the skid marks).
[Trail]
size = 64160
origin = "allocated"
vtable = 0x820086C0
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "capacity", offset = 104, type = "u32", note = "the entries' capacity" },
  { name = "texture_holder", offset = 108, type = "u32", note = "SetTextures108" },
  { name = "params", offset = 112, type = "ptr", to = "OverlayParams" },
  { name = "points", offset = 128, type = "bytes", count = 64000, note = "500 TrailPoint" },
  { name = "oldest", offset = 64128, type = "u32", note = "the oldest point's index" },
  { name = "tail", offset = 64132, type = "u32", note = "where the next point goes" },
  { name = "count", offset = 64136, type = "u32" },
  { name = "last_position", offset = 64144, type = "bytes", count = 16, note = "a vector" },
]

# A trail's point (128 bytes).
[TrailPoint]
size = 128
origin = "embedded"
fields = [
  { name = "position", offset = 0, type = "bytes", count = 16, note = "a vector" },
  { name = "last_position", offset = 16, type = "bytes", count = 16, note = "a vector: the trail's last position when added" },
  { name = "red", offset = 32, type = "u32" },
  { name = "green", offset = 36, type = "u32" },
  { name = "blue", offset = 40, type = "u32" },
  { name = "width_int", offset = 44, type = "u32", note = "the width (+56) as an integer" },
  { name = "shown", offset = 48, type = "u32", note = "the value AddPoint is given; 1 once more than a tick old" },
  { name = "side_width", offset = 52, type = "f32", note = "the width AddPoint is given (the edges' distance)" },
  { name = "width", offset = 56, type = "f32", note = "fades from +124" },
  { name = "age", offset = 60, type = "u32", note = "ticks left" },
  { name = "difference", offset = 64, type = "bytes", count = 16, note = "a vector: position less last position" },
  { name = "edge_minus", offset = 80, type = "bytes", count = 16, note = "a vector: the ribbon's edge (position less the side)" },
  { name = "edge_plus", offset = 96, type = "bytes", count = 16, note = "a vector: the ribbon's other edge" },
  { name = "state", offset = 112, type = "u32", note = "1 or 2 (2: joined to the one before)" },
  { name = "broken", offset = 116, type = "u32", note = "set to 1 where the trail breaks" },
  { name = "texture_coordinate", offset = 120, type = "u32" },
  { name = "full_width", offset = 124, type = "f32" },
]

# A wheel's tire smoke (32,640 bytes, Smoke::Smoke sub_8212B2E8).
[Smoke]
size = 32640
origin = "allocated"
vtable = 0x820086F4
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "capacity", offset = 104, type = "u32", note = "the entries' capacity" },
  { name = "texture_holder", offset = 108, type = "u32", note = "SetTextures108" },
  { name = "params", offset = 112, type = "ptr", to = "OverlayParams" },
  { name = "unknown_116", offset = 116, type = "u32", note = "0 at construction; the set-up's +0 at Init" },
  { name = "puffs", offset = 128, type = "bytes", count = 32400, note = "45 SmokePuff" },
  { name = "oldest", offset = 32528, type = "u32" },
  { name = "head", offset = 32532, type = "u32", note = "where the next puff goes" },
  { name = "count", offset = 32536, type = "u32" },
  { name = "velocity", offset = 32544, type = "bytes", count = 16, note = "a vector (Smoke::SetVelocity)" },
  { name = "region_start", offset = 32560, type = "bytes", count = 16, note = "a vector: with +32,576, the span puffs drift along when the region is on" },
  { name = "region_end", offset = 32576, type = "bytes", count = 16, note = "a vector" },
  { name = "region_rear", offset = 32592, type = "bytes", count = 16, note = "a vector: SetRegion's second point (the rear axle's), InRegion's a" },
  { name = "region_front", offset = 32608, type = "bytes", count = 16, note = "a vector: SetRegion's first point (the front axle's), InRegion's b" },
