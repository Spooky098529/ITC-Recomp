# The schema of docs/functions/app-start-up.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The app's start-up (src/app_start_up/): the app's interfaces as its
# getters meet them, the block App::App is given, the run loop as App::App
# and App::OnRunLoopEvent meet it, the display's tiling block, the vertex
# declaration, GlobalMemoryStatus's buffer, the billboards' globals. The app
# itself (132 bytes) is app-states.toml's App.

# The app's +16 interface (vtable 0x82000E38; App::StartUp's r3, the word
# the start-up keeps at 0x82600344, 0x8266D084, 0x8266D088 and 0x826BABA0),
# as its folded getters sub_82379338 (slot +48) and sub_82379350 (slot +44)
# read it: their offsets are from app + 16.
[AppInterface16]
measures = ["sub_82379338.r3", "sub_82379350.r3",
            "SaveInterface", "sub_820943B0.r3", "sub_820943C8.r3"]
size = 116
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82000E38" },
  { name = "sound_manager", offset = 108, type = "u32", note = "app + 124: the sound manager (AudioManager::Create, sound-cues.md), slot +48's answer" },
  { name = "movie", offset = 112, type = "u32", note = "app + 128: the movie class (Movie::Movie, movies.md), slot +44's answer" },
  { name = "framework_interface", offset = 8, type = "ptr", to = "AppFrameworkInterface", note = "app + 24: the framework's interface, read by the vtable's +8 users getter sub_820943C8 and +12 save-devices getter sub_820943B0 (save-interface's and system-services' reports)" },
]

# The app's +8 interface (vtable 0x82000E80), as sub_82094368 (its slot +4)
# and App::SceneFromInterface8 (slot +12) read it: offsets from app + 8.
# (The measure files App::SceneFromInterface8's r3 under the App itself,
# its +16 as App.+16: a measure fault, reported.)
[AppInterface8]
measure = "sub_82094368.r3"
size = 20
origin = "embedded"
fields = [
  { name = "framework_interface", offset = 16, type = "ptr", to = "AppFrameworkInterface", note = "app + 24: the framework's +36 interface" },
]

# The framework's +36 interface (framework + 36, vtable 0x82000AFC), the one
# the app keeps at +24 (framework.md). Met through the app's +4 and +8
# interfaces (App.+16 is App::SceneFromInterface8's view of it).
[AppFrameworkInterface]
measures = ["App.+16", "sub_82094368.r3.+16",
            "sub_820943B0.r3.+8", "sub_820943C8.r3.+8"]
size = 4
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "AppFrameworkInterfaceVtable", note = "0x82000AFC" },
]

# The framework's +36 interface's vtable (0x82000AFC in the image): the
# getters this-adjusted to the framework (docs/known-data.md, "framework").
[AppFrameworkInterfaceVtable]
measures = ["App.+16.+0", "App.+20.+0", "sub_82094368.r3.+16.+0",
            "sub_820943B0.r3.+8.+0", "sub_820943C8.r3.+8.+0"]
size = 44
origin = "image"
fields = [
  { name = "slot_2_frame_driver", offset = 8, type = "fn", note = "sub_820908E0: the frame driver (framework + 76)" },
  { name = "slot_3_scene", offset = 12, type = "fn", note = "sub_82090908: the scene (framework + 80)" },
  { name = "slot_4_worker_pool", offset = 16, type = "fn", note = "sub_820908E8: the first worker pool (framework + 68)" },
  { name = "slot_9_users", offset = 36, type = "fn", note = "sub_82493700: the users (sub_820943C8 calls it)" },
  { name = "slot_10_save_devices", offset = 40, type = "fn", note = "sub_82090788: the save devices (sub_820943B0 calls it)" },
]

# App::App's r4: the block App::Create passes on.
[AppSetUpBlock]
measure = "App::App.r4"
size = 8
origin = "embedded"
fields = [
  { name = "run_loop", offset = 0, type = "ptr", to = "AppRunLoop" },
  { name = "framework_interface", offset = 4, type = "ptr", to = "AppFrameworkInterface", note = "kept at the app's +24" },
]

# The run loop (App::Run's, vtable 0x82000FE8; framework.md's RunLoop, the
# same object: to merge there) as App::App and App::OnRunLoopEvent meet it.
# The measure joins App::App's loads of the run loop's vtable slots (+4,
# +8 of the vtable) with the run loop itself: they fall in tick_handlers
# here (a measure fault, reported).
[AppRunLoop]
measures = ["App::App.r4.+0", "App::OnRunLoopEvent.r4"]
size = 52
origin = "embedded"
vtable = 0x82000FE8
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "AppRunLoopVtable" },
  { name = "tick_handlers", offset = 4, type = "bytes", count = 12, note = "a std::map of delegates by key (+8 its head node, +12 its size)" },
  { name = "listeners", offset = 16, type = "bytes", count = 12, note = "a std::map of delegates by key" },
]

# The run loop's vtable (0x82000FE8 in the image).
[AppRunLoopVtable]
measure = "App::OnRunLoopEvent.r4.+0"
size = 20
origin = "image"
fields = [
  { name = "slot_1_add_listener", offset = 4, type = "fn" },
  { name = "slot_2_add_tick_handler", offset = 8, type = "fn" },
  { name = "slot_3_remove_listener", offset = 12, type = "fn" },
  { name = "slot_4_remove_tick_handler", offset = 16, type = "fn" },
]

# The event the run loop gives its listeners (App::OnRunLoopEvent's r5).
[AppRunLoopEvent]
measure = "App::OnRunLoopEvent.r5"
size = 4
origin = "embedded"
fields = [
  { name = "code", offset = 0, type = "u32", note = "0: App::DeliverMessage(5); 1: message 6 and the app's handlers removed" },
]

# The display's tiling block ([0x8260034C], 0x82600350): the screen cut in
# tiles for predicated tiling.
[Tiling]
measures = ["Tiling", "[8260034C]"]
size = 64
origin = "image"
fields = [
  { name = "width", offset = 0, type = "u32", note = "1280" },
  { name = "height", offset = 4, type = "u32", note = "720" },
  { name = "multisample_type", offset = 8, type = "u32", note = "2" },
  { name = "tile_count", offset = 12, type = "u32", note = "3" },
  { name = "tiles", offset = 16, type = "bytes", count = 48, note = "TilingTile x tile_count, 16 bytes each" },
]

# One of the tiling block's tiles (16 bytes from its +16).
[TilingTile]
size = 16
origin = "embedded"
fields = [
  { name = "left", offset = 0, type = "u32" },
  { name = "top", offset = 4, type = "u32" },
  { name = "right", offset = 8, type = "u32" },
  { name = "bottom", offset = 12, type = "u32" },
]

# Tiling::LargestTile's r4: the two words out (in SceneTarget::SceneTarget's
# frame, +88).
[TilingTileSize]
measure = "Tiling::LargestTile.r4"
size = 8
origin = "embedded"
fields = [
  { name = "width", offset = 0, type = "u32", note = "the largest right - left" },
  { name = "height", offset = 4, type = "u32", note = "the largest bottom - top" },
]

# CreateVertexDeclaration's elements (r3): 12 bytes each up to the one whose
# stream is 255 (probably D3DVERTEXELEMENT9).
[VertexElement]
measure = "CreateVertexDeclaration.r3"
size = 12
origin = "image"
fields = [
  { name = "stream", offset = 0, type = "u16", note = "255 ends the list" },
  { name = "offset", offset = 2, type = "u16", note = "probably" },
  { name = "element_type", offset = 4, type = "u32", note = "probably the format" },
  { name = "method", offset = 8, type = "u8", note = "probably" },
  { name = "usage", offset = 9, type = "u8", note = "probably" },
  { name = "usage_index", offset = 10, type = "u8", note = "probably" },
  { name = "next_stream", offset = 12, type = "u16", note = "the next element's stream, as the count's loop reads it" },
]

# A vertex declaration (XMemAlloc(56 + 12 x count, 0x24800000) in
# CreateVertexDeclaration): its first 56 bytes cleared, the elements copied
# to +52.
[VertexDeclaration]
measure = "new<?>@CreateVertexDeclaration"
measures = ["Device.+11552", "Device::PatchVertexShader.r5"]
size = 52
origin = "allocated"
fields = [
  { name = "common", offset = 0, type = "u32", note = "0x00100005 (probably the resource's type word)" },
  { name = "reference_count", offset = 4, type = "u32", note = "1 (probably)" },
  { name = "unknown_20", offset = 20, type = "u32", note = "0xFFFF0000" },
  { name = "element_count", offset = 24, type = "u32" },
  { name = "highest_stream", offset = 28, type = "u32" },
  { name = "stream_map", offset = 32, type = "bytes", count = 16, note = "255 for each stream used, else 0" },
  { name = "unknown_48", offset = 48, type = "u32", note = "0" },
  { name = "element0_byte_9", offset = 61, type = "u8", note = "the 12-byte elements from +52: element 0's +9 (Device::PatchVertexShader; probably the usage)" },
  { name = "element0_byte_10", offset = 62, type = "u8", note = "element 0's +10 (Device::PatchVertexShader; probably the usage index)" },
]

# GlobalMemoryStatus's r3: a MEMORYSTATUS (Dropped: nothing reads it).
[MemoryStatus]
measure = "GlobalMemoryStatus.r3"
size = 32
origin = "embedded"
fields = [
  { name = "length", offset = 0, type = "u32" },
  { name = "memory_load", offset = 4, type = "u32" },
  { name = "total_physical", offset = 8, type = "u32" },
  { name = "available_physical", offset = 12, type = "u32" },
  { name = "total_page_file", offset = 16, type = "u32" },
  { name = "available_page_file", offset = 20, type = "u32" },
  { name = "total_virtual", offset = 24, type = "u32" },
  { name = "available_virtual", offset = 28, type = "u32" },
]

# The billboards' HLSL sources ([0x82600A54], [0x82600A60]): C strings,
# read byte by byte for their length.
[BillboardShaderSource]
measures = ["[82600A54]", "[82600A60]"]
size = 1
origin = "image"
fields = [
  { name = "first_char", offset = 0, type = "u8" },
]

[globals]
read_error_app = { address = 0x82600344, type = "ptr", to = "AppInterface16", note = "ReadError::SetApp's: the +4 of the object at 0x82600340" }
app_interface_84 = { address = 0x8266D084, type = "ptr", to = "AppInterface16", note = "sub_8209AC30's" }
scene_target_app = { address = 0x8266D088, type = "ptr", to = "AppInterface16", note = "the video output's way in (its slot 7, then that object's slot 3)" }
scene_target = { address = 0x8266D08C, type = "u32", note = "the SceneTarget (32 bytes, scene-target.md), or 0" }
render_app = { address = 0x826BABA0, type = "ptr", to = "AppInterface16", note = "sub_8209F580's: the scene's render manager" }
display_tiling = { address = 0x8260034C, type = "ptr", to = "Tiling" }
word_82816110 = { address = 0x82816110, type = "u32", note = "sub_8225FB70 clears it; readers not looked for" }
word_82816114 = { address = 0x82816114, type = "u32", note = "sub_8225FB70 clears it; readers not looked for" }
billboard_ring_index = { address = 0x826A5098, type = "u32", note = "flipped 0 / 1" }
billboard_vertex_count = { address = 0x826A509C, type = "u32" }
billboard_vertex_shader = { address = 0x826A50A0, type = "u32" }
billboard_pixel_shader = { address = 0x826A50A4, type = "u32" }
billboard_declaration = { address = 0x826A50A8, type = "ptr", to = "VertexDeclaration" }
billboard_vertex_source = { address = 0x82600A54, type = "ptr", to = "BillboardShaderSource" }
billboard_pixel_source = { address = 0x82600A60, type = "ptr", to = "BillboardShaderSource" }
billboard_elements = { address = 0x82600A64, type = "bytes", count = 48, note = "three VertexElements and the end" }
billboard_float_8266D090 = { address = 0x8266D090, type = "u32", note = "a float Billboards::Init clears (copied as bits from 0x82000A34); readers not looked for" }
