# The schema of docs/functions/type2-mode.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 2 front-end mode (852 bytes: the game mode's base, then its block
# of 14 screen machines at +848), the block (162,688 bytes), a screen machine
# as the block's helpers see it, and the mode's 14-slot vtable the slot
# thunks call through (src/type2_mode/).

# The type 2 mode (ModeType2::ModeType2, game-modes.md; known-data.md:
# "type 2 mode block" for +848). The base (0 to 848) is the game mode's
# (boot-mode.toml's GameMode). The measure joins three other things with it:
# the next-mode answer (slot 6's and the delegates' r3, boot-mode.toml's
# ModeAnswer) at +0 and +4, the mode seen from its +32 interface (r3 = the
# mode + 32 in Interrupt and ForceExit: iface_* below, 32 bytes before the
# fields they are) and the block AllLoaded reads (fault_* at +9608 and up).
# Dual (E5 step 4): made in host memory by Mode::Create; the measure joins
# guest addresses with it (the delegates' answer on the stack, the block
# in AllLoaded and FindShown), which the view reads as guest memory. Its
# fields over the block and at -28 (ForceExit's +4 from the +32 interface:
# a negative offset no host struct holds) were left out.
[ModeType2]
measures = [
  "ModeType2",
  "ModeType2::AfterLeaveScreen.r4",
  "ModeType2::LeaveScreen.r4",
  "ModeType2::Leaving.r4",
  "ModeType2::NextMode.r4",
  "ModeType2::Restart.r4",
  "ModeType2::TearDown.r4",
  "ModeType2::WaitForLoads.r4",
]
size = 852
origin = "allocated"
storage = "dual"
host_alloc = [0x82107828]
vtable = 0x82006B9C
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006B9C (ModeType2Vtable)" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer), not the mode's" },
  { name = "answer_word0", offset = 0, type = "u32", note = "measure fault: the next-mode answer's first word (ModeAnswer; TearDown copies the block's into it), not the mode's" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8 (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "the delegate (ModeDelegate): vtable 0x82010FA0" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the delegate's object: the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "a slot thunk: Mode::Slot9Thunk (WaitForLoads) after Init, Mode::NextModeThunk 0x82235C08 once loaded, Slot10Thunk to 13" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "the +32 interface's vtable 0x82006B90 (Interrupt, ForceExit, Resume)" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers, the block's 14 machines" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (ModeMessage)" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "iface_ring_count", offset = 808, type = "u32", note = "measure fault: ring_count (+840) through the +32 interface (Interrupt)" },
  { name = "iface_ring_start", offset = 812, type = "u32", note = "measure fault: ring_start (+844) through the +32 interface (Interrupt)" },
  { name = "iface_block", offset = 816, type = "u32", note = "measure fault: block (+848) through the +32 interface (Interrupt, ForceExit)" },
  { name = "block", offset = 848, type = "ptr", to = "Type2ModeBlock", note = "VirtualAlloc(0, 162688, 0x1000, 4) by Init, freed by ModeType2::Release" },
]

# The block (VirtualAlloc'ed by ModeType2::Init; known-data.md: "type 2
# mode block"): the 14 screen machines (each a Type2ScreenMachine, its own
# words after it, described by its area), then the shown screen and the next
# mode's answer. The machines' words are reached through Type2ScreenMachine
# views at the machines' addresses; the hub's (+0) and the save screen's are
# named here too, as the measure meets them on the block.
[Type2ModeBlock]
measures = [
  "new<162688>@ModeType2::Init",
  "ModeType2::TearDown.r4.+848",
  "ModeType2::WaitForLoads.r4.+848",
  "ModeType2::NextMode.r4.+848",
  "ModeType2.+816",
]
size = 162688
origin = "allocated"
fields = [
  { name = "hub", offset = 0, type = "bytes", count = 9640, note = "Type2Hub's machine (type2-screens.md); MachineOf 0" },
  { name = "hub_state", offset = 9604, type = "u32", note = "the hub's machine state (14 picks the next mode 4)" },
  { name = "hub_loaded", offset = 9608, type = "u32", note = "the hub's movie loaded (AllLoaded)" },
  { name = "hub_reenter", offset = 9612, type = "u32", note = "open on its message: 1 from Init" },
  { name = "hub_delete_movie", offset = 9616, type = "u32", note = "0 from Init" },
  { name = "race_menu", offset = 9640, type = "bytes", count = 10152, note = "RaceMenu (race-menu.md); MachineOf 1" },
  { name = "tuning_machine", offset = 19792, type = "bytes", count = 36832, note = "the tuning screen (tuning-machine.md); MachineOf 2" },
  { name = "spec_sheet", offset = 56624, type = "bytes", count = 9640, note = "PowerGraphScreen2, the spec sheet (type2-screens.md); MachineOf 9" },
  { name = "user_info", offset = 0x102D8, type = "bytes", count = 9640, note = "UserInfo (user-info.md); MachineOf 10" },
  { name = "options", offset = 0x12880, type = "bytes", count = 9640, note = "Type2Options (options-screen.md); MachineOf 7" },
  { name = "controller_options", offset = 0x14E28, type = "bytes", count = 9640, note = "Type2ControllerOptions (options-screen.md); MachineOf 12" },
  { name = "car_settings", offset = 0x173D0, type = "bytes", count = 9640, note = "CarSettings (car-settings.md); MachineOf 3" },
  { name = "car_dealer", offset = 0x19978, type = "bytes", count = 9640, note = "CarDealer (car-dealer.md); MachineOf 4; its state 14 picks the next mode 4" },
  { name = "build_screen", offset = 0x1BF20, type = "bytes", count = 9640, note = "BuildScreen (type2-screens.md); MachineOf 6" },
  { name = "dialog", offset = 0x1E4C8, type = "bytes", count = 9640, note = "Type2Dialog (type2-dialog.md); MachineOf 16" },
  { name = "plate_editor", offset = 0x20A70, type = "bytes", count = 9640, note = "PlateEditor (type2-screens.md); MachineOf 26" },
  { name = "garage_screen", offset = 0x23018, type = "bytes", count = 9640, note = "GarageScreen (garage-screen.md); MachineOf 5" },
  { name = "save_screen", offset = 0x255C0, type = "bytes", count = 9640, note = "Type2SaveScreen (save-screen.md); MachineOf 44" },
  { name = "save_screen_state", offset = 0x27B44, type = "u32", note = "the save screen's machine state (+0x255C0 + 9604; Interrupt: 5)" },
  { name = "save_screen_loaded", offset = 0x27B48, type = "u32", note = "the save screen's +9608 (+0x255C0 + 9608), the last word AllLoaded waits on" },
  { name = "shown", offset = 0x27B68, type = "u32", note = "the shown screen's index (0 to 7, FindShown; MachineOf's index)" },
  { name = "first_shown", offset = 0x27B6C, type = "u32", note = "Init's first screen: 0 the hub, 3 the car settings, 4 the car dealer" },
  { name = "answer_changed", offset = 0x27B74, type = "u8", note = "the next mode's 8-byte answer (ModeAnswer) TearDown returns: byte 1" },
  { name = "answer_word0", offset = 0x27B74, type = "u32", note = "the answer's first word as copied: byte 1 and three frame bytes" },
  { name = "answer_next_type", offset = 0x27B78, type = "u32", note = "the next mode: 1 the race, 3, 4, 5 the parking area or 12" },
]

# A screen machine of the block as ModeType2's helpers see it (MachineOf's
# answer): a state machine (game-modes.toml's StateMachine) and the words
# every type 2 machine has after it.
[Type2ScreenMachine]
measure = "ModeType2::MachineOf.ret"
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "4 starting, 5 running, 8 a leave asked, 10 leave all, 11, 12, 14, 20 pick the next mode; 6 done" },
  { name = "loaded", offset = 9608, type = "u32", note = "the movie loaded (each machine's WaitForLoad); AllLoaded waits on it" },
  { name = "reenter", offset = 9612, type = "u32", note = "open on its message: 1 from ModeType2::Init" },
  { name = "delete_movie", offset = 9616, type = "u32", note = "delete the movies on unload: 0 from ModeType2::Init" },
]

# The object the mode's slot thunks are given (r4, any mode; the type 2 mode
# here): its vtable.
[ModeSlotObject]
measures = [
  "Mode::Slot8Thunk.r4",
  "Mode::Slot9Thunk.r4",
  "Mode::Slot10Thunk.r4",
  "Mode::Slot11Thunk.r4",
  "Mode::Slot12Thunk.r4",
  "Mode::Slot13Thunk.r4",
]
size = 4
origin = "embedded"
storage = "dual"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "ModeType2Vtable", note = "0x82006B9C for the type 2 mode" },
]

# The type 2 mode's vtable (0x82006B9C, 14 slots).
[ModeType2Vtable]
measures = [
  "Mode::Slot8Thunk.r4.+0",
  "Mode::Slot9Thunk.r4.+0",
  "Mode::Slot10Thunk.r4.+0",
  "Mode::Slot11Thunk.r4.+0",
  "Mode::Slot12Thunk.r4.+0",
  "Mode::Slot13Thunk.r4.+0",
]
size = 56
origin = "image"
fields = [
  { name = "init", offset = 0, type = "fn", note = "slot 0: ModeType2::Init" },
  { name = "release", offset = 4, type = "fn", note = "slot 1: ModeType2::Release" },
  { name = "slot2", offset = 8, type = "fn", note = "slots 2 to 5: Mode::NoNextMode" },
  { name = "slot3", offset = 12, type = "fn" },
  { name = "slot4", offset = 16, type = "fn" },
  { name = "slot5", offset = 20, type = "fn" },
  { name = "next_mode", offset = 24, type = "fn", note = "slot 6: ModeType2::NextMode" },
  { name = "deleting_destructor", offset = 28, type = "fn", note = "slot 7: Mode::DeletingDestructor" },
  { name = "restart", offset = 32, type = "fn", note = "slot 8: ModeType2::Restart (Mode::Slot8Thunk)" },
  { name = "wait_for_loads", offset = 36, type = "fn", note = "slot 9: ModeType2::WaitForLoads (Mode::Slot9Thunk)" },
  { name = "leave_screen", offset = 40, type = "fn", note = "slot 10: ModeType2::LeaveScreen (Mode::Slot10Thunk)" },
  { name = "tear_down", offset = 44, type = "fn", note = "slot 11: ModeType2::TearDown (Mode::Slot11Thunk)" },
  { name = "after_leave_screen", offset = 48, type = "fn", note = "slot 12: ModeType2::AfterLeaveScreen (Mode::Slot12Thunk)" },
  { name = "leaving", offset = 52, type = "fn", note = "slot 13: ModeType2::Leaving (Mode::Slot13Thunk)" },
]

[globals]
pad_blocked0 = { address = 0x826C7960, type = "u32", note = "the pad blocked (known-data.md): NextMode queues no Draw when either word is set" }
pad_blocked1 = { address = 0x826C7964, type = "u32" }
leaving_flag = { address = 0x826364EC, type = "u32", note = "1 from ForceExit (0 or 1), 0 from NextMode when the hub or the car dealer picks mode 4" }
mode_before = { address = 0x826032E0, type = "u32", note = "the mode before (1 the race): Init's first screen and Career::NextDay" }
race_data = { address = 0x826C5B2C, type = "ptr", to = "RaceData", note = "the race data (race-states.toml's RaceData): Init reads its race_mode +0xA3AF4" }
options_settings = { address = 0x826D8478, type = "ptr", to = "OptionsSettings", note = "the options' settings (options-screen.toml's OptionsSettings): Interrupt reads its save_page_closed +712" }
dialog_status = { address = 0x82636204, type = "u32", note = "the type 2 dialog's status (type2-dialog.toml's status): Interrupt answers 1 at 3" }
string_table = { address = 0x826C5C34, type = "u32", note = "the string table Strings::Load gets" }
fade_in_passes = { address = 0x82001BEC, type = "u32", note = "the passes word ScreenFades::FadeIn is given" }
