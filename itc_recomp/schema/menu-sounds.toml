# The schema of docs/functions/menu-sounds.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The game's sound manager (AudioManager, at [0x826C5C80]: the app's +124,
# docs/known-data.md's "sound manager") and its vtable, the second list of
# sounds kept by handle (+1540) and the words its slots are given by address.
# The manager is shared with sound-cues.md (the measure's tie-break gives it
# here); its bank pairs (BankPair), Sounds (Sound) and listener (Listener) are
# sound-cues.md's. Left out (the measure files them here, but they're other
# areas' objects): sub_82099048's r3 (the input manager, input.toml's
# InputManager) and r4 (a pad index, InputIndex), sub_82592400's r3 (an input
# processor, input.toml's InputProcessor) and sub_820A6E00's r3 and r4 (a
# std::string and a C string, std-string.md).

# The manager's vtable (0x82008388), as far as its users call it (the slots'
# names: menu-sounds.md and sound-cues.md). Measured through the manager's
# global ([0x826C5C80]'s +0).
[AudioManagerVtable]
measure = "[826C5C80].+0"
measures = ["sub_82119188.r3.+0"]
size = 132
origin = "image"
fields = [
  { name = "destroy", offset = 0, type = "fn", note = "slot 0: AudioManager::~AudioManager (deleting) sub_82119450" },
  { name = "is_any_bank_loading", offset = 4, type = "fn", note = "slot 1: sub_82117EB8" },
  { name = "find_bank", offset = 8, type = "fn", note = "slot 2: sub_82117FF0" },
  { name = "find_free_bank_slot", offset = 12, type = "fn", note = "slot 3: sub_82117F78" },
  { name = "load_bank", offset = 16, type = "fn", note = "slot 4: AudioManager::LoadBank" },
  { name = "release_bank", offset = 20, type = "fn", note = "slot 5: sub_82118190" },
  { name = "is_bank_loading", offset = 24, type = "fn", note = "slot 6: sub_82118200" },
  { name = "is_bank_loaded", offset = 28, type = "fn", note = "slot 7: sub_82118270" },
  { name = "is_bank_slot_empty", offset = 32, type = "fn", note = "slot 8: sub_821182E0" },
  { name = "get_cue_index", offset = 36, type = "fn", note = "slot 9: sub_82118320" },
  { name = "play_cue_2d", offset = 40, type = "fn", note = "slot 10: AudioManager::PlayCue2D sub_82119638" },
  { name = "play_cue_3d", offset = 44, type = "fn", note = "slot 11: sub_82119608" },
  { name = "stop_bank", offset = 48, type = "fn", note = "slot 12: sub_821189F0" },
  { name = "stop_cue", offset = 52, type = "fn", note = "slot 13: AudioManager::StopCue" },
  { name = "is_cue_playing", offset = 56, type = "fn", note = "slot 14: sub_82118B58" },
  { name = "play_handle", offset = 60, type = "fn", note = "slot 15: sub_82119690" },
  { name = "set_handle_position", offset = 64, type = "fn", note = "slot 16: sub_82118D90" },
  { name = "set_handle_velocity", offset = 68, type = "fn", note = "slot 17: sub_82118DD0" },
  { name = "set_handle_3d", offset = 72, type = "fn", note = "slot 18: sub_82118E10" },
  { name = "set_handle_3d_params", offset = 76, type = "fn", note = "slot 19: sub_82118E50" },
  { name = "start_handle", offset = 80, type = "fn", note = "slot 20: sub_82118EA0" },
  { name = "stop_handle", offset = 84, type = "fn", note = "slot 21: sub_82118ED0" },
  { name = "remove_handle", offset = 88, type = "fn", note = "slot 22: sub_82118F00" },
  { name = "clear_handles", offset = 92, type = "fn", note = "slot 23: sub_82118C70" },
  { name = "update_handles", offset = 96, type = "fn", note = "slot 24: sub_821190B0" },
  { name = "set_listener_position", offset = 100, type = "fn", note = "slot 25: sub_82117E08" },
  { name = "set_listener_orientation", offset = 104, type = "fn", note = "slot 26: sub_82117E10" },
  { name = "set_listener_velocity", offset = 108, type = "fn", note = "slot 27: sub_82117E18" },
  { name = "set_listener_params", offset = 112, type = "fn", note = "slot 28: sub_82117E20" },
  { name = "get_category", offset = 116, type = "fn", note = "slot 29: AudioManager::GetCategory" },
  { name = "set_category_volume", offset = 120, type = "fn", note = "slot 30: AudioManager::SetCategoryVolume" },
  { name = "pause_category", offset = 124, type = "fn", note = "slot 31: AudioManager::PauseCategory" },
  { name = "resume_category", offset = 128, type = "fn", note = "slot 32: AudioManager::ResumeCategory" },
