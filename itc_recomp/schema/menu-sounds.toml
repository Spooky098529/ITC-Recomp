# A node of the handle list (12 bytes, PtrList's): next, previous, a Sound.
# The same layout as sound-cues.md's list at +1528 (AudioManager.+1532).
[SoundHandleNode]
measure = "AudioManager.+1544"
measures = ["AudioManager.+1544.+0", "AudioManager::RemoveHandle.r3@+1540.+4", "AudioManager::RemoveHandle.r3@+1540.+4.+0"]
size = 12
origin = "allocated"
fields = [
  { name = "next", offset = 0, type = "ptr", to = "SoundHandleNode" },
  { name = "previous", offset = 4, type = "ptr", to = "SoundHandleNode" },
  { name = "sound", offset = 8, type = "u32", note = "a Sound (sound-cues.md's, 24 bytes)" },
]

# The list of Sounds kept by handle (the manager's +1540, a std::list of
# pointers; HandleList::Remove's r3).
[SoundHandleList]
measure = "AudioManager::RemoveHandle.r3@+1540"
size = 12
origin = "embedded"
# Dual (E5 step 5, 2026-11-24): the host AudioManager's +1540.
storage = "dual"
fields = [
  { name = "allocator", offset = 0, type = "u32", note = "probably the allocator word (std::list's first)" },
  { name = "head", offset = 4, type = "ptr", to = "SoundHandleNode", note = "the head node" },
  { name = "size", offset = 8, type = "u32" },
]

# The sound manager (1,624 bytes, AudioManager::AudioManager sub_821197E0,
# made by AudioManager::Create sub_82119B38). "[826C5C80]" is the manager
# reached through its global ([0x826C5C80]).
[AudioManager]
measures = ["AudioManager", "[826C5C80]",
            "sub_82119188.r3", "sub_82118930.r3", "sub_82119018.r3"]
size = 1624
origin = "allocated"
vtable = 0x82008388
# Host (E5 step 5, 2026-11-24): made by AudioManager::Create (New in
# src/app_start_up/audio_manager.cpp); freed by its deleting destructor's
# operator delete (sub_82119450, never in play). Its interfaces (+4, +8),
# the handler (+1584) and the lists' and vector's words are reached by
# address (the owner's layout); the audio engine (+16) and the listener
# (+1456) are embed fields of dual types.
storage = "host"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "AudioManagerVtable", note = "0x82008388 (0x820082B8, the base's, in the destructor)" },
  { name = "bank_owner_vtable", offset = 4, type = "u32", note = "0x82008374 (0x82000D48 first): the interface the bank pairs' owner is (+36 of a BankPair); AudioManager::GetEngine's r3" },
  { name = "sound_owner_vtable", offset = 8, type = "u32", note = "0x82008364 (0x82000D48 first): the interface the Sounds' owner is (Sound +0); AudioManager::GetSoundBank's r3" },
  { name = "owner", offset = 12, type = "u32", note = "the constructor's r4; its vtable's slot +8 gives the dispatcher the handler at +1584 is registered with" },
  { name = "engine", offset = 16, type = "embed", to = "AudioEngine", note = "the audio engine (sound-cues.toml): the game's XACT and X3DAudio state" },
  { name = "listener", offset = 1456, type = "embed", to = "SoundListener", note = "the listener (sound-cues.toml, Listener::Listener)" },
  { name = "fault_1508", offset = 1508, type = "u32", note = "probably a measure fault: the +8 interface's +1508 (the bank pairs' first, +1516)" },
  { name = "bank_pairs", offset = 1512, type = "u32", note = "the bank pairs' vector (WordVector::Fill; one slot a bank index): +1512 its allocator word" },
  { name = "bank_pairs_first", offset = 1516, type = "u32", note = "the vector's first slot (a BankPair pointer, 0 for an empty slot)" },
  { name = "bank_pairs_end", offset = 1520, type = "u32", note = "the vector's end" },
  { name = "bank_pairs_capacity_end", offset = 1524, type = "u32", note = "the vector's capacity end (probably)" },
  { name = "sounds_head", offset = 1532, type = "u32", note = "the list of playing Sounds (+1528, a std::list): its head node (sound-cues.md)" },
  { name = "handle_sounds", offset = 1540, type = "bytes", count = 12, note = "the list of Sounds kept by handle (SoundHandleList; AudioManager::PlayHandle and slots 16 to 24)" },
  { name = "handle_sounds_head", offset = 1544, type = "ptr", to = "SoundHandleNode", note = "its head node" },
  { name = "next_handle", offset = 1552, type = "u32", note = "1 at first: the handle AudioManager::PlayHandle gives next" },
  { name = "name", offset = 1556, type = "bytes", count = 28, note = "a std::string (the constructor's r5)" },
  { name = "handler_vtable", offset = 1584, type = "u32", note = "the handler object (40 bytes, registered with the owner's dispatcher; its +12 = 3 runs sub_82094B10 each update): 0x820066DC (0x82000EB8 first)" },
  { name = "handler_vtable2", offset = 1588, type = "u32", note = "the handler's second vtable word: 0x82002908 (0x82000AB4, then 0x82000BA8, first)" },
  { name = "handler_8", offset = 1592, type = "u32", note = "the handler's +8, 0" },
  { name = "handler_12", offset = 1596, type = "u32", note = "the handler's +12, 0 (3 runs sub_82094B10 each update, known-data.md)" },
  { name = "handler_flag_16", offset = 1600, type = "u8", note = "the handler's +16, 0" },
  { name = "handler_flag_17", offset = 1601, type = "u8", note = "the handler's +17, 1" },
  { name = "handler_flag_18", offset = 1602, type = "u8", note = "the handler's +18, 0" },
  { name = "handler_message", offset = 1604, type = "u32", note = "the handler's +20: the constructor's caller's frame word (probably a message id)" },
  { name = "handler_delegate_vtable", offset = 1608, type = "u32", note = "the handler's delegate (+24, 16 bytes): 0x8200833C (0x82000ABC first)" },
  { name = "handler_delegate_object", offset = 1612, type = "ptr", to = "AudioManager", note = "the delegate's object: the manager" },
  { name = "handler_delegate_method", offset = 1616, type = "u64", note = "the delegate's member pointer (two words)" },
]

# AudioManagerSoundOwnerVtable and AudioManagerSoundOwnerSlot0: the XACT engine's
# interface (sound-cues.toml's XactEngineInterface; the measure had joined the
# audio manager with the audio engine until its offset fix, 2026-11-22).

# SoundBankIndex: merged into sound-cues.toml's SoundCuesBankIndex at the integration (the same object).

# SoundCueIndex: merged into sound-cues.toml's SoundCuesCueIndex at the integration (the same object).

# A handle given by address (Sound::HasHandle's r4: compared with a Sound's +12).
[SoundHandleWord]
measure = "Sound::HasHandle.r4"
size = 4
origin = "embedded"
fields = [
  { name = "handle", offset = 0, type = "u32" },
]

# The value HandleList::Remove erases, by address (a Sound pointer).
[SoundHandleListValue]
measure = "HandleList::Remove.r4"
size = 4
origin = "embedded"
fields = [
  { name = "sound", offset = 0, type = "u32" },
]

# The float Listener::SetFloat52 stores at the listener's +52, by address.
[ListenerFloat52Arg]
measure = "Listener::SetFloat52.r4"
size = 4
origin = "embedded"
fields = [
  { name = "value", offset = 0, type = "f32" },
]

[globals]
sound_manager = { address = 0x826C5C80, type = "ptr", to = "AudioManager", note = "the sound manager (AudioManager, app + 124; set by SoundGlobals::Init)" }
one = { address = 0x82000A30, type = "u32", note = "1.0 (copied as a word)" }
zero = { address = 0x82000A34, type = "u32", note = "0.0 (copied as a word)" }
fifteenth = { address = 0x82008060, type = "f32", note = "1/15: a volume setting's step" }
default_category_name = { address = 0x8200A6A4, type = "bytes", count = 8, note = "\"Default\": the effects' XACT category" }
music_category_name = { address = 0x82008348, type = "bytes", count = 6, note = "\"Music\": the music's XACT category" }
effects_volume = { address = 0x82616C38, type = "u32", note = "the effects' volume option's gain (a float; the car sounds' output scales by it)" }
effects_volume_2 = { address = 0x82616C3C, type = "u32", note = "the effects' gain again (a float; the race's sound handlers read it)" }
music_volume = { address = 0x82616BEC, type = "u32", note = "the music's volume (a float; the race's sound handlers fade it)" }

# Embedded objects the measure split from their owners after its offset
# fix (2026-11-22): seeded from the measure, unknown_ until read.

# Split from AudioManager.
[AudioManagerAt1552]
measure = "AudioManager@+1552"
size = 4
