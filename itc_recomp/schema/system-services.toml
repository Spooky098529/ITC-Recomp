# source ([0x8265D408]), then the areas after it laid out from the header's
# sizes. Also met as the +0 of sub_82577630's context (never called).
[XNetConfig]
measure = "XNet"
measures = ["sub_82577788.r3@+28.+20"]
size = 76
origin = "image"
fields = [
  { name = "flags", offset = 8, type = "u32", note = "bit 0: Configure fails (0x80004005)" },
  { name = "total_bytes", offset = 20, type = "u32", note = "the whole size; what's left after the tables goes to +56" },
  { name = "table_d_count", offset = 24, type = "u16", note = "times +26: the area from +64 to +68" },
  { name = "table_d_entry_bytes", offset = 26, type = "u16" },
  { name = "table_e_count", offset = 32, type = "u16", note = "halfwords: the area from +68 to +72" },
  { name = "block_a_bytes", offset = 38, type = "u16", note = "the optional area at +60" },
  { name = "table_b_count", offset = 40, type = "u16", note = "a word each at +44, entries of +42 bytes at +48" },
  { name = "table_b_entry_bytes", offset = 42, type = "u16" },
  { name = "table_b_index", offset = 44, type = "u32", note = "after the header (and the +60 area)" },
  { name = "table_b", offset = 48, type = "u32" },
  { name = "heap", offset = 52, type = "u32", note = "after table_b" },
  { name = "heap_bytes", offset = 56, type = "u32", note = "total_bytes less the header and the tables" },
  { name = "block_a", offset = 60, type = "u32", note = "the source + 44, when block_a_bytes isn't 0" },
  { name = "table_d", offset = 64, type = "u32", note = "heap + heap_bytes" },
  { name = "table_e", offset = 68, type = "u32" },
  { name = "end", offset = 72, type = "u32" },
]

