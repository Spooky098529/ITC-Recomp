# The schema of docs/functions/system-services.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The system services: the users object, the network manager with its user
# table and voice engine, the profile read, XNet's block, the save devices'
# vtables Update calls, and the never-called system link and Live code's
# objects (named by shape; not read). Hand ports: src/hooks/network.cpp,
# notify.cpp, profile.cpp, voice.cpp, user.cpp, start_up.cpp, src/user/,
# src/app/start_up.cpp (xstart).
#
# Not described here, other areas' types the measure filed here (their
# measure names are the lead's to add there):
# - menu-helpers.toml's PageObject: new<28>@Type12Screen6::Create,
#   @Type12Screen9::Create, @Type12Dialog11::Create, @NetRanking::Create;
#   its FrontEndMenu: new<68>@NetRanking::Create.
# - network-mode.toml's NetMachine: sub_8226A660.r3, sub_82263D80.r3,
#   sub_822659F0.ret, sub_822657D8.r3, sub_82265930.r3, sub_82266028.r3,
#   sub_822662F0.r3, sub_822663E0.r3, sub_82266548.r3, sub_82266658.r3,
#   sub_822681D0.r3, sub_822681D0.ret, sub_82268720.r3, sub_82269988.r3,
#   sub_8226CB40.r3, sub_822702C0.r3, sub_82277178.r3, sub_822800C0.r3,
#   sub_82282630.r3.
# - boot-mode.toml's ModeDispatcher (812 bytes, +804 ring_count, +808):
#   sub_8226A660.r4, sub_82263D80.r4, sub_822657D8.r4, sub_82266028.r4,
#   sub_822662F0.r4, sub_822663E0.r4, sub_82266548.r4, sub_82266658.r4,
#   sub_82266750.r4, sub_822681D0.r4, sub_82269988.r4, sub_822702C0.r4,
#   sub_82277178.r4, sub_82277340.r4, sub_82282BC8.r6, sub_822858D8.r4.
# - app-start-up.toml's AppInterface16 / AppFrameworkInterface /
#   AppFrameworkInterfaceVtable (the app's +16 interface, its +8 the
#   framework's +36 interface, whose vtable's +36 is sub_82493700):
#   sub_820943C8.r3, .r3.+8, .r3.+8.+0; and sub_82493700.r3 (96 bytes, +92
#   read: the framework's +36 interface this-adjusted).
# - frame-driver.toml's FrameDriverRunLoopRef: sub_820998B8.r4.+0.


# The users object (256 bytes, Users::Create sub_82099A08, vtable
# 0x82000FA0; the docs' "app" of App::ReadUsers and App::PollSignIn): the four
# users' sign-in records, the signed-in and Live lists, the notification
# listener (src/hooks/notify.cpp) and the Live connection state.
# In host memory since E5 step 4: made by Users::Create's operator new
# (0x82099A24, lifted), freed by its deleting destructor sub_820997D8's
# operator delete (0x82099808, which tells handles; probably never runs).
# Its +224 and +228 are keys handed to the run loop by address (interior
# handles), and save-interface.toml's SignedInUsers is the same object as
# the save interface reads it (dual).
[SysUsers]
measure = "new<256>@Users::Create"
size = 256
origin = "allocated"
storage = "host"
host_alloc = [0x82099A24]
vtable = 0x82000FA0
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82000FA0" },
  { name = "user0_signin_state", offset = 8, type = "u32", note = "the four 40-byte user records from +8 (user n at +8 + 40n): XUserGetSigninState's answer (1 local, 2 Live)" },
  { name = "user0_xuid", offset = 16, type = "u64", note = "the record's +8: XUserGetXUID's answer" },
  { name = "user0_name", offset = 24, type = "bytes", count = 16, note = "the record's +16: XUserGetName's 16 bytes" },
  { name = "user0_on_live", offset = 40, type = "u8", note = "the record's +32: 1 when signed in to Live (state 2)" },
  { name = "live_users", offset = 168, type = "u32", note = "the Live users' list (8 bytes each: the record's address, then the user at +172)" },
  { name = "live_user0_index", offset = 172, type = "u32", note = "the first Live entry's user index" },
  { name = "signed_in_users", offset = 200, type = "u32", note = "the signed-in users' indices (a word each, 4)" },
  { name = "signed_in_count", offset = 216, type = "u32" },
  { name = "live_count", offset = 220, type = "u32" },
  { name = "tick_key", offset = 224, type = "u32", note = "the set-up block's +8" },
  { name = "listener_key", offset = 228, type = "u32", note = "the set-up block's +12" },
  { name = "framework_interface", offset = 232, type = "u32", note = "the set-up block's +4" },
  { name = "unknown_236", offset = 236, type = "u32", note = "set by sub_820998B8 (not read in detail)" },
  { name = "listener", offset = 240, type = "u32", note = "the notification listener (XNotifyCreateListener mask 3; user::kNoListener since B5)" },
  { name = "users_changed", offset = 244, type = "u32", note = "set when the users were rebuilt (sign-in changed)" },
  { name = "live_connection_changed", offset = 248, type = "u32", note = "set by Live connection changed (never sent); App's Live connection state answer" },
  { name = "live_connection_state", offset = 252, type = "u32", note = "Live connection changed's parameter" },
]

# The block sub_820998B8 (the users' set-up) gets (r4), as SaveDevicesSetUp
# (save-interface.toml): the run loop, then the words it copies into the users.
[SysUsersSetUp]
measure = "sub_820998B8.r4"
size = 16
origin = "embedded"
fields = [
  { name = "run_loop", offset = 0, type = "ptr", to = "FrameDriverRunLoopRef", note = "the run loop (frame-driver.toml's FrameDriverRunLoopRef: its slots 2 and 1)" },
  { name = "framework_interface", offset = 4, type = "u32", note = "into the users' +232" },
  { name = "tick_key", offset = 8, type = "u32", note = "into the users' +224" },
  { name = "listener_key", offset = 12, type = "u32", note = "into the users' +228" },
]

# The network manager (460 bytes at 0x826C74A0; its constructor
# sub_8214F660): the voice engine (0 since 2026-10-30: XHV isn't made,
# src/hooks/voice.cpp), the chat data buffer and the machine id. Its system link
# and voice users (sub_8214F790, sub_8214F938, sub_8214FA20, sub_8214FC40,
# sub_8214FDF8, sub_8214FF78) never run.
[NetworkManager]
measures = ["Network", "sub_8214FDF8.r3", "sub_8214FF78.r3", "sub_8214F790.r3", "sub_8214FA20.r3", "sub_8214FC40.r3", "sub_8214F938.r3", "[826C74A0]"]
size = 460
origin = "image"
fields = [
  { name = "voice_engine", offset = 0, type = "ptr", to = "VoiceEngine", note = "XHV's engine (0: not made)" },
  { name = "unknown_4", offset = 4, type = "u32", note = "+4 to +32 cleared by the constructor" },
  { name = "chat_buffer", offset = 36, type = "bytes", count = 400, note = "the local chat data (the engine's GetLocalChatData, sub_8214FA78)" },
  { name = "chat_bytes", offset = 436, type = "u32", note = "the chat data's count" },
  { name = "voice_ticks", offset = 444, type = "u32", note = "the tick count at the voice set-up (sub_8214F6E8)" },
  { name = "machine_id", offset = 456, type = "ptr", to = "NetUserTable", note = "where the machine id is: the user table (0x826C7670), from the voice set-up's r4" },
]

# XHV's voice engine (2,240 bytes, Voice::Init; never made since 2026-10-30).
# The measure files the calls through its table (+0, the 22 entries at
# 0x829576D0) as the engine's own words: each slot below is the table's word
# at that offset (a measure fault, kept as named slots).
[VoiceEngine]
measures = ["sub_8214FDF8.r3.+0", "sub_8214FF78.r3.+0", "sub_8214F790.r3.+0", "sub_8214F938.r3.+0", "sub_8214FA20.r3.+0", "sub_8214FC40.r3.+0", "[826C74A0].+0"]
size = 2240
origin = "allocated"
fields = [
  { name = "table", offset = 0, type = "u32", note = "the engine's table (0x829576D0)" },
  { name = "slot_start_remote_processing", offset = 20, type = "fn", note = "measure fault: the table's +20 (sub_8257B0A8, probably StartRemoteProcessingModes)" },
  { name = "slot_register_remote_talker", offset = 40, type = "fn", note = "measure fault: the table's +40 (sub_8257B188)" },
  { name = "slot_unregister_remote_talker", offset = 44, type = "fn", note = "measure fault: the table's +44 (sub_8257B290)" },
  { name = "slot_get_remote_talkers", offset = 48, type = "fn", note = "measure fault: the table's +48 (sub_8257B2F0)" },
  { name = "slot_is_headset_present", offset = 52, type = "fn", note = "measure fault: the table's +52 (sub_8257A790)" },
  { name = "slot_set_playback_priority", offset = 80, type = "fn", note = "measure fault: the table's +80 (sub_8257B4F8)" },
  { name = "slot_submit_incoming_chat_data", offset = 84, type = "fn", note = "measure fault: the table's +84 (sub_8257B568)" },
]

# The user table (384 bytes at 0x826C7670, cleared by Network::StartUp; the
# network manager's machine id points here): the signed-in users' names and
# XUIDs Network::Update writes (src/hooks/network.cpp) and their gamercard
# regions.
[NetUserTable]
measure = "sub_8214FDF8.r3.+456"
size = 384
origin = "image"
fields = [
  { name = "machine_id", offset = 0, type = "u64", note = "XNetXnAddrToMachineId's out (never written: not signed in to Live)" },
  { name = "count", offset = 12, type = "u8", note = "the signed-in users" },
  { name = "names", offset = 14, type = "bytes", count = 128, note = "4 32-byte UTF-16 names, in order" },
  { name = "xuids", offset = 144, type = "bytes", count = 32, note = "4 XUIDs, in order" },
  { name = "region_slot0", offset = 316, type = "u32", note = "the gamercard region (profile setting 3) after a read" },
  { name = "region_slot1", offset = 320, type = "u32" },
  { name = "region_slot2", offset = 324, type = "u32" },
  { name = "region_slot3", offset = 328, type = "u32" },
  { name = "slot_counts", offset = 364, type = "bytes", count = 16, note = "a word per signed-in slot (achievements.md: probably the network battles' wins)" },
]

# The profile read's results (sub_82149178; XUSER_READ_PROFILE_SETTING_RESULT),
# kept at 0x826C6AD0.
[SysProfileResults]
measure = "new<?>@sub_82149178"
size = 8
origin = "allocated"
# A blob (E5 step 5, 2026-11-24): the profile read's whole result buffer
# (XUSER_READ_PROFILE_SETTING_RESULT, the settings and their data after it,
# user::kProfileBytes), filled by our XUserReadProfileSettings
# (src/hooks/profile.cpp, by address) with pointers into itself; made by the
# lifted profile read's operator new[] (returning at 0x82149224, r3 the
# size), freed by its operator delete[] before the next read.
storage = "blob"
blob_alloc = [{ call = 0x82149224, reg = "r3" }]
fields = [
  { name = "count", offset = 0, type = "u32", note = "the settings' count (26)" },
  { name = "settings", offset = 4, type = "ptr", to = "SysProfileSettings", note = "the settings (0 while missing)" },
]

# The profile's settings (40-byte XUSER_PROFILE_SETTINGs: source +0, user
# +8, id +16, data +24 with its value at +32), 26 of them.
[SysProfileSettings]
measure = "new<?>@sub_82149178.+4"
size = 1040
origin = "allocated"
fields = [
  { name = "region_source", offset = 120, type = "u32", note = "setting 3's source (0 when missing): the gamercard region" },
  { name = "region_value", offset = 152, type = "u32", note = "setting 3's value" },
  { name = "setting15_value", offset = 632, type = "u32", note = "setting 15's value (save-screen.md)" },
  { name = "setting16_value", offset = 672, type = "u32", note = "setting 16's value" },
  { name = "setting17_value", offset = 712, type = "u32", note = "setting 17's value" },
  { name = "setting18_value", offset = 752, type = "u32", note = "setting 18's value" },
]

# The profile read's XOVERLAPPED (28 bytes at 0x826C6080), completed at once
# by XUserReadProfileSettings (src/hooks/profile.cpp).
[SysXOverlapped]
size = 28
origin = "image"
fields = [
  { name = "result", offset = 0, type = "u32", note = "InternalLow: 997 while pending, then the result" },
  { name = "length", offset = 4, type = "u32", note = "InternalHigh: 0, or -1 for an error" },
  { name = "context", offset = 8, type = "u32" },
  { name = "event", offset = 12, type = "u32" },
  { name = "completion_routine", offset = 16, type = "u32" },
