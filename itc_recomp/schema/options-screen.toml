# The schema of docs/functions/options-screen.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The front end's options screen (UI movie 7) and the settings it edits
# (src/options_screen/). Its seven blocks are VirtualAlloc'ed by
# Options::OnEnter (globals below): the page block [0x826D8470] and the
# blocks [0x826D8480] are PageObjects and the menus [0x826D8474] and
# [0x826D8484] FrontEndMenus (menu-helpers.toml's; the measure files them as
# "new<28>@Options::OnEnter", "#3", "new<68>@Options::OnEnter", "#2"); the
# load and save pages' blocks [0x826D847C] and [0x826D8488] are
# options-load-save.toml's.

# The screen's machine: a StateMachine (game-modes.toml) with a word of its
# own after it, as the other front-end screens' machines. The measure also
# files under it the steps' r3 (the step word: +0), Options::SetDefaults'
# save options (+4 to +41) and Options::ClosePage's dispatcher (+804,
# +808): all inside `transitions` here (measure faults).
[OptionsMachine]
measure = "Options"
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32" },
  { name = "loaded", offset = 9608, type = "u32", note = "1 once movie 7 is loaded (WaitForMovie)" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: OnEnter and WaitForMovie go to state 9 (open on its message)" },
  { name = "delete_movie", offset = 9616, type = "u32", note = "set: Options::Close deletes movie 7" },
]

# The mode as the handlers see it (r4, the dispatcher): only its message
# ring, which they post to.
[OptionsDispatcher]
measures = ["Options::Close.r4", "Options::Leave.r4", "Options::OnClosed.r4", "Options::Show.r4"]
size = 812
origin = "embedded"
storage = "dual"
fields = [
  { name = "messages", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (id, two words)" },
  { name = "message_count", offset = 804, type = "u32" },
  { name = "message_start", offset = 808, type = "u32", note = "the ring's first slot" },
]

# The options' settings ([0x826D8478], 716 bytes; docs/known-data.md): the
# context, type 2's career info, three copies of a 192-byte settings block
# (the current settings, the edits, the defaults) and the pages' state.
# "Settings.+-31624" and "new<68>@Options::OnEnter.+4.+-31620" are this
# block reached through the globals' base register (measure faults).
[OptionsSettings]
measures = ["Settings", "Settings.+-31624", "new<68>@Options::OnEnter.+4.+-31620",
            "Settings.+-31596"]
size = 716
origin = "allocated"
fields = [
