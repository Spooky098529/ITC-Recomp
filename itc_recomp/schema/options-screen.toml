  { name = "context", offset = 4, type = "u32", note = "from the mode type: 2 -> 1, 4 -> 0, 6 -> 2, 7 -> 3, 8 -> 4" },
  { name = "music_preview_shown", offset = 8, type = "u32", note = "save +4, or bit 5 of save +6092" },
  { name = "name_0", offset = 12, type = "u32", note = "save +8 + 4i (probably the player's name; type 2 only)" },
  { name = "name_1", offset = 16, type = "u32" },
  { name = "name_2", offset = 20, type = "u32" },
  { name = "name_3", offset = 24, type = "u32" },
  { name = "name_4", offset = 28, type = "u32" },
  { name = "money", offset = 32, type = "u32", note = "save +6116 (type 2 only)" },
  { name = "day_of_week", offset = 36, type = "u32", note = "save +6100 mod 7 (probably; type 2 only)" },
  { name = "day", offset = 40, type = "u32", note = "save +6100 capped at 999 (probably; type 2 only)" },
  { name = "current_block", offset = 44, type = "bytes", count = 192, note = "the current settings: the 192-byte settings block named word by word below" },
  { name = "current_hud_0", offset = 44, type = "u32", note = "the HUD's four on/off values (save options +0 to +12)" },
