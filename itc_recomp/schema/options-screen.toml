# A measure fault: Options::MoveHudCursor's globals' base register, which
# the measure takes for the menu's +4 (probably 0x826DFFFC: -31620 the
# settings' global).
[OptionsFaultBase]
measure = "new<68>@Options::OnEnter.+4"
size = 4
origin = "embedded"
fields = [
  { name = "fault_settings_global", offset = -31620, type = "u32", note = "measure fault: the image word [0x826D8478], not a field" },
]

# UiMovies::Find's answer: the address of a value in a {key, value} pair
# table (mostly the movie table 0x826C5CCC's), or 0x826C5CDC when not found.
[UiMovieTableValue]
measure = "UiMovies::Find.ret"
size = 4
origin = "file"
fields = [
  { name = "value", offset = 0, type = "u32", note = "the value (in the movie table: the UI movie)" },
]

# What Options::PlayMusicPreview reads after Music::Play: probably the sound
# manager [0x826C5C80] reloaded (a measure fault), its vtable's slot 6
# (IsBankLoading, +24).
[OptionsMusicPlayVtable]
measure = "Music::Play.ret.+0"
size = 28
origin = "embedded"
fields = [
  { name = "slot_6", offset = 24, type = "u32", note = "probably the sound manager's IsBankLoading" },
]

[OptionsMusicPlayResult]
measure = "Music::Play.ret"
size = 4
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "OptionsMusicPlayVtable" },
]

