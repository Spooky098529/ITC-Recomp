# The schema of docs/functions/xaudio-objects.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# XAudio's factory objects (the game's own copy of XAudio, translated): the
# factory's object base and descriptor, the source codecs (PCM and XMA)
# with their codec base, packet queue and entries, the sample rate
# converter, the output matrix, the volume meter, the reverb (its I3DL2
# side at +16, its delay lines and filters at +208) and the stages its
# hand port works on, and the out words and allocator the factory's
# functions take. Names from docs/functions/xaudio-objects.md,
# docs/known-data.md and the hand port (src/xaudio/); the reverb's
# parameters by XAudio2's XAUDIO2FX_REVERB_PARAMETERS and I3DL2's listener
# properties, which their conversion matches ("probably" there).
#
# No embedded types in the schema: an object holding another (a codec's
# base at +16, its converter at +184, the reverb's I3DL2 side and core)
# repeats the inner one's fields at their offsets, named for what they are.
#
# Measure faults (tools/type_map.py), each kept as a field with its own
# name and a note so every access fits: a callee's pointer parameter taken
# for the caller's object at offset 0 (the reverb core's stages,
# ReverbCore::Defaults and FilterCoefficient; I3dl2::ToNative's input;
# ReverbCore::Apply's parameters as the reverb; Reverb::Run's core as the
# reverb), the factory's descriptor joined with the object it describes
# (the Size functions' r3), and the codec's inner object joined with the
# outer codec (XAudioCodec::GetState, EndOfStream). The render driver's
# set-up (sub_824657C8) meets AudioRenderDriver, audio.md's: left there.

# Every object the factory makes (docs/known-data.md, "XAudio factory object"):
# an outer interface at +0 over an inner object at +4 (vtable, reference
# count, owner). XAudioObject::Release and Free read it; shared with
# xaudio.md's voices (they hold and release these).
[XAudioObject]
measure = "XAudioObject"
measures = ["sub_82466410.r3@-4"]
size = 16
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "the outer vtable (the class's methods: +0 AddRef, +4 Release, +8 the info, +24 the pass)" },
  { name = "inner_vtable", offset = 4, type = "ptr", to = "XAudioInnerVtable", note = "the inner object's vtable (first 0x8204AA58, the shared base)" },
  { name = "ref_count", offset = 8, type = "u32" },
  { name = "owner", offset = 12, type = "u32", note = "the descriptor's +4 (probably the voice: the callbacks' first argument)" },
]

# The inner object's vtable (the object's +4).
[XAudioInnerVtable]
measures = ["XAudioObject.+4", "Reverb::Reverb.ret.+4", "XmaCodec::XmaCodec.ret.+4"]
size = 20
origin = "image"
fields = [
  { name = "destructor", offset = 0, type = "fn" },
  { name = "delete_object", offset = 12, type = "fn", note = "the deleting call (sub_8245AAB8, xaudio-engine.md)" },
  { name = "count", offset = 16, type = "fn", note = "sub_820911F8, shared" },
]

# The factory's descriptor (the class tables' size and create functions'
# r3): +0 the class id, +4 the owner, then the class's own words, a union
# by class: a codec's 56-byte source format at +8 and its packets, the
# matrix's entries and default matrix, the meter's channels and history.
[XAudioObjectDescriptor]
measures = ["XAudioCodec::Construct.r4", "XAudioCodec::Init.r4", "PcmCodec::PcmCodec.r4", "XmaCodec::XmaCodec.r4", "XAudioMatrix::Init.r4", "VolumeMeter::Init.r4", "Reverb::Reverb.r4", "sub_825A50E0.r3", "sub_825A5DB8.r3", "sub_824657C8.r4"]
size = 80
origin = "embedded"
fields = [
  { name = "class_id", offset = 0, type = "u32" },
  { name = "owner", offset = 4, type = "u32", note = "copied to the object's +12" },
  { name = "format_type", offset = 8, type = "u8", note = "a codec's format type: 0-3 PCM, 4 XMA (the format's +0)" },
  { name = "matrix_entries", offset = 8, type = "u8", note = "the matrix's entry count" },
  { name = "meter_channels", offset = 8, type = "u32", note = "the meter's channels (probably)" },
  { name = "render_device", offset = 8, type = "u32", note = "the render driver's r4 to its Register (audio.md)" },
  { name = "matrix_overwrite", offset = 9, type = "u8", note = "the matrix's overwrite flag (SetOverwrite)" },
  { name = "format_channels", offset = 12, type = "u8", note = "a codec's channels, or an XMA format's streams" },
  { name = "matrix_default", offset = 12, type = "ptr", to = "MatrixLevels", note = "the matrix's default levels (0: none)" },
  { name = "meter_history_length", offset = 12, type = "u32", note = "the meter's history length (probably)" },
  { name = "format_rate", offset = 16, type = "u32", note = "a PCM format's sample rate" },
  { name = "xma_block_scale", offset = 64, type = "f32", note = "the XMA codec's block size: 2^x x 16, rounded up to 16ths (XmaCodec::XmaCodec)" },
  { name = "packet_count", offset = 68, type = "u8", note = "the codec's packet entries" },
  { name = "converter_flags", offset = 69, type = "u8", note = "copied to the codec's +268 (PCM, the converter's flags) or +252 (XMA)" },
  { name = "packet_done_callback", offset = 72, type = "fn" },
  { name = "loop_end_callback", offset = 76, type = "fn" },
]

