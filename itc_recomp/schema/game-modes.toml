fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82010A48" },
  { name = "delegate_ptr", offset = 4, type = "u32", note = "the delegate at +8 (GameMode's)" },
  { name = "delegate_vtable", offset = 8, type = "u32" },
  { name = "delegate_object", offset = 12, type = "u32" },
  { name = "delegate_function", offset = 16, type = "fn" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82010A3C" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher: 50 handler pointers" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "50 messages of 12 bytes (ModeMessage)" },
