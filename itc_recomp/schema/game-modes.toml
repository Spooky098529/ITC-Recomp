# The schema of docs/functions/game-modes.md's objects (docs/e5-native.md, step 2).
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.

# The game's state machine (StateMachine::StateMachine sub_82107108): 200
# transitions of 48 bytes, then the words every mode's machine uses.
[StateMachine]
size = 9616
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (key, functor, next state)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32" },
  { name = "loaded", offset = 9608, type = "u32", note = "set once a mode's movies are loaded (the modes' WaitForMovies)" },
  { name = "reenter", offset = 9612, type = "u32" },
]

# One transition of a state machine's table (48 bytes; known-data.md:
# "transition"). The measure meets the table only as StateMachine's +0 to
# +44 (its first transition), so this type has no measure name of its own.
[StateTransition]
size = 48
origin = "embedded"
fields = [
  { name = "key", offset = 0, type = "bytes", count = 16, note = "the key (TransitionKey): all four words compared" },
  { name = "state", offset = 0, type = "u32", note = "the state the transition is taken in" },
  { name = "message", offset = 4, type = "u32", note = "the message id (0 Update, 1 Draw)" },
  { name = "arg0", offset = 8, type = "u32", note = "the message's second word" },
  { name = "arg1", offset = 12, type = "u32", note = "the message's third word" },
  { name = "functor", offset = 16, type = "u32", note = "a pointer to the functor's storage (+20): the functor part (StateFunctorPart) starts here" },
  { name = "storage", offset = 20, type = "bytes", count = 24, note = "the functor's storage (StateFunctor)" },
  { name = "functor_vtable", offset = 20, type = "u32", note = "0x82011918 a member function, 0x820069BC nothing" },
  { name = "functor_object", offset = 24, type = "u32", note = "the object (the state machine)" },
  { name = "functor_function", offset = 28, type = "fn", note = "the function" },
  { name = "next_state", offset = 44, type = "u32", note = "0: stay" },
]

# A transition's key (16 bytes): (state, the message's three words), as
# StateMachine::Add and StateKey::Equals get it.
[TransitionKey]
measures = ["StateKey", "StateKey::Equals.r4"]
size = 16
origin = "embedded"
fields = [
  { name = "state", offset = 0, type = "u32" },
  { name = "message", offset = 4, type = "u32", note = "the message id" },
  { name = "arg0", offset = 8, type = "u32" },
  { name = "arg1", offset = 12, type = "u32" },
]

# A transition's functor part (a transition from +16; 32 bytes): what
# StateMachine::Add gets (r5), Find and Handle return, and the static
# default at 0x826C5B68.
[StateFunctorPart]
measures = ["StateMachine::Add.r5", "StateMachine::Find.ret", "StateMachine::Handle.ret"]
size = 32
origin = "embedded"
fields = [
  { name = "functor", offset = 0, type = "u32", note = "a pointer to the storage (+4); GameMessages::Dispatch calls its slot 0" },
  { name = "storage", offset = 4, type = "bytes", count = 24, note = "the functor's storage (StateFunctor)" },
  { name = "functor_vtable", offset = 4, type = "u32", note = "0x82011918 a member function, 0x820069BC nothing" },
  { name = "functor_object", offset = 8, type = "u32" },
  { name = "functor_function", offset = 12, type = "fn" },
  { name = "next_state", offset = 28, type = "u32", note = "0: stay" },
]

# A functor (24 bytes of storage in a transition): vtable 0x82011918 calls
# +8 on +4 (probably Delegate::Invoke), 0x820069BC does nothing.
[StateFunctor]
measure = "StateMachine::Handle.ret.+0"
size = 24
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82011918 a member function, 0x820069BC nothing" },
  { name = "object", offset = 4, type = "u32", note = "the state machine" },
  { name = "function", offset = 8, type = "fn" },
]

# A message (12 bytes: a mode's ring entry), as StateMachine::Handle gets it.
[ModeMessage]
measure = "StateMachine::Handle.r4"
size = 12
origin = "embedded"
fields = [
  { name = "id", offset = 0, type = "u32", note = "0 Update, 1 Draw" },
  { name = "arg0", offset = 4, type = "u32" },
  { name = "arg1", offset = 8, type = "u32" },
]

# The modes' holder (8 bytes, Modes::Modes; operator new in sub_82092878).
# Its +4 (the current mode) is boot-mode.toml's GameMode.
[ModeHolder]
measure = "Modes"
size = 8
origin = "allocated"
storage = "host"
host_alloc = [0x820928D4]
vtable = 0x82006AF0
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006AF0 (slot 0 sub_820ACCF0; 1 to 3 the empty sub_82106540)" },
  { name = "mode", offset = 4, type = "ptr", to = "GameMode", note = "the current mode, 0 until Modes::Tick makes one" },
]

# The race mode (type 1, 167,264 bytes; RaceMode::RaceMode sub_821073B8;
# known-data.md: "race mode"). The base (0 to 848) is GameMode's
# (boot-mode.toml); then ten state machines (each a StateMachine with its
# owner's words after its count and state, described by the owners' areas)
# and the camera director at +10512 (camera-modes.toml's CameraDirector).
# In host memory (E5 step 4): made by Mode::Create (game_modes::ModeCreate's
# New; host_alloc for its lifted original's operator new), freed by its
# deleting destructor's operator delete (sub_82107590, lifted). Its members
# (the machines, the camera director, the XPR, the overlay list) stay bytes
# fields, reached through their guest views at the handle + offset (raw
# accesses in guest order): embedding them would duplicate the machines'
# count and state words, which the lifted RaceMode::RaceMode original
# reaches through this view's accessors.
[RaceMode]
measure = "RaceMode"
size = 167264
origin = "allocated"
storage = "host"
host_alloc = [0x82107810]
vtable = 0x82006D34
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006D34 (the base's 0x820069EC before)" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer), not the mode's" },
  { name = "answer", offset = 0, type = "u64", note = "measure fault: the next-mode answer's 8 bytes (ModeAnswer), not the mode's" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8 (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "0x82006B20 the default; 0x82010FA0 after RaceMode::Init" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "0x82235C08 Mode::NextModeThunk" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82006D28 (the base's 0x82006A0C before)" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36): 50 handler pointers (state machines)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (ModeMessage)" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "course_setup", offset = 848, type = "bytes", count = 9600, note = "the course set-up's state machine (CourseSetup::, race-loading.md)" },
  { name = "course_setup_count", offset = 10448, type = "u32" },
  { name = "course_setup_state", offset = 10452, type = "u32" },
  { name = "camera_director", offset = 10512, type = "bytes", count = 77392, note = "the camera director (RaceModeMember::RaceModeMember; camera-modes.toml's CameraDirector), its state machine at +10528" },
  { name = "race_scene", offset = 87936, type = "bytes", count = 9600, note = "the race scene's state machine (race-scene.md)" },
  { name = "race_scene_count", offset = 97536, type = "u32" },
  { name = "race_scene_state", offset = 97540, type = "u32" },
  { name = "race_flow", offset = 97548, type = "bytes", count = 9600, note = "the race flow's state machine (race-flow.md, racer-controllers.md)" },
  { name = "race_flow_count", offset = 107148, type = "u32" },
  { name = "race_flow_state", offset = 107152, type = "u32" },
  { name = "race_states", offset = 107168, type = "bytes", count = 9600, note = "the race states' state machine (race-states.md)" },
  { name = "race_states_count", offset = 116768, type = "u32" },
  { name = "race_states_state", offset = 116772, type = "u32" },
  { name = "race_world", offset = 116812, type = "bytes", count = 9600, note = "the race world's state machine (race-world.md)" },
  { name = "race_world_count", offset = 126412, type = "u32" },
  { name = "race_world_state", offset = 126416, type = "u32" },
  { name = "race_hud_machine", offset = 128664, type = "bytes", count = 9600, note = "the race HUD machine (race-hud-machine.md)" },
  { name = "race_hud_machine_count", offset = 138264, type = "u32" },
  { name = "race_hud_machine_state", offset = 138268, type = "u32" },
  { name = "race_sounds", offset = 138284, type = "bytes", count = 9600, note = "the race sounds' state machine (race-sounds.md)" },
  { name = "race_sounds_count", offset = 147884, type = "u32" },
  { name = "race_sounds_state", offset = 147888, type = "u32" },
  { name = "xpr", offset = 147892, type = "bytes", count = 24, note = "an XPR (XPR::XPR; the race sounds' machine's +9608)" },
  { name = "overlays_machine", offset = 147944, type = "bytes", count = 9600, note = "the race overlays' state machine (RaceOverlaysMachine)" },
  { name = "overlays_machine_count", offset = 157544, type = "u32" },
  { name = "overlays_machine_state", offset = 157548, type = "u32" },
  { name = "overlays", offset = 157552, type = "bytes", count = 100, note = "the race overlays' list (RaceOverlays::Clear, race-overlays.md)" },
  { name = "machine_157652", offset = 157652, type = "bytes", count = 9600, note = "a state machine RaceMode::Init doesn't set up or add" },
  { name = "machine_157652_count", offset = 167252, type = "u32" },
  { name = "machine_157652_state", offset = 167256, type = "u32" },
  { name = "running", offset = 167260, type = "u32", note = "1 after RaceMode::Init; RaceMode::NextMode posts Update only while it isn't 0 (race-loading.md)" },
]

# The race overlays' state machine (race mode + 147944; RaceOverlaysMachine::Init
# sub_8215E6C8 and its handlers): a StateMachine, then the overlay list.
[RaceOverlaysMachine]
measure = "RaceOverlaysMachine"
size = 9708
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateTransition)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "0 at set-up, 1 the overlays made, 3, 2 the views bound, 5 running, 6 probably paused, 7 and 8 the end" },
  { name = "overlays", offset = 9608, type = "bytes", count = 100, note = "25 overlay pointers (race-overlays.md's CarOverlays; 0 none)" },
]

# A camera path buffer (28 bytes, vtable 0x82009390; the TV camera's four at
# +43016): a camera path file loaded into a VirtualAlloc block
# (CameraPath::Load and OnLoaded, camera-modes.md).
[CameraPathBuffer]
measure = "Buffer28"
measures = ["CameraPath::OnLoaded.r6", "Buffer28::Reset.r3"]
size = 28
origin = "embedded"
vtable = 0x82009390
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82009390" },
  { name = "first_path", offset = 4, type = "u32", note = "the file's first 20-byte path (CameraPath::OnLoaded)" },
  { name = "last_path", offset = 8, type = "u32", note = "its last path" },
  { name = "index", offset = 12, type = "u32", note = "-1 at reset" },
  { name = "serial", offset = 16, type = "u32", note = "Archive::Load's answer; -1 at reset" },
  { name = "block", offset = 20, type = "u32", note = "the VirtualAlloc block the file is read into; 0 none" },
  { name = "state", offset = 24, type = "u32", note = "0 at reset, 1 allocating, 2 loading, 3 loaded" },
]

# An object holding an XPR (XprHolder::XprHolder sub_821067A0; the cutscene's
# rival logo's at its +20, camera-modes.toml's RivalLogo).
[XprHolder]
measure = "XprHolder::XprHolder.r3"
size = 56
origin = "embedded"
fields = [
  { name = "unknown_0", offset = 0, type = "u32", note = "-1 in the rival logo's (RivalLogo.holder)" },
  { name = "xpr", offset = 4, type = "bytes", count = 24, note = "the XPR (XPR::XPR)" },
  { name = "xpr_flags", offset = 28, type = "u32", note = "2 at set-up in the rival logo's, bit 0x10 loaded" },
  { name = "records", offset = 32, type = "bytes", count = 24, note = "two 12-byte records, cleared at construction and destruction" },
  { name = "record0_word0", offset = 32, type = "u32" },
  { name = "record0_word1", offset = 36, type = "u32" },
  { name = "record0_word2", offset = 40, type = "u32" },
  { name = "record1_word0", offset = 44, type = "u32" },
  { name = "record1_word1", offset = 48, type = "u32" },
  { name = "record1_word2", offset = 52, type = "u32" },
]

# The type 6 mode (852 bytes, ModeType6::ModeType6 sub_82235E88): the base
