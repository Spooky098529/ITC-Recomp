  { name = "xy", offset = 0, type = "u64" },
  { name = "zw", offset = 8, type = "u64" },
]

# A float3 handed by pointer: AccessorySkeleton::SwingNode's swing vector,
# sub_8259B188's r5 (not read), Matrix::FromScaleRotationTranslation's
# angles, position and scale.
[AccessoryFloat3]
measure = "AccessorySkeleton::SwingNode.r5"
measures = ["sub_8259B660.r3.+144@+16"]
size = 12
origin = "embedded"
fields = [
  { name = "x", offset = 0, type = "f32" },
  { name = "y", offset = 4, type = "f32" },
  { name = "z", offset = 8, type = "f32" },
]

# AccessorySkeleton::Step's r4: a worker pool (0 from its only caller).
[AccessoryWorkerPool]
measure = "AccessorySkeleton::Step.r4"
size = 4
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "AccessoryWorkerPoolVtable" },
]

[AccessoryWorkerPoolVtable]
measure = "AccessorySkeleton::Step.r4.+0"
size = 8
