  { name = "translation_zw", offset = 56, type = "u64" },
  { name = "translation_z", offset = 56, type = "f32" },
]

# What sub_8259A400 (not read) reads at the skeleton's +120.
[AccessorySkeletonTable]
measure = "sub_8259A400.r3.+120"
size = 32
origin = "file"
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "unknown_16", offset = 16, type = "u32" },
  { name = "unknown_20", offset = 20, type = "u32" },
  { name = "unknown_28", offset = 28, type = "u32" },
]

# A float4 handed by pointer: Accessories::SetScale's scale, sub_8259BB98's
# and sub_8259B188's r4 (not read), copied as doublewords.
[AccessoryFloat4]
measures = ["Accessories::SetScale.r4", "sub_8259BB98.r4", "sub_8259B188.r4"]
size = 16
origin = "embedded"
