# fields.
[TodaysEventMachine]
measures = ["TodaysEvent", "TodaysEvent::EndPage.r4"]
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateTransition)" },
  { name = "step_started", offset = 0, type = "u32", note = "measure fault: the transitions' r3 (PageObject.step_started), and the data's +0 (TodaysEventData.ready)" },
  { name = "data_image_records_a", offset = 4, type = "u32", note = "measure fault: TodaysEventData.images_a's first record" },
  { name = "data_image_count_a", offset = 188, type = "u32", note = "measure fault: TodaysEventData.image_count_a" },
  { name = "data_image_records_b", offset = 192, type = "u32", note = "measure fault: TodaysEventData.images_b's first record" },
  { name = "data_image_count_b", offset = 376, type = "u32", note = "measure fault: TodaysEventData.image_count_b" },
