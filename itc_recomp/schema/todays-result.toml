# The schema of docs/functions/todays-result.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 9 front-end mode, the career's end of the day (src/todays_result/):
# the mode (852 bytes), its block (19,300 bytes at +848) holding two state
# machines, today's result (+0, UI movie 27) and today's event (+9640, UI
# movie 0), and each screen's three VirtualAlloc blocks at 0x828160C8 to
# 0x828160DC (a page object, a menu and a data block).
#
# Left to other areas' files (the lead's to add there):
# - the page objects "new<28>@TodaysResult::Create" and
#   "new<28>@TodaysEvent::Create" are menu-helpers.toml's PageObject;
# - the menus "new<68>@TodaysResult::Create" and "new<68>@TodaysEvent::Create"
#   are menu-helpers.toml's FrontEndMenu;
# - the handlers' r4 "TodaysResult::Leave.r4", "TodaysEvent::Leave.r4" and
#   "TodaysEvent::Unloaded.r4" (the mode's dispatcher, its ring's count +804
#   and start +808) are boot-mode.toml's ModeDispatcher.

# The type 9 mode (852 bytes, ModeType9::ModeType9 in game-modes.md; vtable
# 0x82006CAC, +32 vtable 0x82006CA0): the game mode's base (boot-mode.toml's
# GameMode), then the block. The measure joins the mode with its +32
# interface (ForceExit and IsLoaded get the mode + 32), the block (FindShown
# gets the block) and the next-mode answer (the delegates' r3): those
# accesses are the fields marked "measure fault".
# Dual (E5 step 4): made in host memory by Mode::Create; the measure joins
# guest addresses with it (the delegates' answer on the stack, the block
# in AllLoaded and FindShown), which the view reads as guest memory. Its
# fields over the block and at -28 (ForceExit's +4 from the +32 interface:
# a negative offset no host struct holds) were left out.
[ModeType9]
measures = ["ModeType9", "ModeType9::WaitForLoads.r4", "ModeType9::WaitForShown.r4",
            "ModeType9::LeaveScreen.r4", "ModeType9::NextMode.r4", "ModeType9::Leaving.r4"]
size = 852
origin = "allocated"
storage = "dual"
host_alloc = [0x821078D4]
vtable = 0x82006CAC
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006CAC (14 slots)" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer), the delegates' r3" },
  { name = "answer", offset = 0, type = "u64", note = "measure fault: the next-mode answer's 8 bytes (ModeAnswer)" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8, 0 none (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "0x82010FA0 (ModeDelegate::Invoke)" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "a Mode::SlotNThunk or Mode::NextModeThunk 0x82235C08" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82006CA0: IsLoaded, ForceExit, an empty function" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers (the two machines)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (ModeMessage)" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "iface_block", offset = 816, type = "ptr", to = "ModeType9Block", note = "measure fault: IsLoaded's and ForceExit's r3 is the mode + 32, so this is the mode's +848 (block)" },
  { name = "block", offset = 848, type = "ptr", to = "ModeType9Block", note = "VirtualAlloc'ed by Init, freed by Release" },
]

# The type 9 mode's block (19,300 bytes at the mode's +848; known-data.md:
# "type 9 mode block"): today's result's machine at +0, today's event's at
# +9640, the shown machine's index and the next mode's answer.
[ModeType9Block]
measures = ["new<19300>@ModeType9::Init", "ModeType9.+816", "ModeType9::WaitForLoads.r4.+848",
            "ModeType9::NextMode.r4.+848", "ModeType9::Leaving.r4.+848"]
size = 19300
origin = "allocated"
fields = [
  { name = "result", offset = 0, type = "bytes", count = 9620, note = "today's result's machine (TodaysResultMachine)" },
  { name = "result_state", offset = 9604, type = "u32" },
  { name = "result_loaded", offset = 9608, type = "u32", note = "movie 27 loaded" },
  { name = "result_reenter", offset = 9612, type = "u32", note = "1 at Init" },
  { name = "result_delete_movie", offset = 9616, type = "u32", note = "0 at Init" },
  { name = "event", offset = 9640, type = "bytes", count = 9620, note = "today's event's machine (TodaysEventMachine)" },
  { name = "event_state", offset = 19244, type = "u32" },
  { name = "event_loaded", offset = 19248, type = "u32", note = "movie 0 and the images loaded" },
  { name = "event_reenter", offset = 19252, type = "u32", note = "1 at Init" },
  { name = "event_delete_movie", offset = 19256, type = "u32", note = "0 at Init" },
  { name = "shown", offset = 19280, type = "u32", note = "the shown machine's index: 27 today's result, 0 today's event (FindShown)" },
  { name = "shown_at_init", offset = 19284, type = "u32", note = "the same at Init (readers not looked for)" },
  { name = "answer", offset = 19292, type = "u64", note = "the next mode's 8-byte answer ForceExit writes and NextModeAnswer hands to Modes::Tick (ModeAnswer)" },
  { name = "answer_next_type", offset = 19296, type = "u32", note = "the answer's next mode type" },
]

# Today's result's machine (the block's +0; TodaysResult::InitStates): a
# StateMachine (game-modes.toml), then its words. The transitions' r3 (the
# page object's started word) and LeavePage's r3 (the dispatcher) were
# joined with it by the measure: the "measure fault" fields.
[TodaysResultMachine]
measure = "TodaysResult"
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateTransition)" },
  { name = "step_started", offset = 0, type = "u32", note = "measure fault: the transitions' r3 is the page object's +24 (PageObject.step_started)" },
  { name = "ring_count", offset = 804, type = "u32", note = "measure fault: LeavePage's r3 is the dispatcher (ModeDispatcher.ring_count)" },
  { name = "ring_start", offset = 808, type = "u32", note = "measure fault: LeavePage's r3 is the dispatcher (ModeDispatcher.ring_start)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "1 or 9 at Create, 4 shown, 7 leaving, 10 unloaded, 13 done, 20 done with a movie queued" },
  { name = "loaded", offset = 9608, type = "u32", note = "movie 27 loaded" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: Create and WaitForMovie go to state 9 (open on message 6)" },
  { name = "delete_movie", offset = 9616, type = "u32", note = "nonzero: Unload deletes movie 27 and clears loaded" },
]

# Today's event's machine (the block's +9640; TodaysEvent::InitStates), as
