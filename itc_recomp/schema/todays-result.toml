  { name = "ring_start", offset = 808, type = "u32", note = "measure fault: EndPage's r3 is the dispatcher (ModeDispatcher.ring_start)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "1 or 9 at Create (9 with no unlock), 4 shown, 7 leaving, 9 after Unloaded, 10 at the end page, 20 done with movies queued" },
  { name = "loaded", offset = 9608, type = "u32", note = "movie 0 and both image lists loaded" },
