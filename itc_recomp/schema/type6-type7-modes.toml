# The schema of docs/functions/type6-type7-modes.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 6 and 7 front-end modes (src/type67_modes/): the modes (852
# bytes), their first screens, the yes/no dialog, the controller pages'
# machine, the stand's slots and garage camera with its presets, and the
# screen machines the blocks are made of (known-data.md: "type 6 screens",
# "type 7 screens", "type 6 and 7 modes", "garage camera", [0x826D83E0]).
#
# Seeded types not described here (another area's type; the lead adds the
# measure names there):
# - the page objects "new<28>@Type6Screen0::OnEnter",
#   "new<28>@Type7Screen0::OnEnter" (the first screens' +9644+d) and
#   "new<28>@ControllerOptions::OnEnter" ([0x826D848C]) are
#   menu-helpers.toml's PageObject;
# - the menus "new<68>@Type6Screen0::OnEnter", "new<68>@Type7Screen0::OnEnter"
#   (+9648+d) and "new<68>@ControllerOptions::OnEnter" ([0x826D8490]) are
#   menu-helpers.toml's FrontEndMenu;
# - the handlers' r4 (812 bytes, +804 the ring's count, +808 its start):
#   "ControllerOptions::Leave.r4", "Dialog::Leave.r4",
#   "Type6Dialog::{Cancel,ConfirmPage,NoticePage,Update}.r4",
#   "Type7Dialog::{Cancel,ConfirmPage,Leave,NoticePage,Update}.r4",
#   "Type6Screen0::{ChosenPage,Confirm,ConfirmAgain,Leave,MenuPage,SetUpCar}.r4",
#   "Type7Screen0::{ChosenPage,Confirm,Leave,MenuPage,SetUpCar}.r4" are
#   boot-mode.toml's ModeDispatcher (the mode's +36);
# - "Settings.+-31596" (+672, +680) is options-screen.toml's OptionsSettings
#   ([0x826D8494] holds [0x826D8478]: p1_buttons_side, p1_analog_side);
# - "Type6Mode::TearDown.r4.+848", "Type6Mode::WaitForLoads.r4.+848" and
#   "Type7Mode::TearDown.r4.+848", "Type7Mode::WaitForLoads.r4.+848" are the
#   mode's block: type67-screens.toml's Type6Screens and Type7Screens
#   (type 6: +9612, +19280, +29044 loaded words, +91256 the answer's byte,
#   +91260 the next type; type 7: +9616, +19272, +29040, +71276, +71280).

# The type 6 mode (852 bytes, ModeType6::ModeType6 in game-modes.md; vtable
# 0x82010A48, +32 vtable 0x82010A3C): the game mode's base (boot-mode.toml's
# GameMode), then the block. The measure joins the mode with its +32
# interface (Interrupt, ForceExit and Resume get the mode + 32) and the
# next-mode answer (the delegate functions' r3: ModeAnswer): those accesses
# are the fields marked "measure fault".
[Type6Mode]
measures = ["Type6Mode", "Type6Mode::Leaving.r4", "Type6Mode::NextMode.r4",
            "Type6Mode::TearDown.r4", "Type6Mode::WaitForLoads.r4"]
size = 852
origin = "allocated"
vtable = 0x82010A48
fields = [
  { name = "iface_delegate_ptr", offset = -28, type = "u32", note = "measure fault: ForceExit's r3 is the mode + 32, so this is the mode's +4 (delegate_ptr)" },
  { name = "vtable", offset = 0, type = "u32", note = "0x82010A48" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer), the delegate functions' r3" },
  { name = "answer_word0", offset = 0, type = "u32", note = "measure fault: the answer's first word (ModeAnswer.word0), TearDown's copy of the block's answer" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8 (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "0x82010FA0 (ModeDelegate::Invoke)" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "WaitForLoads, then Mode::NextModeThunk (NextMode), Leaving, TearDown" },
  { name = "delegate_adjustment", offset = 20, type = "u32", note = "0" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82010A3C: Interrupt, ForceExit, Resume" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers (nine machines, in Init's order)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (ModeMessage)" },
  { name = "iface_ring_count", offset = 808, type = "u32", note = "measure fault: Interrupt's r3 is the mode + 32, so this is the mode's +840 (ring_count)" },
  { name = "iface_ring_start", offset = 812, type = "u32", note = "measure fault: the mode's +844 (ring_start) through the +32 interface" },
  { name = "iface_block", offset = 816, type = "ptr", to = "Type6Screens", note = "measure fault: the mode's +848 (block) through the +32 interface" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "block", offset = 848, type = "ptr", to = "Type6Screens", note = "the screen block (91,272 bytes, VirtualAlloc'ed by Init, freed by StandMode::Release)" },
]

# The type 7 mode (852 bytes, ModeType7::ModeType7; vtable 0x82010FB0, +32
# vtable 0x82010FA4): Type6Mode's layout, its block a Type7Screens.
[Type7Mode]
measures = ["Type7Mode", "Type7Mode::Leaving.r4", "Type7Mode::NextMode.r4",
            "Type7Mode::TearDown.r4", "Type7Mode::WaitForLoads.r4"]
size = 852
origin = "allocated"
vtable = 0x82010FB0
fields = [
  { name = "iface_delegate_ptr", offset = -28, type = "u32", note = "measure fault: ForceExit's r3 is the mode + 32, so this is the mode's +4 (delegate_ptr)" },
  { name = "vtable", offset = 0, type = "u32", note = "0x82010FB0" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer), the delegate functions' r3" },
  { name = "answer_word0", offset = 0, type = "u32", note = "measure fault: the answer's first word (ModeAnswer.word0), TearDown's copy of the block's answer" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8 (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "0x82010FA0 (ModeDelegate::Invoke)" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "WaitForLoads, then Mode::NextModeThunk (NextMode), Leaving, TearDown" },
  { name = "delegate_adjustment", offset = 20, type = "u32", note = "0" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82010FA4: Interrupt, ForceExit, Resume" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers (seven machines, in Init's order)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (ModeMessage)" },
  { name = "iface_ring_count", offset = 808, type = "u32", note = "measure fault: Interrupt's r3 is the mode + 32, so this is the mode's +840 (ring_count)" },
  { name = "iface_ring_start", offset = 812, type = "u32", note = "measure fault: the mode's +844 (ring_start) through the +32 interface" },
  { name = "iface_block", offset = 816, type = "ptr", to = "Type7Screens", note = "measure fault: the mode's +848 (block) through the +32 interface" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "block", offset = 848, type = "ptr", to = "Type7Screens", note = "the screen block (71,292 bytes, VirtualAlloc'ed by Init, freed by StandMode::Release)" },
]

# Either mode as StandMode::Release (both modes' slot 1) gets it.
[StandMode]
measure = "StandMode"
size = 852
origin = "allocated"
fields = [
  { name = "block", offset = 848, type = "u32", note = "the screen block (Type6Screens or Type7Screens), freed and 0" },
]

# Type 6's first screen (the type 6 block's +4; Type6Screen0::Type6Screen0
# in screen-constructors.md): its machine at +0 (a ScreenMachine), then
# three VirtualAlloc blocks and its own words. The menu over the car: five
# items (the list screen, the node screen, the panel screen, the options,
# quit).
[Type6Screen0]
measure = "Type6Screen0"
size = 9668
origin = "embedded"
fields = [
  { name = "machine", offset = 0, type = "bytes", count = 9600, note = "the machine's transitions (StateMachine, game-modes.toml)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "0 enter, 1 open the movie, 2 wait for it, 4 show, 5 shown, 7 leaving, 6 done, 8 suspended, 9 wait for the mode, 10 leave the mode" },
  { name = "loaded", offset = 9608, type = "u32", note = "movie 22 loaded" },
  { name = "reenter", offset = 9612, type = "u32", note = "open at once (OnEnter: state 1, else 9); 1 from the mode's Init" },
