# The schema of docs/functions/xaudio.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# XAudio's engine and voices (the game's own copy of XAudio, translated):
# the engine at [0x82954F08], the voices' base and the voice with outputs,
# the source and submix voices, the output buffers, the descriptions and
# formats the voices are made from, and the out words XAudio's functions
# write. Names from docs/functions/xaudio.md, docs/known-data.md ("XAudio
# voice", "XAudio source voice", "XAudio submix voice", "XAudio output
# buffer", `0x82954F08`) and the hand port (src/xaudio/voices.h).
#
# Measure faults (tools/type_map.py), each kept as a field with its own
# name and a note so every access fits:
# - a voice's vtable taken for the voice itself (the voice's +0 "points to a
#   voice"): its slot loads land on the voice (XAudioVoice's vt_* fields),
#   and the same for the codec, the allocator, the output targets and
#   matrices (their `.+0` types are the vtables);
# - the voices' descriptions joined with the voices (XAudioVoice::BaseSize,
#   OutputsSize, XAudioSourceVoice::Init and Size, XAudioSubmixVoice's
#   Describe): the desc_* fields;
# - XAudioEngine::Init's and Size's parameters and Barrier's 8-byte barrier
#   joined with the engine (the params_* and barrier fields);
# - XAudio::WaitForVoice's engine joined with the source voice description
#   ("XAudio", the engine_* fields of XAudioSourceDescription);
# - XAudioObject::Free's object (a voice: slot +12 of the voices' vtable)
#   taken for the factory object (xaudio-objects.toml's XAudioObject): its
#   +0 and +8 parts are described here (the voice's vtable and allocator).
#
# Types here other areas also describe (the lead merges them):
# XAudioVoiceAllocator and its vtable are xaudio-engine.toml's
# XAudioBumpAllocator (and xaudio-objects.toml's XAudioAllocator);
# XAudioMeterView and XAudioMeterHistoryView are xaudio-objects.toml's
# VolumeMeter and MeterHistory met through sub_825A5E28 (the meter's levels,
# from the effects' code; lifted, not read in detail).

# The voices' base (docs/known-data.md, "XAudio voice"; XAudioVoice::Construct
# sub_82461500) and the voice with outputs over it (vtable 0x8204A998, +68
# on). The source voice (148 bytes) and the submix voice (80) add their own
# words after +76.
[XAudioVoice]
measures = ["XAudioVoice", "sub_8245FB00.r3"]
size = 88
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x8204A6CC then 0x8204AA00 (the base), 0x8204A998 (with outputs), 0x8204A720 source, 0x8204A870 submix; the root's 0x8204A6B8 once destroyed" },
  { name = "desc_channels", offset = 1, type = "u8", note = "measure fault: XAudioVoice::BaseSize's r3 is the voice description (+1 its channels)" },
  { name = "ref_count", offset = 4, type = "u32" },
  { name = "allocator", offset = 8, type = "ptr", to = "XAudioBumpAllocator" },
  { name = "type", offset = 12, type = "u8", note = "0 source, 1 submix, 2 mastering" },
  { name = "vt_free", offset = 12, type = "u32", note = "measure fault: the vtable's slot +12 (XAudioObject::Free), read through the voice; also BaseSize's description +12 (the buffer)" },
  { name = "node_next", offset = 16, type = "u32", note = "the voice's node in its stage's list (the stage's +8 says 16)" },
  { name = "node_prev", offset = 20, type = "u32" },
  { name = "active_next", offset = 24, type = "u32", note = "the voice's node in the active list (+40 of its stage)" },
  { name = "desc_output_count", offset = 24, type = "u8", note = "measure fault: OutputsSize's r3 is the voice description (+24 the outputs)" },
  { name = "desc_output_channels", offset = 25, type = "u8", note = "measure fault: OutputsSize's description (+25 the outputs' channels)" },
  { name = "active_prev", offset = 28, type = "u32" },
  { name = "buffer", offset = 32, type = "u32", note = "the output buffer's interface (the buffer + 8)" },
  { name = "effects", offset = 36, type = "u32", note = "the effect entries (XAudioEffectEntry, 8 bytes each)" },
  { name = "output_uses", offset = 40, type = "u32", note = "how many voices output to this one while playing" },
  { name = "callback", offset = 44, type = "fn", note = "called every pass with a pointer to its context" },
  { name = "callback_context", offset = 48, type = "u32" },
  { name = "format", offset = 52, type = "u32", note = "the voice's format (8 bytes, XAudioVoiceFormat): its first word" },
  { name = "format_type", offset = 52, type = "u8" },
  { name = "channels", offset = 53, type = "u8" },
  { name = "rate", offset = 56, type = "u32", note = "48,000" },
  { name = "effect_count", offset = 60, type = "u8" },
  { name = "vt_stop", offset = 60, type = "u32", note = "measure fault: the vtable's slot +60 (stop), read through the voice" },
  { name = "flags", offset = 61, type = "u8", note = "bit 0 playing, bit 2 stopping (the tail), bit 6 a start pending" },
  { name = "tail", offset = 62, type = "u16", note = "the effects' tail in passes (the largest effect's)" },
  { name = "tail_left", offset = 64, type = "u16", note = "passes left of the tail while stopping" },
  { name = "output_slots", offset = 68, type = "u8", note = "the outputs allowed (the description's +24)" },
  { name = "output_count", offset = 69, type = "u8", note = "the outputs set" },
  { name = "outputs", offset = 72, type = "ptr", to = "XAudioOutputSlot", note = "12 bytes an output; also the vtable's slot +72 (the input buffer) read through the voice" },
  { name = "stage", offset = 76, type = "u8", note = "a submix voice's stage (its list in the engine's +124)" },
  { name = "vt_activate", offset = 76, type = "u32", note = "measure fault: the vtable's slot +76 (join the active list), read through the voice" },
  { name = "vt_deactivate", offset = 80, type = "u32", note = "measure fault: the vtable's slot +80, read through the voice" },
  { name = "vt_pass", offset = 84, type = "u32", note = "measure fault: the vtable's slot +84 (the voice's pass), read through the voice" },
]

# The voices' vtable as XAudioObject::Free (slot +12) meets it.
[XAudioVoiceVtable]
measure = "XAudioObject.+0"
size = 4
origin = "image"
fields = [
  { name = "deleting_destructor", offset = 0, type = "fn" },
]

# A source voice (148 bytes, vtable 0x8204A720; XAudioSourceVoice::XAudioSourceVoice
