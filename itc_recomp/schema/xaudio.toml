size = 148
origin = "allocated"
vtable = 0x8204A720
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "XAudioSourceVoiceVtable" },
  { name = "desc_category", offset = 56, type = "u8", note = "measure fault: XAudioSourceVoice::Init's r4 is its description (+56 the category)" },
  { name = "desc_codec_byte", offset = 59, type = "u8", note = "measure fault: the description's +59 (the codec description's +68)" },
  { name = "desc_codec_float", offset = 60, type = "f32", note = "measure fault: the description's +60 (the codec description's +64)" },
  { name = "flags", offset = 61, type = "u8", note = "the voice's flags (XAudioVoice)" },
  { name = "desc_codec_flag", offset = 64, type = "u8", note = "measure fault: the description's +64 (the codec description's +69)" },
  { name = "codec", offset = 76, type = "ptr", to = "XAudioCodec", note = "the codec's effect entry (8 bytes): +76 the object, PCM or XMA by the format's id" },
  { name = "desc_codec_word_a", offset = 80, type = "u32", note = "measure fault: the description's +80 (the codec description's +72)" },
  { name = "format", offset = 84, type = "bytes", count = 56, note = "the 56-byte source format (also the description's +84 and +88 by the measure's join)" },
  { name = "format_id", offset = 88, type = "u32" },
  { name = "volume", offset = 140, type = "f32", note = "1.0 at first" },
  { name = "category", offset = 144, type = "u8", note = "0 or 1 (the engine's category volumes)" },
