# The schema of docs/functions/car-settings.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The car settings screen: the type 2 mode's screen machine at its block's
# +0x173D0 (and the type 5 mode's at its +848 block's +0), UI movie 3, where
# the selected garage car's settings are adjusted page by page
# (src/car_settings/). Its page object ([0x826D8458], 28 bytes) is a
# PageObject and its menu ([0x826D845C], 68 bytes) a FrontEndMenu
# (menu-helpers.toml's; the measure files them as
# "new<28>@CarSettings::Create" and "new<68>@CarSettings::Create").

# The screen's machine: a StateMachine (game-modes.toml) with a word of its
# own after it, as the type 2 mode's other machines.
[CarSettings]
measure = "CarSettings"
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32" },
  { name = "loaded", offset = 9608, type = "u32", note = "1 once movie 3 is loaded (WaitForMovie)" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: Create and WaitForMovie go to state 9 (open on its message)" },
  { name = "delete_movie", offset = 9616, type = "u32", note = "as the type 2 mode's other machines (delete the movie on unload)" },
]

# The type 2 or type 5 mode as the handlers see it (r4): only its message
# ring, which they post to.
[CarSettingsMode]
measures = ["CarSettings::Close.r4", "CarSettings::Leave.r4"]
size = 812
origin = "embedded"
storage = "dual"
fields = [
  { name = "messages", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (id, two words)" },
  { name = "message_count", offset = 804, type = "u32" },
  { name = "message_start", offset = 808, type = "u32", note = "the ring's first slot" },
]

# The screen's data ([0x826D8460], 764 bytes, VirtualAlloc'ed by Create;
# docs/known-data.md's "car settings"): three copies of the garage car's
# settings, 116 bytes each (+0 the working copy, +116 the applied, +232 the
# stock car's: floats the gear ratios and final drive, words one setting byte
# of the car each), the best times of routes 8 to 10, the save's figures the
# screen shows and the pages' state.
[CarSettingsData]
measure = "new<764>@CarSettings::Create"
