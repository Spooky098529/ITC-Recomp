# A course record (408 bytes, docs/known-data.md's "course record": the save
# data's 22 at +0x1D52C) as CourseRecord::Entry reads it (r4). Probably the
# same object as "CourseRecords::Of.ret" (type67-screens.md's).
[CourseRecord]
measure = "CourseRecord::Entry.r4"
measures = ["CourseRecords::Of.ret"]
size = 408
origin = "embedded"
fields = [
  { name = "links", offset = 0, type = "bytes", count = 40, note = "ten halfword pairs: the entries' links (+0 the next, +2 the entry's index)" },
  { name = "unknown_40", offset = 40, type = "u16" },
  { name = "unknown_42", offset = 42, type = "u16" },
  { name = "first", offset = 44, type = "u16", note = "the first link (the ranks followed from it)" },
  { name = "unknown_46", offset = 46, type = "u16" },
  { name = "count", offset = 48, type = "u16", note = "probably the entries' count" },
  { name = "entries", offset = 52, type = "bytes", count = 280, note = "28 bytes each (CourseRecordEntry)" },
  { name = "unknown_332", offset = 332, type = "bytes", count = 76, note = "a 76-byte record (cleared at the reset)" },
]

# A course record's 28-byte entry, as CourseRecord::Entry copies it out (r3).
[CourseRecordEntry]
measure = "CourseRecord::Entry.ret"
size = 28
origin = "embedded"
fields = [
  { name = "unknown_0", offset = 0, type = "u32", note = "the car settings' best time rows' second word" },
  { name = "time", offset = 20, type = "u32", note = "probably the time: the best time rows' first word" },
]

[globals]
pages = { address = 0x826D8458, type = "ptr", to = "PageObject" }
menu = { address = 0x826D845C, type = "ptr", to = "FrontEndMenu", note = "a front-end menu (+16 = 4 at Create)" }
data = { address = 0x826D8460, type = "ptr", to = "CarSettingsData" }
