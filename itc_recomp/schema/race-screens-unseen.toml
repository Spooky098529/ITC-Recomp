  { name = "reset_request", offset = 352, type = "u32", note = "a request from sub_82211F18 (to page 7 with message 44)" },
  { name = "ranking_skipped", offset = 356, type = "u32" },
  { name = "fault_replay_0", offset = 0, type = "u16", note = "measure fault: Kind6Menu::ShowReplay's r3 is a replay record (as AfterRaceMenu::ShowReplay's, race-screens.toml), joined with the menu" },
  { name = "fault_replay_2", offset = 2, type = "u16", note = "measure fault: the replay record's +2 (ShowReplay)" },
  { name = "fault_replay_6", offset = 6, type = "u16", note = "measure fault: the replay record's +6 (ShowReplay)" },
  { name = "fault_replay_8", offset = 8, type = "u16", note = "measure fault: the replay record's +8 (ShowReplay)" },
  { name = "fault_replay_10", offset = 10, type = "u16", note = "measure fault: the replay record's +10 (ShowReplay)" },
