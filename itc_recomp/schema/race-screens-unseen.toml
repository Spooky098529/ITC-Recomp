# The schema of docs/functions/race-screens-unseen.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The in-race screens never seen in play (src/race_screens/unseen.h). Kind
# 4's pause menu's page object (new<28>@PauseMenu4::Create) is a PageObject
# (menu-helpers.toml) and its menu list (new<72>@PauseMenu4::Create) a
# MenuList (race-screens.toml): their measures belong there. The embedded
# page objects, front-end menus and menu lists below are spelled out field
# by field with a prefix (the schema has no embedded types). The measure's
# Kind6Menu::RankingTime.r4 to r6 and RaceResults::Open.r4 are the
# callers' frame words, not objects.
#
# Measure faults (left as they are): Kind6Menu::ShowReplay's r3 is a replay
# record (36 bytes, the replay list's), joined to Kind6Menu (its halfword
# loads +0, +2, +6, +8 and +10 fit no field); the transitions' r3 (the page
# object's step word, Kind6Menu +64 or +232, PauseMenu4's page object's +24)
# is taken for the screen's +0.

# Kind 6's screen after the race ([0x82814E10], 360 bytes): race kind 6 is
# the Xbox Live mode's race. Two page objects run together: A (+40) the
# menu and the steps, B (+208) a message box over it.
[Kind6Menu]
measure = "Kind6Menu"
size = 360
origin = "allocated"
fields = [
  { name = "block_0", offset = 0, type = "u32", note = "the block's +0 (ShowKind6Results leaves its frame's leftover)" },
  { name = "time", offset = 4, type = "u32", note = "the block's +4: the result's +20, a time packed as minutes << 16 | seconds << 10 | thousandths, capped at 59:59.999 by Open" },
  { name = "time_high", offset = 4, type = "u16", note = "time's high halfword (the sign bit and the minutes)" },
  { name = "block_16", offset = 16, type = "u32", note = "the block's +16 (not written by ShowKind6Results)" },
  { name = "block_20", offset = 20, type = "u32", note = "the block's +20 (not written by ShowKind6Results)" },
  { name = "menu_movie", offset = 24, type = "ptr", note = "UI movie 17, the menu" },
  { name = "question_movie", offset = 28, type = "ptr", note = "UI movie 20, the question box" },
  { name = "message_movie", offset = 32, type = "ptr", note = "UI movie 21, the message box" },
  { name = "waiting_movie", offset = 36, type = "ptr", note = "UI movie 14, the waiting box" },
  { name = "pages_a_page", offset = 40, type = "u32", note = "the page Update runs; -1 while a transition runs" },
  { name = "pages_a_next_page", offset = 44, type = "u32" },
  { name = "pages_a_previous_page", offset = 48, type = "u32" },
  { name = "pages_a_step", offset = 52, type = "u32", note = "the transition Draw runs; -1 none" },
  { name = "pages_a_queued_step", offset = 56, type = "u32" },
  { name = "pages_a_unknown_20", offset = 60, type = "u32" },
  { name = "pages_a_step_started", offset = 64, type = "u32", note = "the transition's step word" },
  { name = "main_menu_cursor", offset = 68, type = "u32" },
  { name = "main_menu_previous", offset = 72, type = "u32" },
  { name = "main_menu_moved", offset = 76, type = "u32" },
  { name = "main_menu_first_item", offset = 80, type = "u32" },
  { name = "main_menu_last_item", offset = 84, type = "u32" },
  { name = "main_menu_wraps", offset = 88, type = "u32" },
  { name = "main_menu_up_down_locked", offset = 92, type = "u32" },
  { name = "main_menu_left_right_steps", offset = 96, type = "u32" },
  { name = "main_menu_shoulders_step", offset = 100, type = "u32" },
  { name = "main_menu_side", offset = 104, type = "s32" },
  { name = "main_menu_wrapped", offset = 108, type = "u32" },
  { name = "main_menu_list_wrapped", offset = 112, type = "u32" },
  { name = "main_menu_visible_row", offset = 116, type = "u32" },
  { name = "main_menu_previous_row", offset = 120, type = "u32" },
  { name = "main_menu_first_row", offset = 124, type = "u32" },
  { name = "main_menu_rows_shown", offset = 128, type = "u32" },
  { name = "main_menu_player", offset = 132, type = "u32" },
  { name = "slot_list_count", offset = 136, type = "u32" },
  { name = "slot_list_scroll", offset = 140, type = "u32" },
  { name = "slot_list_scroll_before", offset = 144, type = "u32" },
  { name = "slot_list_shown", offset = 148, type = "u32" },
  { name = "slot_list_selection", offset = 152, type = "u32" },
  { name = "slot_list_selection_before", offset = 156, type = "u32" },
  { name = "slot_list_move", offset = 160, type = "u32" },
  { name = "slot_list_side", offset = 164, type = "u32" },
  { name = "slot_list_wrapped", offset = 168, type = "u32" },
  { name = "slot_list_down", offset = 172, type = "u32" },
  { name = "slot_list_up", offset = 176, type = "u32" },
  { name = "slot_list_left", offset = 180, type = "u32" },
  { name = "slot_list_right", offset = 184, type = "u32" },
  { name = "slot_list_accept", offset = 188, type = "u32" },
  { name = "slot_list_back", offset = 192, type = "u32" },
  { name = "slot_list_player", offset = 196, type = "u32" },
  { name = "slot_list_wraps", offset = 200, type = "u32" },
  { name = "slot_list_block", offset = 204, type = "u32" },
  { name = "pages_b_page", offset = 208, type = "u32", note = "the page Update runs; -1 while a transition runs" },
  { name = "pages_b_next_page", offset = 212, type = "u32" },
