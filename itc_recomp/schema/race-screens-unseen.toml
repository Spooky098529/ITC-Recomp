net_answer = { address = 0x826C6B0C, type = "u8", note = "the other console's answer, 255 none yet" }
net_answer_word = { address = 0x826C6B04, type = "u32" }
race_data = { address = 0x826C5B2C, type = "ptr", to = "RaceData", note = "the race data (race-states.toml): +60, +0x59620 the stages, +0x59AE8 the results records, +0xA3AF0 the kind" }
