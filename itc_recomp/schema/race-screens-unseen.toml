  { name = "question_menu_wraps", offset = 256, type = "u32" },
  { name = "question_menu_up_down_locked", offset = 260, type = "u32" },
  { name = "question_menu_left_right_steps", offset = 264, type = "u32" },
  { name = "question_menu_shoulders_step", offset = 268, type = "u32" },
  { name = "question_menu_side", offset = 272, type = "s32" },
  { name = "question_menu_wrapped", offset = 276, type = "u32" },
  { name = "question_menu_list_wrapped", offset = 280, type = "u32" },
  { name = "question_menu_visible_row", offset = 284, type = "u32" },
  { name = "question_menu_previous_row", offset = 288, type = "u32" },
  { name = "question_menu_first_row", offset = 292, type = "u32" },
