# Kind 4's pause menu's screen ([0x826D84E0], 4 bytes).
[PauseMenu4]
measure = "PauseMenu4"
size = 4
origin = "allocated"
fields = [
  { name = "movie", offset = 0, type = "ptr", note = "UI movie 5" },
]

# Kind 4's pause menu's data ([0x826D84E4], 80 bytes).
[PauseMenu4Data]
measure = "new<80>@PauseMenu4::Create"
size = 80
origin = "allocated"
# In host memory since E5 step 3 (2026-11-22, moved by the lead: its sites
# are in race-screens' file): made by PauseMenu4::Create
# (race_screens::PauseMenu4Create; the original's VirtualAlloc at
# 0x822108A4, listed for its lifted original), freed by PauseMenu4::Destroy
# (race_screens::PauseMenu4Destroy; the original's VirtualFree at 0x8220FCF4,
# which returned 1); the global at 0x826D84E4 holds its handle.
storage = "host"
host_alloc = [0x822108A4]
host_free = [{ call = 0x8220FCF4, reg = "r3", returns = 1 }]
fields = [
  { name = "music_volume", offset = 0, type = "u32", note = "player 0's save data's byte +0x1F878, sign-extended" },
  { name = "effects_volume", offset = 4, type = "u32", note = "player 0's save data's byte +0x1F879, sign-extended" },
  { name = "music_edit", offset = 8, type = "u32", note = "the volume page's edit, 0 to 15" },
  { name = "effects_edit", offset = 12, type = "u32", note = "the volume page's edit, 0 to 15" },
  { name = "music_default", offset = 16, type = "u32", note = "15" },
  { name = "effects_default", offset = 20, type = "u32", note = "15" },
  { name = "item_count", offset = 52, type = "u32" },
  { name = "answer", offset = 56, type = "u32", note = "what Update answers on the answer page" },
  { name = "volume_toggle", offset = 60, type = "u32", note = "the volume page's last item's choice, 0 or 1" },
  { name = "main_selection", offset = 64, type = "u32", note = "the main list's selection kept" },
  { name = "run_count", offset = 68, type = "u32", note = "RunTen's counter, done at 10" },
  { name = "player", offset = 72, type = "u32", note = "the player who paused, 0 or 1" },
  { name = "kind", offset = 76, type = "u32", note = "the items' kind: 0 or 1 (the replay bit)" },
]

# The results at the in-race screens' holder's +1028 ([0x82814E18], 52
# bytes): +0 to +16 the 20-byte block RaceHudMachine::ShowResults passes.
[RaceResults]
measure = "RaceResults"
size = 52
origin = "allocated"
fields = [
  { name = "shown_flag", offset = 0, type = "u32", note = "the block's +0: 1 from ShowResults; Intro and Show pick their animations by it" },
  { name = "time", offset = 4, type = "u32", note = "the result's +20, a time packed as minutes << 16 | seconds << 10 | thousandths" },
  { name = "place", offset = 8, type = "u32", note = "the result's +3892: item 7's string from a table (395 to 411) by it" },
  { name = "race_word_60", offset = 12, type = "u32", note = "the race data's +60: item 8's string 1718 + it" },
  { name = "players_word_2196", offset = 16, type = "u32", note = "[0x826D82E8]'s +2196: item 9's string by it (0 to 10)" },
  { name = "movie", offset = 20, type = "ptr", note = "UI movie 7" },
  { name = "pages_page", offset = 24, type = "u32", note = "the page Update runs; -1 while a transition runs" },
  { name = "pages_next_page", offset = 28, type = "u32" },
  { name = "pages_previous_page", offset = 32, type = "u32" },
  { name = "pages_step", offset = 36, type = "u32", note = "the transition Draw runs; -1 none" },
  { name = "pages_queued_step", offset = 40, type = "u32" },
  { name = "pages_unknown_20", offset = 44, type = "u32" },
  { name = "pages_step_started", offset = 48, type = "u32", note = "the transition's step word" },
]

# The results of race kinds 4 and 6 at the holder's +1032 ([0x82814E1C], 40
# bytes).
[SplitResults]
measure = "SplitResults"
size = 40
origin = "allocated"
fields = [
  { name = "outcome", offset = 0, type = "u32", note = "0 to 2" },
  { name = "mode", offset = 4, type = "u32", note = "0 to 2" },
  { name = "movie", offset = 8, type = "ptr", note = "UI movie 8" },
  { name = "pages_page", offset = 12, type = "u32", note = "the page Update runs; -1 while a transition runs" },
  { name = "pages_next_page", offset = 16, type = "u32" },
  { name = "pages_previous_page", offset = 20, type = "u32" },
  { name = "pages_step", offset = 24, type = "u32", note = "the transition Draw runs; -1 none" },
  { name = "pages_queued_step", offset = 28, type = "u32" },
  { name = "pages_unknown_20", offset = 32, type = "u32" },
  { name = "pages_step_started", offset = 36, type = "u32", note = "the transition's step word" },
]

# The leaderboard read's spec in the image (XUSER_STATS_SPEC, at 0x826C6410).
[Kind6StatsSpec]
size = 16
origin = "image"
fields = [
  { name = "view_id", offset = 0, type = "u32" },
  { name = "column_count", offset = 4, type = "u32" },
  { name = "column_0", offset = 8, type = "u16" },
  { name = "column_1", offset = 10, type = "u16" },
  { name = "column_2", offset = 12, type = "u16" },
]

[globals]
