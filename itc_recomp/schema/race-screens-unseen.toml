kind6_menu = { address = 0x82814E10, type = "ptr", to = "Kind6Menu" }
kind6_answer = { address = 0x82814E14, type = "u32", note = "Kind6Menu's answer, 1 to 3 (0 to 2 also open it with its movies' poses reset)" }
race_results = { address = 0x82814E18, type = "ptr", to = "RaceResults" }
split_results = { address = 0x82814E1C, type = "ptr", to = "SplitResults" }
