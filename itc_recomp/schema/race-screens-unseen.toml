  { name = "question_menu_player", offset = 300, type = "u32" },
  { name = "unknown_304", offset = 304, type = "u32", note = "cleared by Open" },
  { name = "rank", offset = 308, type = "u32", note = "the player's rank (the network manager's sub_822914A8)" },
  { name = "rows_read", offset = 312, type = "u32", note = "the leaderboard's rows read" },
  { name = "rows_shown", offset = 316, type = "u32", note = "set: the time attack's rows or record shown" },
  { name = "read_started", offset = 320, type = "u32", note = "a leaderboard read started" },
  { name = "box_message", offset = 324, type = "u32", note = "the box's message, a string id: 44, 48 to 52, 57" },
  { name = "message_which", offset = 328, type = "u32", note = "which message (0 to 3)" },
  { name = "question_which", offset = 332, type = "u32", note = "which question (1 or 2)" },
