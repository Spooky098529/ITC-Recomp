# The schema of docs/functions/car-makers.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The front end's makers of car objects (src/car_makers/): the garage cars,
# the car objects they become, and the scene model record a car object is
# turned into for the stand (SceneModelRecord::FromCar). The garage stage
# and the stand's holder are front-end-car-draw's and stand-models' types;
# the car data is car-physics'.

# A scene model's set-up (4,244 bytes; scene-models.md's constructor, Reset
# and Copy), filled from a car object by SceneModelRecord::FromCar.
[SceneModelRecord]
measure = "SceneModelRecord"
measures = ["SceneModelRecord::Copy.r4"]
size = 4244
origin = "embedded"
fields = [
  { name = "kind", offset = 0, type = "u32", note = "1 by default; from a car: 2 the players' cars (flags 0x81), 1 the rivals (0x2), 3 traffic" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "unknown_8", offset = 8, type = "u32" },
  { name = "block", offset = 16, type = "u32", note = "the car record's +0 (the car record, 3,696 bytes, is embedded at +16): the model block, CarModels::BlockOf of the car id" },
  { name = "paint0_hue", offset = 32, type = "f32", note = "a hue, saturation, value triple (SetPaint)" },
  { name = "paint0_saturation", offset = 36, type = "f32" },
  { name = "paint0_value", offset = 40, type = "f32" },
  { name = "paint1_hue", offset = 48, type = "f32" },
  { name = "paint1_saturation", offset = 52, type = "f32" },
  { name = "paint1_value", offset = 56, type = "f32" },
  { name = "paint2_hue", offset = 64, type = "f32" },
  { name = "paint2_saturation", offset = 68, type = "f32" },
  { name = "paint2_value", offset = 72, type = "f32" },
