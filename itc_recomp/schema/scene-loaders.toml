# The schema of docs/functions/scene-loaders.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The first set of the scene's object pools ([0x826C2E40]) and the loading
# objects it holds, one class a pool (docs/known-data.md "the first set of
# scene object pools", "pool node", "car parts", "cockpit body", "car
# interior", "pool 4 object"; src/scene_loaders/).
#
# Left to other files (the measure's names to add there, not copied here):
# - "Wheels" (pool 5) is car-models.toml's CarWheels; "CarModel" (pool 0)
#   car-models.toml's CarModel; "TrafficCar" (pool 6) and the measure's
#   "TrafficCar::OnFileLoaded.r6" (the same object, r6 of its file-loaded
#   callback) and "SceneModel.+5100.+16780" (TrafficCar::ApplyPalette's r3:
#   a traffic body, +4124 a slot's state) the traffic body's owner's.
# - "CarModelLoads.+320", "Cockpit.+496", "WheelsLoads.+2048",
#   "TrafficCar.+4064" (+8 read: slot 2) and
#   "TrafficCar::OnFileLoaded.r6.+4064" (+16: slot 4) are a texture
#   provider's vtable word: models.toml's TextureProviderVtable.
# - "Cockpit.+24" is the car model (car-models.toml's CarModel: +32 the
#   block); "Cockpit::OnFileLoaded.r6.+3472" a node's matrix
#   (models.toml's SkeletonMatrix: +48, +56 its translation row).
# - "ModelPoint::Find.r4" is a part model (material-passes.toml's
#   PartModel; +196, +260 its skeleton's (+112) node names and matrices,
#   +408 the skeleton's set).
# - "PoolNode.+8.+12.+8" (+7) is a measure fault: ~PoolNode's r10, the
#   previous node on one path and the list's count less one on the others
#   (its store is the previous node's +8, next).
# - car-models.toml's CarModelsFirstSet ("CarInterior.+3092") is
#   ScenePools; its CarInterior joins the interior and the cockpit body
#   (Interior and Cockpit here).

# The first set of scene pools ([0x826C2E40], 140 bytes, ScenePools::MakeA;
# filled by ScenePools::CreateA).
[ScenePools]
# measures from CarModelsFirstSet (car-models), merged at the integration
measures = ["ScenePools", "new<140>@sub_820C3C40",
            "new<140>@ScenePools::MakeA", "CarInterior.+3092", "TrafficCar.+576"]
size = 140
origin = "allocated"
fields = [
  { name = "teardown_count", offset = 0, type = "u32", note = "the teardown's count (2, ScenePools::StartTeardownA); the measure's store here is AllocPages' (sub_820D0960) into its out word, the set's +52" },
  { name = "state", offset = 4, type = "u32", note = "0 when made, 3 once filled, 4 tearing down" },
  { name = "model_set", offset = 8, type = "u32", note = "0 set a, 1 set b (the loading objects read it as [[their first set] + 8])" },
  { name = "car_model_count", offset = 12, type = "u32", note = "pool 0's count" },
  { name = "car_parts_count", offset = 16, type = "u32", note = "pool 1's" },
  { name = "interior_count", offset = 20, type = "u32", note = "pool 3's" },
  { name = "cockpit_count", offset = 24, type = "u32", note = "pool 2's" },
  { name = "pool4_count", offset = 28, type = "u32", note = "pool 4's" },
  { name = "wheels_count", offset = 32, type = "u32", note = "pool 5's" },
  { name = "unused_sum", offset = 36, type = "u32", note = "the record's +32 + +28, not used as a count" },
  { name = "traffic_count", offset = 40, type = "u32", note = "pool 6's" },
  { name = "deferred_releases", offset = 52, type = "ptr", to = "CarModelsDeferredRelease", note = "4 x (+12 + +40) records of 20 bytes" },
  { name = "pools", offset = 56, type = "bytes", count = 84, note = "seven lists of PoolNodes (PoolList), 12 bytes each, by pool" },
  { name = "car_scene_pool7_count", offset = 5036, type = "u32", note = "a measure fault: ScenePools::FindModel's r3 is the car scene ([0x826C2E44]), whose +5036 is pool 7's count" },
]

# ScenePools::CreateA's 36-byte record (its r4): the pools' counts.
[ScenePoolsCreateRecord]
measure = "ScenePools::CreateA.r4"
size = 36
origin = "file"
fields = [
  { name = "model_set", offset = 0, type = "u32" },
  { name = "car_models", offset = 4, type = "u32", note = "pool 0" },
  { name = "car_parts", offset = 8, type = "u32", note = "pool 1" },
  { name = "interiors", offset = 12, type = "u32", note = "pool 3's count is +12 + +16 + +32" },
  { name = "cockpits", offset = 16, type = "u32", note = "pool 2" },
  { name = "pool4", offset = 20, type = "u32", note = "pool 4" },
  { name = "wheels", offset = 24, type = "u32", note = "pool 5's count is +24 + +32 + +28" },
  { name = "extra_wheels", offset = 28, type = "u32", note = "added to the wheels' count and to the set's +36" },
  { name = "traffic", offset = 32, type = "u32", note = "pool 6; added to the interiors' and the wheels' counts" },
]

# The base of the scene pools' objects (PoolNode::PoolNode sub_82594050,
# ~PoolNode sub_825940B0). The measure's other names are the nodes ~PoolNode
# and PoolNode::PoolNode reach through the links.
[PoolNode]
measures = ["PoolNode", "PoolNode::PoolNode.r4.+4", "PoolNode.+4.+8.+7", "PoolNode.+8.+12.+0", "PoolNode.+8.+12.+4"]
size = 24
origin = "embedded"
vtable = 0x8206CCB0
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x8206CCB0 for the node itself; each class's own, then 0x82004F90 before the node's destructor" },
  { name = "list", offset = 4, type = "ptr", to = "PoolList" },
  { name = "next", offset = 8, type = "ptr", to = "PoolNode" },
  { name = "previous", offset = 12, type = "ptr", to = "PoolNode" },
  { name = "state", offset = 16, type = "u32", note = "the pool object's: 0 free, 3 in use" },
  { name = "index", offset = 20, type = "u32", note = "the pool object's index in its pool (-1 from the constructors)" },
]

# A pool's list of PoolNodes (12 bytes, the set's +56 + 12 x pool).
[PoolList]
measures = ["PoolNode::PoolNode.r4", "PoolNode.+8.+12"]
size = 12
origin = "embedded"
fields = [
  { name = "first", offset = 0, type = "ptr", to = "PoolNode" },
  { name = "last", offset = 4, type = "ptr", to = "PoolNode" },
  { name = "count", offset = 8, type = "u32" },
]

# A name the helpers compare (NameMatches' two strings, the skeletons' node
# names, 160-byte records): NUL-terminated bytes.
[SceneLoadersName]
measures = ["NameMatches.r3", "NameMatches.r4", "Cockpit::OnFileLoaded.r6.+292", "TrafficCar::OnFileLoaded.r6.+3860"]
size = 160
origin = "file"
fields = [
  { name = "text", offset = 0, type = "bytes", count = 160, note = "NUL-terminated" },
]

# The car parts (pool 1, 106,016 bytes, vtable 0x82005094; CarParts::CarParts
# sub_820D7428). SceneModel.+5060.+104 is CarParts::ApplyPalette's r3.
[CarParts]
measures = ["CarParts", "SceneModel.+5060.+104",
            "CarParts::OnPartLoadedA.r6", "CarParts::OnPartLoadedB.r6"]
size = 106016
origin = "allocated"
vtable = 0x82005094
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82005094 (the pool node's 0x82004F90 while it's torn down)" },
  { name = "state", offset = 16, type = "u32", note = "the pool object's: 3 in use" },
  { name = "index", offset = 20, type = "u32", note = "its index in the pool" },
  { name = "car_model", offset = 24, type = "ptr", to = "CarModel" },
  { name = "record", offset = 28, type = "bytes", count = 60, note = "a copy of its record (CarParts::LoadSetB reads +28 to +76)" },
  { name = "loads", offset = 96, type = "bytes", count = 105904, note = "the loads (CarPartsLoads)" },
  { name = "slots", offset = 96, type = "bytes", count = 5184, note = "216 LoadSlots of 24 bytes (+116 + 24i their states); set b uses the first 17" },
  { name = "part_models", offset = 5280, type = "bytes", count = 100224, note = "216 PartModels of 464 bytes (the measure's +412 is a model's shape count, +5328 the first's +48, its texture provider)" },
  { name = "first_set", offset = 106000, type = "ptr", to = "ScenePools" },
]

# The car parts' loads (the car parts' +96; CarPartsLoads::CarPartsLoads
# sub_820D6F88).
[CarPartsLoads]
measure = "CarPartsLoads"
size = 105904
origin = "embedded"
fields = [
  { name = "slots", offset = 0, type = "bytes", count = 5184, note = "216 LoadSlots" },
  { name = "part_models", offset = 5184, type = "bytes", count = 100224, note = "216 PartModels of 464 bytes" },
  { name = "points", offset = 105424, type = "bytes", count = 480, note = "30 float4s, w (+105436 + 16i) 1.0 from the constructor" },
]

