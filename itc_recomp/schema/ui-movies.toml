# The schema of docs/functions/ui-movies.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The UI movie library (src/ui_movies/: the files' fix-ups, the animations'
# application, the drawing walk and its recorders). The movie's nodes are
# tuning-screen.toml's UiMovieNode (UiMovie::Child's answer); the movie
# object and its game-side parts are ui-movies-game.toml's.

# The command list's vertices (CommandList::AllocateVertices's answer):
# 24-byte vertices, four at constant offsets in the callers that make quads
# (the UI movie recorders, the minimap, the scene target, the power graph,
# the mode tick's fade).
[CommandListVertices]
measure = "CommandList::AllocateVertices.ret"
size = 96
origin = "file"
fields = [
  { name = "v0_x", offset = 0, type = "f32" },
  { name = "v0_y", offset = 4, type = "f32" },
  { name = "v0_z", offset = 8, type = "f32" },
  { name = "v0_color", offset = 12, type = "u32", note = "ARGB, a byte each" },
  { name = "v0_u", offset = 16, type = "f32" },
  { name = "v0_v", offset = 20, type = "f32" },
  { name = "v1_x", offset = 24, type = "f32" },
  { name = "v1_y", offset = 28, type = "f32" },
  { name = "v1_z", offset = 32, type = "f32" },
  { name = "v1_color", offset = 36, type = "u32" },
  { name = "v1_u", offset = 40, type = "f32" },
  { name = "v1_v", offset = 44, type = "f32" },
  { name = "v2_x", offset = 48, type = "f32" },
  { name = "v2_y", offset = 52, type = "f32" },
  { name = "v2_z", offset = 56, type = "f32" },
  { name = "v2_color", offset = 60, type = "u32" },
  { name = "v2_u", offset = 64, type = "f32" },
  { name = "v2_v", offset = 68, type = "f32" },
  { name = "v3_x", offset = 72, type = "f32" },
  { name = "v3_y", offset = 76, type = "f32" },
  { name = "v3_z", offset = 80, type = "f32" },
  { name = "v3_color", offset = 84, type = "u32" },
  { name = "v3_u", offset = 88, type = "f32" },
  { name = "v3_v", offset = 92, type = "f32" },
]

# A movie file (X2D, version 005) once loaded (UiMovie::FixUpFile).
[UiMovieFile]
measures = ["sub_825A0EB0.r3", "sub_825A0ED8.r3"]
size = 40
origin = "file"
fields = [
  { name = "scene_offset", offset = 4, type = "u32", note = "the scene at the file + this" },
  { name = "magic", offset = 8, type = "bytes", count = 8, note = "X2D\\0 then 005\\0" },
  { name = "first_animation", offset = 16, type = "u32", note = "its animations' first table index" },
  { name = "animation_count", offset = 20, type = "u32" },
  { name = "table_size", offset = 24, type = "u32", note = "the table's entries" },
  { name = "table", offset = 32, type = "u32", note = "the table's first word: 8-byte entries from here, offsets turned into pointers" },
]

# An XMD file (version 001; probably the movie's texture or resource set).
[UiMovieXmd]
measure = "sub_825A0C60.r3"
size = 20
origin = "file"
fields = [
  { name = "magic", offset = 0, type = "bytes", count = 8, note = "XMD\\0 then 001\\0" },
  { name = "flags", offset = 8, type = "u32", note = "bit 0 doubles the swapped words (the swap never runs)" },
  { name = "entry_count", offset = 12, type = "u32" },
  { name = "entries", offset = 16, type = "u32", note = "the first entry's offset: 4 bytes each from here" },
]

# A chunk of a movie's chunk list (sub_8259D5C8 walks them to a tag).
[UiMovieChunk]
measure = "sub_8259D5C8.r3"
size = 8
origin = "file"
fields = [
  { name = "tag", offset = 0, type = "u32", note = "TRM\\0 at the end" },
  { name = "next", offset = 4, type = "u32", note = "the offset to the next chunk" },
]

# An animation of a movie file (64-byte header, then 8-byte entries).
[UiMovieAnimation]
measure = "sub_825A6570.r3"
measures = ["UiMovie::ApplyAnimation.r4"]
size = 68
origin = "file"
fields = [
  { name = "length", offset = 12, type = "f32" },
  { name = "name", offset = 16, type = "u8", note = "probably its name's first byte (ui-movies-game.md)" },
  { name = "first_node_track_list", offset = 32, type = "u32", note = "entry index" },
  { name = "node_track_list_count", offset = 36, type = "u32" },
  { name = "first_key_list", offset = 40, type = "u32", note = "entry index" },
  { name = "key_list_count", offset = 44, type = "u32" },
  { name = "first_sub_animation", offset = 48, type = "u32", note = "entry index" },
  { name = "sub_animation_count", offset = 52, type = "u32" },
  { name = "entry_count", offset = 56, type = "u32", note = "the entries in all" },
  { name = "entries", offset = 64, type = "u32", note = "the first entry's word: 8-byte entries from here, offsets turned into pointers" },
]

# A node track list: the tracks keying one node (by its id), 16-byte
# tracks from +16.
[UiMovieNodeTrackList]
measure = "sub_825A6528.ret"
size = 16
origin = "file"
fields = [
  { name = "node_id", offset = 8, type = "u32", note = "the node's +8" },
  { name = "track_count", offset = 12, type = "u32" },
]

# A key list: 32-byte keys from +16.
[UiMovieKeyList]
measure = "sub_825A6540.ret"
size = 16
origin = "file"
fields = [
  { name = "key_count", offset = 12, type = "u32" },
]

# A track (16 bytes): one node field keyed over time.
[UiMovieTrack]
measures = ["sub_825A6508.ret", "UiMovie::ApplyTrack.r4"]
size = 16
origin = "file"
fields = [
  { name = "property", offset = 0, type = "u32", note = "its property id (UiMovie::TrackProperty)" },
  { name = "key_list", offset = 4, type = "u32", note = "its key list's index in the animation" },
  { name = "start", offset = 8, type = "f32", note = "the time its keys start at" },
  { name = "vertex", offset = 12, type = "u32", note = "the primitive's vertex for indirect properties" },
]

# A key (32 bytes). The interpolation reads the second key's kind and
# tangent angles.
[UiMovieKey]
measures = [
  "sub_825A6518.ret",
  "sub_8259FA20.r3", "sub_8259FA20.r4",
  "sub_8259FAA8.r3", "sub_8259FAA8.r4",
  "sub_8259FB30.r3", "sub_8259FB30.r4",
  "sub_8259FC18.r3", "sub_8259FC18.r4",
  "sub_8259FD40.r3", "sub_8259FD40.r4",
]
size = 32
origin = "file"
fields = [
  { name = "kind", offset = 0, type = "u32", note = "0 step, 1 linear, 2 cubic, 3 eased" },
  { name = "time", offset = 4, type = "f32" },
  { name = "value", offset = 8, type = "f32", note = "a float track's value" },
  { name = "int_value", offset = 8, type = "u32", note = "an integer track's value" },
  { name = "tangent_in", offset = 12, type = "f32", note = "probably the tangent's angle arriving at this key" },
  { name = "tangent_out", offset = 16, type = "f32", note = "probably the tangent's angle leaving the key before" },
]

# A sub-animation (an animation played inside another over part of its time).
[UiMovieSubAnimation]
measure = "sub_825A6558.ret"
size = 40
origin = "file"
fields = [
  { name = "node_id", offset = 8, type = "u32", note = "0: the node itself, else its children with this id" },
  { name = "animation", offset = 16, type = "ptr", to = "UiMovieAnimation", note = "a table index until fixed up" },
  { name = "start", offset = 24, type = "f32", note = "its range in the parent's time (+24, +28)" },
  { name = "end", offset = 28, type = "f32" },
  { name = "map_start", offset = 32, type = "f32", note = "mapped onto its own time (+32, +36)" },
  { name = "map_end", offset = 36, type = "f32" },
]

# A track property's descriptor (12 bytes; 64 at 0x82970C28).
[UiMovieTrackProperty]
measure = "UiMovie::TrackProperty.ret"
size = 12
origin = "image"
fields = [
  { name = "node_offset", offset = 0, type = "u32" },
  { name = "type", offset = 4, type = "u32", note = "0 float, 1 signed and 2 unsigned integer" },
  { name = "flags", offset = 8, type = "u32", note = "the fill's word: sets << 24, indirect << 16, two leftover stack bytes" },
  { name = "sets", offset = 8, type = "u8", note = "1 sets the field, 0 adds to it" },
  { name = "indirect", offset = 9, type = "u8", note = "a primitive's vertex field (the track's +12)" },
]

# A primitive's texture entry (16 bytes from its +128; sub_8259D618's
# answer). The pictures' are ui-movies-game.toml's UiMoviePictureTexture.
[UiMovieTextureEntry]
measure = "sub_8259D618.ret"
size = 16
origin = "file"
fields = [
  { name = "texture", offset = 0, type = "u32", note = "the index in the movie's textures" },
]

# The state the drawing walk passes down the node tree (112 bytes; the
# movie's +64, and copies on the walk's frames).
[UiMovieDrawContext]
measures = ["sub_8259D9F8.r3", "sub_8259D9F8.r4"]
size = 112
origin = "embedded"
fields = [
  { name = "matrix", offset = 0, type = "bytes", count = 64, note = "a 4x4 matrix" },
  { name = "matrix_3", offset = 12, type = "f32", note = "the w column, set to 1.0 before a copy" },
  { name = "matrix_7", offset = 28, type = "f32" },
  { name = "matrix_11", offset = 44, type = "f32" },
  { name = "matrix_15", offset = 60, type = "f32" },
  { name = "clip_left", offset = 64, type = "u32", note = "the clip rectangle (integers; all 0 for none)" },
  { name = "clip_top", offset = 68, type = "u32" },
  { name = "clip_right", offset = 72, type = "u32" },
  { name = "clip_bottom", offset = 76, type = "u32" },
  { name = "red", offset = 80, type = "f32", note = "the color (0 to 1)" },
  { name = "green", offset = 84, type = "f32" },
  { name = "blue", offset = 88, type = "f32" },
  { name = "alpha", offset = 92, type = "f32" },
  { name = "textures", offset = 96, type = "ptr", to = "UiMovieTextureList", note = "the movie's +28" },
  { name = "text_list", offset = 100, type = "ptr", to = "UiMovieDrawTextList", note = "the movie's +40" },
  { name = "unknown_104", offset = 104, type = "u32", note = "-1 from the movie update (UiMovie::Draw's r7)" },
  { name = "scaled", offset = 108, type = "u32", note = "set when a scale isn't 1.0" },
]

# A movie's textures (the movie's +28; a vector).
[UiMovieTextureList]
measure = "UiMovie.+96"
size = 12
origin = "embedded"
fields = [
  { name = "data", offset = 0, type = "u32", note = "the textures' table: a word each, by a texture entry's index" },
  { name = "capacity", offset = 4, type = "u32", note = "512" },
  { name = "count", offset = 8, type = "u32" },
]

# A movie's text list (the movie's +40; a vector of 128-byte items).
[UiMovieDrawTextList]
measure = "UiMovie.+100"
size = 12
origin = "embedded"
fields = [
  { name = "items", offset = 0, type = "ptr", to = "UiMovieTextItem" },
  { name = "capacity", offset = 4, type = "u32", note = "512" },
  { name = "count", offset = 8, type = "u32" },
]

# UiMovieQueuedText: merged into ui-movies-game.toml's UiMovieTextItem at the integration (the same object).

# UiMovieDrawQuad: merged into ui-movies-game.toml's UiMovieQuad at the integration (the same object).

# A drawn quad's vertex position (16 bytes).
[UiMovieQuadPosition]
measures = ["sub_8259DAD0.r3.+88", "sub_8259E098.r3.+88"]
size = 16
origin = "embedded"
fields = [
  { name = "x", offset = 0, type = "f32" },
  { name = "y", offset = 4, type = "f32" },
  { name = "z", offset = 8, type = "f32" },
  { name = "w", offset = 12, type = "f32" },
]

# A drawn quad's vertex color (16 bytes: four integers, 0 to 255).
[UiMovieQuadColor]
measures = ["sub_8259DAD0.r3.+92", "sub_8259E098.r3.+92"]
size = 16
origin = "embedded"
fields = [
  { name = "red", offset = 0, type = "u32" },
  { name = "red_low", offset = 3, type = "u8", note = "the red word's low byte" },
  { name = "green", offset = 4, type = "u32" },
  { name = "green_low", offset = 7, type = "u8" },
  { name = "blue", offset = 8, type = "u32" },
  { name = "blue_low", offset = 11, type = "u8" },
  { name = "alpha", offset = 12, type = "u32" },
]

# A drawn quad's vertex texture coordinates (16 bytes).
[UiMovieQuadCoord]
measure = "sub_8259DAD0.r3.+96"
size = 16
origin = "embedded"
fields = [
  { name = "u", offset = 0, type = "f32" },
  { name = "v", offset = 4, type = "f32" },
]

# A clip rectangle as sub_8259D730 intersects it (four integers).
[UiMovieClipRect]
measure = "sub_8259D730.r4"
size = 16
origin = "embedded"
fields = [
  { name = "left", offset = 0, type = "u32" },
  { name = "top", offset = 4, type = "u32" },
  { name = "right", offset = 8, type = "u32" },
  { name = "bottom", offset = 12, type = "u32" },
]

# The renderer object the library hands its chunks to ([0x82970C18]).
[UiMovieRenderer]
measure = "[82970C18]"
size = 4
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "UiMovieRendererVtable" },
]

[UiMovieRendererVtable]
measure = "[82970C18].+0"
size = 20
origin = "image"
fields = [
  { name = "submit", offset = 16, type = "fn", note = "slot 4: r4 a chunk, r5 its key, f1 its depth" },
]

[globals]
renderer = { address = 0x82970C18, type = "ptr", to = "UiMovieRenderer", note = "set by UiMovie::SetRenderer" }
command_list = { address = 0x82970C1C, type = "ptr", to = "CommandList", note = "the list the recorders record into (UiMovie::SetRenderer)" }
track_properties_filled = { address = 0x82970C20, type = "u8", note = "set once the descriptors are filled" }
track_properties = { address = 0x82970C28, type = "bytes", count = 768, note = "64 UiMovieTrackProperty descriptors" }
track_properties_guard = { address = 0x82970F28, type = "u32", note = "bit 0: the table cleared and its clean-up registered" }
one = { address = 0x82000A30, type = "f32", note = "1.0" }
zero = { address = 0x82000A34, type = "f32", note = "0.0 (also the quads' depth)" }
color_to_integer = { address = 0x82000C44, type = "f32", note = "the vertex colors' scale to integers" }
state_reset_depth = { address = 0x82001BFC, type = "f32", note = "sub_8259D7B0's second chunk's depth" }
clip_reset_depth = { address = 0x82001C00, type = "f32", note = "sub_8259D7B0's first chunk's depth" }
ease_scale = { address = 0x820021E4, type = "f32", note = "the keys' ease and cubic constant" }
color_scale = { address = 0x82002200, type = "f32", note = "the nodes' integer colors' scale (probably 1/255)" }
degrees = { address = 0x82002948, type = "f32", note = "degrees to radians" }
tangent_scale = { address = 0x82002A38, type = "f32", note = "the cubic keys' tangent scale" }
near_zero = { address = 0x82002A44, type = "f32", note = "the rotation's, the scale's and the step keys' threshold" }
layer_depth = { address = 0x82071520, type = "f32", note = "the layer to a depth" }
