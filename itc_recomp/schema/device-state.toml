# The command replay's command items (functions.md's Command::* handlers):
# one 280-byte record whose words mean what each command makes of them.
[ReplayCommand]
measure = "Command"
size = 280
origin = "gpu"
fields = [
  { name = "arg0", offset = 0, type = "u32", note = "the item's first word (a stream, a state, a type, a flag word: by command)" },
  { name = "arg0_high", offset = 0, type = "u16", note = "SetViewports' x, SetScissorRects' left" },
  { name = "arg0_low", offset = 2, type = "u16", note = "SetViewports' y, SetScissorRects' top" },
  { name = "arg1", offset = 4, type = "u32", note = "the second word (Clears' rectangles, Resolves' r4, SetStreamSources' buffer)" },
  { name = "arg1_high", offset = 4, type = "u16", note = "SetViewports' width, SetScissorRects' right, DrawVerticesUP's r5" },
  { name = "arg1_low", offset = 6, type = "u16", note = "SetViewports' height, SetScissorRects' bottom, DrawVerticesUP's vertex count (r6)" },
  { name = "arg2", offset = 8, type = "u32", note = "the third word, also a float (SetViewports' min Z); Clears' r6, Resolves' source rectangle" },
  { name = "arg3", offset = 12, type = "u32", note = "the fourth word, also a float (SetViewports' max Z); SetStreamSources' stride, Clears' r5" },
  { name = "arg4", offset = 16, type = "u32", note = "DrawIndexedVerticesUP's +16 (1: 16-bit indices)" },
  { name = "arg5", offset = 20, type = "u32", note = "DrawIndexedVerticesUP's +20" },
  { name = "arg6", offset = 24, type = "u32", note = "Resolves' destination texture, DrawIndexedVerticesUP's +24" },
  { name = "arg7", offset = 28, type = "u32", note = "Resolves' r7 (item + 28), DrawIndexedVerticesUP's +28" },
  { name = "arg9", offset = 36, type = "u32", note = "Resolves' +36" },
  { name = "arg10", offset = 40, type = "u32", note = "Resolves' +40" },
  { name = "clear_color_0", offset = 44, type = "u8", note = "Resolves' clear color: the bytes +44 to +47 as floats" },
  { name = "clear_color_1", offset = 45, type = "u8" },
  { name = "clear_color_2", offset = 46, type = "u8" },
  { name = "clear_color_3", offset = 47, type = "u8" },
  { name = "clear_z", offset = 48, type = "f32", note = "Resolves' +48" },
  { name = "clear_stencil", offset = 52, type = "u32", note = "Resolves' +52" },
  { name = "clears_r7", offset = 268, type = "u32", note = "Clears' r7 (probably the color)" },
  { name = "clears_z", offset = 272, type = "f32", note = "Clears' f1 (probably Z)" },
  { name = "clears_stencil", offset = 276, type = "u32", note = "Clears' r9 (probably the stencil)" },
]

# A fence list entry (8 bytes, written where +13168 points): the resource's
# address / 4 in bits 0-29 (bit 30 clear), then -1.
[DeviceFenceEntry]
measure = "sub_822AD790.ret"
size = 8
origin = "gpu"
fields = [
  { name = "entry", offset = 0, type = "u64", note = "both words, as the originals store them" },
  { name = "resource", offset = 0, type = "u32", note = "the resource's address / 4 in bits 0-29" },
  { name = "marker", offset = 4, type = "u32", note = "-1" },
]

# The 4,800-byte dummy segment (device +15176, made by sub_822AD228): where
# writers go when the command buffer is out of space; also met as the fence
# list's block (sub_822AD790 takes it in place of a reservation then).
[DeviceDummySegment]
measure = "new<4800>@sub_822AD228"
size = 4800
origin = "allocated"
fields = [
  { name = "header", offset = 0, type = "u32", note = "the fence block's first word (0 when taken)" },
  { name = "count", offset = 4, type = "u32", note = "the fence block's second word: bit 31 kept, the rest the entries' count when the next block is taken" },
]

# A surface (Device::CreateSurface's 48-byte header, graphics-resources.md; the
# cameras' CameraSurface is the same object): the bound render targets and
# depth surface, the set saved at the tiling's start.
[DeviceSurface]
measures = ["Device.+12468", "Device.+12472", "Device.+12476", "Device.+12480", "Device.+12484", "Device::SetDepthStencilSurface.r4", "Device::SetRenderTarget.r5"]
size = 48
origin = "gpu"
fields = [
  { name = "surface_info", offset = 24, type = "u32", note = "RB_SURFACE_INFO (bits 16-17 the MSAA)" },
  { name = "format_info", offset = 28, type = "u32", note = "RB_COLOR_INFO (the color format in bits 16-19) or RB_DEPTH_INFO" },
  { name = "hiz", offset = 32, type = "u32", note = "RB_HIZCONTROL for a depth surface" },
  { name = "size", offset = 36, type = "u32", note = "width - 1 in bits 0-13, height - 1 in bits 15-29" },
]

