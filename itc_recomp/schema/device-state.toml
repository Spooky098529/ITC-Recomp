size = 24
origin = "gpu"
fields = [
  { name = "x", offset = 0, type = "u32" },
  { name = "y", offset = 4, type = "u32" },
  { name = "width", offset = 8, type = "u32" },
  { name = "height", offset = 12, type = "u32" },
  { name = "min_z", offset = 16, type = "f32" },
  { name = "min_z_bits", offset = 16, type = "u32" },
  { name = "max_z", offset = 20, type = "f32" },
  { name = "max_z_bits", offset = 20, type = "u32" },
]

# A gamma ramp: three channels of 256 halfwords (ComputeGammaRamp's r3 out,
# r4 in; the device's at +13608).
[DeviceGammaRamp]
measures = ["ComputeGammaRamp.r3", "ComputeGammaRamp.r4"]
size = 1536
origin = "gpu"
fields = [
  { name = "red", offset = 0, type = "bytes", count = 512 },
  { name = "green", offset = 512, type = "bytes", count = 512 },
  { name = "blue", offset = 1024, type = "bytes", count = 512 },
]

# Device::SetPixelShaderConstantB's data: a word a bool constant (bit 0); the
# measure names it after SetPixelShaderConstantF's return.
[DeviceBoolConstant]
measure = "Device::SetPixelShaderConstantF.ret"
size = 4
origin = "gpu"
fields = [
  { name = "value", offset = 0, type = "u32", note = "bit 0 the bool" },
]

