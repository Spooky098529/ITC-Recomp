  { name = "fetch2", offset = 36, type = "u32", note = "word 2: the size" },
  { name = "fetch3", offset = 40, type = "u32", note = "word 3 (the filters, bits 19-30, are the stage's)" },
  { name = "mip_levels", offset = 44, type = "u32", note = "word 4: the max mip level in bits 2-5, the min in 6-9" },
  { name = "mip_address", offset = 48, type = "u32", note = "word 5: the mip address" },
]

# A vertex buffer's header (32 bytes, Device::CreateVertexBuffer; known-data.md's
# "buffer header"; the index buffer at device +12180 is one too).
[DeviceVertexBuffer]
measure = "Device::SetStreamSource.r5"
