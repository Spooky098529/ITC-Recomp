# The schema of docs/functions/device-state.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The graphics device (the 360's Direct3D linked into the game, 20,444 bytes
# by the measure): its dirty masks, state tables, constants and register
# shadow (blocks 0x2000- at +10240, 0x2100- +10316, 0x2180- +10400, 0x2200-
# +10420, 0x2280- +10468, 0x2300- +10552, 0x2380- +10704; gpu-functions.md,
# "The register shadow as a whole"), the software copies the setters build
# registers from, the bound objects, the command buffer's and predicated
# tiling's state, the display's. Names from docs/known-data.md ("device +..."),
# the area files (device-state.md, command-buffer.md, predicated-tiling.md,
# video-output.md, functions.md) and the hand ports' constants. Arrays indexed
# by state, sampler, stream or tile are `bytes`; their first element also has
# a scalar where code reads it alone. Aliases of other widths at one offset
# are the same word read in halves (or, where the note says, a measure fault).

[Device]
measure = "Device"
size = 20444
origin = "gpu"
fields = [
  { name = "allocation", offset = -4, type = "u32", note = "the block the device was allocated in (it starts 4 bytes in); freed by Device::Release" },
  { name = "vertex_float_dirty_top", offset = 0, type = "u8", note = "its top byte (only Device::PatchVertexShader's shader, a measure fault)" },
  { name = "vertex_float_dirty_high", offset = 0, type = "u32", note = "its high word (also where measure faults land: SetScissorRect's rectangle, SetDisplayMode's and the workers' r3)" },
  { name = "vertex_float_dirty", offset = 0, type = "u64", note = "the vertex float constants' dirty mask (a bit a constant block)" },
  { name = "vertex_float_dirty_low", offset = 4, type = "u32", note = "its low word (measure faults only)" },
  { name = "pixel_float_dirty_high", offset = 8, type = "u32", note = "its high word (Device::LoadShaders; SetScissorRect's rectangle, a measure fault)" },
  { name = "pixel_float_dirty", offset = 8, type = "u64", note = "the pixel float constants' dirty mask" },
  { name = "pixel_float_dirty_low", offset = 12, type = "u32", note = "its low word (SetScissorRect's rectangle, a measure fault)" },
  { name = "shader_dirty", offset = 16, type = "u64", note = "the shader state's dirty mask: bits 0-11 0x2200-0x220B (bit 11 0x2200), 12-43 the fetch constants (bit 43 constant 0), 44-48 0x2180-0x2184, 49-52 the shaders (gpu-functions.md)" },
  { name = "render_dirty_high", offset = 24, type = "u32", note = "its high word (Device::LoadShaders; VertexDeclaration::FromFvf's element count, a measure fault)" },
  { name = "render_dirty", offset = 24, type = "u64", note = "the render state's dirty mask: bit 1 the bool and loop constants, 2-22 0x2100-0x2114, 23-38 0x2000-0x200F, 39-59 0x2280-0x2294" },
  { name = "render_dirty_low", offset = 28, type = "u32", note = "its low word (VertexDeclaration::FromFvf's +28, a measure fault)" },
  { name = "other_dirty_high", offset = 32, type = "u32", note = "its high word (Device::Swap)" },
  { name = "other_dirty", offset = 32, type = "u64", note = "the other state's dirty mask: bits 0-37 0x2300-0x2325, 38-45 0x2380-0x2387, 49-54 sub_822ADEF0's registers" },
  { name = "other_dirty_low", offset = 36, type = "u32", note = "its low word (Device::Swap)" },
  { name = "write_position", offset = 40, type = "u32", note = "the command buffer's write position: the last word written (stored with a pre-increment; command-buffer.md)" },
  { name = "write_position_and_end", offset = 40, type = "u64", note = "+40 and +44 as one doubleword (Device::LoadShaders)" },
  { name = "segment_end", offset = 44, type = "u32", note = "the open segment's end" },
  { name = "soft_end", offset = 48, type = "u32", note = "the segment's soft end (+44 - 160): writers end the segment past it" },
  { name = "reference_count_high", offset = 52, type = "u16", note = "a measure fault: VertexDeclaration::FromFvf's element stores (its declaration isn't the device)" },
  { name = "reference_count", offset = 52, type = "u32", note = "1 at construction (sub_822AD228); sub_8229D978 drops it and releases the device at 1" },
  { name = "reference_count_low", offset = 54, type = "u16", note = "a measure fault, as +52's halfword" },
  { name = "render_state_setters", offset = 56, type = "bytes", count = 384, note = "the render state setters by state (byte offsets 0-380, D3DRS_* order), filled by SetDefaultState from 0x826388F8 (VertexDeclaration::FromFvf's and PatchVertexShader's accesses here are measure faults)" },
  { name = "sampler_state_setters", offset = 440, type = "bytes", count = 80, note = "the sampler state setters by state (0-76)" },
  { name = "render_state_getters", offset = 520, type = "bytes", count = 384, note = "the render state getters by state (Device::LoadShaders' accesses here are a measure fault: a shader's file header)" },
  { name = "sampler_state_getters", offset = 904, type = "bytes", count = 80, note = "the sampler state getters by state" },
  { name = "fetch_constants", offset = 1024, type = "bytes", count = 768, note = "the fetch constants (0x4800-): 32 of 24 bytes; the textures' (sampler n at +24n) and the vertex fetch constants (95 - stream at +1784 - 8 x stream)" },
  { name = "vertex_float_constants", offset = 1792, type = "bytes", count = 4096, note = "the vertex float constants (256 of 16 bytes)" },
  { name = "pixel_float_constants", offset = 5888, type = "bytes", count = 4096, note = "the pixel float constants (256 of 16 bytes)" },
  { name = "bool_loop_constants", offset = 9984, type = "bytes", count = 160, note = "the bool and loop constants (0x4900-, 40 words); the pixel bools at +10000" },
  { name = "rb_surface_info_high", offset = 10240, type = "u16", note = "its high halfword" },
  { name = "rb_surface_info", offset = 10240, type = "u32", note = "0x2000 RB_SURFACE_INFO (Device::SetSurfaceInfo; top 14 bits from the tiling's +12912)" },
  { name = "rb_color_info", offset = 10244, type = "u32", note = "0x2001 RB_COLOR_INFO (render target 0's)" },
  { name = "rb_depth_info_high", offset = 10248, type = "u16", note = "its high halfword" },
  { name = "rb_depth_info", offset = 10248, type = "u32", note = "0x2002 RB_DEPTH_INFO" },
  { name = "rb_color1_info", offset = 10252, type = "u32", note = "0x2003 RB_COLOR1_INFO" },
  { name = "rb_color2_info", offset = 10256, type = "u32", note = "0x2004 RB_COLOR2_INFO" },
  { name = "rb_color3_info", offset = 10260, type = "u32", note = "0x2005 RB_COLOR3_INFO" },
  { name = "reg_2007", offset = 10268, type = "u32", note = "0x2007 (Device::Resolve); not read" },
  { name = "reg_200d", offset = 10292, type = "u32", note = "0x200D: 0x1000 with clip planes on, else 0 (SetRenderState_ClipPlaneEnable)" },
  { name = "reg_200f", offset = 10300, type = "u32", note = "0x200F (sub_822AC2A0 at boot); not read" },
  { name = "pa_sc_window_scissor_tl", offset = 10308, type = "u32", note = "PA_SC_WINDOW_SCISSOR_TL's shadow (x bits 0-14, y bits 16-30)" },
  { name = "pa_sc_window_scissor_br", offset = 10312, type = "u32", note = "PA_SC_WINDOW_SCISSOR_BR's shadow" },
