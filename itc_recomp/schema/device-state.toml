  { name = "fence", offset = 8, type = "u32", note = "the command position when last replaced" },
  { name = "data", offset = 24, type = "u32", note = "the data's address (a vertex buffer's with its low 2 bits 3)" },
  { name = "data_size", offset = 28, type = "u32" },
