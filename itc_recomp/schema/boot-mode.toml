next_type = { address = 0x826C5BC0, type = "u32", note = "the mode type after the list (4 at boot)" }
skippable = { address = 0x826C5BC4, type = "u32", note = "a button skips the movies" }
movie_index = { address = 0x826C5BC8, type = "u32", note = "the list's next entry" }
