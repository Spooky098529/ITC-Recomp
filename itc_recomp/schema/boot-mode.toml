# The schema of docs/functions/boot-mode.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The game modes' base (known-data.md: "game mode"), the boot mode (type 3,
# 10,460 bytes: the base, then its state machine at +848), the type 8 mode's
# base words, the mode's delegate and its 8-byte next-mode answer
# (src/boot_mode/). The action mapper types the measure filed here (the
# destructors sub_8210B388, sub_8210B650, sub_8210AEA0, sub_8210B090,
# sub_8259C6F0 and sub_8209F138's list read) are action-mappers.toml's.

# The game mode's base (852-byte modes: types 2, 4, 5, 6, 7, 9, 10, 12; the
# boot mode and the race mode extend it). The measure joins the next-mode
# answer (slot 6's r3, ModeAnswer) with it: Mode::NoNextMode's and
# BootMode::NextMode's answer stores land on +0 and +4 (answer_* below).
# Dual (E5 step 4): the 852-byte modes live in host memory, the boot, race
# and type 8 modes in guest memory, and the joined answer is on the stack;
# the dispatcher (+36, ModeDispatcher) and the delegate (+8, ModeDelegate)
# are dual for the same reason.
[GameMode]
measures = ["Mode", "BootMode", "Mode::NextModeThunk.r4"]
size = 848
origin = "embedded"
storage = "dual"
vtable = 0x820069EC
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x820069EC the base's, 0x82006B70 the boot mode's, 0x82006B44 ModeType3's" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer), not the mode's" },
  { name = "answer", offset = 0, type = "u64", note = "measure fault: the next-mode answer's 8 bytes (ModeAnswer), not the mode's" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8 (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "the delegate (ModeDelegate): vtable 0x82010FA0" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the delegate's object: the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "0x82235C08 Mode::NextModeThunk for the boot and race modes" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "the second vtable: 0x82006A0C the base's, 0x82006B64 the boot mode's" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers (state machines)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (id, two words)" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
]

# The boot mode as BootMode::NextMode meets it (r4): the base, then the
# boot machine at +848 (BootMachine).
[BootMode]
measure = "BootMode::NextMode.r4"
size = 10460
origin = "allocated"
vtable = 0x82006B70
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006B70" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82006B64" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher: 50 handler pointers" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "50 messages of 12 bytes" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "machine", offset = 848, type = "bytes", count = 9612, note = "the boot machine (BootMachine)" },
  { name = "machine_state", offset = 10452, type = "u32", note = "+848's state: 0 before the movie, 1 playing, 2 ended" },
  { name = "movie_started", offset = 10456, type = "u32", note = "+848's +9608: 1 once Movies::Start was called" },
]

# The boot mode's state machine (+848; a StateMachine, game-modes.toml),
# its +9608 the boot's own word.
[BootMachine]
measure = "Boot"
measures = ["BootMode@+848"]
size = 9612
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions of 48 bytes" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "0 before the movie, 1 playing, 2 ended" },
  { name = "movie_started", offset = 9608, type = "u32", note = "1 once Movies::Start was called (Boot::WaitForMovie); 0 from BootMachine::Init" },
]

# A mode's message dispatcher (the mode's +36), as the machines' handlers
# get it (r4).
[ModeDispatcher]
measure = "Boot::WaitForMovie.r4"
measures = ["TitleLoad::OpenTitle.r4", "TitleLoad::Leave.r4", "TitleLoad::Update.r4", "TitleScreen::OpenNext.r4", "TitleScreen::Leave.r4", "TodaysResult::Leave.r4", "TodaysEvent::Leave.r4", "TodaysEvent::Unloaded.r4", "ReplayTheater::Wait.r4", "ReplayTheater::Leave.r4", "Type5Dialog::Update.r4", "Type6ListScreen::Back.r4", "Type7ListScreen::Back.r4", "Type6NodeScreen::Back.r4", "Type6PanelScreen::Back.r4", "Type7PanelScreen::Back.r4", "Type6PanelScreen::OpenPowerGraph.r4", "Type7PanelScreen::OpenPowerGraph.r4", "Type6PanelScreen::PickCar.r4", "Type7PanelScreen::PickCar.r4", "sub_82230BA8.r4", "sub_82240518.r4", "ControllerOptions::Leave.r4", "Dialog::Leave.r4", "Type6Dialog::Cancel.r4", "Type6Dialog::ConfirmPage.r4", "Type6Dialog::NoticePage.r4", "Type6Dialog::Update.r4", "Type7Dialog::Cancel.r4", "Type7Dialog::ConfirmPage.r4", "Type7Dialog::Leave.r4", "Type7Dialog::NoticePage.r4", "Type7Dialog::Update.r4", "Type6Screen0::ChosenPage.r4", "Type6Screen0::Confirm.r4", "Type6Screen0::ConfirmAgain.r4", "Type6Screen0::Leave.r4", "Type6Screen0::MenuPage.r4", "Type6Screen0::SetUpCar.r4", "Type7Screen0::ChosenPage.r4", "Type7Screen0::Confirm.r4", "Type7Screen0::Leave.r4", "Type7Screen0::MenuPage.r4", "Type7Screen0::SetUpCar.r4", "Type8PanelScreen::UpdateOpening.r4", "Type8PanelScreen::Leave.r4", "Type8PanelScreen::AskQuit.r4", "Type8ListScreen::SetUpRace.r4", "Type8ColorListScreen::SetUpRace.r4", "sub_8226A660.r4", "sub_82263D80.r4", "sub_822657D8.r4", "sub_82266028.r4", "sub_822662F0.r4", "sub_822663E0.r4", "sub_82266548.r4", "sub_82266658.r4", "sub_82266750.r4", "sub_822681D0.r4", "sub_82269988.r4", "sub_822702C0.r4", "sub_82277178.r4", "sub_82277340.r4", "sub_822858D8.r4", "sub_82282BC8.r6"]
size = 812
origin = "embedded"
storage = "dual"
fields = [
  { name = "handlers", offset = 0, type = "bytes", count = 200, note = "50 handler pointers (state machines)" },
  { name = "handler_count", offset = 200, type = "u32" },
  { name = "ring", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (id, two words)" },
  { name = "ring_count", offset = 804, type = "u32" },
  { name = "ring_start", offset = 808, type = "u32" },
]

# The boot mode seen through its +32 interface (vtable 0x82006B64; r3 the
# mode + 32): sub_82107D80 queues message 1 in the mode's ring.
[BootModeInterface32]
measure = "sub_82107D80.r3"
size = 816
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006B64" },
  { name = "ring", offset = 208, type = "bytes", count = 600, note = "the mode's ring (+240)" },
  { name = "ring_count", offset = 808, type = "u32", note = "the mode's +840" },
  { name = "ring_start", offset = 812, type = "u32", note = "the mode's +844" },
]

# The game mode's vtable (0x820069EC the base's, 0x82006B70 the boot mode's).
[GameModeVtable]
measure = "Mode::NextModeThunk.r4.+0"
size = 32
origin = "image"
fields = [
  { name = "init", offset = 0, type = "fn", note = "slot 0: BootMode::Init for the boot mode" },
  { name = "slot1", offset = 4, type = "fn" },
  { name = "slot2", offset = 8, type = "fn", note = "slots 2 to 5: Mode::NoNextMode in every mode" },
  { name = "slot3", offset = 12, type = "fn" },
  { name = "slot4", offset = 16, type = "fn" },
  { name = "slot5", offset = 20, type = "fn" },
  { name = "next_mode", offset = 24, type = "fn", note = "slot 6: the next-mode query (BootMode::NextMode)" },
  { name = "deleting_destructor", offset = 28, type = "fn", note = "slot 7" },
]

# The mode's delegate (the mode's +8; vtable 0x82010FA0, ModeDelegate::Invoke).
[ModeDelegate]
measure = "ModeDelegate::Invoke.r4"
size = 16
origin = "embedded"
storage = "dual"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82010FA0" },
  { name = "object", offset = 4, type = "u32", note = "the mode" },
  { name = "function", offset = 8, type = "fn", note = "Mode::NextModeThunk (0x82235C08) for the boot and race modes" },
  { name = "adjustment", offset = 12, type = "u32", note = "added to the object" },
]

# The 8-byte next-mode answer (slot 6's r3; ModeDelegate::Invoke copies it).
[ModeAnswer]
measure = "ModeDelegate"
size = 8
origin = "embedded"
fields = [
  { name = "changed", offset = 0, type = "u8", note = "1 to change modes" },
  { name = "word0", offset = 0, type = "u32", note = "the first word as copied: changed and three bytes the stack's" },
  { name = "next_type", offset = 4, type = "u32", note = "the next mode's type" },
]

# The type 8 mode (87,768 bytes, ModeType8::ModeType8; known-data.md: "type 8
# mode"; never made in play).
[ModeType8]
measure = "ModeType8"
size = 87768
origin = "allocated"
vtable = 0x82006D60
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006D60" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate" },
  { name = "vtable32", offset = 32, type = "u32", note = "0x82006D54" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher: 50 handler pointers" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "50 messages of 12 bytes" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "member", offset = 848, type = "bytes", count = 86920, note = "ModeType8Member" },
]

# The type 8 mode's +848 (its screens; known-data.md: "type 8 mode"), its
# end the mode's 8-byte answer at +87760.
[ModeType8Member]
measure = "ModeType8@+848"
size = 86920
origin = "embedded"
fields = [
  { name = "screen0", offset = 0, type = "bytes", count = 9792, note = "Type8Screen0 (its machine +4)" },
  { name = "dialog", offset = 9792, type = "bytes", count = 9752, note = "Type8Dialog" },
  { name = "list_screen", offset = 19544, type = "bytes", count = 11368, note = "the list screen" },
  { name = "color_list_screen", offset = 30912, type = "bytes", count = 11828, note = "the color list screen" },
  { name = "panel_screen", offset = 42740, type = "bytes", count = 15252, note = "the panel screen" },
  { name = "options", offset = 57992, type = "bytes", count = 9640, note = "the options (a ScreenMachine)" },
  { name = "controller_pages", offset = 67632, type = "bytes", count = 9640, note = "the controller pages (a ScreenMachine)" },
  { name = "save_screen", offset = 77272, type = "bytes", count = 9640, note = "the save screen (a ScreenMachine)" },
  { name = "answer_changed", offset = 86912, type = "u8", note = "the mode's +87760: the 8-byte answer TearDown returns, its byte 1 to change modes; cleared by the constructor" },
  { name = "answer_next_type", offset = 86916, type = "u32", note = "the answer's next mode (1 the race, 4 the type 4 front end, 12); cleared by the constructor" },
]

[globals]
movie_paused = { address = 0x826C5BA4, type = "u32", note = "the boot movie paused (1); BootMode::NextMode" }
mode_asked = { address = 0x826C5BA8, type = "u32", note = "the mode the boot mode is asked to go to (13 none)" }
