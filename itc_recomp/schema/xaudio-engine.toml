# The schema of docs/functions/xaudio-engine.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# XAudio's engine and mixer (the game's own copy of XAudio, translated): the
# engine's factory and its class tables, the bump allocators, the mastering
# voice with its render driver, the stages (the voice lists the mix walks),
# and the out words the engine's functions write. Names from
# docs/functions/xaudio-engine.md, docs/known-data.md ("XAudio stage",
# "XAudio factory", "XAudio mastering voice", "XAudio allocator", "XAudio
# voice") and the hand port (src/xaudio/engine.h).
#
# The engine itself (XAudioEngine, 372 bytes at [0x82954F08]), its output
# buffers (XAudioBuffer) and the voices' base belong to xaudio.md's file:
# not described here. Types here the measure split from other areas' ones
# (the lead merges them): XAudioBumpAllocator and its vtable are
# xaudio-objects.toml's XAudioAllocator and XAudioAllocatorVtable (which see
# only the vtable); XAudioMasteringDriver is audio.toml's AudioRenderDriver
# met through the mastering voice; XAudioEngineBase is xaudio.md's
# XAudioEngine as its base destructor (sub_8245B170) meets it;
# XAudioEngineInfoOut is xaudio-objects.toml's FactoryInfoOut;
# XAudioFactoryDescriptorId is the byte view of xaudio-objects.toml's
# XAudioObjectDescriptor (class_id); XAudioMixVoice is the voice's base
# (xaudio.md) as XAudioEngine::StageOf meets it.
#
# Measure faults, kept as fields with notes so every access fits:
# XAudioFactory::TableSize's r3 (a pointer to the class table) taken for the
# factory (the factory's +0 read as the table); `new<?>@XAudio::Alloc` joins
# every XAudio::Alloc block: the allocators' (their constructors), the XMA
# object (XmaObject::Create, audio.md) and the factory's classes from id 128
# (sub_8245D760).

# A bump allocator (docs/known-data.md, "XAudio allocator"): 28 bytes plus
# its block. Vtables 0x8204A954 and (+4) 0x8204A980 (the default,
# XAudio::DefaultAllocator) or 0x8204A96C (the sizing one, sub_82460538).
# Met as every engine object's allocator (the engine's +8, a voice's +8).
[XAudioBumpAllocator]
measure = "XAudioAllocator"
measures = ["XAudioEngine.+8", "XAudioMasteringVoice.+8", "sub_8245B170.r3.+8", "XAudioEngine::XAudioEngine.r4", "AudioRenderDriver::Create.r4", "PcmCodec::Create.r4", "Reverb::Create.r4", "VolumeMeter::Create.r4", "XAudioMatrix::Create.r4", "XmaCodec::Create.r4", "PacketLists::Alloc.r5", "VolumeMeter::Init.r5", "XAudioMatrix::Init.r5", "XmaCodec::XmaCodec.r5", "sub_825A50E0.r4", "sub_825A5DB8.r4", "XAudioVoice.+8", "XAudio::GetAllocator.r5.+0", "XAudioObject.+8", "XAudioBuffer::XAudioBuffer.r5", "XAudioBuffer::Create.r4", "sub_824603A0.r3@-4"]
# measures from XAudioVoiceAllocator (xaudio), merged at the integration
# measures from XAudioAllocator (xaudio-objects), merged at the integration
size = 28
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "XAudioBumpAllocatorVtable", note = "0x8204A954" },
  { name = "interface_vtable", offset = 4, type = "u32", note = "the +4 interface's: 0x8204A980 the default, 0x8204A96C the sizing one; 0x8204A940 while the base destroys, the root's after" },
  { name = "ref_count", offset = 8, type = "u32" },
  { name = "attributes", offset = 12, type = "u32", note = "XMemAlloc's attributes, handed to XAudio::Free" },
  { name = "capacity", offset = 16, type = "u32", note = "the block's size (the sizing allocator adds each reservation)" },
  { name = "used", offset = 20, type = "u32" },
  { name = "block", offset = 24, type = "u32", note = "the default's is its own +28" },
  { name = "chain_count", offset = 0, type = "u8", note = "measure fault: BaseSize's description +8 (the effect chain: its count) (from XAudioVoiceAllocator, xaudio)" },
]

# The allocator's vtable (0x8204A954).
[XAudioBumpAllocatorVtable]
# measures from XAudioAllocatorVtable (xaudio-objects), merged at the integration
measures = ["XAudioAllocator.+0", "XAudioEngine.+8.+0", "XAudioMasteringVoice.+8.+0", "sub_8245B170.r3.+8.+0", "XAudioEngine::XAudioEngine.r4.+0",
  "AudioRenderDriver::Create.r4.+0", "PcmCodec::Create.r4.+0", "Reverb::Create.r4.+0", "VolumeMeter::Create.r4.+0", "XAudioMatrix::Create.r4.+0", "XmaCodec::Create.r4.+0", "PacketLists::Alloc.r5.+0", "VolumeMeter::Init.r5.+0", "XAudioMatrix::Init.r5.+0", "XmaCodec::XmaCodec.r5.+0", "sub_825A50E0.r4.+0", "sub_825A5DB8.r4.+0"]
size = 24
origin = "image"
fields = [
  { name = "add_ref", offset = 0, type = "fn" },
  { name = "release", offset = 4, type = "fn" },
  { name = "reserve", offset = 8, type = "fn", note = "XAudioAllocator::Reserve sub_824601F8 (probably)" },
  { name = "commit", offset = 12, type = "fn", note = "XAudioAllocator::Commit sub_82460210 (probably)" },
  { name = "remaining", offset = 16, type = "fn", note = "XAudioAllocator::Remaining sub_82460388" },
  { name = "allocate", offset = 20, type = "fn", note = "XAudioAllocator::Alloc sub_82460288: (the allocator, bytes), 0 when out of memory" },
]

# The allocator's +4 interface (its free and AddRef thunks' r3).
[XAudioAllocatorInterface]
measure = "sub_824603A8.r3"
measures = ["sub_8246D330.r3@-4"]
size = 12
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "XAudioAllocatorInterfaceVtable" },
  { name = "attributes", offset = 8, type = "u32", note = "the allocator's +12, the free's attributes; sub_82460370 adds one to it as a count (probably another class's interface: not read)" },
]

[XAudioAllocatorInterfaceVtable]
measure = "sub_824603A8.r3.+0"
size = 4
origin = "image"
fields = [
  { name = "destructor", offset = 0, type = "fn", note = "called with r4 1 before the free" },
]

# Every block XAudio::Alloc hands out (a measure fault: see the top). As the
# allocators' constructors write it, with the XMA object's and the factory
# classes' words beside.
[XAudioAllocBlock]
measure = "new<?>@XAudio::Alloc"
measures = ["new<?>@XAudio::Alloc.+8"]
size = 76
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "an allocator's 0x8204A954; the XMA object's stream count; a factory class's first function (sub_8245D760)" },
  { name = "interface_vtable", offset = 4, type = "u32", note = "an allocator's +4 interface; the XMA object's flags; a factory class's second function" },
  { name = "ref_count", offset = 8, type = "u32", note = "an allocator's (1); the XMA object's 96-byte entries" },
  { name = "attributes", offset = 12, type = "u32" },
  { name = "capacity", offset = 16, type = "u32" },
  { name = "used", offset = 20, type = "u32" },
  { name = "block", offset = 24, type = "u32" },
  { name = "xma_unknown_28", offset = 28, type = "u32", note = "XmaObject::Create's (audio.md), not read" },
  { name = "xma_unknown_32", offset = 32, type = "u32", note = "XmaObject::Create's (audio.md), not read" },
  { name = "xma_output_buffer", offset = 68, type = "u32", note = "an XMA entry's output buffer (audio.md)" },
  { name = "xma_work_buffer", offset = 72, type = "u32", note = "an XMA entry's work buffer (audio.md)" },
]

# The word an allocator, object or interface is written to.
[XAudioEngineOutWord]
measures = ["XAudioEngine::Create.r5", "sub_82460538.r3", "sub_8245F8D0.r4"]
size = 4
origin = "embedded"
fields = [
  { name = "object", offset = 0, type = "u32", note = "the engine (XAudioEngine::Create), the sizing allocator (sub_82460538), a buffer's interface (sub_8245F8D0)" },
]

# The size word the Size functions write.
[XAudioSizeOut]
# measures from XAudioVoiceSizeOut (xaudio), merged at the integration
measures = ["XAudioFactory::SizeOf.r4", "XAudioEngine::Size.r4", "XAudioMasteringVoice::Size.r4",
  "XAudioBuffer::Size.r4", "XAudioSourceVoice::Size.r4", "XAudioVoice::OutputsSize.r4", "XAudioVoice::BaseSize.r4"]
