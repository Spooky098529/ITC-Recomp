# The schema of docs/functions/mode-tick.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The mode manager's tick services (src/mode_tick/): the per-mode checks,
# the sign-in watch, the billboards' ring, the two screen fades and their
# color rectangles, the menu music. Most of what they touch are image words
# ([globals] below). The other types here are the Xbox Live mode's
# (network-mode.md; unreachable since 2026-11-14), filed under this area by
# the measure because their lifted handlers call ScreenFades::FadeIn,
# Players::SignedInSlot and Music::Play.
#
# Seeded types not described here (another area's type; the lead adds the
# measure names there): the five 812-byte "sub_822614C0.r4",
# "sub_82261600.r4", "sub_82261C20.r4", "sub_82262E10.r4", "sub_82264B90.r4"
# are boot-mode.toml's ModeDispatcher (the mode's +36: +804 the ring count,
# +808 its start); "lstrcmpA.r3", "lstrcmpA.r4", "CompareStringA.r6" are
# c-runtime.toml's CString.

# A color rectangle (112 bytes; ColorRect::Record sub_8217C348 and
# ColorRect::RecordFlat sub_8217A370), built by ScreenFades::Update in its
# frame (the original's r1 - 416 + 112).
[ColorRect]
measure = "ColorRect"
size = 112
origin = "embedded"
fields = [
  { name = "matrix", offset = 0, type = "bytes", count = 64, note = "an identity matrix (ScreenFades::Update)" },
  { name = "kind", offset = 64, type = "u32", note = "0 flat (RecordFlat), 1 sub_8217A758 (never ran), above 1 nothing" },
  { name = "unknown_68", offset = 68, type = "u32", note = "0 from ScreenFades::Update" },
  { name = "unknown_72", offset = 72, type = "u32", note = "2 from ScreenFades::Update" },
  { name = "x", offset = 80, type = "s32" },
  { name = "y", offset = 84, type = "s32" },
  { name = "width", offset = 88, type = "u32" },
  { name = "height", offset = 92, type = "u32" },
  { name = "red", offset = 96, type = "u32", note = "0 to 255" },
  { name = "red_byte", offset = 99, type = "u8", note = "red's low byte (RecordFlat's vertex color)" },
  { name = "green", offset = 100, type = "u32" },
  { name = "green_byte", offset = 103, type = "u8", note = "green's low byte" },
  { name = "blue", offset = 104, type = "u32" },
  { name = "blue_byte", offset = 107, type = "u8", note = "blue's low byte" },
  { name = "alpha", offset = 108, type = "s32", note = "0 to 255: above 0 blends" },
]

# The current mode seen through its +32 interface (the second vtable; for
# the type 12 mode 0x82006C60: Interrupt, ForceExit, Resume), as the sign-in
# watch's handlers get it (r4 = the mode's +32). The handlers never ran.
[SignInModeInterface]
measures = ["sub_8209E540.r4", "sub_8209E610.r4", "sub_8209E790.r4"]
size = 4
origin = "embedded"
storage = "dual"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "SignInModeInterfaceVtable" },
]

# That interface's vtable (three slots).
[SignInModeInterfaceVtable]
measures = ["sub_8209E540.r4.+0", "sub_8209E610.r4.+0", "sub_8209E790.r4.+0"]
size = 12
origin = "image"
fields = [
  { name = "interrupt", offset = 0, type = "fn", note = "slot 0 (the type 12 mode's Interrupt; sub_8209E540 calls it)" },
  { name = "force_exit", offset = 4, type = "fn", note = "slot 1 (ForceExit; sub_8209E790)" },
  { name = "resume", offset = 8, type = "fn", note = "slot 2 (Resume; sub_8209E610)" },
]

# Two 8-byte ids compared by sub_8214E818 (not read in detail; probably
# XUIDs or session ids): the record's +8 against r4's 8 bytes.
[NetIdRecord]
measure = "sub_8214E818.r3"
size = 16
origin = "embedded"
fields = [
  { name = "id", offset = 8, type = "bytes", count = 8, note = "compared byte by byte" },
]

[NetId]
measure = "sub_8214E818.r4"
size = 8
origin = "embedded"
fields = [
  { name = "id", offset = 0, type = "bytes", count = 8 },
]

# A word sub_82260758 (from the sign-in handler sub_8209E730, never ran)
# clears when 10 s passed since [0x826C72EC] (not read in detail).
[NetTimeoutFlag]
measure = "sub_82260758.r3"
size = 4
origin = "embedded"
fields = [
  { name = "flag", offset = 0, type = "u32", note = "0 after the timeout (probably)" },
]

# The Xbox Live mode's screen 8 machine (Type12Screen8::, the type 12
# block's +96524, 9,668 bytes; network-mode.md): a StateMachine
# (game-modes.toml), then its own words, as Type12Screen8::Create sets them.
# Met through its (5, 1) handler sub_82262E10 and the lifted
# sub_82262040, sub_82260A30 (none seen in play).
[ModeTickNet8Machine]
measures = ["sub_82262040.r3", "sub_82262E10.r3", "sub_82260A30.r3"]
size = 9668
origin = "embedded"
fields = [
  { name = "machine", offset = 0, type = "bytes", count = 9616, note = "a StateMachine (game-modes.toml)" },
  { name = "back", offset = 9624, type = "u32", note = "1: Destroy goes to state 14" },
  { name = "race", offset = 9628, type = "u32", note = "0 at Create" },
  { name = "leave", offset = 9632, type = "u32", note = "1: Destroy goes to state 15" },
  { name = "shown", offset = 9636, type = "u32", note = "set by ModeType12::Interrupt on the shown machine" },
  { name = "unknown_9640", offset = 9640, type = "u32", note = "0 at Create" },
  { name = "unknown_9644", offset = 9644, type = "u32", note = "0 at Create" },
  { name = "unknown_9648", offset = 9648, type = "u32", note = "0 at Create" },
  { name = "unknown_9652", offset = 9652, type = "u32", note = "0 at Create; the measure joins it with [0x82816120]'s pointee" },
  { name = "unknown_9656", offset = 9656, type = "u32", note = "0 at Create" },
  { name = "unknown_9660", offset = 9660, type = "u32", note = "1 at Create" },
  { name = "unknown_9664", offset = 9664, type = "u32", note = "1 at Create" },
]

# The Xbox Live mode's screen 9 machine (Type12Screen9::, the block's
# +106192, 9,696 bytes, the network battle's results; network-mode.md), as
# its (4, 1) handler sub_82264B90 meets it (never seen in play).
[ModeTickNet9Machine]
measure = "sub_82264B90.r3"
size = 9696
origin = "embedded"
fields = [
  { name = "machine", offset = 0, type = "bytes", count = 9616, note = "a StateMachine (game-modes.toml)" },
  { name = "back", offset = 9624, type = "u32", note = "1: Destroy goes to state 14" },
  { name = "race", offset = 9628, type = "u32", note = "0 at Create" },
  { name = "leave", offset = 9632, type = "u32", note = "1: Destroy goes to state 15" },
  { name = "unknown_9640", offset = 9640, type = "u32", note = "1 at Create" },
  { name = "unknown_9644", offset = 9644, type = "u32", note = "1 at Create" },
  { name = "unknown_9648", offset = 9648, type = "u32", note = "0 at Create" },
  { name = "save_data_a", offset = 9652, type = "u32", note = "0 at Create; a save data address (sub_821059D0's answer, probably)" },
  { name = "save_data_b", offset = 9656, type = "u32", note = "0 at Create; a save data address (sub_821059D0's answer, probably)" },
  { name = "unknown_9660", offset = 9660, type = "u32", note = "0 at Create" },
  { name = "unknown_9664", offset = 9664, type = "u32", note = "0 at Create" },
  { name = "unknown_9668", offset = 9668, type = "u32", note = "0 at Create" },
  { name = "unknown_9672", offset = 9672, type = "u32", note = "0 at Create" },
  { name = "unknown_9676", offset = 9676, type = "u32", note = "0 at Create" },
  { name = "unknown_9680", offset = 9680, type = "u32", note = "1 at Create" },
  { name = "unknown_9684", offset = 9684, type = "u32", note = "0 at Create" },
  { name = "unknown_9688", offset = 9688, type = "u32", note = "1 at Create" },
  { name = "unknown_9692", offset = 9692, type = "u32", note = "0 at Create" },
]

# Screen 8's page object ([0x82816144], 28 bytes, VirtualAlloc'd by
# Type12Screen8::Create): menu-helpers.toml's PageObject shape. Measure
# fault: the measure joins it with the machine (+9652).
[ModeTickNet8Page]
measure = "new<28>@Type12Screen8::Create"
size = 28
origin = "allocated"
fields = [
  { name = "page", offset = 0, type = "u32", note = "the page Draw runs; -1 while a step runs" },
  { name = "next_page", offset = 4, type = "u32" },
  { name = "previous_page", offset = 8, type = "u32" },
  { name = "step", offset = 12, type = "u32", note = "the step Update runs; -1 none" },
  { name = "queued_step", offset = 16, type = "u32" },
  { name = "unknown_20", offset = 20, type = "u32" },
  { name = "step_started", offset = 24, type = "u32" },
  { name = "fault_9652", offset = 9652, type = "u32", note = "measure fault: the machine's +9652, not the page object's" },
]

# Screen 8's menu ([0x82816148], 68 bytes, VirtualAlloc'd by
# Type12Screen8::Create: +16 0, +20 1): menu-helpers.toml's FrontEndMenu
# shape. Measure faults: +9652 and +24904 are joins with other objects.
[ModeTickNet8Menu]
measure = "new<68>@Type12Screen8::Create"
size = 68
origin = "allocated"
fields = [
  { name = "cursor", offset = 0, type = "u32" },
  { name = "previous", offset = 4, type = "u32" },
  { name = "moved", offset = 8, type = "u32" },
  { name = "first_item", offset = 12, type = "u32" },
  { name = "last_item", offset = 16, type = "u32", note = "0 at Create (the measure's pointer here is a join)" },
  { name = "wraps", offset = 20, type = "u32", note = "1 at Create" },
  { name = "up_down_locked", offset = 24, type = "u32" },
  { name = "left_right_steps", offset = 28, type = "u32" },
  { name = "shoulders_step", offset = 32, type = "u32" },
  { name = "side", offset = 36, type = "s32" },
  { name = "wrapped", offset = 40, type = "u32" },
  { name = "list_wrapped", offset = 44, type = "u32" },
  { name = "visible_row", offset = 48, type = "u32" },
  { name = "previous_row", offset = 52, type = "u32" },
  { name = "first_row", offset = 56, type = "u32" },
  { name = "rows_shown", offset = 60, type = "u32" },
  { name = "player", offset = 64, type = "u32" },
  { name = "fault_9652", offset = 9652, type = "u32", note = "measure fault: a machine's +9652" },
  { name = "fault_24904", offset = 24904, type = "u32", note = "measure fault: a join with another object" },
]

# What the measure finds at the menu's +24904 (a measure fault): its fields
# have the FrontEndMenu shape (probably another screen's menu).
[ModeTickNet8MenuJoin]
measure = "new<68>@Type12Screen8::Create.+24904"
size = 68
origin = "file"
fields = [
  { name = "cursor", offset = 0, type = "u32" },
  { name = "previous", offset = 4, type = "u32" },
  { name = "moved", offset = 8, type = "u32" },
  { name = "first_item", offset = 12, type = "u32" },
  { name = "last_item", offset = 16, type = "u32" },
  { name = "wraps", offset = 20, type = "u32" },
  { name = "up_down_locked", offset = 24, type = "u32" },
  { name = "left_right_steps", offset = 28, type = "u32" },
  { name = "side", offset = 36, type = "s32" },
  { name = "list_wrapped", offset = 44, type = "u32" },
  { name = "visible_row", offset = 48, type = "u32" },
  { name = "previous_row", offset = 52, type = "u32" },
  { name = "first_row", offset = 56, type = "u32" },
  { name = "rows_shown", offset = 60, type = "u32" },
  { name = "player", offset = 64, type = "u32" },
]

