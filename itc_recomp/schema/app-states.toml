# The schema of docs/functions/app-states.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The app (its update, its handler maps, its message and request vectors),
# its +20 interface, its state stack (AppStates) and the stack's layers
# (StateLayer) with their lists, the states' interface, the delegates the
# handler requests copy (src/app_states/, src/hooks/app_states.cpp;
# docs/known-data.md "app", "app state stack", "state layer").
#
# Measure faults (tools/type_map.py), each kept as a field with a name of its
# own and a note: std::for_each's and the iterators' results (r3, a 16- or
# 8-byte temporary in the caller's frame) joined with the container they walk
# (App, MessageVector, OpList, PtrList); the app's +20 interface and +4
# interface joined with the app (App::IsRunning, App::Start, App::FrameDriver).

# The app (132 bytes, its constructor sub_82094590, App::Create).
[App]
measure = "App"
measures = ["AppStates.+4", "App::FrameDriver.r3"]
size = 132
origin = "allocated"
storage = "host"
host_alloc = [0x82094AD4]
vtable = 0x82000EA0
fields = [
  { name = "handlers_map", offset = 28, type = "embed", to = "HandlerMap", note = "the handler map run while the toggle is clear" },
  { name = "toggled_handlers_map", offset = 40, type = "embed", to = "HandlerMap", note = "the handler map run while the toggle is set" },
  { name = "always_handlers_map", offset = 52, type = "embed", to = "HandlerMap", note = "the handler map run every pass" },
  { name = "listeners_map", offset = 64, type = "embed", to = "HandlerMap", note = "the listener map" },
  { name = "messages_vector", offset = 76, type = "embed", to = "MessageVector", note = "the message vector" },
  { name = "requests_vector", offset = 96, type = "embed", to = "RequestVector", note = "the request vector" },
  { name = "vtable", offset = 0, type = "ptr", to = "AppVtable", note = "0x82000EA0" },
  { name = "fault_for_each_result_0", offset = 0, type = "u64", note = "measure fault: App::ForEachMessage's and ForEachRequest's r3 is the result functor, not the app" },
  { name = "vtable_4", offset = 4, type = "u32", note = "the +4 interface's: 0x82000E94 (base 0x82000ABC)" },
  { name = "vtable_8", offset = 8, type = "u32", note = "the +8 interface's: 0x82000E80 (base 0x82000A74)" },
  { name = "fault_for_each_result_8", offset = 8, type = "u64", note = "measure fault: as fault_for_each_result_0" },
  { name = "vtable_12", offset = 12, type = "u32", note = "the +12 interface's: 0x82000E70 (base 0x82000D48)" },
  { name = "vtable_16", offset = 16, type = "u32", note = "the +16 interface's: 0x82000E38 (base 0x82000DD0); the owner a layer keeps (StateLayer +8)" },
  { name = "interface_vtable", offset = 20, type = "ptr", to = "AppInterfaceVtable", note = "the +20 interface's: 0x82000E08 (base 0x82000DA0); the interface the framework keeps at +120 (AppInterface)" },
  { name = "framework_input", offset = 24, type = "ptr", to = "AppFrameworkIface", note = "the framework's +36 interface (its slot 1 the input manager); also App::FrameDriver's +20 read (r3 = app + 4)" },
  { name = "handlers", offset = 28, type = "u32", note = "a handler map (std::map of delegates by key), run while the toggle is clear or a step was asked: its first word, not read" },
  { name = "handlers_head", offset = 32, type = "ptr", to = "AppHandlerMapHead" },
  { name = "handlers_size", offset = 36, type = "u32" },
  { name = "toggled_handlers", offset = 40, type = "u32", note = "the handler map run while the toggle is set: its first word, not read" },
  { name = "toggled_handlers_head", offset = 44, type = "ptr", to = "AppHandlerMapHead" },
  { name = "toggled_handlers_size", offset = 48, type = "u32" },
  { name = "always_handlers", offset = 52, type = "u32", note = "the handler map run every pass: its first word, not read" },
  { name = "always_handlers_head", offset = 56, type = "ptr", to = "AppHandlerMapHead" },
  { name = "always_handlers_size", offset = 60, type = "u32" },
  { name = "listeners", offset = 64, type = "u32", note = "the listener map (given the messages): its first word, not read" },
  { name = "listeners_head", offset = 68, type = "ptr", to = "AppHandlerMapHead" },
  { name = "listeners_size", offset = 72, type = "u32" },
  { name = "messages", offset = 76, type = "u32", note = "the message vector (MessageVector) starts here: its first word, not read" },
  { name = "messages_first", offset = 80, type = "ptr", to = "AppMessageWord" },
  { name = "messages_last", offset = 84, type = "ptr", to = "AppMessageWord" },
  { name = "messages_end", offset = 88, type = "ptr", to = "AppMessageWord" },
  { name = "message", offset = 92, type = "u32", note = "the message being delivered (the listeners get its address)" },
  { name = "requests", offset = 96, type = "u32", note = "the request vector (12-byte requests {type, key, delegate}) starts here: its first word, not read by the app's code; the measure's +96 reads are the +20 interface's +96, the state stack (App::IsRunning, App::Start: a measure fault)" },
  { name = "requests_first", offset = 100, type = "u32" },
  { name = "requests_last", offset = 104, type = "u32" },
  { name = "requests_end", offset = 108, type = "u32" },
  { name = "toggled", offset = 112, type = "u8", note = "the toggle player 1's Start flips (message 0 when set, 2 when cleared)" },
  { name = "step", offset = 113, type = "u8", note = "a step asked (Back while toggled, message 1); cleared after the pass" },
  { name = "unknown_114", offset = 114, type = "u8", note = "0 at construction, not read" },
  { name = "states", offset = 116, type = "ptr", to = "AppStates", note = "the state stack (AppStates::Create)" },
  { name = "camera", offset = 120, type = "u32", note = "a second camera class (368 bytes, sub_820A8B88)" },
  { name = "sound_manager", offset = 124, type = "u32", note = "AudioManager::Create" },
  { name = "movie", offset = 128, type = "u32", note = "312 bytes, Movie::Movie" },
]

# The app's own vtable (0x82000EA0), as the state stack calls it.
[AppVtable]
measure = "AppStates.+4.+0"
size = 12
origin = "image"
fields = [
  { name = "destroy", offset = 0, type = "fn" },
  { name = "interface", offset = 4, type = "fn", note = "slot 1: the +20 interface (AppInterface)" },
  { name = "owner", offset = 8, type = "fn", note = "slot 2: the interface at app + 16, a layer's owner" },
]

# The app's +20 interface (vtable 0x82000E08), seen from its own address: what
# its slots and the state stack's listener get (AppStates::OnMessage's r4).
[AppInterface]
measure = "AppStates::OnMessage.r4"
size = 112
origin = "embedded"
storage = "dual"
fields = [
  { name = "messages_vector", offset = 56, type = "embed", to = "MessageVector", note = "the app's message vector" },
  { name = "requests_vector", offset = 76, type = "embed", to = "RequestVector", note = "the app's request vector" },
  { name = "vtable", offset = 0, type = "ptr", to = "AppInterfaceVtable" },
  { name = "messages", offset = 56, type = "u32", note = "the app's message vector (app + 76)" },
  { name = "requests", offset = 76, type = "u32", note = "the app's request vector (app + 96)" },
  { name = "states", offset = 96, type = "ptr", to = "AppStates", note = "the app's +116" },
]

[AppInterfaceVtable]
measure = "App.+20"
measures = ["AppStates::OnMessage.r4.+0", "App::FrameDriver.r3.+20"]
size = 48
origin = "image"
fields = [
  { name = "fault_framework_vtable", offset = 0, type = "u32", note = "measure fault: App::FrameDriver's read is the framework interface's vtable (r3 = app + 4, its +20 the app's +24)" },
  { name = "add_listener", offset = 4, type = "fn", note = "App::AddListener" },
  { name = "add_always_handler", offset = 8, type = "fn", note = "App::AddAlwaysHandler" },
  { name = "add_toggled_handler", offset = 12, type = "fn", note = "App::AddToggledHandler" },
  { name = "add_handler", offset = 16, type = "fn", note = "App::AddHandler" },
  { name = "remove_listener", offset = 20, type = "fn", note = "probably (AppStates::OnMessage's teardown, listener 9); never ran" },
  { name = "remove_always_handler", offset = 24, type = "fn", note = "probably; never ran" },
  { name = "remove_toggled_handler", offset = 28, type = "fn", note = "probably (key 2); never ran" },
  { name = "remove_handler", offset = 32, type = "fn", note = "probably (key 8); never ran" },
  { name = "start", offset = 36, type = "fn", note = "App::Start" },
  { name = "send_message", offset = 40, type = "fn", note = "App::SendMessage" },
  { name = "is_running", offset = 44, type = "fn", note = "App::IsRunning" },
]

