# A 240-byte point record (PointRecord, second-set.md): one part's point of
# a model, drawn by CarPart::Draw.
[CarPart]
measure = "CarPart"
size = 240
origin = "embedded"
fields = [
  { name = "node", offset = 0, type = "u32", note = "its node record ([+0] + 136: the skeleton's entries)" },
  { name = "model", offset = 4, type = "u32", note = "the part model (0 when not found)" },
  { name = "matrix", offset = 16, type = "bytes", count = 64 },
  { name = "inverse", offset = 80, type = "bytes", count = 64 },
  { name = "position_lo", offset = 144, type = "u64", note = "the glows' node position, two doublewords" },
  { name = "position_hi", offset = 152, type = "u64" },
  { name = "node_index", offset = 224, type = "u32" },
  { name = "shape", offset = 228, type = "u32", note = "the shape's index in the model" },
]

