# The schema of docs/functions/car-draw.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The car scene's per-pass draw of one scene model (src/car_draw/): the car
# scene [0x826C2E44] itself, the second set's point blocks the draws walk
# (the parts', the light kit's, the interior's dials and meters, the
# traffic body's), their records and the light kit's and interior's
# records. The measure meets the point blocks through each group's draw
# (r3 the group), so a point block type holds both the block's own words
# (from its finds and resets) and the words its groups hold at the same
# offsets from their own start (the 240-byte point records at +16 + 240k
# or +240k, and the words after a group's records). The scene model's
# 736-byte block every draw gets in r4 is CarDrawBlock below (the same
# object as second-set.toml's SceneModelBlock, to merge).

# The car scene (5,536 bytes, `CarScene::Create`, [0x826C2E44];
# docs/functions/scene.md's layout, docs/known-data.md's "scene pass
# description" and "car scene (the draw's reads)").
