# The schema of docs/functions/type8-screens.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 8 mode's panel, list and color list screens (src/type8_screens/;
# docs/known-data.md, "type 8 panel and list screens"), never seen in play:
# the panel screen with its panels inline (the panels' layouts are
# car-list.toml's TabPanel, RowPanel, CarPanel, ColorPanel and ConfirmPanel,
# each with the player in a word after them), the list screens over the
# list screens' layout (type67-screens.toml's ListScreen, NodeListScreen,
# ColorListScreen), their list parts and the parts' per-player blocks.
# Embedded objects are `bytes` fields (their address), with the words the
# code reaches through the outer object named beside them.
#
# Measure names left to other areas' types (the lead's to add there):
# - "Type8ListScreen.+9672" is screen-constructors.toml's ListNodeTable
#   (the PairedNodeTable at the list screen's +10360), and
#   "Type8ColorListScreen.+9672" its ListColorNodeTable (the
#   ColorNodeTable at +10432).
# - "Type8PanelScreen::UpdateOpening.r4", "Type8PanelScreen::Leave.r4",
#   "Type8PanelScreen::AskQuit.r4", "Type8ListScreen::SetUpRace.r4" and
#   "Type8ColorListScreen::SetUpRace.r4" are the mode's dispatcher,
#   boot-mode.toml's ModeDispatcher (+804 the ring count, +808 its start).

# The panel screen (the type 8 member's +42740, vtable 0x82010AF0; UI movie
# 4): the two players' car pick, over MachineScreen.
[Type8PanelScreen]
measure = "Type8PanelScreen"
size = 15252
origin = "embedded"
vtable = 0x82010AF0
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82010AF0" },
  { name = "machine", offset = 4, type = "bytes", count = 9616, note = "its StateMachine (game-modes.toml); the measure meets its transitions' words at +88 and +316" },
  { name = "state", offset = 9608, type = "u32", note = "the machine's state (9 back, 10 leave)" },
  { name = "car_list", offset = 9644, type = "ptr", to = "PanelSetPair", note = "the car list (+11272)" },
  { name = "holder", offset = 9648, type = "ptr", to = "SingleGroup", note = "the group holder (+15220)" },
  { name = "opens_itself", offset = 9652, type = "u32", note = "1: PanelScreen::WaitForMovie goes to state 3, Show skips the car list's restore" },
  { name = "draw_mode", offset = 9656, type = "u32", note = "0 the list, 1 the quit dialog, 2 leaving" },
  { name = "panel_f0", offset = 9660, type = "bytes", count = 148, note = "player 0's F panel (Type8TabPanel)" },
  { name = "panel_e0", offset = 9808, type = "bytes", count = 164, note = "player 0's E panel (Type8RowPanel)" },
