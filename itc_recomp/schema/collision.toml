measures = ["BoxShape::Place.r5.+0", "sub_822BE2C8.ret.+0", "sub_820911F8.ret.+0", "sub_820BC560.r5.+0", "CollisionShape::Place.r3.+8.+0", "CollisionShape.+0", "CollisionObject@+32.+0"]
