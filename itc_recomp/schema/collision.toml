# The schema of docs/functions/collision.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The collision world's narrow phase: the box shape and its vtable, the
# shape record a collision object carries at its +32, the pair query on
# CollisionPair::Solve's stack with its contact and four relative-placement
# blocks. Names from docs/known-data.md, the rows and src/collision/.
# Vectors are four floats (`_x` to `_w`); arrays (a box's 8 corners and 6
# faces, a block's 8 corners) name their first element, the others at a
# fixed stride (said in the note).

# The box shape (BoxShape, 496 bytes, vtable 0x82002B30, over the base class
# Shape, vtable 0x82002AA8: its first 116 bytes): the vehicle's +344 object
# (made from the car data's two corners by the vehicle's physics set-up),
# the template of a shape record, and its two placed copies (clones). The
# measure meets it as Shape (the base class's constructor and destructor),
# a collision object's +32 word (the record's template), the copy
# constructors' r3 and r4, BoxShape::Place's template (r5), the slot 8 and
# ~Shape (sub_820BA1D0, sub_820B9C30, lifted, not read), what sub_822BE2C8
# and sub_820911F8 return from a shape record (the current and previous
# copies), and sub_820BC560's r5 (not read; it calls LowerCorner and Radius).
[BoxShape]
measure = "BoxShape"
measures = ["Shape", "sub_820BAB48.r4", "sub_820BAB48.ret", "sub_820BB688.r3", "sub_820BB688.r4", "BoxShape::Place.r5", "sub_822BE2C8.ret", "sub_820911F8.ret", "sub_820BA1D0.r3", "sub_820B9C30.r3", "sub_820BC560.r5", "Part464::Restore.r4", "Part464::Save.r4", "Vehicle.+344", "WallQuery.+12.+0", "AiDriver.+160.+344", "CollisionShape::Place.r3.+8"]
# measures from VehicleBox (vehicle-accessors), merged at the integration
# measures from ReplayPlacedBox (replay-snapshots), merged at the integration
size = 496
origin = "allocated"
vtable = 0x82002B30
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82002B30 (a box); 0x82002AA8 (Shape's) once destroyed or before BoxShape::BoxShape sets it" },
  { name = "car_float_16", offset = 16, type = "f32", note = "set from the car data (Shape::Shape: 0.5)" },
  { name = "car_float_20", offset = 20, type = "f32", note = "set from the car data (Shape::Shape: 0.5)" },
  { name = "car_float_24", offset = 24, type = "f32", note = "set from the car data (Shape::Shape: [0x82002968])" },
  { name = "friction", offset = 28, type = "f32", note = "set from the car data, read by CollisionObject::Respond (Shape::Shape: [0x82002204])" },
  { name = "radius", offset = 32, type = "f32", note = "the bounding sphere's radius" },
  { name = "center_x", offset = 48, type = "f32", note = "the center (w 0.0 from Shape::Shape)" },
  { name = "center_y", offset = 52, type = "f32" },
  { name = "center_z", offset = 56, type = "f32" },
  { name = "center_w", offset = 60, type = "f32" },
  { name = "axis0_x", offset = 64, type = "f32", note = "the axes: three rows (+64, +80, +96), the identity until placed; a placed copy's are the matrix's rows" },
  { name = "axis0_y", offset = 68, type = "f32" },
  { name = "axis0_z", offset = 72, type = "f32" },
  { name = "axis0_w", offset = 76, type = "f32" },
  { name = "axis1_x", offset = 80, type = "f32" },
