# sub_822BE2C8's r3: an accessor shared between classes (14 callers: the
# shape record's current copy, the car's and others' words +8).
[WordAt8Object]
measure = "sub_822BE2C8.r3"
size = 12
origin = "embedded"
fields = [
  { name = "word_8", offset = 8, type = "u32", note = "the word sub_822BE2C8 returns (a shape record's current copy in collision)" },
]

