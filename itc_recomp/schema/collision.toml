  { name = "current", offset = 8, type = "ptr", to = "BoxShape", note = "the current one (swapped with the previous and placed by the body's matrix each tick)" },
  { name = "bounds_min_x", offset = 16, type = "f32", note = "the box around both copies' bounding spheres: the min" },
