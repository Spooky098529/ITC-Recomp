# The schema of docs/functions/texture-compression.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# XGraphics' surface compression (XGCompressSurface and D3DX's image
# blitter linked into the game; in play only the vinyl sheet's A8R8G8B8 to
# DXT5): the image codecs (one 128-byte object for the 30 plain formats,
# each with its own vtable; the DXT codec, 256 bytes, and the YUV one, 176,
# over the same first 128 bytes), the blit object and the image
# descriptions on XGCompressSurface's stack, the float4 rows and pixels the
# codecs and block encoders pass around, the DXT codec's block caches and
# the DXT blocks. Names from src/texture_compression/ (codecs.h's `codec`
# and `description` namespaces, blitter.h's `blit`), the rows and
# docs/known-data.md.

# A plain image codec (ImageCodec::ImageCodec sub_823EA800, made by
# ImageCodec::Create sub_823F6C60): the base and the 30 plain formats'
# classes (their vtables 0x8203B808 to 0x8203B9D8) are one object.
[ImageCodec]
measure = "ImageCodec"
measures = [
  "A16B16G16R16Codec",
  "A16B16G16R16FCodec",
  "A1R5G5B5Codec",
  "A2B10G10R10Codec",
  "A2R10G10B10Codec",
  "A2W10V10U10Codec",
  "A32B32G32R32FCodec",
  "A4R4G4B4Codec",
  "A8B8G8R8Codec",
  "A8Codec",
  "A8L8Codec",
  "A8R8G8B8Codec",
  "G16R16Codec",
  "G16R16FCodec",
  "G32R32FCodec",
  "L16Codec",
  "L6V5U5Codec",
  "L8Codec",
  "Q16W16V16U16Codec",
  "Q8W8V8U8Codec",
  "R16FCodec",
  "R32FCodec",
  "R5G6B5Codec",
  "V16U16Codec",
  "V8U8Codec",
  "X1R5G5B5Codec",
  "X4R4G4B4Codec",
  "X8B8G8R8Codec",
  "X8L8V8U8Codec",
  "X8R8G8B8Codec",
]
size = 128
origin = "allocated"
vtable = 0x8203B778
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "ImageCodecVtable", note = "the base 0x8203B778 (constructor, destructor), then the format's (0x8203B808-0x8203B9D8)" },
  { name = "format", offset = 4, type = "u32", note = "the description's, without bit 8 (tiled)" },
  { name = "kind", offset = 8, type = "u32", note = "the channels: 1 unsigned, 2 mixed signed, 3 signed, 4 float" },
  { name = "has_bits", offset = 12, type = "u32", note = "bits per pixel isn't 0 (not a block format)" },
  { name = "srgb", offset = 16, type = "u32", note = "sRGB (in for a decode, out for an encode)" },
  { name = "srgb_both", offset = 20, type = "u32", note = "both sides sRGB (ImageCodec::Prepare)" },
  { name = "color_key", offset = 24, type = "u32", note = "the color key (0: none)" },
  { name = "palette_set", offset = 28, type = "u32", note = "0 (ImageCodec::Create's LoadPalette test)" },
  { name = "data", offset = 32, type = "ptr", to = "ImageCodecData", note = "the data, at the box's corner for a plain format" },
  { name = "color_key_red", offset = 36, type = "f32", note = "the color key's channels times 1/255" },
  { name = "color_key_green", offset = 40, type = "f32" },
  { name = "color_key_blue", offset = 44, type = "f32" },
  { name = "color_key_alpha", offset = 48, type = "f32" },
  { name = "rounding", offset = 52, type = "u32", note = "the rounding table: 0x8263C768 (0.5s), or the dither's 0x8263C7E8" },
  { name = "palette", offset = 56, type = "u32", note = "operator new (ImageCodec::LoadPalette): 1,024 bytes" },
  { name = "box_left", offset = 60, type = "u32", note = "the box: left, top, right, bottom, front, back (0, 0, 0 at its corner for a plain format)" },
  { name = "box_top", offset = 64, type = "u32" },
  { name = "box_right", offset = 68, type = "u32" },
  { name = "box_bottom", offset = 72, type = "u32" },
  { name = "box_front", offset = 76, type = "u32" },
  { name = "box_back", offset = 80, type = "u32" },
  { name = "convert_from", offset = 84, type = "u32", note = "the other side's channel kind (ConvertRange; 0 none)" },
  { name = "row", offset = 88, type = "ptr", to = "TcFloat4", note = "a float4 row (operator new, ImageCodec::Prepare)" },
  { name = "error_row", offset = 92, type = "ptr", to = "TcFloat4", note = "the error diffusion's (width + 2) float4s (operator new), or 0" },
  { name = "row_pitch", offset = 96, type = "u32" },
  { name = "slice_pitch", offset = 100, type = "u32" },
  { name = "width", offset = 104, type = "u32", note = "the box's size" },
  { name = "height", offset = 108, type = "u32" },
  { name = "depth", offset = 112, type = "u32" },
  { name = "row_bytes", offset = 116, type = "u32", note = "width x bytes per pixel" },
  { name = "bytes_per_pixel", offset = 120, type = "u32" },
]

# The codecs' vtables (16 bytes each; docs/known-data.md).
[ImageCodecVtable]
measure = "ImageCodec.+0"
size = 16
origin = "image"
fields = [
  { name = "destroy", offset = 0, type = "fn", note = "the scalar deleting destructor (r4 the flags)" },
  { name = "decode_row", offset = 4, type = "fn", note = "a row to float4s: r4 the row, r5 the slice, r6 the float4s" },
  { name = "encode_row", offset = 8, type = "fn", note = "a row from float4s, as decode_row" },
  { name = "quantize_color_key", offset = 12, type = "fn", note = "the color key quantized to the format" },
]

# The image's data as the codecs read and write it (a pixel's bytes, by the
# format; the rows' accesses are indexed). Also the source's swapped copy
# (HeapAlloc, XGCompressSurface).
[ImageCodecData]
measure = "ImageCodec.+32"
measures = [
  "A16B16G16R16Codec.+32",
  "A1R5G5B5Codec.+32",
  "A2B10G10R10Codec.+32",
  "A2R10G10B10Codec.+32",
  "A2W10V10U10Codec.+32",
  "A4R4G4B4Codec.+32",
  "A8B8G8R8Codec.+32",
  "A8Codec.+32",
  "A8L8Codec.+32",
  "A8R8G8B8Codec.+32",
  "G16R16Codec.+32",
  "G32R32FCodec.+32",
  "L16Codec.+32",
  "L6V5U5Codec.+32",
  "L8Codec.+32",
  "Q16W16V16U16Codec.+32",
  "Q8W8V8U8Codec.+32",
  "R32FCodec.+32",
  "R5G6B5Codec.+32",
  "V16U16Codec.+32",
  "V8U8Codec.+32",
  "X1R5G5B5Codec.+32",
  "X4R4G4B4Codec.+32",
  "X8B8G8R8Codec.+32",
  "X8L8V8U8Codec.+32",
  "X8R8G8B8Codec.+32",
  "YuvCodec.+32",
  "new<?>@XGCompressSurface",
]
size = 4
origin = "file"
fields = [
  { name = "byte0", offset = 0, type = "u8" },
  { name = "half0", offset = 0, type = "u16" },
  { name = "byte1", offset = 1, type = "u8" },
  { name = "half1", offset = 2, type = "u16" },
]

# A float4: a pixel of the float4 rows the codecs decode to and encode from
