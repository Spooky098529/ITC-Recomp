# XGGetBlockDimensions' out words (the block's width and height; on
# XGCompressSurface's stack at its r1 + 276 and + 272).
[TcBlockDimension]
measures = ["XGGetBlockDimensions.r4", "XGGetBlockDimensions.r5"]
size = 4
origin = "stack"
fields = [
  { name = "value", offset = 0, type = "u32" },
]

# Blitter::LinearWeights' table (sub_8236A9C8, operator new; not read in
# detail): two taps an entry (probably a source index and its weight each).
[BlitLinearWeights]
measures = ["Blitter::LinearWeights.ret", "new<4294967295>@Blitter::LinearWeights"]
size = 16
origin = "allocated"
fields = [
  { name = "first_index", offset = 0, type = "u32", note = "probably" },
  { name = "first_weight", offset = 4, type = "f32", note = "probably" },
  { name = "second_index", offset = 8, type = "u32", note = "probably" },
  { name = "second_weight", offset = 12, type = "f32", note = "probably" },
]

# Blitter::TriangleWeights' list (sub_8236B418, operator new; not read in
# detail; freed by sub_8236B718).
[BlitTriangleWeights]
measures = ["Blitter::TriangleWeights.ret", "new<?>@Blitter::TriangleWeights"]
size = 24
origin = "allocated"
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "first_index", offset = 8, type = "u32", note = "probably a tap's source index" },
  { name = "first_weight", offset = 12, type = "f32", note = "probably its weight" },
  { name = "second_index", offset = 16, type = "u32", note = "probably" },
  { name = "second_weight", offset = 20, type = "f32", note = "probably" },
]

# A DXT color block (8 bytes: the two 5:6:5 ends and 16 two-bit indices;
# DxtColor::EncodeBlock's r3, DecodeBlock's r4). The measure's DxtColor
# also joins float4 pixels at the same pointer (the block encoders' r4):
# their words below, under the float names.
[DxtColorBlock]
measures = ["DxtColor", "DxtColor::DecodeBlock.r4"]
size = 16
origin = "file"
fields = [
  { name = "color0", offset = 0, type = "u16" },
  { name = "color1", offset = 2, type = "u16" },
  { name = "indices", offset = 4, type = "u32" },
  { name = "red", offset = 0, type = "f32", note = "a float4 pixel's (the measure's join)" },
  { name = "green", offset = 4, type = "f32" },
  { name = "blue", offset = 8, type = "f32" },
  { name = "alpha", offset = 12, type = "f32" },
]

# A DXT alpha block (8 bytes: two 8-bit ends and 16 three-bit indices;
# DXT4/5's first half and DXT5A; DxtAlpha::EncodeBlock's r3, DecodeBlock's
# r4). The measure's DxtAlpha also joins the 16 float4 pixels (144 bytes:
# their alphas at +12, pixel 8's at +140).
[DxtAlphaBlock]
measures = ["DxtAlpha", "DxtAlpha::DecodeBlock.r4"]
size = 144
origin = "file"
fields = [
  { name = "alpha0", offset = 0, type = "u8" },
  { name = "ends", offset = 0, type = "u16", note = "both ends" },
  { name = "alpha1", offset = 1, type = "u8" },
  { name = "index_bytes", offset = 2, type = "bytes", count = 6, note = "the 16 three-bit indices" },
  { name = "indices_2", offset = 2, type = "u16" },
  { name = "indices_4", offset = 4, type = "u16" },
  { name = "indices_6", offset = 6, type = "u16" },
  { name = "pixel0_red", offset = 0, type = "f32", note = "the pixels' (the measure's join)" },
  { name = "pixel0_alpha", offset = 12, type = "f32" },
  { name = "pixel8_alpha", offset = 140, type = "f32" },
]

# A DXT3A block (8 bytes: 16 four-bit alphas; Dxt3A::EncodeBlock's r3,
# DecodeBlock's r4). The measure's Dxt3A also joins the 16 float4 pixels.
[Dxt3ABlock]
measures = ["Dxt3A", "Dxt3A::DecodeBlock.r4"]
size = 144
origin = "file"
fields = [
  { name = "alphas_low", offset = 0, type = "u32", note = "pixels 0-7's four bits each (probably)" },
  { name = "alphas_high", offset = 4, type = "u32", note = "pixels 8-15's (probably)" },
  { name = "pixel0_alpha", offset = 12, type = "f32", note = "the pixels' (the measure's join)" },
  { name = "pixel8_alpha", offset = 140, type = "f32" },
]

