  "ImageCodec::AddDiffusionError.r4",
  "Dxt",
  "Dxt1::EncodeBlock.r4",
  "Dxt23::EncodeBlockPremultiplied.r4",
  "DxtAlpha::EncodeBlock.r4",
  "DxtColor::EncodeBlock.r4",
  "DxtColor::FitEndpoints.r4",
  "DxtColor::FitEndpoints.r5",
  "DxtAlpha::FitEndpoints.r4",
  "DxtAlpha::FitEndpoints.r5",
  "A16B16G16R16Codec.+92",
  "A1R5G5B5Codec.+92",
  "A2B10G10R10Codec.+92",
  "A2R10G10B10Codec.+92",
  "A2W10V10U10Codec.+92",
  "A4R4G4B4Codec.+92",
  "A8B8G8R8Codec.+92",
  "A8Codec.+92",
  "A8L8Codec.+92",
  "A8R8G8B8Codec.+92",
  "G16R16Codec.+92",
  "L16Codec.+92",
  "L6V5U5Codec.+92",
  "L8Codec.+92",
  "Q16W16V16U16Codec.+92",
  "Q8W8V8U8Codec.+92",
  "R5G6B5Codec.+92",
  "V16U16Codec.+92",
  "V8U8Codec.+92",
  "X1R5G5B5Codec.+92",
  "X4R4G4B4Codec.+92",
  "X8B8G8R8Codec.+92",
  "X8L8V8U8Codec.+92",
  "X8R8G8B8Codec.+92",
  "A8R8G8B8Codec::DecodeRow.r6",
  "X8R8G8B8Codec::DecodeRow.r6",
  "R5G6B5Codec::DecodeRow.r6",
  "X1R5G5B5Codec::DecodeRow.r6",
  "A1R5G5B5Codec::DecodeRow.r6",
  "A4R4G4B4Codec::DecodeRow.r6",
  "A2B10G10R10Codec::DecodeRow.r6",
  "A8B8G8R8Codec::DecodeRow.r6",
  "X8B8G8R8Codec::DecodeRow.r6",
  "G16R16Codec::DecodeRow.r6",
  "A2R10G10B10Codec::DecodeRow.r6",
  "A16B16G16R16Codec::DecodeRow.r6",
  "A8Codec::DecodeRow.r6",
  "X4R4G4B4Codec::DecodeRow.r6",
  "L8Codec::DecodeRow.r6",
  "A8L8Codec::DecodeRow.r6",
  "V8U8Codec::DecodeRow.r6",
  "L6V5U5Codec::DecodeRow.r6",
  "X8L8V8U8Codec::DecodeRow.r6",
  "Q8W8V8U8Codec::DecodeRow.r6",
  "V16U16Codec::DecodeRow.r6",
  "A2W10V10U10Codec::DecodeRow.r6",
