# The blit object (12 bytes, on XGCompressSurface's stack at its r1 + 144;
# Blitter::Blitter sub_82368D20, Init sub_8236C630, Release sub_82368D30).
[Blitter]
measures = ["Blitter", "Blitter::Init.ret"]
size = 12
origin = "stack"
fields = [
  { name = "frame_point_y", offset = -4, type = "u32", note = "not the blit object's: XGCompressSurface's word below it (the destination point's y when none is given), joined by the measure" },
  { name = "source", offset = 0, type = "ptr", to = "ImageCodec", note = "the source's codec" },
  { name = "destination", offset = 4, type = "ptr", to = "ImageCodec", note = "the destination's codec" },
  { name = "filter", offset = 8, type = "u32", note = "the D3DX filter flags: low 16 bits 1 none, 2 point, 3 linear, 4 triangle, 5 box; 0x80000 dither, 0x100000 diffusion, 0x200000 sRGB in, 0x400000 sRGB out; bits 16-18 the mirror flags" },
  { name = "filter_type", offset = 11, type = "u8", note = "the filter's low byte (its type)" },
]

# An image description (84 bytes, two on XGCompressSurface's stack at its
# r1 + 160 (the destination) and + 288 (the source)): what the codecs are
# made from.
[ImageDescription]
measures = ["Blitter::Init.r4", "Blitter::Init.r5"]
size = 84
origin = "stack"
fields = [
  { name = "data", offset = 0, type = "u32" },
  { name = "format", offset = 4, type = "u32", note = "the codec's format (0x18280086 A8R8G8B8, 0x1A200054 DXT4/5, ...)" },
  { name = "row_pitch", offset = 8, type = "u32" },
  { name = "slice_pitch", offset = 12, type = "u32" },
  { name = "extent_left", offset = 16, type = "u32", note = "the surface: 0, 0, width, height, 0, depth" },
  { name = "extent_top", offset = 20, type = "u32" },
  { name = "extent_right", offset = 24, type = "u32" },
  { name = "extent_bottom", offset = 28, type = "u32" },
