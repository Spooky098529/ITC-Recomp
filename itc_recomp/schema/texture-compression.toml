# An entry of the DXT codec's block caches (8 bytes; EncodeRow's +248,
# DecodeRow's +240).
[DxtBlockCacheEntry]
measures = ["new<4294967295>@DxtCodec::EncodeRow", "new<4294967295>@DxtCodec::DecodeRow"]
size = 8
origin = "allocated"
fields = [
  { name = "rows_in", offset = 0, type = "u32", note = "a bit for each of the block row's four rows in" },
  { name = "pixels", offset = 4, type = "ptr", to = "TcFloat4", note = "the block row's 16 float4s a block column (operator new)" },
]

