# The schema of docs/functions/stand-models.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The front end's car stand (docs/known-data.md "garage stage", "traffic
# body", "scene model record"; src/stand_models/): the garage stage, the
# first set's traffic body (the measure's "TrafficCar", which also files
# the stand's scene model and other pool objects ScenePools::GetB returns),
# the wheel GarageStage::SetWheel reads its colors from, and a car spec copy.
#
# Left to other files (the measure's names to add there, not described here):
# - "ScenePools::SetUpB.ret" (+4296 the draw word, +4880) is the new scene
#   model: scene-models.toml's SceneModel.
# - "new<68>@Type12Screen1::Create#2", "#3" and "#4" are front-end menus
#   (Menu's 68-byte layout, stored by the menu's set-up): menu-helpers.toml's
#   FrontEndMenu.
# - The stand's holder blocks (`[0x826D83E0]`'s +0 to +8, each a 4-byte page
#   holding the stage at +0) are filed under GarageStage at +0 by the measure.

# The garage stage (6,208 bytes, VirtualAlloc'd by StandSlot::Init,
# GarageStage::Init; docs/known-data.md "garage stage"). The measure also
# files its sub-objects' accesses at their own offsets (measure faults):
# GarageStage::ResetPose's r3 is stage + 32, GarageLights::Init and SetMode's
# and GarageStage::SetLights' r3 the lights at + 4512, and a holder block's
# +0 (the stage pointer) is filed at +0; the camera at + 112 is filed here at
# the stage's offsets (GarageStage::ApplyPreset, Draw), which is right.
[GarageStage]
measure = "GarageStage"
measures = ["GarageLights", "GarageStage.+0"]
size = 6208
origin = "allocated"
fields = [
  { name = "index", offset = 0, type = "u32", note = "the stage's index (0 to 2, GarageStage::Init). Measure fault: a holder block's +0, the stage pointer, is filed here" },
  { name = "pending_block", offset = 4, type = "u32", note = "-1 when nothing is pending (GarageStage::IsBusy), else the model block GarageStage::ReloadModel remakes the scene model for" },
  { name = "model_index", offset = 8, type = "u32", note = "the car's scene model's index in pool 7 of the car scene (-1 none)" },
  { name = "unknown_12", offset = 12, type = "f32", note = "0.0 from GarageStage::Init" },
  { name = "model_claimed", offset = 16, type = "u32", note = "set while it holds a claimed model (GarageStage::MakeModel sets 1; ReloadModel releases it first)" },
  { name = "joined_records", offset = 16, type = "bytes", count = 96, note = "measure fault: GarageLights::Init and SetMode's eleven 96-byte light records and SetLights' reads (r3 the lights, stage + 4512: its +16 to +111), and ResetPose's vectors (r3 stage + 32), filed at the stage's own offsets" },
  { name = "bonnet", offset = 32, type = "f32", note = "a value opened and closed by animation types 2 and 3 (probably the bonnet), copied to the scene model's +4928" },
  { name = "open_x", offset = 48, type = "f32", note = "+48 to +63 copied to the scene model's +4944 and +4960 (+52, +56 and +96 opened and closed by animation types 4 and 5, probably the doors)" },
  { name = "open_y", offset = 52, type = "f32" },
  { name = "open_z", offset = 56, type = "f32" },
  { name = "angle_x", offset = 80, type = "f32", note = "+80 to +95 the car's angles (from a preset's +48, GarageStage::ApplyPreset)" },
  { name = "yaw", offset = 84, type = "f32", note = "the car's yaw, turned 0.5 degrees a call (GarageStage::Draw)" },
  { name = "angle_z", offset = 88, type = "f32" },
  { name = "doors", offset = 96, type = "u32", note = "the doors' word (animation types 4 and 5; 0 from ResetPose)" },
  { name = "camera", offset = 112, type = "bytes", count = 4400, note = "the garage camera (docs/known-data.md \"garage camera\"; GarageCamera::Init, Update). Also covers the lights' records +304 to +399 and +1072 to +1087 the measure files at the stage's offsets (GarageLights::Init, SetLights)" },
  { name = "camera_set_up", offset = 112, type = "u32", note = "the camera's +0: 0 until the presets are loaded (GarageStage::Draw does nothing until then)" },
  { name = "camera_elevation", offset = 212, type = "f32", note = "the camera's +100 (a preset's +4)" },
  { name = "camera_zoom", offset = 220, type = "f32", note = "the camera's +108: 640 / tan(field of view)" },
  { name = "camera_orbit_angle", offset = 288, type = "f32", note = "the camera's +176" },
  { name = "camera_distance", offset = 292, type = "f32", note = "the camera's +180 (a preset's +8)" },
  { name = "camera_fov", offset = 336, type = "f32", note = "the camera's +224, degrees (a preset's +12)" },
  { name = "camera_preset_table", offset = 404, type = "u32", note = "the camera's +292: the presets' index table (0x82619428, 290 slots a car)" },
  { name = "camera_preset_count", offset = 4504, type = "u32", note = "the camera's +4392" },
  { name = "lights", offset = 4512, type = "bytes", count = 1088, note = "the lights (GarageLights::Init, SetMode, GarageStage::SetLights): +16 + 96i eleven records (+32 + 96i three lights, +304 + 96i four spots), +1072 the 16 bytes for 0x8265ED00" },
  { name = "animations", offset = 5600, type = "bytes", count = 448, note = "16 entries of 28 bytes (+0 the type, +4 the steps, +8 a word, +12 the value's address, +16 the scene model's index, +20 done, +24 a float)" },
  { name = "animation_count", offset = 6048, type = "u32" },
  { name = "reflection", offset = 6052, type = "u32", note = "the reflection drawn (two passes); 1 from Init" },
  { name = "draw_word", offset = 6056, type = "u32", note = "the scene model's draw word (its +4296)" },
  { name = "dark", offset = 6060, type = "u32", note = "the light kit switched off every frame (GarageStage::SetDark)" },
  { name = "unknown_6064", offset = 6064, type = "u32", note = "+6064 to +6084 0 from Init" },
  { name = "unknown_6068", offset = 6068, type = "u32" },
  { name = "unknown_6072", offset = 6072, type = "u32" },
  { name = "unknown_6076", offset = 6076, type = "u32" },
  { name = "unknown_6080", offset = 6080, type = "u32" },
  { name = "unknown_6084", offset = 6084, type = "u32" },
  { name = "waiting_preset", offset = 6088, type = "u32", note = "a camera preset waiting (-1 none)" },
  { name = "plates_shown", offset = 6092, type = "u32", note = "the number plates shown (1 from Init; GarageStage::SetPlates)" },
  { name = "front_axle_height", offset = 6096, type = "f32", note = "the car data's +1736 (GarageStage::FitCar)" },
  { name = "rear_axle_height", offset = 6100, type = "f32", note = "the car data's +1756" },
  { name = "front_wheel_height", offset = 6104, type = "f32", note = "the front axle record's +52" },
  { name = "rear_wheel_height", offset = 6108, type = "f32", note = "the rear axle record's +52" },
  { name = "front_camber", offset = 6112, type = "f32", note = "the front axle record's +208 (probably)" },
  { name = "rear_camber", offset = 6116, type = "f32" },
  { name = "front_toe", offset = 6120, type = "f32", note = "the front axle record's +212 (probably)" },
  { name = "rear_toe", offset = 6124, type = "f32" },
  { name = "front_camber_offset", offset = 6128, type = "f32", note = "sin(+208 x [0x82002948]) x +52" },
  { name = "rear_camber_offset", offset = 6132, type = "f32" },
  { name = "front_height", offset = 6136, type = "f32", note = "+6104 - +6096 (probably the front height)" },
  { name = "rear_height", offset = 6140, type = "f32", note = "+6108 - +6100" },
  { name = "mean_height", offset = 6144, type = "f32", note = "GarageStage::PoseCar" },
  { name = "pitch", offset = 6148, type = "f32", note = "GarageStage::PoseCar" },
  { name = "wheelbase", offset = 6152, type = "f32", note = "the car data's +4" },
  { name = "front_track", offset = 6156, type = "f32", note = "the car data's +8 (probably)" },
  { name = "rear_track", offset = 6160, type = "f32", note = "the car data's +12 (probably)" },
  { name = "front_axle_x", offset = 6176, type = "f32", note = "+6176 to +6188 the front axle record's +0 to +8 and 1.0 (GarageStage::FitCar, FitAxles)" },
  { name = "front_axle_y", offset = 6180, type = "f32" },
  { name = "front_axle_z", offset = 6184, type = "f32", note = "probably the front half track" },
  { name = "front_axle_w", offset = 6188, type = "f32" },
  { name = "rear_axle_x", offset = 6192, type = "f32", note = "+6192 to +6204 the rear axle record's +0 to +8 and 1.0" },
  { name = "rear_axle_y", offset = 6196, type = "f32" },
  { name = "rear_axle_z", offset = 6200, type = "f32", note = "probably the rear half track" },
  { name = "rear_axle_w", offset = 6204, type = "f32" },
  { name = "front_axle_xy", offset = 6176, type = "u64", note = "GarageStage::Init's doubleword copies" },
  { name = "front_axle_zw", offset = 6184, type = "u64" },
  { name = "rear_axle_xy", offset = 6192, type = "u64" },
  { name = "rear_axle_zw", offset = 6200, type = "u64" },
]

# The first set's traffic body (pool 6, 7,408 bytes, vtable 0x820050B4;
# TrafficCar::TrafficCar, Load; docs/known-data.md "traffic body"). The
# measure joins it with every pool object ScenePools::GetB returns: above
# all the stand's scene model (pool 7 of the second set, scene-models.toml's
# SceneModel: its +32 the 4,244-byte record, car-makers.toml's
# SceneModelRecord, so a `model_` field at +n is the record's +n - 32), and
# a few second set objects' words (the `joined_` fields). Where both use an
# offset, the field is named for the traffic body and the note gives the
# stand model's word.
[TrafficCar]
measure = "TrafficCar"
measures = ["SceneCockpit.+28", "SceneTraffic.+9768", "SceneModel.+5092.+9760"]
size = 16780
origin = "allocated"
vtable = 0x820050B4
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x820050B4 (0x82004F90 in the destructor's end)" },
  { name = "state", offset = 16, type = "u32", note = "the pool node's (0 when made)" },
  { name = "index", offset = 20, type = "u32", note = "-1 when made. Measure fault: also SceneCockpit, SceneTraffic and SceneWheels::Release's pool index" },
  { name = "joined_owner", offset = 24, type = "u32", note = "measure fault: the second set's pool objects' +24 (SceneCockpit, SceneParts, ScenePool4, SceneWheels::SetUp; SceneModel::ApplyRecord, Build)" },
  { name = "joined_cockpit_28", offset = 28, type = "u32", note = "measure fault: SceneCockpit::SetUp's store" },
  { name = "car_number", offset = 32, type = "u32", note = "the car record's +0: the traffic car's number, which picks its name at [0x82601980 + 4 x it]. Measure fault: also SceneCockpit::SetUp's store" },
  { name = "model_block", offset = 48, type = "u32", note = "measure fault: the stand's scene model's car record +0, the model block (GarageAnims, GarageStage::ApplyPreset, SetAeroSet)" },
  { name = "model_paint0_xy", offset = 64, type = "u64", note = "measure fault: the stand model's record +32 to +79, three 16-byte hue, saturation, value rows, copied as doublewords by GarageStage::SetColor0 to SetColor5" },
