# The wheel GarageStage::SetWheel reads (Params::GetWheel's 48-byte record,
# car-specs.toml's CarWheelRecord), joined by the measure with the car spec
# whose +8380 is the stock wheel in the same layout (the `stock_` fields).
# Its three colors: a hue halfword, a saturation and a value byte (/255).
[StandWheelSource]
measure = "Params::GetWheel.ret"
size = 8412
origin = "file"
fields = [
  { name = "color0_hue", offset = 8, type = "u16", note = "into the record's +80 (front) or +128 (rear) as floats" },
  { name = "color0_saturation", offset = 10, type = "u8" },
  { name = "color0_value", offset = 11, type = "u8" },
  { name = "f16", offset = 16, type = "f32", note = "into the record's +4060 (front) or +4076 (rear)" },
  { name = "color1_hue", offset = 20, type = "u16" },
  { name = "color1_saturation", offset = 22, type = "u8" },
  { name = "color1_value", offset = 23, type = "u8" },
  { name = "color2_hue", offset = 24, type = "u16" },
  { name = "color2_saturation", offset = 26, type = "u8" },
  { name = "color2_value", offset = 27, type = "u8" },
  { name = "f28", offset = 28, type = "f32", note = "into the record's +4056 (front) or +4072 (rear)" },
  { name = "stock_color0_hue", offset = 8388, type = "u16", note = "measure fault: the car spec's stock wheel (+8380), its +8 to +28" },
  { name = "stock_color0_saturation", offset = 8390, type = "u8" },
  { name = "stock_color0_value", offset = 8391, type = "u8" },
  { name = "stock_f16", offset = 8396, type = "f32" },
  { name = "stock_color1_hue", offset = 8400, type = "u16" },
  { name = "stock_color1_saturation", offset = 8402, type = "u8" },
  { name = "stock_color1_value", offset = 8403, type = "u8" },
  { name = "stock_color2_hue", offset = 8404, type = "u16" },
  { name = "stock_color2_saturation", offset = 8406, type = "u8" },
  { name = "stock_color2_value", offset = 8407, type = "u8" },
  { name = "stock_f28", offset = 8408, type = "f32" },
]

# A copy of a car's spec (8,448 bytes VirtualAlloc'd by sub_82274DA8, the Xbox
# Live mode's, not seen in play: Params::GetCarSpec's 8,432 bytes memcpy'd,
# then the car id), added to one of two lists by its byte +771 or freed.
[StandModelsSpecCopy]
measures = ["new<8448>@sub_82274DA8", "new<8448>@sub_82274DA8#2"]
size = 8448
origin = "allocated"
fields = [
  { name = "unknown_771", offset = 771, type = "u8", note = "the spec's byte +771: 0 or 1 picks the list, else the copy is freed" },
  { name = "car_id", offset = 8432, type = "u32" },
]

[globals]
scene = { address = 0x826C2E44, type = "ptr", to = "CarScene", note = "the car scene (the second set of scene pools)" }
stand_holder = { address = 0x826D83E0, type = "ptr", note = "the stand scene's holder (StandScene::Create): +0 to +8 three 4-byte blocks, each holding a garage stage at +0; +20 a stand model was made" }

# Embedded objects the measure split from their owners after its offset
# fix (2026-11-22): seeded from the measure, unknown_ until read.

# Split from GarageStage.
[GarageStageAt32]
measure = "GarageStage.+0@+32"
size = 60
origin = "embedded"
fields = [
  { name = "unknown_48", offset = 48, type = "f32" },
  { name = "unknown_52", offset = 52, type = "f32" },
  { name = "unknown_56", offset = 56, type = "f32" },
]

# Split from TrafficCar.
[TrafficCarAt160]
measure = "TrafficCar@+160"
size = 11456
origin = "embedded"
fields = [
  { name = "unknown_11452", offset = 11452, type = "u32" },
]
