# The schema of docs/functions/type5-mode.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 5 front-end mode (the parking area's mode; 852 bytes: the game
# mode's base, then its block of three machines at +848), the block (28,940
# bytes), the mode's 15-slot vtable Mode::Slot14Thunk calls through, and its
# dialog (a copy of the type 2 dialog's design): the machine at the block's
# +19280 and its data block (src/type5_mode/). The dialog's page object
# ([0x82814E3C], 28 bytes) is a PageObject and its menu ([0x82814E40], 68
# bytes) a FrontEndMenu (menu-helpers.toml's; the measure files them as
# "new<28>@Type5Dialog::OnEnter" and "new<68>@Type5Dialog::OnEnter"). The
# dispatcher its pages and Update get (r4, the mode's +36) is boot-mode.toml's
# ModeDispatcher (the measure's "Type5Dialog::Update.r4").

# The type 5 mode (ModeType5::ModeType5 sub_82106F08, game-modes.md;
# known-data.md: "type 5 mode block" for +848). The base (0 to 848) is the
# game mode's (boot-mode.toml's GameMode). The measure joins other things
# with it: the next-mode answer (the delegates' r3, boot-mode.toml's
# ModeAnswer) at +0, the mode seen from its +32 interface (r3 = the mode + 32
# in Interrupt and ForceExit: iface_* below, 32 bytes before the fields they
# are) and the block FindShown gets (fault_* at +9604 and +28920).
# Dual (E5 step 4): made in host memory by Mode::Create; the measure joins
# guest addresses with it (the delegates' answer on the stack, the block
# in AllLoaded and FindShown), which the view reads as guest memory. Its
# fields over the block and at -28 (ForceExit's +4 from the +32 interface:
# a negative offset no host struct holds) were left out.
[ModeType5]
# measures from LocationScreenMode (location-screen), merged at the integration
measures = [
  "ModeType5",
  "ModeType5::LeaveScreen.r4",
  "ModeType5::Leaving.r4",
  "ModeType5::NextMode.r4",
  "ModeType5::WaitForLoads.r4",
  "ModeType5::WaitForShown.r4",
  "FrontEndMode::NextMode.r4"]
size = 852
origin = "allocated"
storage = "dual"
host_alloc = [0x82107858]
vtable = 0x82006C24
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006C24 (Type5ModeVtable)" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (ModeAnswer; the delegates clear it), not the mode's" },
  { name = "delegate_ptr", offset = 4, type = "ptr", to = "ModeDelegate", note = "the delegate at +8, 0 when it wraps to 0 (also the answer's next type +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "the delegate (ModeDelegate): vtable 0x82010FA0" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the delegate's object: the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "a slot thunk: Mode::Slot8Thunk (WaitForLoads) after Init, Mode::NextModeThunk 0x82235C08 once loaded, Slot11Thunk to Slot14Thunk" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "the +32 interface's vtable 0x82006C18 (Interrupt, ForceExit, Resume)" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers, the block's three machines (+9640, +0, +19280)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (ModeMessage)" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "iface_block", offset = 816, type = "u32", note = "measure fault: block (+848) through the +32 interface (Interrupt, ForceExit)" },
  { name = "block", offset = 848, type = "ptr", to = "Type5ModeBlock", note = "VirtualAlloc(0, 28940, 0x1000, 4) by Init, freed by ModeType5::Release" },
]

# The block (VirtualAlloc'ed by ModeType5::Init; known-data.md: "type 5 mode
# block"): the three machines (each a StateMachine, game-modes.toml, with the
# words every front-end machine has after it; the dialog's is Type5Dialog),
# then the shown machine and the next mode's answer. location-screen.toml's
# LocationScreenModeBlock is this block as FrontEndMode::NextMode meets it.
# In host memory since E5 step 4 (2026-11-24): made by ModeType5::Init (the
# original's VirtualAlloc(28940) at 0x8222FDA4; Init has no lifted
# original), freed by ModeType5::Release's FreePages (its VirtualFree at
# 0x8222FBB4; the lifted original runs only for a block that isn't pages,
# never a handle); the mode's +848 holds its handle. As Type2ModeBlock, the
# three machines stay described by their areas' guest views (CarSettings,
# LocationScreenMachine, Type5Dialog, StateMachine and StateTransition):
# their accesses reach the block through its handle (memory::RawHandleLoad
# and Store, by this type's layout), so every view of a machine agrees
# whatever its type; the dispatcher (+36) and the transitions' functors
# hold interior handles (the block + 9640, + 0, + 19280). The measure's
# "new<28940>@ModeType5::Init" was location-screen.toml's LocationScreenPart
# (the same block), merged here.
[Type5ModeBlock]
# measures from LocationScreenModeBlock (location-screen), merged at the integration
measures = [
  "new<28940>@ModeType5::Init",
  "ModeType5.+816",
  "ModeType5::NextMode.r4.+848",
  "ModeType5::WaitForLoads.r4.+848",
  "ModeType5::Leaving.r4.+848",
  "FrontEndMode::NextMode.r4.+848"]
size = 28940
origin = "allocated"
storage = "host"
fields = [
  { name = "car_settings", offset = 0, type = "bytes", count = 9640, note = "the car settings' machine (car-settings.md, CarSettings::InitType5); id 3" },
  { name = "car_settings_state", offset = 9604, type = "u32", note = "the car settings' machine state" },
  { name = "car_settings_loaded", offset = 9608, type = "u32", note = "its movies loaded (AllLoaded)" },
  { name = "car_settings_reenter", offset = 9612, type = "u32", note = "open on its message: 1 from Init" },
  { name = "car_settings_delete_movie", offset = 9616, type = "u32", note = "0 from Init" },
  { name = "location_screen", offset = 9640, type = "bytes", count = 9640, note = "the parking area's machine (location-screen.md's LocationScreenMachine); id 21" },
  { name = "location_state", offset = 19244, type = "u32", note = "the parking area's machine state: 8 a leave asked, 10 leave (message 4), 11 a race set up, 13 today's result" },
  { name = "location_loaded", offset = 19248, type = "u32", note = "its movies loaded (AllLoaded)" },
  { name = "location_reenter", offset = 19252, type = "u32", note = "open on its message: 1 from Init" },
  { name = "location_delete_movie", offset = 19256, type = "u32", note = "0 from Init" },
  { name = "dialog", offset = 19280, type = "bytes", count = 9640, note = "the mode's dialog's machine (Type5Dialog); id 16" },
  { name = "dialog_state", offset = 28884, type = "u32", note = "the dialog's machine state (9 idle: Interrupt answers 1)" },
  { name = "dialog_loaded", offset = 28888, type = "u32", note = "its movies loaded (AllLoaded)" },
  { name = "dialog_reenter", offset = 28892, type = "u32", note = "open on its message: 1 from Init" },
  { name = "dialog_delete_movie", offset = 28896, type = "u32", note = "0 from Init" },
  { name = "shown", offset = 28920, type = "u32", note = "the shown machine's id (3, 16 or 21; FindShown; 21 at Init)" },
  { name = "first_shown", offset = 28924, type = "u32", note = "21 at Init (readers not looked for)" },
  { name = "answer", offset = 28928, type = "u64", note = "the next mode's 8-byte answer (ModeAnswer), written whole by NextMode and ForceExit" },
  { name = "answer_word0", offset = 28928, type = "u32", note = "the answer's first word: its changed byte and three bytes" },
  { name = "answer_next_type", offset = 28932, type = "u32", note = "the answer's next mode type (1 the race, 9 today's result, 4 the title, 12)" },
]

# The dialog's machine (the block's +19280; Type5Dialog::Init): a state
# machine (game-modes.toml's StateMachine) and the words every front-end
# machine has after it. The measure joins two other things with it: the
# started word the steps get (r3, the page object's +24: fault_step_started
# at +0) and the dispatcher the pages get (r3, ModeDispatcher: fault_ring_*
# at +804 and +808).
[Type5Dialog]
measure = "Type5Dialog"
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's)" },
  { name = "fault_step_started", offset = 0, type = "u32", note = "measure fault: the steps' r3, the page object's step_started (+24), not the machine's" },
  { name = "fault_ring_count", offset = 804, type = "u32", note = "measure fault: the pages' r3 is the dispatcher (ModeDispatcher's ring_count), not the machine" },
  { name = "fault_ring_start", offset = 808, type = "u32", note = "measure fault: the dispatcher's ring_start, as above" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "0 enter, 1 load the movies, 2 wait for them, 4 a dialog opening, 9 idle" },
  { name = "loaded", offset = 9608, type = "u32", note = "movies 16 to 19 loaded (WaitForMovies)" },
  { name = "reenter", offset = 9612, type = "u32", note = "open on its message: 1 from ModeType5::Init (OnEnter goes to 1, else 9)" },
  { name = "delete_movie", offset = 9616, type = "u32", note = "0 from ModeType5::Init" },
]

# The dialog's data block (68 bytes, VirtualAlloc by Type5Dialog::OnEnter,
# freed by OnLeft; [0x82814E44]).
[Type5DialogData]
measure = "new<68>@Type5Dialog::OnEnter#2"
size = 68
origin = "allocated"
# In host memory since E5 step 3 (2026-11-22): made by Type5Dialog::OnEnter
# (the original's VirtualAlloc(68) at 0x8222593C), freed by OnLeft (its
# VirtualFree at 0x822257F8); the global at 0x82814E44 holds its handle.
storage = "host"
fields = [
  { name = "movies_loaded", offset = 0, type = "u32", note = "1 once movies 16 to 19 are loaded" },
  { name = "queued_state", offset = 4, type = "u32", note = "the machine's state queued by the close steps (9); 21 none" },
  { name = "movie_shown", offset = 8, type = "u32", note = "the movie shown, 16 to 19" },
  { name = "interrupted", offset = 12, type = "u32", note = "set by message 18 (OnInterrupt); the pages close with message 20" },
]

# The object Mode::Slot14Thunk is given (r4: the type 5 mode, the only one
# with a slot 14): its vtable.
[Type5SlotObject]
measure = "Mode::Slot14Thunk.r4"
size = 4
origin = "embedded"
storage = "dual"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "Type5ModeVtable", note = "0x82006C24" },
]

# The type 5 mode's vtable (0x82006C24, 15 slots; read from default.xex).
[Type5ModeVtable]
measure = "Mode::Slot14Thunk.r4.+0"
size = 60
origin = "image"
fields = [
  { name = "init", offset = 0, type = "fn", note = "slot 0: ModeType5::Init" },
  { name = "release", offset = 4, type = "fn", note = "slot 1: ModeType5::Release" },
  { name = "slot2", offset = 8, type = "fn", note = "slots 2 to 5: Mode::NoNextMode" },
  { name = "slot3", offset = 12, type = "fn" },
  { name = "slot4", offset = 16, type = "fn" },
  { name = "slot5", offset = 20, type = "fn" },
  { name = "next_mode", offset = 24, type = "fn", note = "slot 6: ModeType5::NextMode" },
  { name = "deleting_destructor", offset = 28, type = "fn", note = "slot 7: Mode::DeletingDestructor" },
  { name = "wait_for_loads", offset = 32, type = "fn", note = "slot 8: ModeType5::WaitForLoads (Mode::Slot8Thunk)" },
  { name = "slot9", offset = 36, type = "fn", note = "slots 9 and 10: Mode::NoNextMode" },
  { name = "slot10", offset = 40, type = "fn" },
  { name = "wait_for_shown", offset = 44, type = "fn", note = "slot 11: ModeType5::WaitForShown (Mode::Slot11Thunk)" },
  { name = "leave_screen", offset = 48, type = "fn", note = "slot 12: ModeType5::LeaveScreen (Mode::Slot12Thunk)" },
  { name = "next_mode_answer", offset = 52, type = "fn", note = "slot 13: FrontEndMode::NextMode sub_8222FCA0 (Mode::Slot13Thunk)" },
  { name = "leaving", offset = 56, type = "fn", note = "slot 14: ModeType5::Leaving (Mode::Slot14Thunk)" },
]

[globals]
pages = { address = 0x82814E3C, type = "ptr", to = "PageObject", note = "the dialog's page object (pages 0 to 3, steps 0 to 9)" }
menu = { address = 0x82814E40, type = "ptr", to = "FrontEndMenu", note = "the dialog's menu, items 0 (yes) to 1 (no)" }
data = { address = 0x82814E44, type = "ptr", to = "Type5DialogData" }
location_screen = { address = 0x82814E50, type = "ptr", to = "LocationScreen", note = "the parking area's screen (location-screen.toml's): Resume sets its restart (+900)" }
leaving_flag = { address = 0x826364EC, type = "u32", note = "how the title is entered: 1 from ForceExit (reasons 0 and 1)" }
string_table = { address = 0x826C5C34, type = "u32", note = "the string table Strings::Load gets" }
fade_in_passes = { address = 0x82001BEC, type = "u32", note = "the passes word ScreenFades::FadeIn is given" }
