  { name = "x_bits", offset = 0, type = "u32" },
  { name = "y", offset = 4, type = "f32" },
  { name = "y_bits", offset = 4, type = "u32" },
  { name = "z", offset = 8, type = "f32" },
  { name = "z_bits", offset = 8, type = "u32" },
