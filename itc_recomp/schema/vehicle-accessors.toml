# The schema of docs/functions/vehicle-accessors.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The vehicle accessors' objects: the collision object (the vehicle's +340)
# and the contacts on it, the stage list and its 80-byte stages, the racer
# records, the linked lists of the scene's pools, the vector library's
# 16-byte vectors and its matrices, and small records handed by pointer.
# The vehicle and its rigid body are car-physics.toml's (Vehicle,
# RigidBody), the collision world car-physics.toml's CollisionWorld, the
# scene's pools scene-loaders.toml's ScenePools and car-draw.toml's
# CarScene, the race data race-states.toml's RaceData.
#
# Types that are another area's type met under another measure name (for
# the Integrate phase to join; their field names follow that type's):
# CollisionObject = car-physics.toml's CollisionWorldObject (this one is
# the owner's); CollisionObjectContact = car-physics.toml's
# CollisionContact; VehicleBox = collision.toml's BoxShape;
# AccessorRacerRecord = race-setup.toml's Car (its racer record fields);
# AccessorStageRoute = race-states.toml's StageRoute; AccessorCarDecal =
# race-setup.toml's CarDecal; AccessorRigidBody = car-physics.toml's
# RigidBody; VectorLibMatrix = matrix-math.toml's Matrix.

# A collision object: the vehicle's +340; 320 bytes, vtable 0x82002A94, 50
# of them in the collision world's +16 (known-data.md). Also the world's
# list links (+228, +232) and the list head's object as the measure meets
# them.
[CollisionObject]
measure = "CollisionObject"
measures = ["sub_820B7CB8.r3", "sub_820B7CC0.r3", "CollisionObject::CollisionObject.r3"]
size = 320
origin = "embedded"
vtable = 0x82002A94
# 24 functions; areas: car-physics.md, replay-snapshots.md, vehicle-accessors.md
fields = [
  { name = "array_count", offset = -16, type = "u32", note = "the objects' block count header (the first object's -16)" },
  { name = "vtable", offset = 0, type = "u32", note = "0x82002A94" },
  { name = "unknown_4", offset = 4, type = "f32" },
  { name = "body", offset = 16, type = "ptr", to = "RigidBody", note = "its rigid body" },
  { name = "shape", offset = 20, type = "ptr", to = "BoxShape", note = "its shape (the vehicle's +344 box)" },
  { name = "shape_template", offset = 32, type = "ptr", to = "BoxShape", note = "the embedded shape record's (+32 to +144) template shape" },
  { name = "shape_previous", offset = 36, type = "u32", note = "the shape record's previous placed copy" },
  { name = "shape_current", offset = 40, type = "u32", note = "the shape record's current placed copy (goes to the second query)" },
  { name = "unknown_56", offset = 56, type = "u32", note = "the shape record's +24" },
  { name = "lowest_travel", offset = 144, type = "f32", note = "minus the lowest wheel travel (the shape record's +112)" },
  { name = "push_x", offset = 160, type = "f32", note = "the largest push per axis this tick" },
  { name = "push_y", offset = 164, type = "f32" },
  { name = "push_z", offset = 168, type = "f32" },
  { name = "push_w", offset = 172, type = "f32" },
  { name = "pair_torque_x", offset = 176, type = "f32", note = "the summed torque from pairs this tick" },
  { name = "pair_torque_y", offset = 180, type = "f32" },
  { name = "pair_torque_z", offset = 184, type = "f32" },
  { name = "pair_torque_w", offset = 188, type = "f32" },
  { name = "push_count", offset = 192, type = "u32", note = "how many pushes" },
  { name = "push_scale_x", offset = 208, type = "f32", note = "a per-axis scale of the push-out (1, 1, 1 from CollisionObject::Init); sub_820B7D68 sets it" },
  { name = "push_scale_y", offset = 212, type = "f32" },
  { name = "push_scale_z", offset = 216, type = "f32" },
  { name = "push_scale_w", offset = 220, type = "f32" },
  { name = "torque_scale", offset = 224, type = "f32", note = "sub_820B7D70 sets it" },
  { name = "next", offset = 228, type = "ptr", to = "CollisionObject", note = "the next in the world's active or free list" },
  { name = "previous", offset = 232, type = "ptr", to = "CollisionObject" },
  { name = "unknown_236", offset = 236, type = "u32" },
  { name = "first_contact", offset = 240, type = "ptr", to = "CollisionContact", note = "its contacts, linked by their +68" },
  { name = "groups", offset = 244, type = "u32", note = "its own groups (CollisionObject::AddGroups, RemoveGroups)" },
  { name = "collides_with", offset = 248, type = "u32", note = "the groups it collides with" },
  { name = "mask", offset = 252, type = "u32", note = "a bit mask (sub_820B7D18 clears bits)" },
  { name = "response_bits", offset = 256, type = "u32", note = "the surface bits that get a response (sub_820B7D28 sets, sub_820B7D38 clears)" },
  { name = "push_out_bits", offset = 260, type = "u32", note = "the surface bits that push it out (sub_820B7D48 sets, sub_820B7D58 clears)" },
  { name = "first_pair", offset = 264, type = "ptr", to = "CollisionPair", note = "the head of its pair list (sub_820B7CB8, sub_820B7CC0)" },
  { name = "owner_id", offset = 268, type = "u32", note = "objects with the same nonzero id don't pair" },
  { name = "no_queries", offset = 272, type = "u32", note = "set: no queries" },
  { name = "unknown_276", offset = 276, type = "u32" },
  { name = "box_friction", offset = 280, type = "u32", note = "set: friction from the +344 object alone" },
  { name = "unmoved", offset = 284, type = "u32", note = "0 after a move" },
  { name = "moved", offset = 288, type = "u32", note = "set when moved (sub_820B7998)" },
  { name = "push_out_x", offset = 304, type = "f32", note = "this pass's push-out" },
  { name = "push_out_y", offset = 308, type = "f32" },
  { name = "push_out_z", offset = 312, type = "f32" },
  { name = "push_out_w", offset = 316, type = "f32" },
]

# CollisionObjectContact: merged into car-physics.toml's CollisionContact at the integration (the same object).

# Two of the collision world's 80-byte hit records (the hits array as the
# measure meets it; car-physics.toml's CollisionHit is one record), and
# CollisionRecord::Copy's (sub_820B7D78) out: a hit record's first 68 bytes.
[CollisionHitRecords]
measure = "CollisionRecords"
measures = ["sub_820B7D78.r3"]
size = 160
origin = "embedded"
# 2 functions; areas: car-physics.md, vehicle-accessors.md
fields = [
  { name = "point", offset = 0, type = "bytes", count = 16 },
  { name = "normal", offset = 16, type = "bytes", count = 16, note = "probably the surface normal" },
  { name = "push", offset = 32, type = "bytes", count = 16, note = "the push direction" },
  { name = "depth", offset = 48, type = "f32" },
  { name = "depth_bits", offset = 48, type = "u32", note = "copied as a word (sub_820B7D78)" },
  { name = "depth_2", offset = 52, type = "f32", note = "the depth again (walls)" },
  { name = "depth_2_bits", offset = 52, type = "u32" },
  { name = "surface_bits", offset = 56, type = "u32" },
  { name = "key", offset = 60, type = "u32", note = "hits with the same key are merged" },
  { name = "time", offset = 64, type = "f32" },
  { name = "time_bits", offset = 64, type = "u32" },
  { name = "hit1_depth", offset = 128, type = "f32", note = "the second record's +48" },
  { name = "hit1_key", offset = 140, type = "u32", note = "the second record's +60" },
]

# The stage list: the race data's +0x59620 (known-data.md), 1,224 bytes:
# ten 80-byte stages (RaceStage) from +0, then the count and the current.
[Stages]
measure = "[826C5B2C]@+366112"
size = 1224
origin = "embedded"
# 9 functions; areas: race-setup.md, vehicle-accessors.md
fields = [
  { name = "stage0_type", offset = 0, type = "u32", note = "stage 0's +0 (the stages: RaceStage at + 80 x i)" },
  { name = "stage0_word_4", offset = 4, type = "u32" },
  { name = "stage0_word_8", offset = 8, type = "u32" },
  { name = "stage0_racer0", offset = 44, type = "u32" },
  { name = "stage0_racer0_word", offset = 48, type = "u32" },
  { name = "stage0_slot_count", offset = 76, type = "u32" },
  { name = "count", offset = 800, type = "u32", note = "the stage count" },
  { name = "current", offset = 804, type = "u32", note = "the current stage (-1 in the accessors means it)" },
  { name = "word_808", offset = 808, type = "u32", note = "sub_820FFAB0 sets it, sub_820FFC68 reads it" },
  { name = "course_record", offset = 812, type = "bytes", count = 408, note = "a course record (race-states.toml's)" },
  { name = "kept_word", offset = 1220, type = "u32", note = "a word Stages::Clear keeps" },
]

# One stage of the stage list (80 bytes at the list + 80 x i).
[RaceStage]
size = 80
origin = "embedded"
fields = [
  { name = "type", offset = 0, type = "u32", note = "2 and 3 answer sub_820FFC30; 4 is never added (the reset's)" },
  { name = "word_4", offset = 4, type = "u32" },
  { name = "word_8", offset = 8, type = "u32" },
  { name = "route", offset = 24, type = "bytes", count = 16, note = "its route (a StageRoute, Stages::SetRoute)" },
  { name = "racer0", offset = 44, type = "u32", note = "slot i's racer index at +44 + 8 x i (-1 ends them)" },
  { name = "racer0_word", offset = 48, type = "u32", note = "slot i's word at +48 + 8 x i" },
  { name = "slot_count", offset = 76, type = "u32", note = "its slot count (Stages::AddRacer)" },
]

# AccessorStageRoute: merged into race-states.toml's StageRoute at the integration (the same object).

# An array of 3,936-byte racer records with the count at +0x49FE0 (room for
# 77: the race data's results records at +0x59AE8; RacerRecords::Add, At).
[RacerRecordArray]
measure = "RacerRecords::At.r3"
measures = ["[826C5B2C]@+367336"]
size = 303076
origin = "embedded"
fields = [
  { name = "count", offset = 303072, type = "u32" },
]

# A linked list (List::Init, List::At: the scene's pools, 12 bytes there:
# ScenePools' +56 + 12 x pool). +12 and +16 are other lists' (the
# measure's: the archive's, the app states'), not the pools'.
[AccessorList]
measure = "List"
measures = ["List::Clear_820ACF88.r3", "List::At.r3"]
size = 20
origin = "file"
# 6 functions; areas: app-states.md, archive.md, scene.md, vehicle-accessors.md
fields = [
  { name = "first", offset = 0, type = "ptr", to = "AccessorListNode", note = "the first node" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "count", offset = 8, type = "u32" },
  { name = "unknown_12", offset = 12, type = "u32", note = "another list kind's (the measure's)" },
  { name = "unknown_16", offset = 16, type = "u32", note = "another list kind's (the measure's)" },
]

# A list node: an object of a scene pool (List::At's answer), linked by +8.
# The fields past +32 are other node types' (a measure fault: List::At
# serves every pool's objects).
[AccessorListNode]
measure = "List::At.ret"
measures = ["List.+0", "List::At.r3.+0"]
size = 5076
origin = "file"
# 14 functions; areas: car-scene-draw.md, course-scenery.md, scene-loaders.md, scene-models.md, scene.md, second-set.md, vehicle-accessors.md
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "next", offset = 8, type = "ptr", to = "AccessorListNode" },
  { name = "state", offset = 16, type = "u32", note = "0 free, 3 in use (ScenePools::Claim, Get)" },
  { name = "unknown_24", offset = 24, type = "u32" },
  { name = "kind", offset = 32, type = "u32", note = "the second set's pool 7's model kind (ScenePools::FindModel)" },
  { name = "fault_4296", offset = 4296, type = "u32", note = "a measure fault (another node type's)" },
  { name = "fault_5040", offset = 5040, type = "u32", note = "a measure fault (another node type's)" },
  { name = "fault_5048", offset = 5048, type = "u32", note = "a measure fault (another node type's)" },
  { name = "fault_5068", offset = 5068, type = "u32", note = "a measure fault (another node type's)" },
  { name = "fault_5072", offset = 5072, type = "u32", note = "a measure fault (another node type's)" },
]

