# The schema of docs/functions/files-and-saves.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# B4's objects (files and saves): the file class (File, the base of
# file-layer.toml's GameFile), the save slots (src/saves/), the movie
# player's file source (src/hooks/movie_files.cpp), the game's container
# files (src/game_data/data_file.cpp), and the words the Win32-style file
# calls take by pointer. The overlappeds the save slots and file calls use
# are other areas' types (c-runtime-core.toml's CrtOverlapped, the Win32
# OVERLAPPED; achievements.toml's AchievementOverlapped, the XOVERLAPPED):
# the slot holds them as bytes fields.

# The file class (16 bytes, vtable 0x8206C05C; the base stream's 0x8206BFF8):
# File::OpenRead, Read, Seek, Close and the rest (src/hooks/file_class.cpp).
# The same object as file-layer.toml's GameFile, its derived class.
# sub_82593B10 opens one (CreateFile, GetFileSize), and the audio engine's
# start-up (sub_8259D1F0) reads one through its vtable.
[File]
measures = ["File", "sub_82593B10.r3", "sub_8259D1F0.r4"]
size = 16
origin = "file"
vtable = 0x8206C05C
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "FileVtable", note = "0x8206C05C; the base stream's 0x8206BFF8 (the destructors)" },
  { name = "handle", offset = 4, type = "u32", note = "-1 when closed" },
  { name = "position", offset = 8, type = "u32", note = "moved by Read and Seek" },
  { name = "size", offset = 12, type = "u32", note = "GetFileSize's answer at the open (File::GetSize returns it)" },
]

# The file class's vtable, as the audio engine's start-up (sub_8259D1F0)
# calls it.
[FileVtable]
measure = "sub_8259D1F0.r4.+0"
size = 24
origin = "image"
fields = [
  { name = "read", offset = 8, type = "fn", note = "File::Read (sub_8258C820)" },
  { name = "get_size", offset = 20, type = "fn", note = "File::GetSize (sub_822B80D8), probably" },
]

# File::Read's and File::Write's r5: the size, passed by pointer.
[FileSizeArg]
measures = ["File::Read.r5", "File::Write.r5"]
size = 4
origin = "embedded"
fields = [
  { name = "size", offset = 0, type = "u32" },
]

# File::Seek's r4: the offset, passed by pointer.
[FileSeekOffsetArg]
measure = "File::Seek.r4"
size = 4
origin = "embedded"
fields = [
  { name = "offset", offset = 0, type = "s32" },
]

# File::Seek's r5: the method (0 the start, 1 the current position, 2 the
# end), passed by pointer.
[FileSeekMethodArg]
measure = "File::Seek.r5"
size = 4
origin = "embedded"
fields = [
  { name = "method", offset = 0, type = "u32" },
]

# sub_82593B10's r5: a byte choosing CreateFile's disposition.
[FileOpenFlag]
measure = "sub_82593B10.r5"
size = 1
origin = "embedded"
fields = [
  { name = "must_exist", offset = 0, type = "u8", note = "nonzero: open existing (3); 0: open always (4)" },
]

# GetOverlappedResult's r5: the bytes moved (out).
[OverlappedBytesOut]
measure = "GetOverlappedResult.r5"
size = 4
origin = "embedded"
fields = [
  { name = "bytes", offset = 0, type = "u32" },
]

# GetFileSize's r4: the size's high word (out).
[FileSizeHighOut]
measure = "GetFileSize.r4"
size = 4
origin = "embedded"
fields = [
  { name = "high", offset = 0, type = "u32" },
]

# SetFilePointer's r5: the position's high word (in and out, optional).
[FilePointerHigh]
measure = "SetFilePointer.r5"
size = 4
origin = "embedded"
fields = [
  { name = "high", offset = 0, type = "u32" },
]

# InitNamedObjectAttributes' r3: an OBJECT_ATTRIBUTES (12 bytes).
[KernelObjectAttributes]
measure = "InitNamedObjectAttributes.r3"
size = 12
origin = "embedded"
fields = [
  { name = "root_directory", offset = 0, type = "u32", note = "-4 for the named objects' root" },
  { name = "name", offset = 4, type = "u32", note = "an ANSI_STRING" },
  { name = "attributes", offset = 8, type = "u32" },
]

# _write_nolock's r4: the buffer written (read a byte at a time).
[WriteNolockBuffer]
measure = "_write_nolock.r4"
size = 1
origin = "embedded"
fields = [
  { name = "first_byte", offset = 0, type = "u8" },
]

# A compressed archive asset (Ucl::Unpack's r4): UCL's header, then blocks
# (an unpacked size, a stored size, the data), ended by a size of 0.
[UclStream]
measure = "Ucl::Unpack.r4"
size = 22
origin = "embedded"
fields = [
  { name = "first_block_size", offset = 18, type = "u32", note = "the first block's unpacked size (0: no blocks); its stored size follows at +22" },
]

# A compressed block (Ucl::UnpackBlock's r3): NRV2B's bit stream, read a
# byte at a time.
[UclBlockSource]
measure = "Ucl"
size = 30
origin = "embedded"
fields = [
  { name = "bytes", offset = 0, type = "bytes", count = 30, note = "the stream's bytes (the measure saw +1 to +29)" },
]

# Ucl::UnpackBlock's r6: the unpacked length (out).
[UclLengthOut]
measure = "Ucl::UnpackBlock.r6"
size = 4
origin = "embedded"
fields = [
  { name = "length", offset = 0, type = "u32" },
]

# A container file (DataFile::GetEntry, src/game_data/data_file.cpp):
# little-endian words, a count then the entries' offsets from the container.
[DataFile]
measure = "DataFile"
size = 8
origin = "file"
fields = [
  { name = "count", offset = 0, type = "u32", note = "little-endian (byte-swapped by the reader)" },
  { name = "count_byte0", offset = 0, type = "u8", note = "the count's first byte, loaded on its own by the original's byte swap" },
  { name = "offsets", offset = 4, type = "u32", note = "the first of `count` little-endian offsets (entry i at +4 + 4i)" },
]

# The movie player's file data source (the XDK media library's, vtable
# 0x8204DD50; src/hooks/movie_files.cpp).
[MovieSource]
measure = "MovieSource"
size = 136
origin = "allocated"
vtable = 0x8204DD50
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "handle", offset = 44, type = "u32", note = "-1 when closed" },
  { name = "at_end", offset = 48, type = "u32", note = "1 at the end or after a short read (AtEnd returns it)" },
  { name = "start", offset = 56, type = "u64", note = "where the data starts in the file" },
  { name = "size", offset = 64, type = "u64" },
  { name = "window", offset = 72, type = "u32", note = "the read-ahead window (Prime, Cancel), probably" },
  { name = "unknown_80", offset = 80, type = "u32", note = "cleared by Cancel" },
  { name = "position", offset = 88, type = "u64" },
  { name = "block_size", offset = 104, type = "u32" },
  { name = "block_count", offset = 108, type = "u32" },
  { name = "unknown_112", offset = 112, type = "u32", note = "cleared by Cancel" },
  { name = "blocks_ahead", offset = 116, type = "u32", note = "1 for 0" },
  { name = "flags", offset = 120, type = "u32", note = "1 a path, 2 a wide path, 4 the caller's handle (not closed by Close), 8 looping" },
  { name = "blocks_memory", offset = 124, type = "u32", note = "the blocks' memory when allocated by the set-up" },
  { name = "unknown_128", offset = 128, type = "u32", note = "cleared by Cancel" },
  { name = "block_list", offset = 132, type = "u32" },
]

# The save content's description (XCONTENT_DATA, 308 bytes): in the save
# slot at +164, and one per enumerated save in the slot's buffer (+80). No
# measure: reached through the slot's bytes and the buffer's index.
[XContentData]
size = 308
origin = "embedded"
fields = [
  { name = "device", offset = 0, type = "u32" },
  { name = "content_type", offset = 4, type = "u32", note = "1 a saved game" },
  { name = "display_name", offset = 8, type = "bytes", count = 256, note = "UTF-16, 128 characters" },
  { name = "file_name", offset = 264, type = "bytes", count = 42 },
]

# One save slot (1,000 bytes, vtable 0x82002190; four in an operator new[]
# array at the save devices' +44; src/saves/slot_steps.cpp). The measure met
# it as each step's r4 and as its deleting destructors' r3 (sub_820A4508 one
# slot, sub_820A5660 the array); docs/known-data.md's "save slot". The
# overlappeds are bytes fields (an XOVERLAPPED, 28 bytes, each; the file's a
# Win32 OVERLAPPED, 20 bytes).
[SaveSlot]
measures = ["SaveSlot::WriteFile.r4", "SaveSlot::ReadFile.r4", "SaveSlot::WaitEnumerate.r4",
            "SaveSlot::Create.r4", "SaveSlot::Delete.r4", "SaveSlot::LoadStep.r4",
            "SaveSlot::OpenItem.r4", "SaveSlot::SaveStep.r4", "SaveSlot::ShowDeviceSelector.r4",
            "SaveSlot::WaitDeviceSelector.r4", "sub_820A4508.r3", "sub_820A5660.r3"]
size = 1000
origin = "allocated"
vtable = 0x82002190
fields = [
  { name = "array_count", offset = -8, type = "u32", note = "the operator new[] block's count, 8 bytes before the first slot" },
  { name = "vtable", offset = 0, type = "u32" },
  { name = "unknown_4", offset = 4, type = "u32", note = "reached only by ReadFile's overlapped reads, which the measure joins to the slot (a measure fault)" },
  { name = "device_selector", offset = 8, type = "bytes", count = 28, note = "the device selector's XOVERLAPPED" },
  { name = "device", offset = 36, type = "u32", note = "0 for none" },
  { name = "device_free_bytes", offset = 40, type = "u64" },
  { name = "enumeration", offset = 48, type = "bytes", count = 28, note = "the enumeration's XOVERLAPPED" },
  { name = "enumerator", offset = 76, type = "u32", note = "the enumerator's handle" },
  { name = "enumeration_buffer", offset = 80, type = "u32", note = "XContentData each (308 bytes); freed by the destructor" },
  { name = "open_failed", offset = 84, type = "u32", note = "a word array (the owner's +68 words, SaveSlot::AllocBuffers): 1 for each enumerated save that couldn't be opened; freed by the destructor" },
  { name = "enumeration_buffer_size", offset = 88, type = "u32" },
  { name = "enumerated_count", offset = 92, type = "u32", note = "XGetOverlappedResult's result" },
  { name = "enumeration_step", offset = 96, type = "u32" },
  { name = "open", offset = 100, type = "bytes", count = 28, note = "the open's XOVERLAPPED" },
  { name = "check_step", offset = 128, type = "u32" },
  { name = "check_item", offset = 132, type = "u32" },
  { name = "content_op", offset = 136, type = "bytes", count = 28, note = "create's, delete's and the thumbnail's XOVERLAPPED" },
  { name = "content_data", offset = 164, type = "bytes", count = 308, note = "an XContentData: the content used" },
  { name = "file_overlapped", offset = 472, type = "bytes", count = 20, note = "the file read's or write's OVERLAPPED (its event at +488)" },
  { name = "file_event", offset = 492, type = "u32", note = "the file step's event, also kept here" },
  { name = "file_handle", offset = 496, type = "u32" },
  { name = "file_bytes", offset = 500, type = "u32", note = "the bytes read or written" },
  { name = "display_name", offset = 504, type = "bytes", count = 256, note = "UTF-16" },
  { name = "file_name", offset = 760, type = "bytes", count = 42 },
  { name = "file_path", offset = 802, type = "bytes", count = 130, note = "TXR360:\\TXR_DATA_1" },
  { name = "data", offset = 932, type = "u32" },
  { name = "data_size", offset = 936, type = "u32" },
  { name = "thumbnail", offset = 940, type = "u32" },
  { name = "thumbnail_size", offset = 944, type = "u32" },
  { name = "step", offset = 948, type = "u32", note = "the save's, load's and delete's sub-step" },
  { name = "step_error", offset = 952, type = "u32", note = "0 none, 1 failed, 2 no room" },
  { name = "user", offset = 956, type = "u32", note = "-1 none" },
  { name = "request_device_selector", offset = 960, type = "u32", note = "probably; the state the steps share" },
  { name = "request_enumeration", offset = 964, type = "u32", note = "probably" },
  { name = "request_save", offset = 968, type = "u32" },
  { name = "request_load", offset = 972, type = "u32" },
  { name = "request_delete", offset = 976, type = "u32" },
  { name = "failure_acknowledged", offset = 980, type = "u32" },
  { name = "enumerated_saves", offset = 984, type = "u32" },
  { name = "state", offset = 988, type = "u32", note = "0 no user, 1 no device, 2 a step failed, 3 ready, 4 the device selector, 5 the enumeration, 6 the saves' check, 7 the save, 8 the load, 9 the delete" },
  { name = "failure_reason", offset = 992, type = "u32", note = "2 the save failed, 3 no room, 4 the load failed, 5 the delete failed" },
]

# The archive streaming object (Archive::Init's r3, kept at 0x826A5100,
# archive.toml's `streaming`): Init ends by calling its vtable's slot 1.
[ArchiveStreamer]
measure = "[826A5100]"
size = 4
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "ArchiveStreamerVtable" },
]

[ArchiveStreamerVtable]
measure = "[826A5100].+0"
size = 8
origin = "image"
fields = [
  { name = "on_init", offset = 4, type = "fn", note = "called at Archive::Init's end" },
]

# The audio engine's start-up (sub_8259D1F0): the XACT engine
# (XACT3CreateEngine's, at the audio engine's +8), probably, and its
# vtable's Initialize.
[XactEngineRef]
measure = "sub_8259D1F0.r3.+28.+8"
size = 4
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "XactEngineVtable" },
]

[XactEngineVtable]
measure = "sub_8259D1F0.r3.+28.+8.+0"
size = 12
origin = "image"
fields = [
  { name = "initialize", offset = 8, type = "fn", note = "probably Initialize (with the settings file read into the audio engine's +0 and +4)" },
]
