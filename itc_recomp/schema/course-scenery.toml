  { name = "model_count", offset = 4, type = "u32" },
  { name = "model_capacity", offset = 8, type = "u32", note = "the manager's model count" },
  { name = "lights", offset = 12, type = "ptr", to = "AreaLights" },
  { name = "models", offset = 16, type = "ptr", to = "AreaModel", note = "the first of its models (4 bytes each)" },
]

# A data file of the course set or the areas (count, then offsets).
[SceneryDataFile]
measures = ["PoolObject.+1056", "PoolObject.+1592", "Scenery.+12.+80", "Lights.+224.+12.+80"]
size = 4
origin = "file"
fields = [
  { name = "count", offset = 0, type = "u32", note = "little-endian" },
  { name = "count_byte", offset = 0, type = "u8", note = "its first byte" },
]

# An entry of those files (DataFile::GetEntry's answer): an area of the area
# file (CollectModels) or a light group (Lights::FindNearest), joined.
[SceneryFileEntry]
measure = "DataFile::GetEntry.ret"
size = 148
origin = "file"
fields = [
  { name = "count", offset = 0, type = "u32", note = "an area's model count (big-endian), a light group's scans" },
  { name = "corners", offset = 32, type = "bytes", count = 64, note = "an area's four 16-byte corners" },
  { name = "light_count", offset = 60, type = "u32", note = "a light group's lights" },
  { name = "light_x", offset = 76, type = "f32", note = "a light group's first light (48 bytes each)" },
  { name = "light_xy", offset = 76, type = "u64" },
  { name = "light_y", offset = 80, type = "f32" },
  { name = "light_z", offset = 84, type = "f32" },
  { name = "light_zw", offset = 84, type = "u64" },
  { name = "light_16", offset = 92, type = "u64", note = "its bytes 16 to 23" },
  { name = "model_number", offset = 96, type = "u32", note = "an area's first model record's number (96-byte records)" },
  { name = "light_24", offset = 100, type = "u64", note = "its bytes 24 to 31" },
]

# What a view sees from (CollectAreas' and CollectModels' r5: a viewport entry).
[SceneryViewport]
measures = ["Scenery::CollectAreas.r5", "Scenery::CollectModels.r5"]
size = 1612
origin = "image"
fields = [
  { name = "far_distance", offset = 72, type = "f32" },
  { name = "eye_x", offset = 1600, type = "f32" },
  { name = "eye_z", offset = 1608, type = "f32" },
]

# A pass description (the draws' r4; Scenery::Draw's frame +80).
[SceneryPassDesc]
measures = ["Scenery::DrawArea.r4", "Scenery::DrawSetLists.r4", "Scenery::RecordHeadlightProjectors.r4"]
size = 36
origin = "stack"
fields = [
  { name = "camera_pass_object", offset = 8, type = "u32", note = "the camera pass (RecordHeadlightProjectors sets it)" },
  { name = "player", offset = 12, type = "u32" },
  { name = "viewport_entry", offset = 16, type = "u32" },
  { name = "camera_pass", offset = 20, type = "u32", note = "the camera pass's number" },
  { name = "key_a", offset = 24, type = "u32", note = "to [0x8296B90C]" },
  { name = "key_b", offset = 28, type = "u32", note = "to [0x8296B900]" },
  { name = "mask", offset = 32, type = "u32" },
]

# Scenery::Draw's pass table (0x82603060, 20 entries of 24 bytes): the
# words copied into a pass description's +12 to +32 (SceneryPassDesc).
[SceneryPassEntry]
size = 24
origin = "image"
fields = [
  { name = "player", offset = 0, type = "u32", note = "the viewport ([[0x826C2CE8] + 4 x it])" },
  { name = "viewport_entry", offset = 4, type = "u32", note = "the viewport's 80-byte entry" },
  { name = "camera_pass", offset = 8, type = "u32", note = "the camera pass's number (0x826BAC00 + 592 x it)" },
  { name = "key_a", offset = 12, type = "u32" },
  { name = "key_b", offset = 16, type = "u32" },
  { name = "mask", offset = 20, type = "u32" },
]

# The views' masks (0x82602F80, 14 records of 16 bytes): Scenery::Update
# sets each record's camera pass from its viewport, ViewMask ORs the bits of
# a view's records whose pass is enabled.
[SceneryViewMask]
size = 16
origin = "image"
fields = [
  { name = "view", offset = 0, type = "u32", note = "the view (also the viewport's player for CameraPass::FromViewport)" },
  { name = "viewport_entry", offset = 4, type = "u32" },
  { name = "camera_pass", offset = 8, type = "u32", note = "the camera pass's number" },
  { name = "bits", offset = 12, type = "u32" },
]

# Lights::FindNearest's output (32 bytes a light) and point.
[NearestLight]
measure = "Lights::FindNearest.r4"
size = 32
origin = "stack"
fields = [
  { name = "x", offset = 0, type = "f32" },
  { name = "y", offset = 4, type = "f32" },
  { name = "z", offset = 8, type = "f32" },
  { name = "w", offset = 12, type = "f32", note = "the float at 0x82000A30" },
  { name = "f16", offset = 16, type = "f32", note = "the light's bytes 16 to 31" },
  { name = "f20", offset = 20, type = "f32" },
  { name = "f24", offset = 24, type = "f32" },
  { name = "f28", offset = 28, type = "f32" },
]

[NearestLightPoint]
measure = "Lights::FindNearest.r5"
size = 12
origin = "stack"
fields = [
  { name = "x", offset = 0, type = "f32" },
  { name = "y", offset = 4, type = "f32" },
  { name = "z", offset = 8, type = "f32" },
]

# The texture provider's vtable (the manager's +228's first word).
[SceneryProviderVtable]
measure = "Scenery.+228"
size = 20
origin = "image"
fields = [
  { name = "clear_all", offset = 8, type = "fn", note = "slot 2 (0x82594328)" },
  { name = "set", offset = 16, type = "fn", note = "slot 4, TextureProvider::Set (0x82594718)" },
]

# The texture animations (the course set's +1060).
[AnimationSet]
measure = "AnimationSet"
size = 8
origin = "file"
fields = [
  { name = "count", offset = 0, type = "u32" },
  { name = "first_offset", offset = 4, type = "u32", note = "the offsets, from the table's end (set + 4 (count + 1))" },
]

[Animation]
measure = "Animation"
size = 20
origin = "file"
fields = [
  { name = "frame_count", offset = 0, type = "u32" },
  { name = "frame", offset = 4, type = "u32" },
  { name = "tick", offset = 8, type = "u32" },
  { name = "length", offset = 12, type = "u32" },
  { name = "first_start", offset = 16, type = "u32", note = "each frame's start tick from here; the texture words after them" },
]

[globals]
manager = { address = 0x826C5514, type = "ptr", to = "Scenery", note = "set by Scenery::Init, cleared by ClearGlobal" }
physical_held = { address = 0x826C5518, type = "u32", note = "the physical bytes the scenery holds" }
created = { address = 0x826C551C, type = "ptr", to = "Scenery", note = "set by Scenery::Create, cleared by Destroy (the same object)" }
load_buffer_size = { address = 0x826A5130, type = "u32", note = "the archive's shared load buffer's size" }
load_buffer = { address = 0x826A5134, type = "u32", note = "the archive's shared load buffer" }
create_float_200 = { address = 0x820067B8, type = "u32", note = "192.0, the manager's +200 (copied as bits)" }
create_float_204 = { address = 0x820067B4, type = "u32", note = "72.0, the manager's +204" }
create_float_208 = { address = 0x82001FAC, type = "u32", note = "256.0, the manager's +208" }
create_float_212 = { address = 0x820067B0, type = "u32", note = "64.0, the manager's +212" }
item_distance = { address = 0x82000A34, type = "f32", note = "0.0: StartLoad's distance for every item" }
one = { address = 0x82000A30, type = "f32", note = "1.0" }
zero = { address = 0x82000A34, type = "f32", note = "0.0 (the draws' ranges, inside an area's rectangle)" }
key_a = { address = 0x8296B90C, type = "u32", note = "the render queue's key (the pass's +24)" }
key_b = { address = 0x8296B900, type = "u32", note = "the render queue's key (the pass's +28)" }
key_depth = { address = 0x8296B908, type = "u32", note = "the depth buckets' key" }
depth_key = { address = 0x8296B8FC, type = "u32", note = "the depth draws' key" }
other_key = { address = 0x8296B8F8, type = "u32", note = "the depth draws' second key" }
pass_table = { address = 0x82603060, type = "bytes", count = 480, note = "Scenery::Draw's 20 SceneryPassEntry records" }
view_masks = { address = 0x82602F80, type = "bytes", count = 224, note = "the 14 SceneryViewMask records" }
range_x = { address = 0x82001FCC, type = "f32", note = "the course set's model's draw range, x (also material-passes' projector_depth_bias)" }
range_y = { address = 0x82006804, type = "f32", note = "the course set's model's draw range, y (also scenery-lists' point_range_far)" }
headlight_near_plane = { address = 0x82001FBC, type = "f32", note = "0.1, the headlight projectors' near plane" }

