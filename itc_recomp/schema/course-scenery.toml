# The schema of docs/functions/course-scenery.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The course scenery: its manager (248 bytes, physical memory, at
# [0x826C5514] and [0x826C551C]), its five object pools (40-byte pool object
# headers), the two lists of areas and models it streams, the visible areas
# it hands the draw, the course set (pool 2), the areas' lights (pool 3) and
# models (pool 4), and the texture animations (src/course_scenery/).
#
# Measure faults (the measure joins objects through shared registers):
# - "Scenery" holds the manager and also, at +0 to +28, the scenery lists
#   (SceneryItemList), their 12-byte table entries (the u16s at +0, +2), the
#   visible areas (SceneryVisibleArea: DrawArea, Draw) and the 44-byte
#   configuration (PoolSizes); the manager's fields there are named, the
#   others are described in their own types.
# - "PoolObject" holds the pool objects' header and, past +40, the course
#   set's fields Scenery::DrawSetLists reads (CourseSet's, named set_ here).
# - "DataFile::GetEntry.ret" joins an area's entry of the area file
#   (CollectModels) and a light group (Lights::FindNearest).
# - "Scenery.+24" joins the lists' tables (LoadAll) and the configuration's
#   pool 0 asset word (PoolSizes' [[config + 24]]).
# Left to other areas' types (not claimed here): "Scenery.+16.+56" (the
# area model's Model, models.md) and
# "Scenery::RecordHeadlightProjectors.r4.+8" (the CameraPass, cameras.md).

# The manager (measures: its own, LoadAll's and Stream's r3 as SceneryList,
# Lights::FindNearest's owner as Lights).
[Scenery]
measure = "Scenery"
measures = ["SceneryList", "Lights", "SceneryList::LoadAll.r4", "SceneryList::Add.r4", "PoolObject.+3792", "SceneryList::Clear.r4", "SceneryList::ReleaseUnused.r4"]
size = 248
origin = "allocated"
fields = [
  { name = "pool_count", offset = 0, type = "u32", note = "5 (the manager is the pool set: ObjectPools)" },
  { name = "table_area", offset = 0, type = "u16", note = "measure fault: a list table entry's area (SceneryListTableEntry)" },
  { name = "table_model", offset = 2, type = "u16", note = "measure fault: a list table entry's model (SceneryListTableEntry)" },
  { name = "pool_records", offset = 4, type = "ptr", to = "ObjectPoolRecord", note = "the pools' block: five 24-byte records, then the objects" },
  { name = "mode", offset = 8, type = "u32", note = "the configuration's +0: 0 everything loaded at once, else streamed (2: [[+40]])" },
  { name = "view_count_minus_1", offset = 12, type = "u32", note = "the configuration's +4: the views (players) less 1" },
  { name = "unknown_16", offset = 16, type = "u32", note = "the configuration's +8" },
  { name = "unknown_20", offset = 20, type = "u32", note = "the configuration's +12" },
  { name = "unknown_24", offset = 24, type = "u32", note = "the configuration's +16" },
  { name = "unknown_28", offset = 28, type = "u32", note = "the configuration's +20" },
  { name = "pool0_asset", offset = 32, type = "ptr", to = "SceneryWord", note = "the configuration's +24: -> pool 0's asset id" },
  { name = "course_table", offset = 36, type = "ptr", to = "SceneryCourseTable", note = "the configuration's +28: the course's table of areas" },
  { name = "mode2_source", offset = 40, type = "ptr", to = "SceneryWord", note = "the configuration's +32: -> the mode taken in mode 2 when +12 is 0" },
  { name = "pool0_on", offset = 44, type = "u32", note = "the configuration's +36: pool 0 has an object" },
  { name = "pool1_on", offset = 48, type = "u32", note = "the configuration's +40: pool 1 is set up" },
  { name = "unknown_52", offset = 52, type = "u32", note = "0 by Init" },
  { name = "unknown_56", offset = 56, type = "u32", note = "0 by Init (+60 to +107 cleared too)" },
  { name = "area_count", offset = 92, type = "u32", note = "the areas with a light asset (PoolSizes)" },
  { name = "area_count_streamed", offset = 96, type = "u32", note = "the same count again: pool 3's objects and list A's cut when streamed" },
  { name = "model_count", offset = 100, type = "u32", note = "the areas' models (PoolSizes)" },
  { name = "model_cap", offset = 104, type = "u32", note = "the model count capped at 16: pool 4's objects and list B's cut when streamed" },
  { name = "pool0_object", offset = 108, type = "ptr", to = "SceneryBlockObject", note = "pool 0's object (StartLoad, with +44)" },
  { name = "course_set", offset = 112, type = "ptr", to = "CourseSet", note = "pool 2's object (StartLoad)" },
  { name = "list_a_pool", offset = 116, type = "u32", note = "list A (the areas; a SceneryItemList at +116): its pool, 3" },
  { name = "list_a_done", offset = 120, type = "u32" },
  { name = "list_a_count", offset = 124, type = "u32" },
  { name = "list_a_capacity", offset = 128, type = "u32" },
  { name = "list_a_pointers", offset = 132, type = "u32", note = "the items' pointers, sorted nearest first" },
  { name = "list_a_items", offset = 136, type = "ptr", to = "SceneryListItem" },
  { name = "list_a_table", offset = 140, type = "ptr", to = "SceneryListTableEntry" },
  { name = "list_b_pool", offset = 144, type = "u32", note = "list B (the models; a SceneryItemList at +144): its pool, 4" },
  { name = "list_b_done", offset = 148, type = "u32" },
  { name = "list_b_count", offset = 152, type = "u32" },
  { name = "list_b_capacity", offset = 156, type = "u32" },
  { name = "list_b_pointers", offset = 160, type = "u32" },
  { name = "list_b_items", offset = 164, type = "ptr", to = "SceneryListItem" },
  { name = "list_b_table", offset = 168, type = "ptr", to = "SceneryListTableEntry" },
  { name = "last_pool", offset = 172, type = "u32", note = "the pool last asked to load (-1 none)" },
  { name = "last_index", offset = 176, type = "u32", note = "its object's index (-1 none)" },
  { name = "pool0_data_size", offset = 180, type = "u32" },
  { name = "pool0_block", offset = 184, type = "u32", note = "pool 0's data block (AllocPhysical)" },
  { name = "load_buffer", offset = 188, type = "u32", note = "the buffer the area models load into ([0x826A5134] or 0)" },
  { name = "loading_all", offset = 192, type = "u32", note = "set while Scenery::IsLoaded loads everything" },
  { name = "mask", offset = 196, type = "u32", note = "0x38435: camera pass bits, 0x10 the set's model, 0x20 its list, 0x400 the areas' lights drawn, 0x4000 the texture animations stopped" },
  { name = "unknown_200", offset = 200, type = "f32", note = "192.0 (0x820067B8)" },
  { name = "unknown_204", offset = 204, type = "f32", note = "72.0 (0x820067B4)" },
  { name = "unknown_208", offset = 208, type = "f32", note = "256.0 (0x82001FAC)" },
  { name = "unknown_212", offset = 212, type = "f32", note = "64.0 (0x820067B0)" },
  { name = "visible_count", offset = 216, type = "u32", note = "the visible areas (Scenery::Update)" },
  { name = "visible_capacity", offset = 220, type = "u32" },
  { name = "visible_areas", offset = 224, type = "ptr", to = "SceneryVisibleArea", note = "272-byte entries" },
  { name = "texture_provider", offset = 228, type = "ptr", to = "SceneryProviderVtable", note = "the TextureProvider made here (20 bytes, 64 slots); this word is its vtable 0x8206CCB4" },
]

# A scenery list (28 bytes; the manager's +116 and +144).
[SceneryItemList]
measure = "SceneryList::Sort.r4"
size = 28
origin = "embedded"
fields = [
  { name = "pool", offset = 0, type = "u32", note = "3 (areas) or 4 (models)" },
  { name = "done", offset = 4, type = "u32", note = "the items done (LoadAll)" },
  { name = "count", offset = 8, type = "u32" },
  { name = "capacity", offset = 12, type = "u32", note = "also the table's count" },
  { name = "pointers", offset = 16, type = "u32", note = "an array of pointers to the items, sorted nearest first" },
  { name = "items", offset = 20, type = "ptr", to = "SceneryListItem" },
  { name = "table", offset = 24, type = "ptr", to = "SceneryListTableEntry" },
]

# A scenery list's item (16 bytes).
[SceneryListItem]
measure = "Scenery.+4"
measures = ["SceneryList::Add.r4.+20"]
size = 16
origin = "allocated"
fields = [
  { name = "distance", offset = 0, type = "f32" },
  { name = "mask", offset = 4, type = "u32", note = "the camera passes that see it" },
  { name = "key", offset = 8, type = "u32", note = "the area and model halfwords as one word" },
  { name = "area", offset = 8, type = "u16" },
  { name = "model", offset = 10, type = "u16" },
  { name = "object", offset = 12, type = "ptr", to = "PoolObject", note = "its pool's object, 0 while not loaded" },
]

# A scenery list's table entry (12 bytes): every key the list can hold.
[SceneryListTableEntry]
measure = "SceneryList::LoadAll.r4.+24"
measures = ["Scenery@+8.+24"]
size = 12
origin = "allocated"
fields = [
  { name = "key", offset = 0, type = "u32", note = "the area and model halfwords as one word (also PoolSizes' pool 0 asset word: a measure fault)" },
  { name = "area", offset = 0, type = "u16" },
  { name = "model", offset = 2, type = "u16" },
  { name = "asset", offset = 4, type = "u32", note = "the asset id" },
  { name = "object", offset = 8, type = "ptr", to = "PoolObject", note = "mode 0: its object once loaded" },
  { name = "next_object", offset = 20, type = "u32", note = "the next entry's object (LoadAll's original reads it 12 bytes on)" },
]

# A word the configuration points to.
[SceneryWord]
measures = ["Scenery.+32", "Scenery.+40"]
size = 4
origin = "file"
fields = [
  { name = "value", offset = 0, type = "u32", note = "pool 0's asset id, or the mode in mode 2" },
]

# The 44-byte configuration Scenery::Setup copies to the manager's +8.
[SceneryConfig]
measure = "Scenery@+8"
size = 44
origin = "file"
fields = [
  { name = "mode", offset = 0, type = "u32", note = "0 everything loaded at once, else streamed" },
  { name = "view_count_minus_1", offset = 4, type = "u32" },
  { name = "unknown_8", offset = 8, type = "u32" },
  { name = "unknown_12", offset = 12, type = "u32" },
  { name = "unknown_16", offset = 16, type = "u32" },
  { name = "unknown_20", offset = 20, type = "u32" },
  { name = "pool0_asset", offset = 24, type = "ptr", to = "SceneryWord" },
  { name = "course_table", offset = 28, type = "ptr", to = "SceneryCourseTable" },
  { name = "mode2_source", offset = 32, type = "ptr", to = "SceneryWord" },
  { name = "pool0_on", offset = 36, type = "u32" },
  { name = "pool1_on", offset = 40, type = "u32" },
]

# The course's table of areas (the configuration's +28).
[SceneryCourseTable]
measure = "Scenery.+36"
measures = ["Scenery@+8.+28"]
size = 20
origin = "file"
fields = [
  { name = "set_second_asset", offset = 8, type = "u32", note = "the course set's second asset (into its data; its size is pool 2's)" },
  { name = "set_first_asset", offset = 12, type = "u32", note = "the course set's first asset (into a physical block)" },
  { name = "area_count", offset = 16, type = "u32" },
  { name = "light_asset", offset = 20, type = "u32", note = "area 0's light asset (area n's 12 n on; -1 ends them)" },
  { name = "first_model_asset", offset = 24, type = "u32", note = "area 0's first model asset" },
  { name = "last_model_asset", offset = 28, type = "u32", note = "area 0's last model asset" },
]

# The pool set (the manager's first 8 bytes).
[ObjectPools]
measure = "ObjectPools"
size = 8
origin = "embedded"
fields = [
  { name = "count", offset = 0, type = "u32" },
  { name = "records", offset = 4, type = "ptr", to = "ObjectPoolRecord", note = "the records (the original: one XPhysicalAlloc block, the records, then the objects; since E5 step 5 a host array, the objects' block apart)" },
]

# A pool's 24-byte record.
[ObjectPoolRecord]
measures = ["new<?>@ObjectPools::Init", "ObjectPools::Pool.ret"]
size = 24
origin = "allocated"
# Host (E5 step 5, 2026-11-24): the records as a host array of their own
# (ObjectPools::Init's hand port, NewArray; freed by ObjectPools::Shutdown's
# Delete), out of the pools' physical block, which keeps the objects and
# their data (pool 0's first object is its start). Only the hand ports
# reach them.
storage = "host"
fields = [
  { name = "object_count", offset = 0, type = "u32" },
  { name = "object_size", offset = 4, type = "u32" },
  { name = "data_size", offset = 8, type = "u32" },
  { name = "first_object", offset = 12, type = "ptr", to = "PoolObject" },
  { name = "free_head", offset = 16, type = "ptr", to = "PoolObject" },
  { name = "used_head", offset = 20, type = "ptr", to = "PoolObject" },
]

# A pool's 24-byte descriptor (ObjectPools::Init's r5; Scenery::SetupPools'
# frame).
[ObjectPoolDesc]
measure = "ObjectPools::Init.r5"
size = 24
origin = "stack"
fields = [
  { name = "pool", offset = 0, type = "u32" },
  { name = "object_size", offset = 4, type = "u32" },
  { name = "data_size", offset = 8, type = "u32" },
  { name = "object_count", offset = 12, type = "u32" },
  { name = "data_count", offset = 16, type = "u32" },
  { name = "factory", offset = 20, type = "fn", note = "makes each object (Scenery::MakePoolObject), 0 plain pool objects" },
]

# A pooled object's 40-byte header.
[PoolObject]
measure = "PoolObject"
measures = ["ObjectPools::Pool.ret.+20", "ObjectPools::Release.ret", "PoolObject::AllocData.r3"]
size = 40
origin = "allocated"
vtable = 0x82006848
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "PoolObjectVtable" },
  { name = "data", offset = 4, type = "u32", note = "its data buffer (+4 to +12 AllocData's record: the data, its size, the used)" },
  { name = "data_size", offset = 8, type = "u32" },
  { name = "data_used", offset = 12, type = "u32" },
  { name = "index", offset = 16, type = "u32", note = "its index in the pool" },
  { name = "prev", offset = 20, type = "ptr", to = "PoolObject", note = "on the pool's free or used list" },
  { name = "next", offset = 24, type = "ptr", to = "PoolObject" },
  { name = "unknown_28", offset = 28, type = "u32", note = "0 by the constructor" },
  { name = "flags", offset = 32, type = "u32", note = "0x1 in use, 0x2 cleared when loaded, 0x8 loaded, 0x10 seen this update, 0x20 not seen, to be released" },
  { name = "countdown", offset = 36, type = "u32", note = "the updates left before release (2; -1 none)" },
  # Measure fault: CourseSet's fields (Scenery::DrawSetLists).
  { name = "set_area_file", offset = 1056, type = "ptr", to = "SceneryDataFile", note = "CourseSet's area_file" },
  { name = "set_texture_animations", offset = 1060, type = "ptr", to = "AnimationSet", note = "CourseSet's texture_animations" },
  { name = "set_light_groups", offset = 1592, type = "ptr", to = "SceneryDataFile", note = "CourseSet's light_groups" },
  { name = "set_list_c_count", offset = 1596, type = "u32", note = "CourseSet's list_c_count" },
  { name = "set_list_c_head", offset = 1860, type = "u16", note = "CourseSet's list_c_head" },
  { name = "set_list_d_count", offset = 2124, type = "u32" },
  { name = "set_list_d_head", offset = 2388, type = "u16" },
  { name = "set_list_e_count", offset = 2652, type = "u32" },
  { name = "set_list_e_head", offset = 2916, type = "u16" },
  { name = "set_points_animations", offset = 3788, type = "u32", note = "CourseSet's points_animations" },
  { name = "set_points_provider", offset = 3792, type = "u32" },
  { name = "set_points_race_word", offset = 3796, type = "u32" },
  { name = "set_points_count", offset = 3800, type = "u32" },
]

# The pool objects' vtables (three slots).
[PoolObjectVtable]
measure = "PoolObject.+0"
size = 12
origin = "image"
fields = [
  { name = "key", offset = 0, type = "fn", note = "the key's address and size" },
  { name = "load", offset = 4, type = "fn" },
  { name = "reset", offset = 8, type = "fn" },
]

# The blocks Scenery::AllocPhysical (sub_820F1490) makes: the manager (248
# bytes), list A's and B's pointer arrays, items and tables, the visible
# areas, pool 0's block (never in play) and the course set's first file
# (CourseSet::Load: read whole by Archive::Load, then copied out by
# XPR::Create and Model::Load and freed by CourseSet::OnLoaded). The
# original's XPhysicalAlloc(size, -1, 0, 4), but the GPU reads none of them:
# no physical or GPU address is taken of them, the textures and vertex data
# are copied into XPR::Create's and Model::Load's own physical blocks. A blob
# (E5 step 7, 2026-11-24): the hand port's Scenery::AllocPhysical
# (src/course_scenery/course_scenery.cpp, New) and the lifted original's
# XPhysicalAlloc (returning at 0x820F14B0); its size (XPhysicalSize, whole
# 4 KB pages as the physical block's) still counted at [0x826C5518]; freed
# by Scenery::FreePhysical's XPhysicalFree (memory::FreePhysical takes
# handles): Scenery::UnloadPools, Unload, Destroy, CourseSet::OnLoaded.
[SceneryBlock]
size = 0
origin = "allocated"
storage = "blob"
blob_alloc = [{ call = 0x820F14B0, reg = "r3" }]
fields = []

# The pools' objects and their data (ObjectPools::Init's block, since E5
# step 5 without the records): the course set (with the second file loaded
# into its data), the areas' lights (their light files) and models, pools 0
# and 1's objects. The original's XPhysicalAlloc(size, -1, 64, 4), but the GPU
# reads none of it (the models' vertex data and the XPRs' textures are
# copied into their own physical blocks; the light groups' sprites are
# written into the command buffer). A blob (E5 step 7, 2026-11-24):
# ObjectPools::Init's hand port (New; its original isn't lifted: no lifted
# site), freed by ObjectPools::Shutdown (memory::FreePhysical of pool 0's
# first object, the block's start).
[ObjectPoolsBlock]
size = 0
origin = "allocated"
storage = "blob"
fields = []

# Pools 0 and 1's objects (60 bytes; never loaded in play).
[SceneryBlockObject]
measure = "sub_820F1098.r3"
size = 60
origin = "allocated"
vtable = 0x8200674C
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "PoolObjectVtable", note = "0x8200674C pool 0's, 0x82006758 pool 1's" },
  { name = "block", offset = 56, type = "u32", note = "0 by MakePoolObject; pool 0's load sub_820F1098 sets it" },
]

# The course's shared set (pool 2's object, 3,824 bytes).
[CourseSet]
measures = ["CourseSet", "CourseSet::OnLoaded.r6", "TextureAnimations"]
size = 3824
origin = "allocated"
vtable = 0x82006784
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "PoolObjectVtable" },
  { name = "xpr", offset = 64, type = "bytes", count = 32, note = "its textures (an XPR; CourseSet::InitParts' +0)" },
  { name = "model", offset = 96, type = "bytes", count = 432, note = "its model (a Model)" },
  { name = "list_a", offset = 528, type = "bytes", count = 528, note = "a ModelList (entry 2)" },
  { name = "area_file", offset = 1056, type = "ptr", to = "SceneryDataFile", note = "the second file's entry 0: the areas" },
  { name = "texture_animations", offset = 1060, type = "ptr", to = "AnimationSet", note = "the second file's entry 1" },
  { name = "list_b", offset = 1064, type = "bytes", count = 528, note = "a ModelList (entry 3)" },
  { name = "light_groups", offset = 1592, type = "ptr", to = "SceneryDataFile", note = "the second file's entry 2" },
  { name = "list_c_count", offset = 1596, type = "u32", note = "a ModelList (entry 4), drawn whole by DrawSetLists" },
  { name = "list_c_head", offset = 1860, type = "u16", note = "its List64's head (+264)" },
  { name = "list_d_count", offset = 2124, type = "u32", note = "a ModelList (entry 5), its B entries" },
  { name = "list_d_head", offset = 2388, type = "u16" },
  { name = "list_e_count", offset = 2652, type = "u32", note = "a ModelList (entry 6), its C entries" },
  { name = "list_e_head", offset = 2916, type = "u16" },
  { name = "points", offset = 3180, type = "bytes", count = 608, note = "a point list (entry 7, ModelList::LoadPoints)" },
  { name = "points_animations", offset = 3788, type = "u32", note = "the point list's +608: the set's texture animations" },
  { name = "points_provider", offset = 3792, type = "u32", note = "its +612: the texture provider" },
  { name = "points_race_word", offset = 3796, type = "u32", note = "its +616: from the race's table at [0x826D82E8]" },
  { name = "points_count", offset = 3800, type = "u32", note = "its +620" },
  { name = "first_file", offset = 3808, type = "u32", note = "the first asset's block (AllocPhysical), freed once parsed" },
  { name = "second_file", offset = 3812, type = "u32", note = "the second asset, in the object's data" },
]

# An area's lights (pool 3's object, 88 bytes).
