  { name = "star_rotation", offset = 152, type = "u32" },
  { name = "star_colors", offset = 160, type = "bytes", count = 128 },
]

# The star definition (the glare's +48; probably the HDR sample's STARDEF).
[StarDef]
measure = "Glow@+8064@+48"
size = 240
origin = "embedded"
fields = [
  { name = "line_count", offset = 0, type = "u32" },
