  { name = "sort_key", offset = 8, type = "u32", note = "the render queue's key of its main chunk" },
  { name = "second_sort_key", offset = 12, type = "u32", note = "the motion blur's velocity chunks' key (it - 2 for the upload and the blur's chunk)" },
  { name = "width", offset = 16, type = "u32" },
  { name = "height", offset = 20, type = "u32" },
  { name = "x", offset = 24, type = "u32", note = "the view's position (by-view resolves and quads)" },
  { name = "y", offset = 28, type = "u32" },
  { name = "flags", offset = 32, type = "u32", note = "bit 2 kept past the race (PostEffects::DestroyRace); bits 0-1 the target filter's target (render target 4 or 3)" },
  { name = "camera_pass", offset = 36, type = "u32", note = "its camera pass (0x826BAC00 + 592 x it)" },
  { name = "reset", offset = 40, type = "u32", note = "1 at set-up, cleared after each record" },
  { name = "no_history", offset = 44, type = "u32", note = "PostEffects::ToggleNoHistory" },
  { name = "updated", offset = 48, type = "u32", note = "set on logic passes (PostEffects::MarkUpdated)" },
  { name = "skipped", offset = 52, type = "u32", note = "skipped when set (PostEffects::RecordAll)" },
  { name = "vertices", offset = 56, type = "bytes", count = 8000, note = "two buffers of 100 40-byte vertices (PostEffectQuad's)" },
  { name = "vertex_count", offset = 8056, type = "u32", note = "vertices used in the buffer in use" },
  { name = "vertex_buffer", offset = 8060, type = "u32", note = "the buffer in use (0 or 1)" },
  { name = "texture", offset = 8064, type = "ptr", to = "RenderTexture" },
]

# A post effects' table entry (0x826174A8, 15 of 36 bytes; copied into the effect at +4).
[PostEffectTableEntry]
size = 36
origin = "image"
fields = [
  { name = "kind", offset = 0, type = "u32" },
  { name = "sort_key", offset = 4, type = "u32" },
  { name = "second_sort_key", offset = 8, type = "u32" },
  { name = "width", offset = 12, type = "u32" },
  { name = "height", offset = 16, type = "u32" },
  { name = "x", offset = 20, type = "u32" },
  { name = "y", offset = 24, type = "u32" },
  { name = "flags", offset = 28, type = "u32" },
  { name = "camera_pass", offset = 32, type = "u32" },
]

# A render texture: an entry of the pool at 0x826C5DC8 (20 of 36 bytes, by id), or
# one of its own (id 20, operator new).
[RenderTexture]
measure = "RenderTexture"
measures = ["new<36>@RenderTextures::Acquire", "Glow.+8364", "Glow.+8368", "Glow.+8372", "Glow.+8404", "RenderTextures::Release.r3.+0"]
size = 36
origin = "allocated"
fields = [
  { name = "format", offset = 0, type = "u32" },
  { name = "width", offset = 4, type = "u32" },
  { name = "height", offset = 8, type = "u32" },
  { name = "key0", offset = 12, type = "u32", note = "two more words of the key (the view's x and y for id 1, else 0)" },
  { name = "key1", offset = 16, type = "u32" },
  { name = "users", offset = 20, type = "u32" },
  { name = "header", offset = 24, type = "ptr", to = "TextureHeader", note = "52 bytes (operator new), set by XGSetTextureHeader" },
  { name = "memory", offset = 28, type = "u32", note = "its physical memory (XPhysicalAlloc)" },
  { name = "id", offset = 32, type = "u32", note = "20: its own entry, not the pool's" },
]

# An effect's render texture field, by address (RenderTextures::Release's r3).
[RenderTextureRef]
measure = "RenderTextures::Release.r3"
size = 4
origin = "embedded"
fields = [
  { name = "entry", offset = 0, type = "ptr", to = "RenderTexture" },
]

# The glare definition (the glow's +8064; probably the DirectX SDK HDR sample's GLAREDEF).
[GlareDef]
measure = "Glow@+8064"
size = 288
origin = "embedded"
fields = [
  { name = "glare_luminance", offset = 0, type = "f32" },
  { name = "bloom_luminance", offset = 4, type = "f32" },
  { name = "ghost_luminance", offset = 8, type = "f32" },
  { name = "ghost_distortion", offset = 12, type = "f32" },
  { name = "star_luminance", offset = 16, type = "f32" },
  { name = "star_inclination", offset = 20, type = "f32", note = "the table's +24 (its +20, the star type, left out)" },
  { name = "chromatic_aberration_luminance", offset = 24, type = "f32" },
  { name = "afterimage_sensitivity", offset = 28, type = "f32" },
  { name = "afterimage_ratio", offset = 32, type = "f32" },
  { name = "afterimage_luminance", offset = 36, type = "f32" },
