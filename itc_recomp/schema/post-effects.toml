# The schema of docs/functions/post-effects.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The post effects: up to 15 screen-space effects (0x826C5D80), one object
# each, made from a table at 0x826174A8 (src/post_effects/). Every kind
# starts with PostEffect's fields (the base class, 8,064 bytes); the kinds
# repeat them under the same names. The measure's SceneLights (filed here)
# joins the command list's slots with the second set's light kit: left out
# (a measure fault, reported).

# The base class, as PostEffects:: meets every kind (the array's words).
[PostEffect]
measure = "PostEffect"
measures = ["[826C5D80]", "sub_82136DC8.r3", "PostEffect::ReleaseSurface.r3"]
size = 8064
origin = "allocated"
vtable = 0x82008838
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "PostEffectVtable", note = "the kind's vtable (base 0x82008838 between the constructor's steps and after the destructor)" },
  { name = "kind", offset = 4, type = "u32", note = "+4 to +39: the table entry (PostEffectTableEntry) copied in; 0 glow, 1, 2 color filter, 3 motion blur, 4, 5 target filter" },
  { name = "sort_key", offset = 8, type = "u32", note = "the render queue's key of its main chunk" },
  { name = "second_sort_key", offset = 12, type = "u32", note = "the motion blur's velocity chunks' key (it - 2 for the upload and the blur's chunk)" },
  { name = "width", offset = 16, type = "u32" },
  { name = "height", offset = 20, type = "u32" },
  { name = "x", offset = 24, type = "u32", note = "the view's position (by-view resolves and quads)" },
  { name = "y", offset = 28, type = "u32" },
  { name = "flags", offset = 32, type = "u32", note = "bit 2 kept past the race (PostEffects::DestroyRace); bits 0-1 the target filter's target (render target 4 or 3)" },
  { name = "camera_pass", offset = 36, type = "u32", note = "its camera pass (0x826BAC00 + 592 x it)" },
  { name = "reset", offset = 40, type = "u32", note = "1 at set-up, cleared after each record" },
  { name = "no_history", offset = 44, type = "u32", note = "PostEffects::ToggleNoHistory" },
  { name = "updated", offset = 48, type = "u32", note = "set on logic passes (PostEffects::MarkUpdated)" },
  { name = "skipped", offset = 52, type = "u32", note = "skipped when set (PostEffects::RecordAll)" },
  { name = "vertices", offset = 56, type = "bytes", count = 8000, note = "two buffers of 100 40-byte vertices (PostEffectQuad's)" },
  { name = "vertex_count", offset = 8056, type = "u32", note = "vertices used in the buffer in use" },
  { name = "vertex_buffer", offset = 8060, type = "u32", note = "the buffer in use (0 or 1)" },
]

# The effects' vtables: slot 0 records, slot 1 the deleting destructor; the
# glow's (0x820088B0) has its setters at slots 2 to 12 and 24.
[PostEffectVtable]
measures = ["[826C5D80].+0", "Glow.+0"]
size = 100
origin = "image"
fields = [
  { name = "record", offset = 0, type = "fn", note = "Glow::Record, ColorFilter::Record, MotionBlur::Record, TargetFilter::Record" },
  { name = "destroy", offset = 4, type = "fn", note = "the deleting destructor (r4 = 1 deletes)" },
  { name = "c33_x_second_setter", offset = 8, type = "fn", note = "glow only: Glow::Set8436 (+8436)" },
  { name = "c33_x_first_setter", offset = 12, type = "fn", note = "glow only: Glow::Set8440 (+8440)" },
  { name = "c34_x_setter", offset = 16, type = "fn", note = "glow only: Glow::Set8444 (+8444)" },
  { name = "c34_y_setter", offset = 20, type = "fn", note = "glow only: Glow::Set8448 (+8448)" },
  { name = "strength_setter", offset = 24, type = "fn", note = "glow only: Glow::Set8452 (+8452)" },
  { name = "c33_z_setter", offset = 28, type = "fn", note = "glow only: Glow::Set8456 (+8456)" },
  { name = "history_weight_setter", offset = 32, type = "fn", note = "glow only: Glow::Set8460 (+8460)" },
  { name = "param_8464_setter", offset = 36, type = "fn", note = "glow only: Glow::Set8464 (+8464)" },
  { name = "star_step_setter", offset = 40, type = "fn", note = "glow only: Glow::Set8468 (+8468)" },
