  { name = "inclination", offset = 100, type = "f32" },
  { name = "rotation", offset = 104, type = "u32", note = "probably a bool (the HDR sample's bRotation)" },
  { name = "colors", offset = 112, type = "bytes", count = 128, note = "eight colors (r, g, b, a) of 16 bytes" },
]

# A star line (StarDef + 4 + 16 i).
[StarLine]
size = 16
origin = "embedded"
fields = [
  { name = "passes", offset = 0, type = "u32" },
  { name = "sample_length", offset = 4, type = "f32" },
  { name = "attenuation", offset = 8, type = "f32" },
  { name = "angle", offset = 12, type = "f32" },
