# The schema of docs/functions/video-output.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The video output (frame driver + 64, vtable 0x8206CAF8): the object
# between the frame driver and the graphics library's device, which it
# makes and holds, with the device lock and the front buffers; and the
# game's sync wrappers under it (Event, Semaphore, ScopedLock), on kernel
# imports. Hand ports: src/graphics/video_output.cpp (the device lock),
# src/hooks/video_mode.cpp (VideoOutput::SetUpDisplay).
#
# Measure faults (for tools/type_map.py): sub_8229DB38 (CreateDevice) stores
# the device through r8 = video output + 140, filed at the video output's
# +0; VideoPresentParameters joins Device::SetUpDisplay's r4 (the whole
# parameters, video output + 16) with Device::SetUpRing's r4 (their +72
# block); DeviceDisplayCapture and DeviceDisplayCaptureLoose are probably the
# Device itself (its +20128 block), and sub_822B4E78's r3 (Device + 20128) is
# joined to it at offset 0; sub_82090F88.r3 is framework.toml's DebugText
# (left out here).

[VideoOutput]
measure = "VideoOutput"
size = 308
origin = "gpu"
vtable = 0x8206CAF8
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x8206CAF8 (also where the measure files CreateDevice's store through +140)" },
  # The presentation parameters (124 bytes at +16, VideoPresentParameters'
  # layout), filled by VideoOutput::SetUpDisplay for Device::Init.
  { name = "params_width", offset = 16, type = "u32", note = "1280" },
  { name = "params_height", offset = 20, type = "u32", note = "720" },
  { name = "params_render_target_format", offset = 24, type = "u32", note = "0x18280186" },
  { name = "params_unknown_12", offset = 28, type = "u32", note = "0" },
  { name = "params_surface_argument", offset = 32, type = "u32", note = "0; passed to both surfaces" },
  { name = "params_unknown_24", offset = 40, type = "u32", note = "1" },
  { name = "params_depth_surface", offset = 52, type = "u32", note = "non-zero for a depth surface (1)" },
  { name = "params_depth_format", offset = 56, type = "u32", note = "0x1A220197" },
  { name = "params_unknown_52", offset = 68, type = "u32", note = "0x80000000" },
  { name = "params_skip_render_target", offset = 72, type = "u32", note = "0 (memset)" },
  { name = "params_no_front_buffer", offset = 76, type = "u32", note = "1: no front buffer from the library" },
  { name = "params_front_buffer_format", offset = 80, type = "u32", note = "0 (memset)" },
  { name = "params_display_format", offset = 84, type = "u32", note = "0 (memset)" },
  { name = "params_ring_unknown_0", offset = 88, type = "u32", note = "0; the +72 block Device::SetUpRing reads" },
  { name = "params_ring_size", offset = 92, type = "u32", note = "65536" },
  { name = "params_ring", offset = 96, type = "u32", note = "64 KB of physical memory" },
  { name = "params_command_buffer_size", offset = 100, type = "u32", note = "1048576" },
  { name = "params_command_buffer", offset = 104, type = "u32", note = "1 MB of physical memory" },
  { name = "params_segments", offset = 108, type = "u32", note = "256" },
  { name = "device", offset = 140, type = "ptr", to = "Device", note = "made by VideoOutput::SetUpDisplay (CreateDevice), 0 on failure" },
  { name = "unknown_144", offset = 144, type = "u32", note = "0 at construction" },
  { name = "unknown_148", offset = 148, type = "u32", note = "0 at construction" },
  { name = "video_mode", offset = 152, type = "bytes", count = 48, note = "where XGetVideoMode's answer went; never read (zeroed by the set-up)" },
  { name = "safe_x", offset = 208, type = "u32", note = "the safe area: 5% of the width (64)" },
  { name = "safe_y", offset = 212, type = "u32", note = "5% of the height (36)" },
  { name = "safe_width", offset = 216, type = "u32", note = "90% of the width (1152)" },
  { name = "safe_height", offset = 220, type = "u32", note = "90% of the height (648)" },
  { name = "device_lock", offset = 224, type = "bytes", count = 40, note = "the game's Semaphore of count 1; a host std::binary_semaphore in its place since 2026-10-24, these bytes no longer written" },
  { name = "unknown_264", offset = 264, type = "u8", note = "0 at construction" },
  { name = "unknown_265", offset = 265, type = "u8", note = "0 at construction" },
  { name = "unknown_266", offset = 266, type = "u8", note = "0 at construction" },
  { name = "unknown_267", offset = 267, type = "u8", note = "255 at construction" },
  { name = "front_buffer_index", offset = 268, type = "u32", note = "0 or 1, flipped by VideoOutput::Present" },
  { name = "front_buffer_0", offset = 272, type = "u32", note = "the front buffers' textures (Device::CreateTexture, format 0x28280106), indexed by front_buffer_index" },
  { name = "front_buffer_1", offset = 276, type = "u32" },
  { name = "unknown_280", offset = 280, type = "u32", note = "0 at construction" },
  { name = "unknown_284", offset = 284, type = "u32", note = "0 at construction" },
  { name = "unknown_288", offset = 288, type = "u32", note = "0 at construction" },
  { name = "unknown_292", offset = 292, type = "u8", note = "0 at construction" },
  { name = "display_width", offset = 296, type = "u32", note = "read by the camera passes and Viewport::Init" },
  { name = "display_height", offset = 300, type = "u32" },
  { name = "vblank_interval", offset = 304, type = "u32", note = "1 for 0 or 1, 2, 3 for 4, 0 for 0x80000000" },
]

# The presentation parameters (124 bytes; the video output's +16, copied to
# device + 13188), as Device::SetUpDisplay (sub_822ACE00) reads them; the
# measure also files here Device::SetUpRing's reads of their +72 block (+4
# ring size, +8 ring, +12 command buffer size, +16 command buffer, +20
# segments), which land on the same offsets.
[VideoPresentParameters]
measure = "Device::SetUpRing.r4"
size = 124
origin = "embedded"
fields = [
  { name = "width", offset = 0, type = "u32" },
  { name = "height", offset = 4, type = "u32", note = "(SetUpRing: the ring's size)" },
  { name = "render_target_format", offset = 8, type = "u32", note = "(SetUpRing: the ring)" },
  { name = "unknown_12", offset = 12, type = "u32", note = "(SetUpRing: the command buffer's size)" },
  { name = "surface_argument", offset = 16, type = "u32", note = "passed to both surfaces (SetUpRing: the command buffer)" },
  { name = "unknown_20", offset = 20, type = "u32", note = "(SetUpRing: the segments)" },
  { name = "unknown_24", offset = 24, type = "u32" },
  { name = "depth_surface", offset = 36, type = "u32", note = "non-zero for a depth surface" },
  { name = "depth_format", offset = 40, type = "u32" },
  { name = "unknown_52", offset = 52, type = "u32" },
  { name = "skip_render_target", offset = 56, type = "u32", note = "non-zero to skip the render target" },
  { name = "no_front_buffer", offset = 60, type = "u32", note = "non-zero to skip the front buffer (the game sets it)" },
  { name = "front_buffer_format", offset = 64, type = "u32" },
  { name = "display_format", offset = 68, type = "u32" },
  { name = "ring_unknown_0", offset = 72, type = "u32" },
  { name = "ring_size", offset = 76, type = "u32" },
  { name = "ring", offset = 80, type = "u32" },
  { name = "command_buffer_size", offset = 84, type = "u32" },
  { name = "command_buffer", offset = 88, type = "u32" },
  { name = "segments", offset = 92, type = "u32" },
  { name = "scaler", offset = 96, type = "u32", note = "the scaler's parameters" },
]

# The game's event (a word: the kernel handle). Event::Create, Wait, Signal.
[Event]
measure = "Event"
size = 4
origin = "embedded"
fields = [
  { name = "handle", offset = 0, type = "u32", note = "CreateEvent's handle (auto-reset); -1 when none" },
]

# The game's semaphore (40 bytes, Semaphore::Init): the device lock's kind
# before it went host, and the archive loader's four.
[Semaphore]
measure = "Semaphore"
size = 40
origin = "embedded"
fields = [
  { name = "event", offset = 0, type = "u32", note = "its Event's handle (auto-reset, not set)" },
  { name = "critical_section", offset = 4, type = "bytes", count = 28, note = "RtlInitializeCriticalSection's" },
  { name = "count", offset = 32, type = "s32", note = "1 at Init; Wait waits while 0 or less; mirrored from the host semaphores for the archive's four" },
  { name = "maximum", offset = 36, type = "u32", note = "1 (probably the maximum; not read by Wait or Signal)" },
]

# A scoped lock (a word on the caller's stack): ScopedLock::ScopedLock and
# ~ScopedLock.
[ScopedLock]
measure = "ScopedLock"
size = 4
origin = "embedded"
fields = [
  { name = "critical_section", offset = 0, type = "u32", note = "the critical section entered" },
]

# Event::Wait's r4: the timeout.
[EventWaitTimeout]
measure = "Event::Wait.r4"
size = 4
origin = "embedded"
fields = [
  { name = "milliseconds", offset = 0, type = "u32", note = "-1 forever" },
]

# QueryPerformanceFrequency's r3: where the rate goes.
[PerformanceFrequency]
measure = "QueryPerformanceFrequency.r3"
size = 8
origin = "embedded"
fields = [
  { name = "frequency", offset = 0, type = "u64", note = "50,000,000 (ours)" },
]

# VideoOutput::UnlockDevice's r4: the caller's word holding the device
# (LockDevice's answer; frame driver + 384 for FrameDriver::DrawFrame).
[VideoOutputDeviceHolder]
measure = "VideoOutput::UnlockDevice.r4"
size = 4
origin = "embedded"
fields = [
  { name = "device", offset = 0, type = "ptr", to = "Device", note = "0 after UnlockDevice" },
]

# The block at device + 20084 (sub_8229D620, never seen in play; not read in
# detail): reference-counted, freed with its buffer when the count reaches 0.
[DeviceSharedBlock]
measure = "Device.+20084"
size = 16
origin = "gpu"
fields = [
  { name = "ref_count", offset = 0, type = "u32", note = "down by 1; at 0 the block goes" },
  { name = "buffer", offset = 4, type = "u32", note = "freed (XMemFree)" },
  { name = "fence", offset = 12, type = "u32", note = "waited on (Device::BlockOnFence) when non-zero, probably" },
]

# sub_822B4680's r3 (never seen in play, not read): probably the device, its
# 312-byte block at +20128 freed and reset (physical memory at +20128 and
# +20132, six words of -1 from +20136); also sub_822B4E78's reads of that
# block at its own offsets (+64..+296, a measure fault).
[DeviceDisplayCapture]
measure = "sub_822B4680.r3"
size = 20436
origin = "gpu"
fields = [
  { name = "unknown_64", offset = 64, type = "u32" },
  { name = "unknown_68", offset = 68, type = "u32" },
  { name = "unknown_72", offset = 72, type = "u32" },
  { name = "unknown_76", offset = 76, type = "u32" },
  { name = "unknown_292", offset = 292, type = "u32" },
  { name = "unknown_296", offset = 296, type = "u8" },
  { name = "capture_memory_0", offset = 20128, type = "u32", note = "freed (XMemFree or MmFreePhysicalMemory, by +20428's top bits)" },
  { name = "capture_memory_1", offset = 20132, type = "u32", note = "freed likewise" },
  { name = "unknown_20136", offset = 20136, type = "u32", note = "-1 after the reset (six words)" },
  { name = "capture_flags", offset = 20428, type = "u32", note = "two bits a block: how each was allocated" },
  { name = "unknown_20432", offset = 20432, type = "u32", note = "kept across the reset" },
]

