# The schema of docs/functions/heap.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# Two kinds of types here. The game's own heap: XAPI's process heap (NT's
# RtlHeap, statically linked; its handle at 0x8297149C), its blocks and
# list links, as HeapAlloc, HeapFree, HeapReAlloc and HeapSize read them
# (routed to our allocation layer since 2026-10-22, src/hooks/heap.cpp, so
# only their never-run originals touch these; the offsets match NT's HEAP
# with a 16-byte HEAP_ENTRY, so 8 bytes past NT's from +16 on: the names
# from NT are "probably"). And the measure's types whose only callee is
# operator new or delete (the classes' deleting destructors and a few
# makers, all lifted and never seen in play): other areas' classes, given
# their names from the docs where the vtable is known; their own areas
# extend or move them when described there.

# The process heap (1,412 bytes seen; made at boot by sub_82297C08).
[ProcessHeap]
measure = "[8297149C]"
size = 1412
origin = "allocated"
fields = [
  { name = "flags", offset = 20, type = "u32", note = "the heap's flags; 0x40000: check the caller's process type (+379)" },
  { name = "force_flags", offset = 24, type = "u32", note = "ORed into every call's flags (HeapReAlloc)" },
  { name = "virtual_memory_threshold", offset = 28, type = "u32", note = "probably (NT's): sizes above it get their own virtual block" },
  { name = "decommit_free_block_threshold", offset = 40, type = "u32", note = "probably (NT's), read by HeapFree" },
  { name = "decommit_total_free_threshold", offset = 44, type = "u32", note = "probably (NT's), read by HeapFree" },
  { name = "total_free_size", offset = 48, type = "u32", note = "probably (NT's): updated by every allocation and free" },
  { name = "align_round", offset = 80, type = "u32", note = "added to a size before align_mask (HeapReAlloc)" },
  { name = "align_mask", offset = 84, type = "u32" },
  { name = "process_type", offset = 379, type = "u8", note = "compared with KeGetCurrentProcessType when flags has 0x40000" },
  { name = "unknown_380", offset = 380, type = "u32", note = "read by HeapReAlloc: when 0 (and no other flag), the size isn't padded by 16" },
  { name = "large_free_first", offset = 384, type = "ptr", to = "HeapListEntry", note = "free list 0's head (blocks of 128 units and more, by size)" },
  { name = "large_free_last", offset = 388, type = "ptr", to = "HeapListEntry" },
  { name = "free_lists", offset = 392, type = "bytes", count = 1016, note = "free lists 1 to 127 (8 bytes each, indexed by size)" },
  { name = "lock", offset = 1408, type = "u32", note = "the heap's critical section (taken unless the flags have 0x1)" },
]

# A list link: a free block's (8 bytes into its header) or a large virtual
# block's (48 bytes before the block).
[HeapListEntry]
measures = ["[8297149C].+384", "[8297149C].+384.+0", "[8297149C].+388",
            "HeapFree.r5.+-44", "HeapFree.r5.+-48"]
size = 8
origin = "embedded"
fields = [
  { name = "free_size", offset = -8, type = "u16", note = "a free block's size in 16-byte units (its header's +0)" },
  { name = "next", offset = 0, type = "ptr", to = "HeapListEntry" },
  { name = "previous", offset = 4, type = "ptr", to = "HeapListEntry" },
]

# A block as the game holds it: its 16-byte header right before it (+0 the
# size, +4 the segment, +5 the flags, +6 the unused bytes), a large block's
# virtual entry 48 bytes before it.
[HeapBlock]
measures = ["HeapFree.r5", "HeapSize.r5", "new<?>@HeapReAlloc", "[8297149C].+384.+0.+4"]
size = 0
origin = "allocated"
fields = [
  { name = "large_next", offset = -48, type = "u32", note = "a large block's link in the heap's virtual blocks list" },
  { name = "large_previous", offset = -44, type = "u32" },
  { name = "unknown_m48", offset = -48, type = "u16", note = "HeapReAlloc's in-place resize: a header's size the measure puts 48 bytes before the block (probably another header than this block's)" },
  { name = "unknown_m44", offset = -44, type = "u8", note = "the same header's segment index (probably)" },
  { name = "unknown_m43", offset = -43, type = "u8", note = "the same header's flags (probably)" },
  { name = "large_commit_size", offset = -24, type = "u32", note = "a large block's committed bytes (HeapSize: less the unused bytes and 48)" },
  { name = "size", offset = -16, type = "u16", note = "in 16-byte units; a large block's unused bytes" },
  { name = "flags", offset = -11, type = "u8", note = "0x1 busy, 0x2 with extra, 0x8 a large virtual block" },
  { name = "unused_bytes", offset = -10, type = "u8" },
  { name = "link_next", offset = 0, type = "u32", note = "the measure joins HeapReAlloc's block with a free link: the free lists' next written here" },
]

# _calloc_impl's r5: where the error goes (calloc's stack word).
[CallocErrorOut]
measure = "_calloc_impl.r5"
size = 4
origin = "embedded"
fields = [
  { name = "error", offset = 0, type = "u32", note = "12 (ENOMEM) on failure" },
]

# D3DX's buffer (D3DXCreateBuffer, functions.md; 16 bytes from XMemAlloc).
[D3DXBuffer]
measure = "new<16>@D3DXCreateBuffer"
size = 16
origin = "allocated"
vtable = 0x82019DC0
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "ref_count", offset = 4, type = "u32" },
  { name = "size", offset = 8, type = "u32" },
  { name = "data", offset = 12, type = "u32", note = "the buffer's bytes (vtable slot 6's XMemAlloc)" },
]

# D3DXCreateBuffer's r4: where the buffer goes.
[D3DXBufferOut]
measure = "D3DXCreateBuffer.r4"
size = 4
origin = "embedded"
fields = [
  { name = "buffer", offset = 0, type = "ptr", to = "D3DXBuffer" },
]

# std::exception (std::bad_alloc's base), as its copy constructor
# sub_825A67A8 reads the source (r4) and writes the copy (r3).
[StdException]
measures = ["sub_825A67A8.r3", "sub_825A67A8.r4"]
size = 12
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82000CC0 (std::exception's)" },
  { name = "what", offset = 4, type = "ptr", to = "ExceptionMessage" },
  { name = "owns_what", offset = 8, type = "u32", note = "probably: set when what was copied into a block of its own" },
]

# The message std::exception holds (a C string).
[ExceptionMessage]
measure = "sub_825A67A8.r4.+4"
size = 1
origin = "allocated"
fields = [
  { name = "first_char", offset = 0, type = "u8" },
]

# Objects seen only in their deleting destructors, which put back the base
