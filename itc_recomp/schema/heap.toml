# The schema of docs/functions/heap.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# Two kinds of types here. The game's own heap: XAPI's process heap (NT's
# RtlHeap, statically linked; its handle at 0x8297149C), its blocks and
# list links, as HeapAlloc, HeapFree, HeapReAlloc and HeapSize read them
# (routed to our allocation layer since 2026-10-22, src/hooks/heap.cpp, so
# only their never-run originals touch these; the offsets match NT's HEAP
# with a 16-byte HEAP_ENTRY, so 8 bytes past NT's from +16 on: the names
# from NT are "probably"). And the measure's types whose only callee is
# operator new or delete (the classes' deleting destructors and a few
# makers, all lifted and never seen in play): other areas' classes, given
# their names from the docs where the vtable is known; their own areas
# extend or move them when described there.
# Moved to their owners at E5 step 2's integration: Framework and
# DebugText (framework.toml), SaveSlot (files-and-saves.toml), CommandList
# (command-list.toml), Skeleton and PrimitiveDrawer (model-animation.toml),
# TextureProvider (models.toml), Movie, MovieWrapper and
# MovieWrapperVtable (movies.toml).

# The process heap (1,412 bytes seen; made at boot by sub_82297C08).
[ProcessHeap]
measure = "[8297149C]"
size = 1412
origin = "allocated"
fields = [
  { name = "flags", offset = 20, type = "u32", note = "the heap's flags; 0x40000: check the caller's process type (+379)" },
  { name = "force_flags", offset = 24, type = "u32", note = "ORed into every call's flags (HeapReAlloc)" },
  { name = "virtual_memory_threshold", offset = 28, type = "u32", note = "probably (NT's): sizes above it get their own virtual block" },
  { name = "decommit_free_block_threshold", offset = 40, type = "u32", note = "probably (NT's), read by HeapFree" },
  { name = "decommit_total_free_threshold", offset = 44, type = "u32", note = "probably (NT's), read by HeapFree" },
  { name = "total_free_size", offset = 48, type = "u32", note = "probably (NT's): updated by every allocation and free" },
  { name = "align_round", offset = 80, type = "u32", note = "added to a size before align_mask (HeapReAlloc)" },
  { name = "align_mask", offset = 84, type = "u32" },
  { name = "process_type", offset = 379, type = "u8", note = "compared with KeGetCurrentProcessType when flags has 0x40000" },
  { name = "unknown_380", offset = 380, type = "u32", note = "read by HeapReAlloc: when 0 (and no other flag), the size isn't padded by 16" },
  { name = "large_free_first", offset = 384, type = "ptr", to = "HeapListEntry", note = "free list 0's head (blocks of 128 units and more, by size)" },
  { name = "large_free_last", offset = 388, type = "ptr", to = "HeapListEntry" },
  { name = "free_lists", offset = 392, type = "bytes", count = 1016, note = "free lists 1 to 127 (8 bytes each, indexed by size)" },
  { name = "lock", offset = 1408, type = "u32", note = "the heap's critical section (taken unless the flags have 0x1)" },
]

# A list link: a free block's (8 bytes into its header) or a large virtual
# block's (48 bytes before the block).
[HeapListEntry]
measures = ["[8297149C].+384", "[8297149C].+384.+0", "[8297149C].+388",
            "HeapFree.r5.+-44", "HeapFree.r5.+-48"]
size = 8
origin = "embedded"
fields = [
  { name = "free_size", offset = -8, type = "u16", note = "a free block's size in 16-byte units (its header's +0)" },
  { name = "next", offset = 0, type = "ptr", to = "HeapListEntry" },
  { name = "previous", offset = 4, type = "ptr", to = "HeapListEntry" },
]

# A block as the game holds it: its 16-byte header right before it (+0 the
# size, +4 the segment, +5 the flags, +6 the unused bytes), a large block's
# virtual entry 48 bytes before it.
[HeapBlock]
measure = "HeapFree.r5"
measures = ["HeapSize.r5", "new<?>@HeapReAlloc", "[8297149C].+384.+0.+4", "HeapReAlloc.r5"]
size = 0
origin = "allocated"
fields = [
  { name = "large_next", offset = -48, type = "u32", note = "a large block's link in the heap's virtual blocks list" },
  { name = "large_previous", offset = -44, type = "u32" },
  { name = "unknown_m48", offset = -48, type = "u16", note = "HeapReAlloc's in-place resize: a header's size the measure puts 48 bytes before the block (probably another header than this block's)" },
  { name = "unknown_m44", offset = -44, type = "u8", note = "the same header's segment index (probably)" },
  { name = "unknown_m43", offset = -43, type = "u8", note = "the same header's flags (probably)" },
  { name = "large_commit_size", offset = -24, type = "u32", note = "a large block's committed bytes (HeapSize: less the unused bytes and 48)" },
  { name = "size", offset = -16, type = "u16", note = "in 16-byte units; a large block's unused bytes" },
  { name = "flags", offset = -11, type = "u8", note = "0x1 busy, 0x2 with extra, 0x8 a large virtual block" },
  { name = "unused_bytes", offset = -10, type = "u8" },
  { name = "link_next", offset = 0, type = "u32", note = "the measure joins HeapReAlloc's block with a free link: the free lists' next written here" },
]

# _calloc_impl's r5: where the error goes (calloc's stack word).
[CallocErrorOut]
measure = "_calloc_impl.r5"
size = 4
origin = "embedded"
fields = [
  { name = "error", offset = 0, type = "u32", note = "12 (ENOMEM) on failure" },
]

# D3DX's buffer (D3DXCreateBuffer, functions.md; 16 bytes from XMemAlloc).
[D3DXBuffer]
measure = "new<16>@D3DXCreateBuffer"
size = 16
origin = "allocated"
vtable = 0x82019DC0
# In host memory (E5 step 4, 2026-11-24): made only by D3DXCreateBuffer's
# XMemAlloc (returning at 0x822BE484), freed only by its deleting
# destructor sub_822BE3E8's XMemFree of the object (0x822BE430; r3 0, as
# LocalFree leaves it). The data block (+12) stays guest memory. Its
# getters are shared leaves read through other types' views (File::GetSize
# sub_822B80D8 at +12, WordAt8 sub_822BE2C8 at +8, XAudioVoice::AddRef
# sub_8245F860 at +4): raw accesses the handles resolve.
storage = "host"
host_alloc = [0x822BE484]
host_free = [{ call = 0x822BE430, reg = "r3", returns = 0 }]
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "ref_count", offset = 4, type = "u32" },
  { name = "size", offset = 8, type = "u32" },
  { name = "contents", offset = 12, type = "u32", note = "the buffer's bytes (vtable slot 6's XMemAlloc)" },
]

# D3DXCreateBuffer's r4: where the buffer goes.
[D3DXBufferOut]
measure = "D3DXCreateBuffer.r4"
size = 4
origin = "embedded"
fields = [
  { name = "buffer", offset = 0, type = "ptr", to = "D3DXBuffer" },
]

# std::exception (std::bad_alloc's base), as its copy constructor
# sub_825A67A8 reads the source (r4) and writes the copy (r3).
[StdException]
# measures from StdLogicError (screen-objects), merged at the integration
measures = ["sub_825A67A8.r3", "sub_825A67A8.r4",
  "sub_820919B8.r3", "sub_820915F8.r3"]
size = 12
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82000CC0 (std::exception's)" },
  { name = "what", offset = 4, type = "ptr", to = "ExceptionMessage" },
  { name = "owns_what", offset = 8, type = "u32", note = "probably: set when what was copied into a block of its own" },
]

# The message std::exception holds (a C string).
[ExceptionMessage]
measure = "sub_825A67A8.r4.+4"
size = 1
origin = "allocated"
fields = [
  { name = "first_char", offset = 0, type = "u8" },
]

# Objects seen only in their deleting destructors, which put back the base
# class's vtable and call operator delete (bit 0 of r4): the vtables are
# 0x82000A74, 0x82000AB4 (sub_82090268, sub_820AC950), 0x82000D84 (the
# run loop's interface), 0x82000DA0, 0x82000DD0, 0x82000EB8, 0x82001EC0
# (Camera), 0x82002148 (the save interface's base), 0x820024C8, 0x82002880
# (the app states' base), 0x82007F18 and 0x820713C0 (ClientList),
# 0x820085D8 (Overlay), 0x82008838 (the post effects' base), 0x82010B5C,
# 0x8206CB30 and 0x82000ED4 (Thread), 0x8206CBE4, 0x8206CC00 (the input
# processors' base), 0x82071380 (ClientNode).
[VtableObject]
measures = ["sub_820901D8.r3", "sub_82090268.r3", "sub_820926C8.r3", "sub_820927E8.r3",
            "sub_82092830.r3", "sub_82094B68.r3", "sub_8209FB80.r3", "sub_820A44C0.r3",
            "sub_820A70B0.r3", "sub_820AC950.r3", "sub_820ACCF0.r3", "sub_8210B0E8.r3",
            "sub_8210B0E8.ret", "sub_82126818.r3", "sub_82133C18.r3", "sub_82589480.r3",
            "sub_8258DEB8.r3", "sub_8258DEB8.ret", "sub_82591898.r3", "sub_825925A8.r3",
            "sub_8259C8C8.r3", "sub_8259C910.r3"]
size = 4
origin = "allocated"
storage = "dual"
fields = [
  { name = "vtable", offset = 0, type = "u32" },
]

# An 8-byte object with two vtables (0x82000EB8, then 0x82000BA8 and
# 0x82000AB4 at +4), deleted by sub_82090D68; the same pair is embedded in
# the debug text (+8) and the movie (+12).
[DualVtableObject]
measure = "sub_82090D60.r3@-4"
size = 8
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "vtable_4", offset = 4, type = "u32" },
]

# An object holding a std::vector at +4 (begin, end, end of storage), freed
# and cleared by sub_820A9010; sub_820A9208 (vtable 0x82002780) deletes one
# at its +4.
[VectorHolder]
measure = "sub_820A9010.r3"
size = 16
origin = "allocated"
fields = [
  { name = "first", offset = 4, type = "u32" },
  { name = "last", offset = 8, type = "u32" },
  { name = "end", offset = 12, type = "u32" },
]

[VectorHolderOwner]
measure = "sub_820A9208.r3"
size = 8
origin = "allocated"
vtable = 0x82002780
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "holder", offset = 4, type = "ptr", to = "VectorHolder" },
]

# The objects sub_820A81C0 makes (not read, never seen in play): items with
# a vtable, +4 0, +8 their argument and +12 a value block of their own.
[FloatPairItem]
measure = "new<16>@sub_820A81C0#2"
# "FloatPairItem": its constructor's r3 since sub_820A70F8 was named
# (2026-11-22).
measures = ["FloatPairItem"]
size = 16
origin = "allocated"
vtable = 0x82002518
# In host memory (E5 step 4, 2026-11-24): made by sub_820A81C0's operator
# new for kind 10 (returning at 0x820A822C), freed by its deleting
# destructor sub_820A71C8's operator delete (0x820A71F8). Not seen in play.
storage = "host"
host_alloc = [0x820A822C]
host_free = [{ call = 0x820A71F8, reg = "r3" }]
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "unknown_4", offset = 4, type = "u32", note = "0 when made" },
  { name = "argument", offset = 8, type = "u32", note = "the maker's r4" },
  { name = "value", offset = 12, type = "ptr", to = "FloatPair" },
]

[FloatPair]
measure = "new<12>@FloatPairItem::FloatPairItem"
size = 12
origin = "allocated"
# In host memory (E5 step 3; the lead's check of lift.py's host_alloc and
# host_free, 2026-11-22): made by sub_820A70F8's operator new (returning at
# 0x820A7130), freed by FloatPairItem's destructor sub_820A7180's operator
# delete (0x820A71A8, r3 kept as operator delete leaves it). Not seen in play.
storage = "host"
host_alloc = [0x820A7130]
host_free = [{ call = 0x820A71A8, reg = "r3" }]
fields = [
  { name = "flag", offset = 0, type = "u8", note = "1 when made" },
  { name = "a", offset = 4, type = "f32", note = "both set to the float at 0x82000A34" },
  { name = "b", offset = 8, type = "f32" },
]

[FloatTripleItem]
measure = "new<16>@sub_820A81C0"
size = 16
origin = "allocated"
vtable = 0x82002628
# In host memory (E5 step 4, 2026-11-24): made by sub_820A81C0's operator
# new for kind 11 (returning at 0x820A8204), freed by its deleting
# destructor sub_820A7C00's operator delete (0x820A7C30). Not seen in play.
storage = "host"
host_alloc = [0x820A8204]
host_free = [{ call = 0x820A7C30, reg = "r3" }]
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "unknown_4", offset = 4, type = "u32", note = "0 when made" },
  { name = "argument", offset = 8, type = "u32", note = "the maker's r4" },
  { name = "value", offset = 12, type = "ptr", to = "FloatTriple" },
]

[FloatTriple]
measure = "new<20>@sub_820A7AF8"
size = 20
origin = "allocated"
# In host memory (E5 step 4, 2026-11-24, as FloatPair): made by
# sub_820A7AF8's operator new (returning at 0x820A7B28), freed by
# FloatTripleItem's destructor sub_820A7B78's operator delete (0x820A7BA0).
# Not seen in play.
storage = "host"
host_alloc = [0x820A7B28]
