# 0x820085D8 (Overlay), 0x82008838 (the post effects' base), 0x82010B5C,
# 0x8206CB30 and 0x82000ED4 (Thread), 0x8206CBE4, 0x8206CC00 (the input
# processors' base), 0x82071380 (ClientNode).
[VtableObject]
measures = ["sub_820901D8.r3", "sub_82090268.r3", "sub_820926C8.r3", "sub_820927E8.r3",
            "sub_82092830.r3", "sub_82094B68.r3", "sub_8209FB80.r3", "sub_820A44C0.r3",
            "sub_820A70B0.r3", "sub_820AC950.r3", "sub_820ACCF0.r3", "sub_8210B0E8.r3",
            "sub_8210B0E8.ret", "sub_82126818.r3", "sub_82133C18.r3", "sub_82589480.r3",
            "sub_8258DEB8.r3", "sub_8258DEB8.ret", "sub_82591898.r3", "sub_825925A8.r3",
            "sub_8259C8C8.r3", "sub_8259C910.r3"]
size = 4
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "u32" },
]

