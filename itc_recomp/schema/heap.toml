# The 64-byte item sub_820A81C0 makes (vtable 0x820025D8, set by sub_820A7688).
[Item820025D8]
measure = "new<64>@sub_820A81C0"
size = 64
origin = "allocated"
vtable = 0x820025D8
# In host memory (E5 step 4, 2026-11-24): made by sub_820A81C0's operator
# new for kind 9 (returning at 0x820A8254); freed by the base's deleting
# destructor sub_820A70B0 (its vtable's slot 0, shared with every
# VtableObject), whose operator delete tells handles from guest addresses.
# Not seen in play.
storage = "host"
host_alloc = [0x820A8254]
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "argument", offset = 8, type = "u32", note = "the maker's r4" },
  { name = "unknown_16", offset = 16, type = "u64" },
  { name = "unknown_24", offset = 24, type = "u64" },
  { name = "unknown_28", offset = 28, type = "f32" },
  { name = "unknown_32", offset = 32, type = "u64" },
  { name = "unknown_40", offset = 40, type = "u64" },
  { name = "unknown_44", offset = 44, type = "f32" },
  { name = "unknown_48", offset = 48, type = "f32" },
  { name = "unknown_52", offset = 52, type = "f32" },
]

# A list of 12-byte entries with a byte count, as sub_825788C0 (not read,
# never seen in play; XMemAlloc and XMemFree) reads and copies it.
[ByteCountedList]
measures = ["sub_825788C0.r3", "new<8>@sub_825788C0"]
size = 8
origin = "allocated"
# Dual (E5 step 4, 2026-11-24): the copies sub_825788C0 makes are host
# (its XMemAlloc returning at 0x8257899C; freed by its own XMemFree on
# failure, 0x82578ADC, and by sub_82578AF0's when the engine's call fails,
# 0x82578BEC; r3 0, as LocalFree leaves it); the list it copies (r3, its
# caller's argument +4) may be guest memory. The entries block (+4) stays
# guest memory. Voice (XHV) code: Dropped, never runs.
storage = "dual"
host_alloc = [0x8257899C]
host_free = [{ call = 0x82578ADC, reg = "r3", returns = 0 },
             { call = 0x82578BEC, reg = "r3", returns = 0 }]
fields = [
  { name = "count", offset = 0, type = "u8" },
  { name = "entries", offset = 4, type = "u32", note = "count 12-byte entries, compared by their first byte" },
]

# sub_82578AF0's r5 (not read): +4 a ByteCountedList handed to sub_825788C0.
[ByteCountedListArgs]
measure = "sub_82578AF0.r5"
size = 12
origin = "embedded"
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "list", offset = 4, type = "ptr", to = "ByteCountedList" },
  { name = "unknown_8", offset = 8, type = "u32" },
]

[globals]
process_heap = { address = 0x8297149C, type = "ptr", to = "ProcessHeap", note = "GetProcessHeap's word, made at boot by sub_82297C08" }
no_large_physical_pages = { address = 0x829537B0, type = "u32", note = "when not 0, XPhysicalAlloc and XPhysicalAllocEx clear X_MEM_LARGE_PAGES from the protection" }
physical_protections = { address = 0x82638770, type = "u32", note = "XMemAlloc's protections for physical memory: four words, by (attributes >> 28) & 3" }
new_handler = { address = 0x82971170, type = "fn", note = "the new handler _callnewh calls" }
new_mode = { address = 0x8297119C, type = "u32", note = "probably _newmode: malloc retries through _callnewh when set" }
