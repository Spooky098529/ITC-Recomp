# The schema of docs/functions/career.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The player's career over the save data (SaveData::Of(i), 0x1F978 bytes,
# docs/known-data.md): the stats record at +48, the 12-byte records of the
# 400 items at +0x199F8, the unlocks, the rewards, the garage's list at
# +6120 and the day's offers. Names are ours and mostly guesses (the
# career's rows say how much is read).
#
# Measure faults (tools/type_map.py), kept as fields with their own names:
# Stats::AddRaceResult's r3 (the save data) and DayLog::Push's r4 (the day
# block, stats +24) are joined with the stats record (Stats); the counters,
# the day block and the week's block (all a counter first) are one measure
# (Counter); sub_820FF5A0's object (race-hud-object.md's best splits) is
# joined with the save data through ItemRecords; Garage::InsertCar's r3 (the
# garage list, save +6120) is joined with the save data (Garage).
# CareerSave is the same object as the save data other areas meet through
# SaveData::Of.ret (not claimed here: another area's measure).

# A player's save data, as the career reads it.
[CareerSave]
measures = ["Career", "Progress", "Garage", "Items", "ItemRecords", "memcpy_825A7410.ret"]
size = 129400
origin = "allocated"
fields = [
  { name = "new_game", offset = 0, type = "u32", note = "1 for a new game (SaveData::Create)" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "pick", offset = 8, type = "bytes", count = 20, note = "the next pick (a CareerPick: Career::PickNext, Career::PickFromCar)" },
  { name = "pick_kept", offset = 28, type = "bytes", count = 20, note = "the pick's copy (a CareerPick), kept by Career::PickNext when unchanged" },
  { name = "stats", offset = 48, type = "bytes", count = 6040, note = "the stats record (a CareerStats)" },
  { name = "splits_fault_60", offset = 60, type = "u32", note = "measure fault: sub_820FF5A0's object's +60 (race-hud-object.md's best splits), not the save data's" },
  { name = "splits_fault_64", offset = 64, type = "u32", note = "measure fault: sub_820FF5A0's object's +64" },
  { name = "splits_fault_68", offset = 68, type = "u32", note = "measure fault: sub_820FF5A0's object's +68" },
  { name = "splits_fault_72", offset = 72, type = "u32", note = "measure fault: sub_820FF5A0's object's +72" },
  { name = "kind5_won", offset = 6048, type = "u32", note = "an item of kind 5 (byte +35) beaten (Stats::AddRaceResult; Items::AllWonKind5Or4 reads it)" },
  { name = "play_time_mark", offset = 6088, type = "u32", note = "the frame counter [0x826C5B90] PlayTime::Add measures from (PlayTime::Mark)" },
  { name = "stages", offset = 6092, type = "u32", note = "the stages reached, a bit each (SaveData::FirstUnsetFlag)" },
  { name = "unknown_6096", offset = 6096, type = "u32" },
  { name = "day", offset = 6100, type = "u32", note = "the day (7 a week; 1 a fixed rival race)" },
  { name = "mode", offset = 6104, type = "u32", note = "the race mode" },
  { name = "location", offset = 6108, type = "u32", note = "14 to 19, 48" },
  { name = "next_location", offset = 6112, type = "u32", note = "48 at the set-up; else put into +6108 after the race" },
  { name = "money", offset = 6116, type = "u32", note = "3000 for a new game, at most 9,999,999" },
  { name = "garage", offset = 6120, type = "bytes", count = 98612, note = "the garage's list (a CareerGarageList): 4-byte nodes, the cars of 1,968 bytes from +6332" },
  { name = "garage_free", offset = 6320, type = "u16", note = "the garage list's free list (+200)" },
  { name = "unknown_6322", offset = 6322, type = "u16" },
  { name = "garage_head", offset = 6324, type = "u16", note = "the garage list's head (+204)" },
  { name = "unknown_6326", offset = 6326, type = "u16" },
  { name = "garage_count", offset = 6328, type = "u16", note = "the garage list's count (+208)" },
  { name = "selected_car", offset = 104736, type = "u32", note = "0x19920: the selected garage car, a position in the list" },
  { name = "reward_cars", offset = 104740, type = "bytes", count = 12, note = "0x19924: a bit set (Rewards::Grant's kind 38)" },
  { name = "unlock_set", offset = 104752, type = "bytes", count = 60, note = "0x19930: the unlocks the rewards set (a copy of 0x826C50A8)" },
  { name = "unlock_set_2", offset = 104812, type = "bytes", count = 60, note = "0x1996C: a copy of 0x826C3044 (less 0x826C3E34's bits)" },
  { name = "reward_set_40", offset = 104872, type = "bytes", count = 28, note = "0x199A8: a copy of 0x826C3C24 (Rewards::Grant's kind 40)" },
  { name = "reward_set_41", offset = 104900, type = "bytes", count = 28, note = "0x199C4: a copy of 0x826C50E4 (Rewards::Grant's kind 41)" },
  { name = "locations", offset = 104928, type = "bytes", count = 8, note = "0x199E0: the locations unlocked (Locations::Unlock; the race data's +20)" },
  { name = "locations_2", offset = 104936, type = "bytes", count = 8, note = "0x199E8: Locations::Unlock2's bits" },
  { name = "item_records", offset = 104952, type = "bytes", count = 4800, note = "0x199F8: 400 records of 12 bytes (CareerItemRecord) by item id" },
  { name = "unknown_109792", offset = 109792, type = "u32", note = "0x1ACE0: cleared by Career::NextDay" },
  { name = "item_flags", offset = 109796, type = "bytes", count = 52, note = "0x1ACE4: a 400-bit set (ItemFlags::Set), all set but bits 310 to 375" },
  { name = "unknown_109848", offset = 109848, type = "u32" },
  { name = "offers", offset = 109856, type = "bytes", count = 600, note = "0x1AD20: 6 locations of 100 bytes (12-byte entries {0, table, entry}, the count at +96)" },
  { name = "table_words", offset = 110456, type = "bytes", count = 6144, note = "0x1AF78: a word for each entry of tables 0 to 7, 768 bytes a table (table 1 at 0x1B278, tables 2 to 7 from 0x1B578; 2 done); table 0's probably" },
  { name = "unlocks_shown", offset = 116600, type = "bytes", count = 768, note = "0x1C778: 64 12-byte entries {0, table, entry}, the unlocks to show" },
  { name = "unlocks_shown_count", offset = 117368, type = "u32", note = "0x1CA78" },
  { name = "table0_done", offset = 117372, type = "bytes", count = 8, note = "0x1CA7C: a bit set, table 0's entries unlocked" },
  { name = "rewards_shown", offset = 117380, type = "bytes", count = 2688, note = "0x1CA84: 12-byte entries {0, 8, index}, the rewards to show" },
  { name = "rewards_shown_count", offset = 120068, type = "u32", note = "0x1D504" },
  { name = "rewards_granted", offset = 120072, type = "bytes", count = 28, note = "0x1D508: a bit set, the 40-byte entries granted" },
  { name = "movie_after_results", offset = 120100, type = "u32", note = "0x1D524: a movie to play after the day's results, -1 none" },
  { name = "unknown_120104", offset = 120104, type = "u32" },
]

# The 20-byte pick at the save data's +8 (and its copy at +28).
[CareerPick]
measures = ["sub_82110CA8.r4", "sub_82111140.r4", "sub_82112260.r4", "sub_82115550.r4", "sub_82115708.r4"]
size = 20
origin = "embedded"
fields = [
  { name = "level", offset = 0, type = "u8", note = "0 to 15, from the stats' races (Career::PickNext)" },
  { name = "head", offset = 0, type = "u32", note = "the level's word, stored whole by sub_82112260" },
  { name = "first_kind", offset = 4, type = "u32", note = "4 from a garage car; 5 with +8 17 to 70 makes it special (Pick::IsSpecial)" },
  { name = "first_value", offset = 8, type = "u16", note = "a garage car's byte +1569 (Career::PickFromCar)" },
  { name = "first_set", offset = 10, type = "u8" },
  { name = "second_kind", offset = 12, type = "u32", note = "3 from a garage car" },
  { name = "second_value", offset = 16, type = "u16", note = "a garage car's id % 4 (Career::PickFromCar)" },
  { name = "second_set", offset = 18, type = "u8" },
]

# The stats record: the save data's +48.
[CareerStats]
measure = "Stats"
size = 6040
origin = "embedded"
fields = [
  { name = "counter", offset = 0, type = "bytes", count = 24, note = "a CareerCounter" },
  { name = "day", offset = 24, type = "bytes", count = 4840, note = "the day block (a CareerCounter first), cleared by Stats::StartDay" },
  { name = "week", offset = 4864, type = "bytes", count = 60, note = "the week's block (a CareerCounter first), cleared on day 0 of 7" },
  { name = "other_counter", offset = 4924, type = "bytes", count = 24, note = "another CareerCounter" },
  { name = "results", offset = 4948, type = "bytes", count = 724, note = "the last 15 results (a CareerResults)" },
  { name = "day_log", offset = 5672, type = "bytes", count = 124, note = "the last 10 days (a CareerDayLog)" },
  { name = "by_mode", offset = 5796, type = "bytes", count = 84, note = "14 bytes a mode: halfwords +2 wins, +4 losses, +6 outcome 3, +8, +10 races, +12" },
  { name = "mean_812", offset = 5880, type = "f32", note = "a running mean {float, count}: the result's +812 (Stats::AddRaceResult)" },
  { name = "mean_812_count", offset = 5884, type = "u32" },
  { name = "mean_816", offset = 5888, type = "f32", note = "the result's +816" },
  { name = "mean_816_count", offset = 5892, type = "u32" },
  { name = "mean_788", offset = 5896, type = "f32", note = "the result's +788 x [0x820082A0] (the stage's type 0)" },
  { name = "mean_788_count", offset = 5900, type = "u32" },
  { name = "mean_796", offset = 5904, type = "f32", note = "the result's mean at +796 (RunningMean::MergeTwo)" },
  { name = "mean_796_count", offset = 5908, type = "u32" },
  { name = "mean_820", offset = 5912, type = "f32", note = "the result's float +820" },
  { name = "mean_820_count", offset = 5916, type = "u32" },
  { name = "mean_won", offset = 5920, type = "f32", note = "100.0 a race the result's +784 is set, else 0.0" },
  { name = "mean_won_count", offset = 5924, type = "u32" },
  { name = "mean_day_ratio", offset = 5928, type = "f32", note = "each day's +5952 x 100 / +5956 (Stats::CloseDay)" },
  { name = "mean_day_ratio_count", offset = 5932, type = "u32" },
  { name = "mean_day_total_8", offset = 5936, type = "f32", note = "each day's +5960" },
  { name = "mean_day_total_8_count", offset = 5940, type = "u32" },
  { name = "mean_day_total_12", offset = 5944, type = "f32", note = "each day's +5964" },
  { name = "mean_day_total_12_count", offset = 5948, type = "u32" },
  { name = "day_total_4", offset = 5952, type = "u32", note = "the day's sums of the race data's +0xA3AD4 (Progress::AfterRace)" },
  { name = "day_total_0", offset = 5956, type = "u32", note = "of +0xA3AD0 (1 at the day's start)" },
  { name = "day_total_8", offset = 5960, type = "u32", note = "of +0xA3AD8" },
  { name = "day_total_12", offset = 5964, type = "u32", note = "of +0xA3ADC / 50" },
  { name = "best_win_streak", offset = 5968, type = "u16" },
  { name = "win_streak", offset = 5970, type = "u16", note = "up to 9,999" },
  { name = "loss_streak", offset = 5972, type = "u16" },
  { name = "best_804", offset = 5976, type = "f32", note = "the largest result's +804" },
  { name = "best_828", offset = 5980, type = "f32", note = "the largest result's +828 x [0x820029D8] (the stage's type 0)" },
  { name = "best_828_2", offset = 5984, type = "f32", note = "as +5980" },
  { name = "sum_820", offset = 5988, type = "f32", note = "the results' +820 added" },
  { name = "unknown_5992", offset = 5992, type = "f32" },
  { name = "best_16", offset = 5996, type = "u32", note = "the largest result's +16 (unsigned)" },
  { name = "kind5_won", offset = 6000, type = "u32", note = "the save data's +6048 (CareerSave.kind5_won)" },
  { name = "cars_sold", offset = 6006, type = "u16", note = "probably (Garage::Sell), up to 9,999" },
  { name = "unknown_6008", offset = 6008, type = "u32" },
  { name = "points", offset = 6024, type = "u32", note = "probably the money earned, at most 9,999,999 (Stats::AddPoints)" },
  { name = "days", offset = 6028, type = "u16", note = "up to 9,999 (Stats::CloseDay)" },
  { name = "unknown_6032", offset = 6032, type = "u32" },
  { name = "unknown_6036", offset = 6036, type = "u8" },
  { name = "unknown_6037", offset = 6037, type = "u8" },
  { name = "unknown_6038", offset = 6038, type = "u8" },
  { name = "save_best_828", offset = 6028, type = "f32", note = "measure fault: Stats::AddRaceResult's r3 is the save data (stats +5980)" },
  { name = "save_sum_820", offset = 6036, type = "f32", note = "measure fault: the save data's +6036 (stats +5988)" },
  { name = "save_best_16", offset = 6044, type = "u32", note = "measure fault: the save data's +6044 (stats +5996)" },
  { name = "save_kind5_won", offset = 6048, type = "u32", note = "measure fault: the save data's +6048" },
  { name = "save_mode", offset = 6104, type = "u32", note = "measure fault: the save data's +6104 (the mode)" },
]

# A 24-byte counter (the stats record's +0 and +4924), the day block (stats
# +24: a counter, then today's opponents) and the week's block (stats +4864:
# a counter, then the week's sums): one measure, so one type; the day's and
# the week's fields overlap past the counter.
[CareerCounter]
measure = "Counter"
size = 4840
origin = "embedded"
fields = [
  { name = "won_kinds", offset = 0, type = "u32", note = "a bit set of the item kinds (byte +35) first won against" },
  { name = "lost_kinds", offset = 4, type = "u32", note = "first lost against" },
  { name = "outcome3_kinds", offset = 8, type = "u32", note = "first outcome 3 against" },
  { name = "wins", offset = 12, type = "u16", note = "up to 9,999" },
  { name = "losses", offset = 14, type = "u16" },
  { name = "outcome3", offset = 16, type = "u16" },
  { name = "unknown_18", offset = 18, type = "u16", note = "counted by Stats::AddRaceResult on a loss whose result's +3920 is 3" },
  { name = "rival_wins", offset = 20, type = "u16", note = "probably (Career::AddRivalWin)" },
  { name = "races", offset = 22, type = "u16" },
  { name = "day_opponents", offset = 24, type = "bytes", count = 1600, note = "the day block's: the item ids raced today (400 words)" },
  { name = "day_opponent_count", offset = 1624, type = "u32" },
  { name = "day_opponent_records", offset = 1628, type = "bytes", count = 3200, note = "8 bytes an item id: halfwords {losses, wins, outcome 3}, at most 999" },
  { name = "day_win_streak", offset = 4828, type = "u16" },
  { name = "day_best_streak", offset = 4830, type = "u16" },
  { name = "day_points", offset = 4832, type = "u32", note = "probably the day's money earned (RaceHudMachine::AwardPrize adds to it with Stats::AddPoints)" },
  { name = "unknown_4836", offset = 4836, type = "f32" },
  { name = "week_best_804", offset = 24, type = "f32", note = "the week's block's: the largest result's +804" },
  { name = "week_mean_796", offset = 28, type = "f32", note = "a running mean of the result's +796 (RunningMean::MergeTwo)" },
  { name = "week_mean_796_count", offset = 32, type = "u32" },
  { name = "week_808", offset = 36, type = "u32", note = "the last result's +808" },
  { name = "unknown_40", offset = 40, type = "u32" },
  { name = "week_sum_816", offset = 44, type = "u32", note = "the results' +816 added" },
  { name = "week_sum_812", offset = 48, type = "u32", note = "the results' +812 added" },
  { name = "week_kind1_wins", offset = 52, type = "u16", note = "wins against items of kind (byte +35) 1" },
  { name = "unknown_54", offset = 54, type = "u16" },
  { name = "week_kind4_losses", offset = 56, type = "u16" },
  { name = "week_kind5_losses", offset = 58, type = "u16" },
]

# The last 15 results: the stats record's +4948 (save data +4996).
[CareerResults]
measure = "Results"
size = 724
origin = "embedded"
fields = [
  { name = "count", offset = 0, type = "u32", note = "up to 15" },
  { name = "records", offset = 4, type = "bytes", count = 720, note = "15 CareerResultRecords, the newest first" },
]

# One of the last results (ResultRecord::Fill, from the race data's last
# result record).
[CareerResultRecord]
measure = "ResultRecord"
size = 48
origin = "embedded"
fields = [
  { name = "value_812", offset = 0, type = "u32", note = "the result's +812" },
  { name = "value_816", offset = 4, type = "u32", note = "the result's +816" },
  { name = "mean_796", offset = 8, type = "u32", note = "the result's 8 bytes at +796 (a float, then a count)" },
  { name = "mean_796_count", offset = 12, type = "u32" },
  { name = "won", offset = 16, type = "u32", note = "the result's +3924 is 1" },
  { name = "opponent_1", offset = 20, type = "u32", note = "the item id of the result's +980" },
  { name = "opponent_2", offset = 24, type = "u32", note = "of +1952" },
  { name = "opponent_3", offset = 28, type = "u32", note = "of +2924" },
  { name = "value_972", offset = 32, type = "u32", note = "the result's +972" },
  { name = "race_mode", offset = 36, type = "u32", note = "the race data's +32" },
  { name = "racer_60", offset = 40, type = "u32", note = "the racer record's +60" },
  { name = "value_968", offset = 44, type = "u32", note = "the result's halfword +968, sign-extended" },
]

# ResultRecord::Fill's race data (another area's object; only its +32 here).
[CareerFillRaceData]
measure = "ResultRecord::Fill.r4"
size = 36
origin = "embedded"
fields = [
  { name = "mode", offset = 32, type = "u32", note = "the race data's +32 (the mode)" },
]

# The day log: the stats record's +5672.
[CareerDayLog]
measure = "DayLog"
size = 124
origin = "embedded"
fields = [
  { name = "count", offset = 0, type = "u32", note = "up to 10" },
  { name = "records", offset = 4, type = "bytes", count = 120, note = "10 records of 12 bytes {races, a float, a word}, the newest first" },
  { name = "newest_races", offset = 4, type = "u32", note = "the day block's +22" },
  { name = "newest_4836", offset = 8, type = "f32", note = "the day block's float +4836" },
  { name = "newest_18", offset = 12, type = "u32", note = "the day block's +18" },
]

# An item's record: the save data's +0x199F8 + 12 x id.
[CareerItemRecord]
measures = ["Counter::AddWin.r4.+4", "Counter::AddLoss.r4.+4", "Counter::AddOutcome3.r4.+4"]
size = 12
origin = "embedded"
fields = [
  { name = "losses", offset = 0, type = "u16", note = "at most 999" },
  { name = "wins", offset = 2, type = "u16" },
  { name = "outcome3", offset = 4, type = "u16" },
  { name = "rival_wins", offset = 6, type = "u16", note = "probably (sub_821116E0)" },
  { name = "unknown_8", offset = 8, type = "u32" },
]

# The data tables' item (3,008 bytes, DataTables::Item's), as the counters
# read it.
[CareerOpponentItem]
measures = ["Counter::AddWin.r4.+8", "Counter::AddLoss.r4.+8", "Counter::AddOutcome3.r4.+8"]
size = 3008
origin = "file"
fields = [
  { name = "kind", offset = 35, type = "u8", note = "the item's kind (signed)" },
]

# What ItemRecords::Add* build on their stack and hand their callees.
[CareerOpponent]
measures = ["Counter::AddWin.r4", "Counter::AddLoss.r4", "Counter::AddOutcome3.r4"]
size = 12
origin = "embedded"
fields = [
  { name = "id", offset = 0, type = "u32", note = "the item id" },
  { name = "record", offset = 4, type = "ptr", to = "CareerItemRecord" },
  { name = "item", offset = 8, type = "ptr", to = "CareerOpponentItem" },
]

# The garage's list: the save data's +6120.
[CareerGarageList]
measure = "GarageList"
size = 98612
origin = "embedded"
fields = [
  { name = "nodes", offset = 0, type = "bytes", count = 200, note = "4-byte nodes {+0 the next node, +2 the car's slot}" },
  { name = "free", offset = 200, type = "u16", note = "the free list's first node" },
  { name = "head", offset = 204, type = "u16" },
  { name = "count", offset = 208, type = "u16" },
  { name = "cars", offset = 212, type = "bytes", count = 98400, note = "50 cars of 1,968 bytes (the first 1,884 a car object's)" },
]

# A car object Garage::Add adds (the car's own type is another area's).
[CareerAddedCar]
measure = "Garage::Add.r4"
size = 1968
origin = "embedded"
fields = [
  { name = "car_id", offset = 12, type = "u32" },
]

# The 56-byte entries of the data tables 0 to 7 (DataTables::Entry56).
[CareerEntry56]
measures = ["DataTables::Entry56.ret", "Entry56"]
size = 56
origin = "file"
fields = [
  { name = "kind", offset = 0, type = "u32", note = "-1 ends the table; 4 never unlocks" },
  { name = "mask", offset = 4, type = "u32", note = "bits 0 to 5 the locations 14 to 19, 6 location 48, 7 to 9 the modes 0, 1, other, 10 to 14 the stages" },
  { name = "next_page", offset = 8, type = "u32", note = "added to the entry's index for its next page, 0 none" },
  { name = "text", offset = 12, type = "u32", note = "a string index from 4650" },
  { name = "image", offset = 16, type = "u32", note = "an image bit (-1 none)" },
  { name = "all_conditions", offset = 20, type = "u32", note = "nonzero: all three conditions needed, else any" },
  { name = "conditions", offset = 24, type = "bytes", count = 24, note = "three CareerConditions, -1 ends" },
  { name = "unknown_48", offset = 48, type = "u32" },
  { name = "unknown_52", offset = 52, type = "u32" },
]

# The 40-byte entries (DataTables::Entry40): the rewards.
[CareerEntry40]
measure = "DataTables::Entry40.ret"
size = 40
origin = "file"
fields = [
  { name = "kind_mask", offset = 0, type = "u32", note = "Condition::Test's mask of item kinds" },
  { name = "reward_kind", offset = 4, type = "u32", note = "0 to 41 (Rewards::Grant)" },
  { name = "reward_value", offset = 8, type = "u32" },
  { name = "all_conditions", offset = 12, type = "u32" },
  { name = "conditions", offset = 16, type = "bytes", count = 24, note = "three CareerConditions, -1 ends (-1 in the first ends the table)" },
]

# An unlock's or a reward's condition (Condition::Test).
[CareerCondition]
measure = "Condition"
size = 8
origin = "file"
fields = [
  { name = "kind", offset = 0, type = "u32", note = "0 to 9" },
  { name = "value", offset = 4, type = "u32" },
