# The schema of docs/functions/save-interface.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The save system's interface: the save devices (their constructor, slot
# handlers and getters, src/save_interface/), the front end's save layer
# (the save buffers at [0x828161F0], the replays' records and list entries)
# and the users' object the interface reads the controllers' slots from.
#
# Described elsewhere (the measure's names here are the lead's to add
# there): the save slot (files-and-saves.toml's SaveSlot: the measure's
# SaveSlot::*.r4, SlotArray.+0 and "SaveSlot", which joins the save devices
# and a slot), XContentData (files-and-saves.toml: SaveInterface::SaveAt.ret),
# the app's +16 interface and the framework's +36 interface with its vtable
# (app-start-up.toml's AppInterface16, AppFrameworkInterface,
# AppFrameworkInterfaceVtable: the measure's SaveInterface, SaveInterface.+0,
# sub_820943B0.r3, .r3.+8 and .r3.+8.+0), the run loop (frame-driver.toml's
# FrameDriverRunLoopRef, FrameDriverRunLoop, FrameDriverRunLoopVtable,
# FrameDriverEventWord: SaveDevices::SaveDevices.r4.+0, SaveDevices::OnEvent.r4,
# .r4.+0 and .r5) and the save data's play time (career.toml's CareerSave and
# CareerStats: PlayTime and PlayTime::Add.r4).

# The save devices (116 bytes, vtable 0x82002198; SaveDevices::SaveDevices
# sub_820A6160, made by SaveDevices::Create for the framework's +124):
# docs/known-data.md's "save owner". Its getters at vtable slots 11 and 12
# (sub_820A5848, sub_820A5860) and sub_820A57D0 read the slots at +44.
[SaveDevices]
measures = ["SaveDevices", "sub_820A57D0.r3", "sub_820A5848.r3", "sub_820A5860.r3"]
size = 116
origin = "allocated"
vtable = 0x82002198
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82002198 (0x82002148 the base's, left by the destructor)" },
  { name = "tick_key", offset = 4, type = "u32", note = "the tick handler's key (the set-up block's +8, 1)" },
  { name = "listener_key", offset = 8, type = "u32", note = "the listener's key (the set-up block's +12, 1)" },
  { name = "device_list", offset = 12, type = "u32", note = "the framework's +56 interface (the set-up block's +4): the device list through its slot 1" },
  { name = "root_name", offset = 16, type = "bytes", count = 28, note = "the content's root name: 0x820021E0's string at the constructor, then \"TXR360\" (SaveDevices::SetRootName)" },
  { name = "slots", offset = 44, type = "ptr", to = "SaveSlot", note = "the four 1,000-byte slots (the operator new[] block + 8; 0 when it failed)" },
  { name = "slot_count", offset = 48, type = "u32", note = "4" },
  { name = "device_selector_flags", offset = 52, type = "u32", note = "512" },
  { name = "listener", offset = 56, type = "u32", note = "the storage devices' notification listener (user::kNoListener since B5); Update runs only with one" },
  { name = "content_bytes", offset = 60, type = "u32", note = "1,024: the save's size for XContentCalculateSize (sub_82295C18)" },
  { name = "content_count", offset = 64, type = "u32", note = "1: the count for XContentCalculateSize" },
  { name = "saves_to_enumerate", offset = 68, type = "u32", note = "100: each slot's buffers' size (SaveSlot::AllocBuffers)" },
  { name = "busy_slot", offset = 72, type = "u32", note = "the slot whose check, save, load or delete is running (0 none; states 6 to 9 claim it)" },
  { name = "wait_for_user", offset = 76, type = "fn", note = "state 0's handler sub_820A4870; the handlers are +76 + 4 x the slot's state" },
  { name = "wait_for_device", offset = 80, type = "fn", note = "state 1: sub_820A5878" },
  { name = "failed", offset = 84, type = "fn", note = "state 2: sub_820A4890" },
  { name = "ready", offset = 88, type = "fn", note = "state 3: sub_820A58D8" },
  { name = "wait_device_selector", offset = 92, type = "fn", note = "state 4: sub_820A48B8 (files-and-saves.md)" },
  { name = "enumerate_step", offset = 96, type = "fn", note = "state 5: sub_820A59C0" },
  { name = "check_step", offset = 100, type = "fn", note = "state 6: sub_820A5A88" },
  { name = "save_step", offset = 104, type = "fn", note = "state 7: sub_820A5BE8 (files-and-saves.md)" },
  { name = "load_step", offset = 108, type = "fn", note = "state 8: sub_820A5E68 (files-and-saves.md)" },
  { name = "delete_step", offset = 112, type = "fn", note = "state 9: sub_820A6010" },
]

# The block SaveDevices::SaveDevices gets (r4, from SaveDevices::Create).
[SaveDevicesSetUp]
measure = "SaveDevices::SaveDevices.r4"
size = 16
origin = "embedded"
fields = [
  { name = "run_loop", offset = 0, type = "ptr", to = "FrameDriverRunLoopRef", note = "the run loop (its slots 2 and 1 add the tick handler and the listener)" },
  { name = "device_list", offset = 4, type = "u32", note = "the framework's +56 interface: into the save devices' +12" },
  { name = "tick_key", offset = 8, type = "u32", note = "1: into the save devices' +4" },
  { name = "listener_key", offset = 12, type = "u32", note = "1: into the save devices' +8" },
]

# The slots' operator new[] block (4,008 bytes, SaveDevices::SaveDevices):
# the count, then four SaveSlots (files-and-saves.toml) from +8.
[SaveSlotArrayBlock]
measure = "new<4008>@SaveDevices::SaveDevices"
size = 4008
origin = "allocated"
fields = [
  { name = "count", offset = 0, type = "u32", note = "4; the first slot's array_count" },
  { name = "slots", offset = 8, type = "bytes", count = 4000, note = "four 1,000-byte SaveSlots (vtable 0x82002190); the save devices' +44 points here" },
]

# The save devices' +44 as SlotArray::Reset (sub_820A55F0) gets it (r3 =
# the save devices + 44).
[SaveSlotArrayHolder]
measure = "SaveDevices@+44"
size = 4
origin = "embedded"
fields = [
  { name = "slots", offset = 0, type = "ptr", to = "SaveSlot", note = "the first slot (0 none): the array's count at -8, deleted and cleared" },
]

# The save buffers (24 bytes, VirtualAlloc'd by SaveBuffers::Create, at
# [0x828161F0]): docs/known-data.md's 0x828161F0.
[SaveBuffers]
measure = "new<24>@SaveBuffers::Create"
size = 24
origin = "allocated"
fields = [
  { name = "game_data", offset = 0, type = "u32", note = "the game data's buffer (129,400 bytes, the save data's layout: career.toml's CareerSave; options-load-save.toml's OptionsLoadedGameData)" },
  { name = "replay", offset = 4, type = "u32", note = "a replay's buffer (1,231,088 bytes)" },
  { name = "replay_record", offset = 8, type = "ptr", to = "SaveReplayRecord", note = "the 36-byte replay record being saved" },
  { name = "records", offset = 12, type = "ptr", to = "SaveReplayRecord", note = "the replays' records, 36 bytes each (Replays::BuildList; VirtualFree'd)" },
  { name = "entries", offset = 16, type = "ptr", to = "SaveReplayEntry", note = "their list entries, 304 bytes each" },
  { name = "count", offset = 20, type = "u32", note = "the records' count" },
]

# A replay's list entry (304 bytes, the save buffers' +16).
[SaveReplayEntry]
measure = "new<24>@SaveBuffers::Create.+16"
size = 304
origin = "allocated"
fields = [
  { name = "file_name", offset = 0, type = "bytes", count = 42, note = "the rep_... file name" },
  { name = "display_name", offset = 42, type = "bytes", count = 256, note = "128 UTF-16 characters" },
  { name = "number", offset = 300, type = "u32", note = "the replay's number (0 the empty entry Replays::BuildList adds first)" },
]

# A replay record (36 bytes, the save buffers' +12 and +8), read back from a
# rep_... file name's twelve numbers. Replays::Sort (sub_8228F840) sorts
# them by +28 and reads the second record's through its +64.
[SaveReplayRecord]
measure = "Replays"
size = 36
origin = "allocated"
fields = [
  { name = "word_0", offset = 0, type = "u32", note = "read as a word (a pointer by the measure, 4 loads in 2 functions; not known); the record's +0 is a halfword below" },
  { name = "year", offset = 0, type = "u16", note = "probably, as in a SYSTEMTIME" },
  { name = "month", offset = 2, type = "u16", note = "probably" },
  { name = "day", offset = 6, type = "u16", note = "probably" },
  { name = "hour", offset = 8, type = "u16", note = "probably" },
  { name = "minute", offset = 10, type = "u16", note = "probably" },
  { name = "time", offset = 16, type = "u32", note = "a time packed as minutes (bits 16-30), seconds (10-15) and thousandths (0-9)" },
  { name = "mode", offset = 20, type = "u32", note = "QUEST, TIME ATTACK, VS BATTLE, NETWORK TIME ATTACK, ... (0x826380F8)" },
  { name = "course", offset = 24, type = "u32", note = "probably" },
  { name = "number", offset = 28, type = "u32", note = "the replay's number (the list's sort key; 0 the empty record)" },
  { name = "result", offset = 32, type = "u32", note = "probably" },
  { name = "next_number", offset = 64, type = "u32", note = "the next record's number (+36 +28), as Replays::Sort's first compare reads it" },
]

# The users and sign-in object (framework + 128, system-services.md), as
# the save interface reads it: sub_82490B08 (its count) and Users::SignedIn
# (sub_820996D8). Dual (E5 step 4): the users (system-services.toml's
# SysUsers) are in host memory, and sub_82490B08 is folded into two other
# classes' vtables (0x8204DC58, 0x8204E388), a generic getter's type.
[SignedInUsers]
measures = ["Users", "sub_82490B08.r3"]
size = 220
origin = "allocated"
storage = "dual"
fields = [
  { name = "users", offset = 0, type = "bytes", count = 160, note = "4 users of 40 bytes; a user's +8 is nonzero when signed in" },
  { name = "order", offset = 200, type = "bytes", count = 16, note = "the users by index (4 words; Users::SignedIn's (index + 50) x 4)" },
  { name = "count", offset = 216, type = "u32", note = "the signed-in count" },
]

# A C string the request setters and SaveDevices::SetRootName copy byte by
# byte with their terminator (the name, the file name, the path).
[SaveCString]
measures = ["SaveDevices::SetRootName.r4", "SaveSlot::RequestSave.r6", "SaveSlot::RequestSave.r7",
            "SaveSlot::RequestLoad.r6", "SaveSlot::RequestLoad.r7", "SaveSlot::RequestDelete.r6"]
size = 1
origin = "image"
fields = [
  { name = "first", offset = 0, type = "u8", note = "a byte of the string (the copy loops step the pointer)" },
]

[globals]
interface = { address = 0x826BDC90, type = "ptr", to = "AppInterface16", note = "the save interface: the app + 16 (vtable 0x82000E38), set by SaveInterface::Init" }
save_buffers = { address = 0x828161F0, type = "ptr", to = "SaveBuffers" }
controllers = { address = 0x826BABA4, type = "bytes", count = 16, note = "each player's controller (4 words)" }
play_time_frames = { address = 0x826C5B90, type = "u32", note = "the play time's frame counter (PlayTime::Add)" }
root_name = { address = 0x82001ED4, type = "bytes", count = 7, note = "\"TXR360\"" }
