  { name = "choice_8", offset = 136, type = "u32", note = "kinds 8 and 9's r5" },
  { name = "choice_10", offset = 140, type = "u32", note = "kind 10's" },
  { name = "choice_11", offset = 144, type = "u32", note = "kind 11's" },
  { name = "choice_12", offset = 148, type = "u32", note = "kind 12's" },
  { name = "choice_14", offset = 152, type = "u32", note = "kind 14's" },
  { name = "choice_15", offset = 156, type = "u32", note = "kind 15's" },
  { name = "points", offset = 176, type = "bytes", count = 37108, note = "the point block (PartsPoints, second-set.md; groups by part in known-data.md)" },
  { name = "light_value", offset = 27664, type = "f32", note = "the point block's +27488, in the headlights' group (SceneParts::LightValue)" },
  { name = "points_car_record", offset = 37252, type = "u32", note = "the point block's +37076: the first set's car model's car record (its +32; SceneParts::Build)" },
  { name = "points_record", offset = 37256, type = "u32", note = "the point block's +37080: the record (+108)" },
  { name = "points_scene_car_model", offset = 37260, type = "u32", note = "the point block's +37084: the second set's car model (+24)" },
  { name = "points_skeleton", offset = 37268, type = "u32", note = "the point block's +37092: the first set's car model's skeleton (its +3760)" },
  { name = "unknown_37280", offset = 37280, type = "u32", note = "0 from SceneParts::Reset" },
  { name = "scene", offset = 37284, type = "ptr", to = "CarScene", note = "the car scene ([0x826C2E44]); its +4 the model set" },
]

