# The schema of docs/functions/load-poll.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The scene models' load poll (src/load_poll/): the parts' finishers and the
# record's apply steps over the second set's objects (known-data.md's
# "second set objects" and "scene model"). The second set's other objects
# (the scene model, the interior, the cockpit, the light kit, the traffic
# body, the wheels) are other areas'; the measure gives this area the parts
# object (pool 1) and the interior's meters.
#
# Left to other files (the measure's names to add there, not copied here):
# "InteriorMeters.+0" is car-draw.toml's InteriorRecord (the interior's
# 120-byte record; the meters also read +16 + 12i, gauge i's texture index);
# "CarParts.+106000" is the first set of scene pools (car-models.toml's
# CarModelsFirstSet: +8 the model set); "SceneInterior.+11608" is a second
# set car model (car-models.toml's CarModelsSceneCarModel: +24 the first
# set's car model) and "SceneInterior.+11608.+24" that car model
# (car-models.toml's CarModel: +32 the block); "SceneParts.+92" is a part
# model (PartModel, material-passes.md: +452 the selected texture).

# Pool 1 of the second set: a car's parts (37,296 bytes, SceneParts::SceneParts
# sub_820E2F18, second-set.md), a PoolNode at +0.
# In host memory (E5 step 4): made by CarScene::SetUp (the hand port's
# pool loop, src/car_models/scene_fill.cpp; the lifted original's
# VirtualAlloc returning to 0x820C8FC0), freed by its deleting destructor's
# operator delete (sub_820E2F78, a handle). Its scalar fields are the
# layout; the record (+108) and the point block (+176: PartsPoints, its
# groups, the 240-byte point records) stay guest-shaped views reaching the
# host object through raw accesses (guest order but for the fields here):
# PartsPoints is a view at the block and at its groups' addresses alike, so
# it can't be an embedded dual type without its members disagreeing with
# the bytes other views read, and the choice and points_ fields here would
# be swapped twice in the layout under an embed of PartsRecord or
# PartsPoints.
[SceneParts]
measure = "SceneParts"
size = 37296
origin = "allocated"
storage = "host"
host_alloc = [0x820C8FC0]
vtable = 0x82006024
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006024" },
  { name = "list", offset = 4, type = "u32", note = "the PoolNode's list" },
  { name = "link_8", offset = 8, type = "u32", note = "the PoolNode's links" },
  { name = "link_12", offset = 12, type = "u32" },
  { name = "state", offset = 16, type = "u32", note = "3 in use" },
  { name = "index", offset = 20, type = "u32", note = "its index in the pool (-1 from the constructor)" },
  { name = "scene_car_model", offset = 24, type = "ptr", to = "CarModelsSceneCarModel", note = "the second set's car model (pool 0; SceneParts::Link): its +24 the first set's car model" },
  { name = "skeleton", offset = 28, type = "u32", note = "the car model's loading object's +3760, the node file's skeleton (SceneParts::Link)" },
  { name = "part_model_0", offset = 32, type = "u32", note = "the 17 part models by kind (+32 + 4k; CarParts::Part, SceneParts::Build; cleared by Reset): PartModel, material-passes.md" },
  { name = "part_model_1", offset = 36, type = "u32" },
  { name = "part_model_2", offset = 40, type = "u32" },
  { name = "part_model_3", offset = 44, type = "u32" },
  { name = "part_model_4", offset = 48, type = "u32", note = "0 without the call when the record's +124 is 13" },
  { name = "part_model_5", offset = 52, type = "u32" },
  { name = "part_model_6", offset = 56, type = "u32" },
  { name = "part_model_7", offset = 60, type = "u32" },
  { name = "part_model_8", offset = 64, type = "u32" },
  { name = "part_model_9", offset = 68, type = "u32" },
  { name = "part_model_10", offset = 72, type = "u32" },
  { name = "part_model_11", offset = 76, type = "u32" },
  { name = "part_model_12", offset = 80, type = "u32" },
  { name = "part_model_13", offset = 84, type = "u32" },
  { name = "part_model_14", offset = 88, type = "u32" },
  { name = "part_model_15", offset = 92, type = "u32", note = "the measure's SceneParts.+92 (its +452 the selected texture)" },
  { name = "part_model_16", offset = 96, type = "u32" },
  { name = "loaded", offset = 100, type = "u32", note = "CarParts::IsLoaded's answer (SceneParts::Finish); 1 once loaded" },
  { name = "first_set_parts", offset = 104, type = "u32", note = "the first set's parts (CarParts, scene-loaders.md; pool 1 of [0x826C2E40])" },
  { name = "record", offset = 108, type = "bytes", count = 60, note = "the 60-byte parts record (SceneParts::SetUp, Apply); its words pick each kind's part" },
  { name = "choice_0", offset = 108, type = "u32", note = "kind 0's CarParts::Part r5 (and kind 1's r6)" },
  { name = "choice_1", offset = 112, type = "u32", note = "kind 1's r5" },
  { name = "choice_2", offset = 116, type = "u32", note = "kind 2's" },
  { name = "choice_3", offset = 120, type = "u32", note = "kind 3's" },
