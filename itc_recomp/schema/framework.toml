# The schema of docs/functions/framework.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The app framework: the framework object main makes, the run loop App::Run
# drives it with (two handler maps, Dinkumware's std::map<unsigned,
# Delegate*>, and a std::vector of 12-byte requests), the services the
# framework's set-up makes (src/framework/; known-data.md's "framework" and
# "run loop").
#
# Measure faults (reported): the measure joins a few objects with their
# vtables or with a function's result (a register reused): "HandlerMap"
# (the map and HandlerMap::Insert's result), "RequestVector" (the vector and
# an erase or insert result), "FrameStart::FrameStart.r4.+0" and
# "sub_82094F30.r4.+0" (the run loop and its vtable), "App.+0" (the app's
# +16 vtable and the run loop's), "App.+8" (the run loop's +8 met as the
# app's), "HandlerMap::Insert.ret" (the run loop and the app met as the
# insert's result). Their fields carry notes.

# The framework (136 bytes, Framework::Framework sub_82090420, made by
# Framework::Create from main). Sixteen interfaces' vtables at +0 to +60,
# the services Framework::Init makes at +64 to +128, and the flags App::Run
# reads. sub_820908F8.ret is heap.toml's measure for it (to move here).
[Framework]
measures = ["Framework", "sub_820908F8.ret", "App::Run.r4", "sub_82090350.r3.+0",
            "sub_82090760.r3", "sub_82090768.r3"]
size = 136
origin = "allocated"
vtable = 0x82000B90
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "FrameworkVtable", note = "0x82000B90" },
  { name = "vtable_4", offset = 4, type = "u32", note = "0x82000B8C (slot 0 only)" },
  { name = "vtable_8", offset = 8, type = "u32", note = "0x82000B84: slot 1 the frame driver; the scene's interface" },
  { name = "vtable_12", offset = 12, type = "u32", note = "0x82000B80 (slot 0 only): the worker pools' interface" },
  { name = "vtable_16", offset = 16, type = "u32", note = "0x82000B7C (slot 0 only): the input manager's interface" },
  { name = "vtable_20", offset = 20, type = "u32", note = "0x82000B70: 1 the frame driver, 2 the scene; the debug text's interface" },
  { name = "vtable_24", offset = 24, type = "u32", note = "0x82000B4C: 1 +68, 2 +72, 3 +88, 4 +76, 5 +80, 6 +92, 7 +100, 8 +104" },
  { name = "vtable_28", offset = 28, type = "u32", note = "0x82000B38: 1 +88, 2 +76, 3 +80, 4 +104" },
  { name = "vtable_32", offset = 32, type = "u32", note = "0x82000B28: 1 +76, 2 +88, 3 +92" },
  { name = "vtable_36", offset = 36, type = "u32", note = "0x82000AFC: the app's interface (1 the input manager ... 9 +128, 10 +124)" },
  { name = "vtable_40", offset = 40, type = "u32", note = "0x82000AF4: 1 the debug text; the frame start's interface" },
  { name = "vtable_44", offset = 44, type = "u32", note = "0x82000AEC: 1 the second worker pool; the first pool maker's" },
  { name = "vtable_48", offset = 48, type = "u32", note = "0x82000AE4: 1 the second worker pool; the morph job maker's" },
  { name = "vtable_52", offset = 52, type = "u32", note = "0x82000AD4: 1 +68, 2 +76, 3 +80; the frame passes' interface" },
  { name = "vtable_56", offset = 56, type = "u32", note = "0x82000ACC: 1 the users; the save devices' interface" },
  { name = "vtable_60", offset = 60, type = "u32", note = "0x82000AC8 (slot 0 only): the users' interface" },
  { name = "run_loop", offset = 64, type = "ptr", to = "RunLoop", note = "Framework::Init's r4" },
  { name = "worker_pool", offset = 68, type = "ptr", to = "WorkerPoolInterface", note = "the first worker pool + 8" },
  { name = "worker_pool_2", offset = 72, type = "ptr", to = "WorkerPoolInterface", note = "the second worker pool + 8" },
  { name = "frame_driver", offset = 76, type = "u32", note = "the frame driver + 20 (frame-driver.md)" },
  { name = "scene", offset = 80, type = "u32", note = "the scene (Scene::Create, frame-driver.md)" },
  { name = "frame_start", offset = 84, type = "ptr", to = "FrameStart" },
  { name = "input_manager", offset = 88, type = "u32", note = "the input manager (input.md)" },
  { name = "debug_text", offset = 92, type = "ptr", to = "DebugText" },
  { name = "unknown_96", offset = 96, type = "u32", note = "0, never set by the set-up" },
  { name = "unknown_100", offset = 100, type = "u32", note = "0, never set by the set-up" },
  { name = "unknown_104", offset = 104, type = "u32", note = "0, never set by the set-up" },
  { name = "frame_passes", offset = 108, type = "u32", note = "the frame passes (44 bytes, frame-passes.md)" },
  { name = "pool_maker", offset = 112, type = "u32", note = "also at 0x8296B910 (PoolMaker, vtable 0x82002848)" },
  { name = "morph_job_maker", offset = 116, type = "ptr", to = "MorphJobMaker", note = "also at 0x8296B914" },
  { name = "app", offset = 120, type = "ptr", to = "FrameworkAppInterface", note = "the app + 20" },
  { name = "save_devices", offset = 124, type = "u32", note = "save-interface.md" },
  { name = "users", offset = 128, type = "u32", note = "the users and sign-in object (system-services.md)" },
  { name = "unknown_132", offset = 132, type = "u8", note = "cleared by the constructor, not read" },
  { name = "restart_requested", offset = 133, type = "u8", note = "slot 4: cleared by Framework::OnTick; when set, App::Run sends event 0 and calls Framework::Start again" },
