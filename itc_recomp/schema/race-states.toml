# One of the progress's four racer slots (536 bytes at +40 + 536i).
[RaceProgressSlot]
size = 536
origin = "embedded"
fields = [
  { name = "hold_0", offset = 0, type = "u32", note = "0 at the reset (probably a 15-tick hold after hits)" },
  { name = "hold_1", offset = 4, type = "u32", note = "0 at the reset (as +0)" },
  { name = "entry", offset = 8, type = "ptr", to = "MinimapRacerEntry", note = "its manager entry (0 none)" },
  { name = "sections", offset = 12, type = "bytes", count = 512, note = "the route sections passed (256 halfwords)" },
  { name = "section_count", offset = 524, type = "u32", note = "at most 256" },
  { name = "level", offset = 528, type = "u32", note = "the stage's slot word (a level, 0 to 4, scaling the SP drain; 2 at the reset)" },
  { name = "start_section", offset = 532, type = "u16", note = "-1 at the reset" },
  { name = "start_slice", offset = 534, type = "u16", note = "-1 at the reset" },
]

# The race's checks' out pair (an end and a reason; 0 none): r3 of
# RaceProgress::CountHits, Damage, DrainSp, CheckLap, CheckFinish,
# FollowRoute and sub_821653E8, read back by RaceStates::RaceTick as a
# doubleword.
[RaceCheckResult]
measures = [
  "RaceProgress::CheckFinish.ret", "RaceProgress::Damage.ret", "RaceProgress::DrainSp.ret",
  "RaceProgress::FollowRoute.ret", "sub_821653E8.r3", "sub_821653E8.ret",
]
size = 8
origin = "embedded"
fields = [
  { name = "pair", offset = 0, type = "u64", note = "the two words read as one" },
  { name = "end", offset = 0, type = "u32", note = "the race's end (0 none)" },
  { name = "reason", offset = 4, type = "u32" },
]

# A packed time (4 bytes): minutes in bits 16-30, seconds 10-15,
# thousandths 0-9, bit 31 negative (Time::Add, Time::Sub, the compare
# sub_820FF680, RaceProgress::TickFraction's r5).
[PackedTime]
measures = ["Time", "Time::Add.r4", "Time::Sub.r4", "sub_820FF680.r3", "sub_820FF680.r4", "RaceProgress::TickFraction.r5"]
size = 4
origin = "embedded"
fields = [
  { name = "packed", offset = 0, type = "u32" },
]

# A route position (4 bytes): signed halfwords section and slice (-1 none),
# met whole as a word. RoutePosition::NotAfter's and MapToSection's
# argument, the copies sub_820FFE98 and sub_820FFF10 answer.
[RoutePosition]
measure = "RoutePosition::MapToSection.r4"
measures = ["RoutePosition::NotAfter.r4", "sub_820FFE98.ret", "sub_820FFF10.ret", "RoutePosition", "AiDriver::UpdateStarting.ret@+4", "TrackPosition@+4"]
# measures from VehicleRoutePosition (vehicle), merged at the integration
size = 4
origin = "embedded"
fields = [
  { name = "word", offset = 0, type = "u32", note = "section and slice read or written as one word" },
  { name = "section", offset = 0, type = "u16", note = "signed" },
  { name = "slice", offset = 2, type = "u16", note = "signed" },
]

# A link index sub_82163000 (SectionsJoin) writes out (r5, r6): a forward
# link (0 to 2) or -1.
[SectionsJoinLink]
measures = ["sub_82163000.r5", "sub_82163000.r6"]
size = 4
origin = "embedded"
fields = [
  { name = "link", offset = 0, type = "u32", note = "-1 none" },
]

# A stage's route (16 bytes, the stage's +24 copied by sub_820FFD48; the
# race data's +4 route and the progress's +6076 have the same layout).
[StageRoute]
# measures from AccessorStageRoute (vehicle-accessors), merged at the integration
measures = ["sub_820FFD48.r3"]
measure = "sub_820FFD48.ret"
size = 16
origin = "embedded"
fields = [
  { name = "course", offset = 0, type = "u32", note = "a course route's index" },
  { name = "location", offset = 4, type = "u32" },
  { name = "first_position", offset = 8, type = "u32", note = "section and slice" },
  { name = "last_position", offset = 12, type = "u32", note = "section and slice (the finish)" },
]

# A course record's entry (28 bytes; never seen in play): CourseEntry::Clear
# sub_82105BC8 sets +0 to +16 to 0 and +20, +24 to [0x82006924].
[CourseTimeEntry]
measure = "CourseEntry"
size = 28
origin = "embedded"
fields = [
  { name = "word_0", offset = 0, type = "u32", note = "0 at the clear" },
  { name = "word_4", offset = 4, type = "u32", note = "0 at the clear" },
  { name = "word_8", offset = 8, type = "u32", note = "0 at the clear" },
  { name = "word_12", offset = 12, type = "u32", note = "0 at the clear" },
  { name = "word_16", offset = 16, type = "u32", note = "0 at the clear" },
  { name = "time_a", offset = 20, type = "u32", note = "a packed time ([0x82006924] empty), added to time_b for the entry's total" },
  { name = "time_b", offset = 24, type = "u32", note = "a packed time" },
]

# A course record (408 bytes; the stage list's +812, CourseRecords::Save;
# never seen in play): a list of ten nodes, then ten entries.
[CourseTimeList]
measure = "CourseRecord"
size = 408
origin = "embedded"
fields = [
  { name = "nodes", offset = 0, type = "bytes", count = 40, note = "ten nodes of two signed halfwords: +0 the next node, +2 an entry index" },
  { name = "node0_next", offset = 0, type = "u16", note = "CourseRecord::Reset" },
  { name = "node0_entry", offset = 2, type = "u16" },
  { name = "node9_next", offset = 36, type = "u16", note = "the last node's next (CourseRecord::Reset)" },
  { name = "free_first", offset = 40, type = "u16", note = "the free list's first node (signed)" },
  { name = "word_42", offset = 42, type = "u16", note = "set by CourseRecord::Reset" },
  { name = "first", offset = 44, type = "u16", note = "the list's first node (signed)" },
  { name = "word_46", offset = 46, type = "u16", note = "set by CourseRecord::Reset" },
  { name = "count", offset = 48, type = "u16", note = "the list's count" },
  { name = "entries", offset = 52, type = "bytes", count = 280, note = "ten 28-byte entries (CourseTimeEntry)" },
  { name = "best", offset = 332, type = "bytes", count = 76, note = "the best's details" },
]

