# The race's states: a StateMachine (game-modes.toml) at the race mode's
# +107168 with the race's words after its count and state. The measure
# meets it as the handlers' r3 (the lifted handlers' own names too); its +0
# to +1696 accesses are other objects joined in (faults).
[RaceStates]
measures = ["RaceStates", "sub_82167D88.r3", "sub_82168018.r3", "sub_821683A8.r3", "sub_82168620.r3"]
size = 9644
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateTransition, game-modes.toml); 87 added by RaceStates::Init" },
  { name = "fault_still_count", offset = 0, type = "u32", note = "measure fault: RaceStates::RacersStill's count word (its r3 is the machine's +9628, not the machine)" },
  { name = "fault_record_word_4", offset = 4, type = "u16", note = "measure fault: SceneModelRecord::FromCar's halfword +4" },
  { name = "fault_car_word_12", offset = 12, type = "u32", note = "measure fault: EventCondition::CarIs's +12" },
  { name = "fault_wheels_1692", offset = 1692, type = "u32", note = "measure fault: SceneModelRecord::SetWheels's +1692" },
  { name = "fault_wheels_1696", offset = 1696, type = "u32", note = "measure fault: SceneModelRecord::SetWheels's +1696" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "1 at set-up; 3 waiting for the load, 16 a stage loading, 10 to 12 and 21 the starts, 22 the countdown, 23 racing, 25 paused, 26 the end, 17 and 18 the replay, 30 the menu after a race, 36, 37, 35 the end" },
  { name = "pause_quit", offset = 9608, type = "u32", note = "0 or 1 by the pause menu's two quits (OnQuit, OnQuit2)" },
  { name = "step", offset = 9612, type = "u32", note = "a step within a state" },
  { name = "ticks", offset = 9616, type = "u32", note = "a tick count" },
  { name = "word_9620", offset = 9620, type = "u32", note = "cleared with the tick count; never read" },
  { name = "progress", offset = 9624, type = "ptr", to = "RaceProgress", note = "[0x826D82E8] (RaceStates::Init)" },
  { name = "still_ticks", offset = 9628, type = "u32", note = "ticks with no racer touching anything (to 30, RaceStates::RacersStill)" },
  { name = "word_9632", offset = 9632, type = "u32", note = "cleared with the still count" },
  { name = "settled", offset = 9636, type = "u32", note = "the racers settled (StandingStartTick)" },
  { name = "settled_ticks", offset = 9640, type = "u32", note = "ticks since the racers settled" },
]

# The race mode's dispatcher (the race mode's +36; boot-mode.toml's
# ModeDispatcher): the handlers' r4. A handler posts a message by appending
# to its ring (StateMachine handlers' Post).
[RaceStatesDispatcher]
measures = [
  "RaceStates::AbortTick.r4", "RaceStates::AfterRaceTick.r4", "RaceStates::AfterReplayTick.r4",
  "RaceStates::CountdownTick.r4", "RaceStates::DemoTick.r4", "RaceStates::EndWhenFaded.r4",
  "RaceStates::FreeStartTick.r4", "RaceStates::LinkTick.r4", "RaceStates::MenuLoadTick.r4",
  "RaceStates::OnContinue.r4", "RaceStates::OnWorldLoaded.r4", "RaceStates::QuitTick.r4",
  "RaceStates::RaceTick.r4", "RaceStates::ReplayLoadTick.r4", "RaceStates::ReplaySetUpTick.r4",
  "RaceStates::RollingLoadTick.r4", "RaceStates::RollingStartTick.r4", "RaceStates::StageLoadTick.r4",
  "RaceStates::StandingLoadTick.r4", "RaceStates::StandingStartTick.r4", "sub_82167D88.r4",
  "sub_82168018.r4", "sub_821683A8.r4", "sub_82168620.r4", "sub_82168858.r4", "sub_82168C80.r4",
]
size = 812
origin = "embedded"
fields = [
  { name = "handlers", offset = 0, type = "bytes", count = 200, note = "50 handler pointers (state machines)" },
  { name = "handler_count", offset = 200, type = "u32" },
  { name = "ring", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (ModeMessage: +0 the message, +4 and +8 0)" },
  { name = "ring_count", offset = 804, type = "u32" },
  { name = "ring_start", offset = 808, type = "u32" },
  { name = "fault_word_1008", offset = 1008, type = "u32", note = "measure fault: RollingLoadTick's and sub_82168018's r4 +1008 (the race mode's +1044, in the course set-up machine's table): another object kept in the register, not read further" },
  { name = "fault_word_1012", offset = 1012, type = "u32", note = "measure fault: as +1008" },
]

