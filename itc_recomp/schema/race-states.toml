# The schema of docs/functions/race-states.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race's states (the race mode's state machine at +107168, RaceStates::,
# src/race_states/), the race's progress ([0x826D82E8], RaceProgress::) and
# the race data ([0x826C5B2C], the measure's Racers, which the race's states
# touch most) with the small records their code passes around.
#
# Not here (other areas' types the measure filed under this one):
# "RaceProgress.+48", "Achievements.+48" and "RaceManager::EntryOfRecord.ret"
# are the racers' manager's 28-byte entry (minimap.toml's
# MinimapRacerEntry); "Vehicle::Get.ret.+340" is a vehicle's collision
# object (car-physics.toml's CollisionWorldObject, +240 its first contact);
# "Achievements.+6112" is a pointee the measure never reads. The results
# record at the progress's +2184 is race-hud-machine.toml's
# RacerResultsRecord, its 972-byte entries race-setup.md's.

# The race data ([0x826C5B2C], 0xA3B00 bytes, RaceData::Create; known-data.md
# 0x826C5B2C): the race's route, its racer records (+48, 93 of 3,936 bytes),
# the stage list (+0x59620), the flags (+0x59AE4), the 77 results records
# (+0x59AE8) and the words after them. The measure joins three bases into
# this one: the race data, the racers object at its +48 (Racers::Reset's;
# racer records at +0 there) and a racer record or a stage list met at +0;
# what those see is named `fault_...` with the offset in their own object.
[RaceData]
measure = "Racers"
measures = ["[826C5B2C]", "Vehicle.+5712", "Vehicle::ResetForCar.r4", "Vehicle::SetUpSurfaceGrip.r4", "AiDriver.+160.+5712", "AiDriver::Setup.r4"]
size = 670464
origin = "allocated"
fields = [
  { name = "unknown_0", offset = 0, type = "u32", note = "read as a float and a word by AiDriver::Setup and Racers::NearestHumanVehicle: probably a racer record's +0 (the measure's join)" },
  { name = "route", offset = 4, type = "bytes", count = 16, note = "the race's route (16 bytes, Route::Set; race-setup.md)" },
  { name = "route_course", offset = 4, type = "u32", note = "a course route's index (0 to 22, probably the course; AiPath::BranchMasks reads 0 to 7)" },
  { name = "route_location", offset = 8, type = "u32", note = "the location (1 to 46 in Race::StartPosition)" },
  { name = "route_first_position", offset = 12, type = "u32", note = "the route's first position (section, slice)" },
  { name = "route_last_position", offset = 16, type = "u32", note = "the route's last position (section, slice)" },
  { name = "branch_flags", offset = 20, type = "u32", note = "0x4 to 0x20: which branch kinds the AI drivers take (AiPath::BranchMasksFor); from the save data's +0x199E0" },
  { name = "drawn_entries", offset = 24, type = "u32", note = "0x1 to 0x800: which entries of the course set's +2124 list are drawn" },
  { name = "effects_word", offset = 28, type = "u32", note = "0 at the reset; passed to the overlays (their effects update with 0 or 3); read by RaceStates::OnRaceEnd" },
  { name = "mode", offset = 32, type = "u32", note = "the mode (the save data's +6104, sub_820FF968)" },
  { name = "racer_records", offset = 48, type = "bytes", count = 366048, note = "93 racer records of 3,936 bytes (the racers object, Racers::Reset)" },
  { name = "record0_place", offset = 60, type = "u32", note = "racer record 0's +12 (its first entry's place), read by Kind6Menu::SaveReplay and RaceHudMachine::ShowResults" },
  { name = "fault_record_byte_76", offset = 76, type = "u8", note = "measure fault: a racer record's byte +76 (Vehicle::SetUp's record at +0)" },
  { name = "fault_record_byte_77", offset = 77, type = "u8", note = "measure fault: a racer record's byte +77 (Vehicle::SetUp's record at +0)" },
