# The schema of docs/functions/audio.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The audio library's render driver object and its XMA layer: the XMA
# object (the original's layout: our src/hooks/xma.cpp keeps its own state
# behind an opaque 16-byte handle instead, so only the original's code
# reads these fields), its 96-byte stream entries (a copy of the XMA
# hardware context's words, then the entry's own), and the small structs
# the XMA helpers take. Names from docs/functions/audio.md,
# docs/known-data.md and the hand ports; the context words' names follow
# the XMA hardware context's layout ("probably" where only that says so).
#
# The XMA source voice (XmaVoice, sub_8246AEE0.r3, sub_8246B0C8.r3,
# sub_8246B1C8.r3, sub_8246B480.r3, sub_8246BB98.r3, sub_8246BE20.r3,
# sub_8246BFD8.r3, XmaCodec::~XmaCodec.ret) is XAudio's XMA codec, which
# xaudio-objects.toml describes (XmaCodec); its +16 measures
# (sub_8246B480.r3.+16, sub_8246BE20.r3.+16, sub_8246BFD8.r3.+16) are the
# codec base's vtable (CodecBaseVtable there). Left for that file.

# The XMA object (XmaObject::Create sub_8245C650, from the XMA voice's
# set-up; the voice's +184).
[XmaObject]
measures = ["XmaObject", "sub_8245C948.r3", "sub_8245CAE0.r3", "sub_8245CB38.r3", "sub_8245CBB0.r3", "sub_8245CD68.r3", "sub_8245CE10.r3", "sub_8245D050.r3", "sub_8245D288.r3"]
size = 12
origin = "allocated"
fields = [
  { name = "stream_count", offset = 0, type = "u32" },
  { name = "flags", offset = 4, type = "u32", note = "0x10000 locked, 0x20000 the copies hold the contexts (written back at the unlock), 0x40000 contexts made; Create sets 0x30000" },
  { name = "streams", offset = 8, type = "ptr", to = "XmaStreamEntry", note = "96 bytes each" },
]

# An XMA object's stream entry (96 bytes, the object's +8): a copy of its
# hardware context's first 48 bytes (written back at the unlock), then the
# entry's own words.
[XmaStreamEntry]
measures = ["XmaObject.+8", "sub_8245CAE0.r3.+8", "sub_8245CB38.r3.+8", "sub_8245CBB0.r3.+8", "sub_8245CD68.r3.+8", "sub_8245CE10.r3.+8", "sub_8245D050.r3.+8"]
size = 96
origin = "allocated"
fields = [
  { name = "context_buffers", offset = 0, type = "u32", note = "context word 0: input buffer 0's packet count, the loop count, the input buffers' valid bits, the output buffer's block count and write offset (probably)" },
  { name = "context_format", offset = 4, type = "u32", note = "context word 1: input buffer 1's packet count, the loop subframes, the output padding (bits 24-26), sample rate, stereo bit, output valid bit" },
  { name = "context_input_read_offset", offset = 8, type = "u32", note = "context word 2: the input read offset (bits) and the error status (top bits)" },
  { name = "context_loop_start", offset = 12, type = "u32", note = "context word 3: the loop start (bit offset)" },
  { name = "context_loop_end", offset = 16, type = "u32", note = "context word 4: the loop end (bit offset)" },
  { name = "context_input_buffer_0", offset = 20, type = "u32", note = "context word 5: input buffer 0's physical address" },
  { name = "context_input_buffer_1", offset = 24, type = "u32", note = "context word 6: input buffer 1's physical address" },
  { name = "context_output_buffer", offset = 28, type = "u32", note = "context word 7: the output buffer's physical address" },
  { name = "context_work_buffer", offset = 32, type = "u32", note = "context word 8: the work buffer's physical address" },
  { name = "context_output_read_offset", offset = 36, type = "u32", note = "context word 9: the output buffer's read offset (blocks)" },
  { name = "context_word_10", offset = 40, type = "u32", note = "context word 10" },
  { name = "context_word_11", offset = 44, type = "u32", note = "context word 11" },
  { name = "hardware_context", offset = 64, type = "u32", note = "XMACreateContext's context (0 when released)" },
  { name = "output_buffer", offset = 68, type = "u32", note = "the decoded samples' ring" },
  { name = "work_buffer", offset = 72, type = "u32" },
  { name = "samples_consumed", offset = 76, type = "u32" },
  { name = "context_id", offset = 80, type = "u16", note = "(physical address - [0x82954F0C]) / 64" },
  { name = "block_position", offset = 82, type = "u16", note = "the position in the current 256-byte output block" },
  { name = "input_address_0", offset = 84, type = "u32", note = "input buffer 0's address (virtual)" },
  { name = "input_address_1", offset = 88, type = "u32", note = "input buffer 1's address (virtual)" },
]

# A stream's description (XmaObject::Create's r4, 12 bytes each).
[XmaStreamDescription]
measure = "XmaObject::Create.r4"
size = 12
origin = "embedded"
fields = [
  { name = "sample_rate", offset = 0, type = "u32" },
  { name = "ring_samples", offset = 4, type = "u32", note = "the output ring's size, in samples" },
  { name = "channels", offset = 8, type = "u8" },
  { name = "unknown_9", offset = 9, type = "u8" },
]

# XmaObject::Create's out word (r6): the object.
[XmaObjectOut]
measure = "XmaObject::Create.r6"
size = 4
origin = "embedded"
fields = [
  { name = "object", offset = 0, type = "u32", note = "the XMA object (ours: an opaque handle)" },
]

# The XMA data a stream plays (SetInputBuffer's r5, the frame walks' r3):
# 2,048-byte packets.
[XmaData]
measures = ["XmaObject::SetInputBuffer.r5", "sub_8246A5F8.r3", "sub_8246A698.r3"]
size = 4
origin = "embedded"
fields = [
  { name = "first_packet_header", offset = 0, type = "u32", note = "the first packet's header: frame count (top 6 bits), first frame's bit offset, stream (low 8 bits)" },
]

# The loop data (XmaObject::SetLoopData's r5, XMASetLoopData's).
[XmaLoopData]
measure = "XmaObject::SetLoopData.r5"
size = 11
origin = "embedded"
fields = [
  { name = "start_bit", offset = 0, type = "u32", note = "the loop start's bit offset into the input (26 bits)" },
  { name = "end_bit", offset = 4, type = "u32", note = "the loop end's bit offset (26 bits)" },
  { name = "end_subframe", offset = 8, type = "u8", note = "subframes played in the last frame - 1 (2 bits)" },
  { name = "skip_subframes", offset = 9, type = "u8", note = "subframes skipped at the start (3 bits)" },
  { name = "count", offset = 10, type = "u8", note = "255 forever" },
]

# The read address out word (sub_8245CBB0's r6, sub_8245CD68's r5).
[XmaReadOut]
measures = ["sub_8245CBB0.r6", "sub_8245CD68.r5"]
size = 4
origin = "embedded"
fields = [
  { name = "read_address", offset = 0, type = "u32", note = "where the samples are read from" },
]

# sub_8245D070's out (r5): the input position.
[XmaInputPosition]
measure = "sub_8245D070.r5"
size = 12
origin = "embedded"
fields = [
  { name = "input_buffer", offset = 0, type = "u32", note = "the current input buffer's address (+84 or +88)" },
  { name = "read_offset", offset = 4, type = "u32", note = "the input read offset" },
  { name = "format_bits", offset = 8, type = "u32", note = "context word 1's low 3 bits" },
]

# The render driver object (20 bytes, the mastering voice's +68;
# AudioRenderDriver::AudioRenderDriver sub_82465938, docs/known-data.md).
[AudioRenderDriver]
measures = ["AudioRenderDriver", "sub_824657C8.r3"]
size = 20
origin = "allocated"
vtable = 0x8204AAEC
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "AudioRenderDriverVtable", note = "0x8204AAEC" },
  { name = "inner_vtable", offset = 4, type = "u32", note = "0x8204AAD0 (0x8204AA58 at the start, the base's 0x8204A6B8 after the destructor)" },
  { name = "ref_count", offset = 8, type = "u32" },
  { name = "callback_arg", offset = 12, type = "u32", note = "the mastering voice: the mixer callback's argument" },
  { name = "handle", offset = 16, type = "u32", note = "the render driver client's handle (ours from src/audio/native_audio.cpp), 0 when none" },
]

# The render driver's vtable (0x8204AAEC).
[AudioRenderDriverVtable]
measure = "sub_824657C8.r3.+0"
size = 32
origin = "image"
fields = [
  { name = "register_driver", offset = 28, type = "fn", note = "AudioRenderDriver::Register (sub_824657E0)" },
]

[globals]
xma_context_array = { address = 0x82954F0C, type = "u32", note = "the XMA registers' ContextArrayAddress (read once at boot by sub_8245C638, used by sub_8245D138 for context ids; neither runs now)" }

# Embedded objects the measure split from their owners after its offset
# and class-name fixes (2026-11-22): seeded from the measure; names kept
# from the owners' fault_ fields, unknown_ until read.

# Split from AudioRenderDriver.
[AudioRenderDriverOuter4]
measure = "sub_82465848.r3@-4"
size = 20
origin = "embedded"
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "unknown_4", offset = 4, type = "u32" },
  { name = "unknown_16", offset = 16, type = "u32" },
]
