# The schema of docs/functions/car-list.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The car list the type 6 and 7 panel screens show (the car pick): PanelSet
# (at the panel screens' +9752) and its base at +4 (PanelSetBase, `b` in the
# docs), the four panels the screens build (F the tabs, E the car rows, D
# the colors, C the car's info), the two-player confirm panel and the
# two-player variant PanelSetPair (src/car_list/; docs/known-data.md, "car
# list").
#
# Measure faults left unclaimed (no type here takes them):
# - "PanelSetBase.+512" (+24236, PanelSetBase::TabsPage): the two-player
#   word 0x82815EAC read through a register the measure took for b + 512.
# - "new<32>@PanelSetBase::SetUpColors" is CarListColor (tuning-pages owns
#   it by the tie: Color::HsvToRgb's reads at +0 and +8, 8 bytes wide, are
#   of the HSV at the record's +16, which SetUpColors passes).

# PanelSetBase: the car list's base (the set's +4, `b`), vtable 0x820110C4
# (one slot, sub_8224B888). Built by PanelSetBase::PanelSetBase
# (screen-constructors.md).
[PanelSetBase]
measure = "PanelSetBase"
measures = ["PanelSetBase.+1820", "PanelSetBase::PanelSetBase.r3", "PanelSetBase::Build.r3", "PanelSetBase::ToTabs.r3", "PanelSetBase::Update.r3", "PanelSetBase::HandleInput.r3"]
size = 1972
origin = "embedded"
vtable = 0x820110C4
fields = [
  { name = "vtable", offset = 0, type = "u32" },
  { name = "built", offset = 4, type = "u32", note = "the lists built (Build: nothing again while it and the two-player word share a bit)" },
