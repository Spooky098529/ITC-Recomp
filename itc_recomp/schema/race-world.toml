# Embedded objects the measure split from their owners after its offset
# fix (2026-11-22): seeded from the measure, unknown_ until read.

# Split from RaceManager.
[RaceManagerAt48]
measure = "Race@+48"
size = 6014
origin = "embedded"
fields = [
  { name = "unknown_6008", offset = 6008, type = "u32" },
  { name = "unknown_6012", offset = 6012, type = "u16" },
]

# Split from RaceManager.
[RaceManagerAt32]
measure = "RaceManager@+32"
size = 24
