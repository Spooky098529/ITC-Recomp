# The schema of docs/functions/power-graph-screen.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 6 and 7 modes' power graph screen: UI movie 9 over the car the
# player picked, its specs as texts (src/power_graph_screen/). Its page
# object and menu are menu-helpers.toml's PageObject and FrontEndMenu (the
# measure's new<28>@PowerGraphScreen67::OnEnter and new<68>@... to add to
# their measures there); the mode's dispatcher the vtable slots post to is
# boot-mode.toml's ModeDispatcher (PowerGraphScreen6::PostLeave.r4 and the
# others to add there).

# The data block (92 bytes, VirtualAlloc'ed by OnEnter, freed by OnLeft;
# [0x82815EBC]): two words, then the record at +8 filled by
# PowerGraph::SetEntry (car-list.md) or PowerGraph::SetFromCar
# (type6-type7-modes.md) and read by SetTexts. Record offsets in the notes.
[PowerGraphScreenData]
measure = "new<92>@PowerGraphScreen67::OnEnter"
size = 92
origin = "allocated"
storage = "host"
fields = [
  { name = "movie_loaded", offset = 0, type = "u32", note = "1 once movie 9 is loaded (WaitForLoad)" },
  { name = "part_icon", offset = 1, type = "u8", note = "measure fault: SetParts' r4 is the data's +68 (parts), joined with the block; its byte +1 (the part icon), not the data's +1" },
  { name = "queued_state", offset = 4, type = "u32", note = "the machine's state Update applies; 21 none, 9 from ClosedPage" },
  { name = "car_value", offset = 8, type = "u32", note = "the record (+8 to +92; its words below) +0: 0 (SetEntry) or int(the car's +1892 float) (SetFromCar); SetTexts' node 10" },
  { name = "rating", offset = 12, type = "u32", note = "record +4: the spec's +712 (SetEntry) or a value from the car data (SetFromCar); node 11" },
  { name = "spec_word_0", offset = 16, type = "u32", note = "record +8: the spec's +716 (s +76); node 12" },
  { name = "spec_word_1", offset = 20, type = "u32", note = "record +12: the spec's +724 (s +84); node 13" },
  { name = "spec_word_2", offset = 24, type = "u32", note = "record +16: the spec's +720 (s +80); node 14" },
  { name = "car_id", offset = 28, type = "u32", note = "record +20: the car id; strings 1646, 1790, 1718 + it" },
  { name = "spec_byte_0", offset = 32, type = "u32", note = "record +24: a spec byte (+769, s +129); string 1934 + it" },
  { name = "spec_byte_1", offset = 36, type = "u32", note = "record +28: a spec byte (+770, s +130); string 421 + it" },
  { name = "engine_class", offset = 40, type = "u32", note = "record +32: a class 0 to 6 from the spec byte +708 (s +68); string 428 + it" },
  { name = "spec_flag", offset = 44, type = "u32", note = "record +36: the spec byte +709 (s +69) set, 1 or 0; string 426 + it" },
  { name = "spec_word_3", offset = 48, type = "u32", note = "record +40: the spec's +648 (s +8); node 39" },
  { name = "curve_value_0", offset = 52, type = "u32", note = "record +44: int(the power curve's +1056) (+652); node 33" },
  { name = "curve_value_1", offset = 56, type = "u32", note = "record +48: int(the curve's +1060) (+656); node 40" },
  { name = "peak_torque", offset = 60, type = "f32", note = "record +52: the peak torque in kgf·m (probably); node 34" },
  { name = "peak_index", offset = 64, type = "u32", note = "record +56: int(the curve's +1052), the peak's index; node 41" },
  { name = "parts_word_0", offset = 68, type = "u32", note = "record +60 to +76 (the parts): five words from the car's +1568 (SetFromCar only); SetParts reads their bytes +1 to +11 in guest order (each word's most significant byte first)" },
  { name = "parts_word_1", offset = 72, type = "u32" },
  { name = "parts_word_2", offset = 76, type = "u32" },
  { name = "parts_word_3", offset = 80, type = "u32" },
  { name = "parts_word_4", offset = 84, type = "u32" },
  { name = "tab", offset = 88, type = "u32", note = "record +80: the tab word the caller passes (r4); node 3 shown for 2 and 5" },
]

# The screen's member (the type 6 block's +52692, the type 7 block's +42352):
# a vtable, then the machine (a StateMachine, game-modes.toml) at +4.
[PowerGraphScreen67]
measure = "PowerGraphScreen67"
size = 9620
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "PowerGraphScreen67Vtable", note = "0x82010A68 (type 6), 0x82010FD0 (type 7)" },
  { name = "machine", offset = 4, type = "bytes", count = 9616, note = "the machine (StateMachine)" },
  { name = "machine_state", offset = 9608, type = "u32", note = "the machine's state (its +9604)" },
  { name = "machine_loaded", offset = 9612, type = "u32", note = "the machine's loaded word (its +9608)" },
  { name = "machine_reenter", offset = 9616, type = "u32", note = "the mode's word the entry reads (the machine's +9612): set, state 1, else 9" },
]

# The member's vtable (0x82010A68 type 6's, 0x82010FD0 type 7's): slots 1 to
# 3 post the machine's replies on the mode's ring.
[PowerGraphScreen67Vtable]
measure = "PowerGraphScreen67.+0"
size = 16
origin = "image"
fields = [
  { name = "slot0", offset = 0, type = "fn" },
  { name = "post_leave", offset = 4, type = "fn", note = "slot 1: message 4 (type 7: 3), Leave" },
  { name = "post_closing", offset = 8, type = "fn", note = "slot 2: message 23 (20), from MenuPage" },
  { name = "post_closed", offset = 12, type = "fn", note = "slot 3: message 24 (21), from ClosedPage" },
]

# The steps' r4: the page object's started word (PageObject +24).
[PowerGraphStepStarted]
measures = ["PowerGraphScreen67::Step0.r4", "PowerGraphScreen67::Step1.r4"]
size = 4
origin = "embedded"
fields = [
  { name = "started", offset = 0, type = "u32", note = "0 on a step's first call" },
]

# SetPartRow1's and SetPartRow2's r4: a word array on SetParts' frame (the
# parts' bytes sign-extended).
[PowerGraphPartValues]
measures = ["PowerGraphScreen67::SetPartRow1.r4", "PowerGraphScreen67::SetPartRow2.r4"]
size = 4
origin = "embedded"
fields = [
  { name = "value", offset = 0, type = "s32", note = "indexed: 10 hides a row 2 node, 37 and above a row 1 node" },
]

[globals]
pages = { address = 0x82815EB4, type = "ptr", to = "PageObject", note = "the page object, VirtualAlloc'ed by OnEnter" }
menu = { address = 0x82815EB8, type = "ptr", to = "FrontEndMenu", note = "a front-end menu, +16 = 7" }
data = { address = 0x82815EBC, type = "ptr", to = "PowerGraphScreenData" }
shown = { address = 0x82815EC0, type = "u32", note = "the graph drawn while set (Step0's end); 0 from OnEnter, Open, Shown and Step1" }

# Embedded objects the measure split from their owners after its offset
# fix (2026-11-22): seeded from the measure, unknown_ until read.

# Split from PowerGraphScreenData.
[PowerGraphScreenDataAt68]
measure = "new<92>@PowerGraphScreen67::OnEnter@+68"
size = 2
origin = "embedded"
fields = [
  { name = "unknown_1", offset = 1, type = "u8" },
]
