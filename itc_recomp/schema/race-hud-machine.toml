  { name = "unknown_256", offset = 256, type = "f32" },
  { name = "unknown_260", offset = 260, type = "f32" },
  { name = "unknown_264", offset = 264, type = "f32" },
  { name = "unknown_268", offset = 268, type = "f32" },
