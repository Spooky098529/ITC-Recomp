# The schema of docs/functions/race-hud-machine.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race HUD machine (race mode + 128664, RaceHudMachine::, src/race_hud_machine/):
# one of the race mode's state machines, driving the in-race screens' holder
# ([0x826D84F0], RaceScreens::, race-hud-object.md) by the race kind.
#
# Not here: the racers' manager's entry the measure calls "Race.+2308"
# (SetUp's and ShowKind6Results' +24, AiDrivers::ResetAll's +0 and +20) is
# minimap.toml's MinimapRacerEntry (the lead to add the measure name there).

# The machine: a StateMachine (game-modes.toml) with the race HUD's words
# after its count and state. The measure meets it again as the r3 its
# handlers keep across their callees (PauseMenu::Open, AltHud::ToggleView,
# RaceHud::RunMovie answer it back).
[RaceHudMachine]
measures = ["RaceHudMachine", "PauseMenu4::Open.ret", "AltHud::ToggleView.ret", "RaceHud::RunMovie.ret"]
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateTransition, game-modes.toml); 65 added by RaceHudMachine::Init" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "0 at set-up; 1 waiting for the race world, 2 before the start, 3 a free run's intro, 4 a stage set up, 5 the countdown, 6 the HUD's movie +620, 7 the race, 8 the alternate HUD's view, 9 to 11 paused, 21 the results, 22 the menu after the race, 23 an abort, 24 and 25 the end (guesses)" },
  { name = "holder", offset = 9608, type = "ptr", to = "RaceScreens", note = "the in-race screens' holder ([0x826D84F0], copied by CreateScreens)" },
  { name = "kind", offset = 9612, type = "u32", note = "the race kind (the race data's +0xA3AF0, copied by CreateScreens): 1 to 3 and 6 the race HUD, 4 the holder's +656 object, 5 the alternate HUD, 0 the attract race's +12" },
  { name = "message30", offset = 9616, type = "u32", note = "set by message 30 (OnMessage30), cleared by SetUp and ClosePause; read only by kind 4's pause menu" },
]

# The measure's join of RaceHud::RunMovie's r3 (the HUD, its +456 and +604)
# with the machine the draws keep in r3 (CountdownDraw's and RaceDraw's
# +9608 after RaceHud::RunMovie). race-hud-object.toml's RaceHud +436 (the
# countdown running, a word, not a pointer) points here by that join.
[RaceHud_436]
measure = "RaceHud.+436"
size = 9612
origin = "embedded"
fields = [
  { name = "fault_hud_movie_running", offset = 456, type = "u32", note = "measure fault: RaceHud::RunMovie's HUD +456 (its movie +604 run when not 0)" },
  { name = "fault_hud_movie", offset = 604, type = "u32", note = "measure fault: RaceHud::RunMovie's HUD +604 (a UI movie)" },
  { name = "fault_machine_holder", offset = 9608, type = "ptr", to = "RaceScreens", note = "measure fault: the machine's +9608 (the holder), read by CountdownDraw and RaceDraw" },
]

# The in-race screens' holder (1,040 bytes, [0x826D84F0], VirtualAlloc'd by
# RaceScreens::Create, freed by RaceScreens::Destroy; known-data.md). The race
# HUD (RaceHud, race-hud-object.toml) is embedded at +16, the +656 object
# (SplitHud) at +656, the alternate HUD's holder (AltHudHolder, alt-hud.toml)
# at +1004: the words of theirs the holder's users reach through the holder
# are named here by the object's offset.
[RaceScreens]
measures = ["RaceScreens", "PauseMenu4::Open.ret.+9608", "AltHud::ToggleView.ret.+9608", "RaceHud.+436.+9608"]
size = 1040
origin = "allocated"
fields = [
  { name = "fault_alt_hud_object", offset = 0, type = "u32", note = "measure fault: RaceScreens::Make1004's r3 is the holder's +1004 (AltHudHolder's object)" },
  { name = "fault_alt_hud_menu_list", offset = 4, type = "u32", note = "measure fault: RaceScreens::Make1004's AltHudHolder +4 (the menu list)" },
  { name = "flags", offset = 8, type = "u32", note = "0 at set-up; bit 0 the replay bit (set when the menu after the race picks the replay: the alternate HUD drawn in place of the race HUD)" },
  { name = "fault_split_countdown_running", offset = 336, type = "u32", note = "measure fault: sub_822159F0's r3 is the holder's +656 (SplitHud +336)" },
  { name = "fault_split_mode", offset = 340, type = "u32", note = "measure fault: sub_82216810's and sub_82216830's r3 is the holder's +656 (SplitHud +340)" },
  { name = "hud_signs_on", offset = 440, type = "u32", note = "the race HUD's +424 (signs on): 1 by CloseResults, 0 by OnRaceEnd" },
  { name = "hud_countdown_running", offset = 452, type = "u32", note = "the race HUD's +436: CountdownUpdate goes to the race once it's 0" },
  { name = "hud_results", offset = 460, type = "ptr", to = "RacerResultsRecord", note = "the race HUD's +444: the race progress's ([0x826D82E8]) +2184, its results record (StartCountdown)" },
  { name = "fault_hud_countdown_movie", offset = 612, type = "u32", note = "measure fault: sub_82212A38's r3 is the holder's +16 (the HUD's movie +612)" },
  { name = "fault_hud_movie2", offset = 620, type = "u32", note = "measure fault: sub_822126C8's, sub_82212868's and sub_82212AE8's r3 is the holder's +16 (the HUD's movie +620)" },
  { name = "fault_ring_count", offset = 820, type = "u32", note = "measure fault: RaceUpdate's post, the race mode's dispatcher's ring count (+804)" },
  { name = "fault_ring_start", offset = 824, type = "u32", note = "measure fault: RaceUpdate's post, the dispatcher's ring start (+808)" },
  { name = "split_results", offset = 1000, type = "ptr", to = "RacerResultsRecord", note = "the +656 object's +344: the race progress's +2184 (StartCountdown, kind 4)" },
  { name = "alt_hud", offset = 1004, type = "bytes", count = 8, note = "the alternate HUD's holder (AltHudHolder, alt-hud.toml): the object and its menu list" },
  { name = "pause_menu", offset = 1012, type = "ptr", note = "[0x826D84D0], the pause menu (the measure's PauseMenu4 ... new<4>@sub_8220D7E8; race-screens.md)" },
  { name = "kind4_pause_menu", offset = 1016, type = "ptr", note = "[0x826D84E0], kind 4's pause menu, probably (the measure's PauseMenu4)" },
  { name = "after_race_menu", offset = 1020, type = "ptr", note = "[0x826D8510], the menu after the race (the measure's new<4>@sub_8221B1F0)" },
  { name = "career_results", offset = 1024, type = "ptr", note = "[0x826D8500], the career's results (the measure's CareerResults, race-screens.md)" },
  { name = "race_results", offset = 1028, type = "ptr", note = "[0x82814E18], the results of kinds 1 (mode 0) and 2 (the measure's RaceResults)" },
  { name = "split_results_screen", offset = 1032, type = "ptr", note = "[0x82814E1C], the results of kinds 4 and 6 (the measure's SplitResults)" },
  { name = "kind6_menu", offset = 1036, type = "ptr", note = "[0x82814E10], kind 6's screen after the race (the measure's Kind6Menu)" },
]

# The race mode's dispatcher (the race mode's +36; game-modes.toml's
# RaceMode names the same words there): the handlers' r4. Posting a message
# appends to its ring.
[RaceHudMachineDispatcher]
measures = ["RaceHudMachine::PauseUpdate.r4", "RaceHudMachine::AfterRaceUpdate.r4", "RaceHudMachine::ResultsUpdate.r4"]
size = 812
origin = "embedded"
fields = [
  { name = "handlers", offset = 0, type = "bytes", count = 200, note = "50 handler pointers (state machines)" },
  { name = "handler_count", offset = 200, type = "u32" },
  { name = "ring", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (ModeMessage: +0 the message, +4 and +8 0)" },
  { name = "ring_count", offset = 804, type = "u32" },
  { name = "ring_start", offset = 808, type = "u32" },
]

# A results record (3,936 bytes; known-data.md "racer record array" and the
# race progress's +2184): the race data's records at +48 and +0x59AE8
# (RacerRecords::At), the race progress's +2184, a vehicle's +5712. Entries
# E of 972 bytes from +4, one a racer; e0_ is entry 0's word, e1_ entry 1's.
[RacerResultsRecord]
measures = ["RacerRecords::At.ret", "Vehicle::Get.ret.+5712", "RaceHud.+344", "sub_82215A50.r3.+344", "sub_82216908.r3.+344", "sub_82216950.r3.+344"]
size = 3936
origin = "embedded"
fields = [
  { name = "count", offset = 0, type = "u32", note = "the entries' count" },
  { name = "e0_record_index", offset = 4, type = "u32", note = "E +0: the racer record's index" },
  { name = "e0_item", offset = 8, type = "u32", note = "E +4: its item (an id; AwardPrize's opponents, from entry 1)" },
  { name = "e0_place", offset = 12, type = "u32", note = "E +8: its place (0 the leader)" },
  { name = "e0_ticks", offset = 16, type = "u32", note = "E +12: its ticks raced" },
  { name = "e0_time", offset = 20, type = "u32", note = "E +16: its time (RaceTime::FromTicks)" },
  { name = "e0_flag_ticks", offset = 784, type = "u32", note = "E +780: ticks with the vehicle's byte +2424 set" },
  { name = "e0_sp", offset = 788, type = "u32", note = "E +784: SP (probably spirit points; 0 is out)" },
  { name = "e0_mean_speed", offset = 796, type = "u32", note = "E +792: a running mean of the speed in km/h" },
  { name = "e0_mean_speed_pair", offset = 796, type = "u64", note = "E +792 read as a doubleword" },
  { name = "unknown_800", offset = 800, type = "u32" },
  { name = "e0_top_speed", offset = 804, type = "f32", note = "E +800: the top speed" },
  { name = "e0_hard_hit", offset = 808, type = "u32", note = "E +804: a hard hit (230.0 or more)" },
  { name = "e0_track_hits", offset = 812, type = "u32", note = "E +808" },
  { name = "e0_car_hits", offset = 816, type = "u32", note = "E +812" },
  { name = "e0_distance", offset = 820, type = "f32", note = "E +816: the distance in km" },
  { name = "e0_route_distance", offset = 828, type = "f32", note = "E +824: the distance along the stage's route (the place's key); AwardPrize's prize from it" },
  { name = "e0_split_0", offset = 844, type = "f32", note = "E +840: the first of 8-byte entries, a float each (AwardPrize's +24; their count +968)" },
  { name = "e0_split_1", offset = 852, type = "f32", note = "E +848: the second (AwardPrize's pairs from here, 8 bytes apart)" },
  { name = "e0_split_count", offset = 968, type = "u16", note = "E +964: the 8-byte entries' count" },
  { name = "e0_input_seen", offset = 972, type = "u32", note = "E +968: 1 once the input's halfword +6 or +10 was nonzero" },
  { name = "e1_item", offset = 980, type = "u32", note = "entry 1's item (AwardPrize walks +980 + 972i)" },
  { name = "e1_sp", offset = 1760, type = "u32", note = "entry 1's SP" },
  { name = "route", offset = 3892, type = "u32", note = "a 16-byte route's first word" },
  { name = "kind6_result", offset = 3916, type = "u32", note = "kind 6's result: 0 or 2 posts 40 after the race, 1 or 3 its own screen" },
  { name = "outcome", offset = 3920, type = "u32", note = "1 finished (probably), 3 tested (the menu after the race's flag; AwardPrize's +0 2)" },
  { name = "finish", offset = 3924, type = "u32", note = "1 probably a win, 2 a loss, 3" },
  { name = "unknown_3928", offset = 3928, type = "u32" },
  { name = "ticks", offset = 3932, type = "u32", note = "probably the race's tick count (RaceHud::RunTimerMovie's FromTicks)" },
]

