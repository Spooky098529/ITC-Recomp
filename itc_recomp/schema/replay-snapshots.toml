# The schema of docs/functions/replay-snapshots.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race's snapshots for its replay (src/replay_snapshots/): a block
# (ReplaySnapshot, 38,928 bytes) of the input recordings holds the racers'
# manager's entries and counts, then one 5,232-byte record a vehicle
# (ReplayRecord) with its parts: the rigid body (ReplayBodyState), the
# physics part (ReplayVehiclePhysics) and the collision object
# (ReplayCollisionState, with its two placed shape copies, ReplayShapeState).
# Each part's fields are the vehicle's (car-physics.toml's Vehicle,
# RigidBody, CollisionWorldObject, collision.toml's BoxShape) whose names
# they take; vectors (16 bytes) and matrices (64) are bytes fields, as
# car-physics.toml's (the code passes their addresses to the vector library
# and the matrix math).

# A race snapshot: the racers' manager's head ([0x826D82F4], race-world.md)
# and the seven vehicles' records. Two in the input recordings: block A
# (+0x20F590, the race's start) and block B (+0x218DA0, its end); the kept
# replay's +0x2B610 a copy of block A.
[ReplaySnapshot]
measures = ["RaceSnapshot", "RaceSnapshot::Copy.r4"]
size = 38928
origin = "embedded"
fields = [
  { name = "entries", offset = 0, type = "bytes", count = 2156, note = "the manager's first 77 entries (28 bytes each, from its +4)" },
  { name = "traffic_entries", offset = 2156, type = "bytes", count = 84, note = "the manager's three traffic entries (its +2160)" },
  { name = "slot_0", offset = 2240, type = "u32", note = "the manager's 7 slot words (+2336 to +2360)" },
  { name = "slot_1", offset = 2244, type = "u32" },
  { name = "slot_2", offset = 2248, type = "u32" },
  { name = "slot_3", offset = 2252, type = "u32" },
  { name = "slot_4", offset = 2256, type = "u32" },
  { name = "slot_5", offset = 2260, type = "u32" },
  { name = "slot_6", offset = 2264, type = "u32" },
  { name = "racer_count", offset = 2268, type = "u32", note = "the manager's +2364" },
  { name = "entry_count", offset = 2272, type = "u32", note = "the manager's +2368" },
  { name = "opponent_count", offset = 2276, type = "u32", note = "the manager's +2372 (opponents streamed in)" },
  { name = "traffic_listed", offset = 2280, type = "u32", note = "the manager's +2376" },
  { name = "traffic_count", offset = 2284, type = "u32", note = "the manager's +2380" },
  { name = "unknown_2288", offset = 2288, type = "u32", note = "the manager's +2388" },
  { name = "unknown_2292", offset = 2292, type = "u32", note = "0 at RaceSnapshot::Save, copied by RaceSnapshot::Copy" },
  { name = "records", offset = 2304, type = "bytes", count = 36624, note = "seven ReplayRecords (5,232 bytes each), one a vehicle (Vehicle::Get(i))" },
]

# A vehicle's record (5,232 bytes, constructed by Record5232::Record5232 in
# data-load.md).
[ReplayRecord]
measure = "Record5232"
size = 5232
origin = "file"
fields = [
  { name = "car_flags", offset = 0, type = "u32", note = "the vehicle's +6148 (0: the vehicle not in use, the record skipped)" },
  { name = "collision_flags", offset = 4, type = "u32", note = "the vehicle's +6152 (its contact bits)" },
  { name = "status", offset = 16, type = "bytes", count = 112, note = "the vehicle's +6160 (VehicleStatus, memcpy)" },
  { name = "track_positions", offset = 128, type = "bytes", count = 480, note = "the vehicle's five track positions (+5232, 96 bytes each; TrackPosition::Copy)" },
  { name = "body", offset = 608, type = "bytes", count = 528, note = "a ReplayBodyState (516 bytes): the rigid body's (vehicle +336)" },
  { name = "physics", offset = 1136, type = "bytes", count = 2944, note = "a ReplayVehiclePhysics (2,938 bytes): the vehicle's +0 to +3241, packed" },
  { name = "collision", offset = 4080, type = "bytes", count = 1152, note = "a ReplayCollisionState: the collision object's (vehicle +340)" },
]

# The rigid body's first 516 bytes (car-physics.toml's RigidBody, at the
# same offsets): a record's +608.
[ReplayBodyState]
measure = "BodyState"
size = 516
origin = "embedded"
fields = [
  { name = "fixed", offset = 0, type = "u8", note = "set: no inverse mass" },
  { name = "mass", offset = 4, type = "f32" },
  { name = "inverse_mass", offset = 8, type = "f32" },
  { name = "center_of_mass", offset = 16, type = "bytes", count = 16 },
  { name = "velocity", offset = 32, type = "bytes", count = 16 },
  { name = "speed_cap", offset = 48, type = "f32" },
  { name = "force", offset = 64, type = "bytes", count = 16 },
  { name = "orientation", offset = 80, type = "bytes", count = 16, note = "a quaternion, copied as two doublewords (ld, std)" },
  { name = "angular_velocity", offset = 96, type = "bytes", count = 16 },
  { name = "spin_cap", offset = 112, type = "f32" },
  { name = "torque", offset = 128, type = "bytes", count = 16 },
  { name = "velocity_direction", offset = 144, type = "bytes", count = 16 },
  { name = "speed", offset = 160, type = "f32" },
  { name = "linear_damping", offset = 164, type = "f32" },
  { name = "momentum", offset = 176, type = "bytes", count = 16 },
  { name = "center_of_mass_offset", offset = 192, type = "bytes", count = 16 },
  { name = "origin", offset = 208, type = "bytes", count = 16 },
  { name = "orientation_matrix", offset = 224, type = "bytes", count = 64 },
  { name = "matrix", offset = 288, type = "bytes", count = 64 },
  { name = "inertia", offset = 352, type = "bytes", count = 16 },
  { name = "inverse_inertia", offset = 368, type = "bytes", count = 16 },
  { name = "angular_damping", offset = 384, type = "f32" },
  { name = "angular_momentum", offset = 400, type = "bytes", count = 16 },
  { name = "world_inverse_inertia", offset = 416, type = "bytes", count = 64 },
  { name = "gravity", offset = 480, type = "bytes", count = 16 },
  { name = "weight", offset = 496, type = "bytes", count = 16 },
  { name = "effective_mass", offset = 512, type = "f32" },
]

