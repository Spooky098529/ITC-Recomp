# ReplayPlacedBox: merged into collision.toml's BoxShape at the integration (the same object).

# A measure fault: the r4 of the six record copies (Record5232::CopyTrack,
# BodyState::Copy, Member1136::Copy, Part464::Copy, Member4080::CopyShapes,
# Member4080::Copy) joined into one type, each a different part of a record
# (ReplayRecord, ReplayBodyState, ReplayVehiclePhysics, ReplayShapeState,
# ReplayCollisionState). One bytes field until the measure splits them.
[ReplayCopySource]
measure = "Record5232::CopyTrack.r4@+1136"
measures = ["Record5232::CopyTrack.r4@+608", "Part464::Copy.r4", "Record5232::CopyTrack.r4@+4080", "Record5232::CopyTrack.r4", "Record5232::Copy.r4@+4080@+16"]
size = 2938
origin = "embedded"
fields = [
  { name = "part", offset = 0, type = "bytes", count = 2938, note = "a record part (which one depends on the copy)" },
]

