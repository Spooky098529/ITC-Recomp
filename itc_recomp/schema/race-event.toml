# A player's save data (0x1F978 bytes, SaveData::Of; career.toml's
# CareerSave is the same object).
[SaveData]
measure = "SaveData::Of.ret"
measures = ["SaveData"]
size = 129400
origin = "allocated"
fields = [
  { name = "new_game", offset = 0, type = "u32", note = "1 for a new game; also TodaysEvent::NextUnlockEntry's and Type2Hub::NextNotice's +0 (probably a list entry joined by the measure)" },
  { name = "shown_items", offset = 4, type = "u32", note = "Settings::Read: OR'd with bit 5 of +6092 into the options' +8 (the sound page's items shown)" },
  { name = "pick_head", offset = 8, type = "u32", note = "the pick's first word (CareerPick.head)" },
  { name = "wins", offset = 60, type = "u16", note = "the stats record's +12" },
  { name = "races_20", offset = 68, type = "u16", note = "the stats record's +20, a race count" },
  { name = "races_22", offset = 70, type = "u16", note = "the stats record's +22, a race count" },
  { name = "day_float_4836", offset = 4908, type = "f32", note = "the day block's float +4836" },
  { name = "mode_counts", offset = 5844, type = "u16", note = "+5844 + 14 x mode: a count, up to 9999 (mode 0's)" },
  { name = "location_count_12", offset = 5910, type = "u16", note = "+5886 + 2 x location: counts by location (location 12's)" },
  { name = "mean_796", offset = 5952, type = "f32", note = "the stats record's +5904, a running mean" },
