# The schema of docs/functions/race-event.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race event (RaceEvent::, 160 bytes at [0x826C6078]): the opponents a
# career race offers, from the data tables' 400 items sorted by their unlock
# state into pools by location (RaceEvent::Init's 6,080-byte block), trimmed
# and copied into ten groups; locations 0 to 3 also get the event's list
# (+156). The items' unlock conditions are tests over the save data and the
# garage's selected car (EventCondition::). Names are ours and mostly guesses
# (docs/known-data.md's race event rows). Also here, as the measure files
# them under this area (the area touching them most): the save data
# (SaveData::Of's), the data tables' item, a car object's copies of its spec
# (+1888, sub_820C4550's) and the power curve EventCondition::Power builds.
#
# Measure faults (tools/type_map.py), kept as fields with their own names:
# - "Unlock" joins the item with Car::FromBuild's and CarDecal::FromBuild's
#   car build (an item's +160; the build_ fields hold the build's offsets)
#   and Unlock::HasSectionCondition's unlock block (an item's +40).
# - RaceEvent joins the event with EventPools::ToGroup's and ToGroupNoList's
#   group (their +4 and +8, which fit the section flags' words), and with
#   RaceEvent::FindRacer's and RaceEvent::Entry's list entry (+0).
# - EventGroup.+8's offsets from EventGroup::PromoteUnlocked's moves wrap at
#   2^32 (the entry before, -4 and -2, and the one after: offsets 2^32 - 4
#   to 2^32 + 2).
# - SceneModelRecord::SetWheels.ret joins block 2's copy with
#   sub_820CE600's and sub_820CE7F0's engine stage (its +20 to +28).
# - EventCondition's +0 read as a word by EventCondition::CategoryMask: its
#   r4 and r5 (&a location, &a mode mask) are a condition's arguments.
# The same objects as other areas' types (for the lead to merge): SaveData
# is career.toml's CareerSave; OpponentItem career.toml's CareerOpponentItem;
# StagePowerCurve the measure's PowerCurve; RaceEventRoutePosition the
# measure's RoutePosition.

# The race event (160 bytes, RaceEvent::Make; [0x826C6078]).
[RaceEvent]
measure = "RaceEvent"
size = 160
origin = "allocated"
fields = [
  { name = "section_rival_waiting", offset = 0, type = "u32", note = "1 when a list entry's item has a kind 65 condition (RaceEvent::Init); also the list entry's item id through the measure's join" },
  { name = "on_section_13", offset = 4, type = "u32", note = "1 while the player's car is on section 13's slices 0 to 9 (AiPath::NoteFixedSections; +4 and +8, or +12 and +16, let the section rival in); also a group's entries through the measure's join" },
  { name = "on_section_14", offset = 8, type = "u32", note = "section 14's slices 0 to 4; also a group's locked entries through the measure's join" },
  { name = "on_section_4", offset = 12, type = "u32", note = "section 4's slices 0 to 9" },
  { name = "on_section_5", offset = 16, type = "u32", note = "section 5's slices 0 to 4" },
  { name = "count", offset = 20, type = "u16", note = "the list's count (+22 + +24)" },
  { name = "open_0_to_3", offset = 22, type = "u16", note = "groups 0 to 3's open counts summed" },
  { name = "locked_0_to_3", offset = 24, type = "u16", note = "groups 0 to 3's locked counts summed" },
  { name = "open_4_to_9", offset = 26, type = "u16", note = "groups 4 to 9's open counts summed" },
  { name = "locked_4_to_9", offset = 28, type = "u16", note = "groups 4 to 9's locked counts summed" },
  { name = "mode", offset = 30, type = "u16", note = "RaceEvent::SetMode" },
  { name = "mode_streak", offset = 32, type = "u16", note = "the save data's +6060 + 1 with the same mode as last, else 1" },
  { name = "location", offset = 34, type = "u16" },
  { name = "groups", offset = 36, type = "bytes", count = 120, note = "ten EventGroups, one a location 0 to 9" },
  { name = "group0_open", offset = 36, type = "u16", note = "group 0's (EventGroup.open)" },
  { name = "group0_locked", offset = 38, type = "u16" },
  { name = "group0_entries", offset = 40, type = "ptr", to = "EventGroupEntry" },
  { name = "group0_locked_entries", offset = 44, type = "ptr", to = "EventGroupEntry" },
  { name = "group4_open", offset = 84, type = "u16", note = "group 4's (EventGroup.open)" },
  { name = "group4_locked", offset = 86, type = "u16" },
  { name = "group4_entries", offset = 88, type = "ptr", to = "EventGroupEntry" },
  { name = "group4_locked_entries", offset = 92, type = "ptr", to = "EventGroupEntry" },
  { name = "list", offset = 156, type = "ptr", to = "RaceEventEntry", note = "VirtualAlloc'ed, count +20" },
]

# A list entry (12 bytes, the event's +156; RaceEvent::Alloc's).
[RaceEventEntry]
measure = "new<?>@RaceEvent::Alloc"
measures = ["RaceEvent::Entry.ret"]
size = 12
origin = "allocated"
fields = [
  { name = "item_id", offset = 0, type = "u32", note = "the opponent's item (its car build at the item's +160)" },
  { name = "start", offset = 4, type = "u32", note = "a start position (two halfwords, -1 -1 until placed: RaceEvent::PlaceEntry)" },
  { name = "flag", offset = 8, type = "u32", note = "1 open or found among the racers; 0 gives the racer flags 0x300" },
  { name = "start_section", offset = 4, type = "u16", note = "start's high halfword: the start's route section (RaceManager::AddRacers)" },
  { name = "start_slice", offset = 6, type = "u16", note = "start's low halfword: its slice" },
]

# A race event group (12 bytes, the event's +36 + 12 x location).
[EventGroup]
measure = "EventGroup"
measures = ["EventGroup::Alloc.r3", "EventGroup::Free.r3"]
size = 12
origin = "embedded"
fields = [
  { name = "open", offset = 0, type = "u16", note = "the open count" },
  { name = "locked", offset = 2, type = "u16", note = "the locked count" },
  { name = "entries", offset = 4, type = "ptr", to = "EventGroupEntry", note = "VirtualAlloc'ed, open + locked entries" },
  { name = "locked_entries", offset = 8, type = "ptr", to = "EventGroupEntry", note = "the locked part: +4 + 4 x the open count" },
]

# A group's entry (4 bytes).
[EventGroupEntry]
measure = "EventGroup.+4"
measures = ["EventGroup.+8", "EventPools::CopyIds.r4", "RaceEvent@+84.+4", "RaceEvent@+84.+8"]
size = 4
origin = "embedded"
fields = [
  { name = "item_id", offset = 0, type = "u16" },
  { name = "list_index", offset = 2, type = "u16", note = "its index in the event's list (locations 0 to 3; -1 once promoted past the open ones)" },
  { name = "word", offset = 0, type = "u32", note = "the entry as one word (the swaps)" },
  { name = "next_item_id", offset = 4, type = "u16", note = "the next entry's (the moves)" },
  { name = "next_list_index", offset = 6, type = "u16" },
  { name = "next_word", offset = 4, type = "u32" },
  { name = "wrapped_prev_item_id", offset = 4294967292, type = "u16", note = "measure fault: the entry before (-4), its offset not wrapped to 32 bits" },
  { name = "wrapped_prev_list_index", offset = 4294967294, type = "u16", note = "measure fault: -2" },
  { name = "wrapped_item_id", offset = 4294967296, type = "u16", note = "measure fault: +0" },
  { name = "wrapped_list_index", offset = 4294967298, type = "u16", note = "measure fault: +2" },
]

# A location's pools (608 bytes; RaceEvent::Init's block holds ten): counted
# halfword lists of item ids, up to 100 each.
[EventPools]
measure = "EventPools"
size = 608
origin = "embedded"
fields = [
  { name = "open", offset = 0, type = "u16", note = "the open items not beaten: the count" },
  { name = "open_ids", offset = 2, type = "bytes", count = 200, note = "their ids" },
  { name = "won", offset = 202, type = "u16", note = "the open items beaten: the count" },
  { name = "won_ids", offset = 204, type = "bytes", count = 200 },
  { name = "locked", offset = 404, type = "u16", note = "the locked items and the rivals of the others: the count" },
  { name = "locked_ids", offset = 406, type = "bytes", count = 200 },
  { name = "kept", offset = 606, type = "u16", note = "the kept count (at most the location's cap)" },
]

# RaceEvent::Init's block: ten EventPools.
[RaceEventPoolBlock]
measure = "new<6080>@RaceEvent::Init"
size = 6080
origin = "allocated"
fields = [
  { name = "pools", offset = 0, type = "bytes", count = 6080, note = "ten EventPools, one a location" },
  { name = "pool0_open", offset = 0, type = "u16" },
  { name = "pool0_won", offset = 202, type = "u16" },
  { name = "pool0_locked", offset = 404, type = "u16" },
  { name = "pool0_kept", offset = 606, type = "u16" },
  { name = "pool4_open", offset = 2432, type = "u16" },
  { name = "pool4_won", offset = 2634, type = "u16" },
  { name = "pool4_locked", offset = 2836, type = "u16" },
  { name = "pool4_kept", offset = 3038, type = "u16" },
]

# An event condition (20 bytes): an item's +48, +68 (its unlock) and +100
# (available).
[EventCondition]
measure = "EventCondition"
measures = ["EventCondition::State.r3"]
size = 20
origin = "embedded"
fields = [
  { name = "answer", offset = 0, type = "s16", note = "the answer wanted" },
  { name = "kind", offset = 2, type = "s16", note = "0 to 67 (the tests in race-event.md)" },
  { name = "arg0", offset = 4, type = "s32", note = "the arguments: -1 unused" },
  { name = "arg1", offset = 8, type = "s32" },
  { name = "arg2", offset = 12, type = "s32" },
  { name = "arg3", offset = 16, type = "s32" },
]

# The data tables' item (3,008 bytes, DataTables::Item; the opponents).
[OpponentItem]
measure = "DataTables::Item.ret"
measures = ["Unlock", "CarDecal::FromBuild.r4"]
size = 3008
origin = "file"
fields = [
  { name = "id", offset = 0, type = "u16" },
  { name = "category", offset = 34, type = "u8", note = "0 to 47, bits counted by the unlock tests" },
  { name = "kind", offset = 35, type = "u8", note = "0 to 5 (signed): kind 2 waits on its category's kind 0 items, kind 5 on every other item" },
  { name = "location", offset = 36, type = "u8", note = "0 to 9 (signed)" },
  { name = "sort_key", offset = 37, type = "u8", note = "after +35 (signed); the racer's +3924" },
  { name = "unlock", offset = 40, type = "bytes", count = 48, note = "the unlock block, +40 to +87" },
  { name = "mode_mask", offset = 40, type = "u16", note = "a mask of modes (read signed)" },
  { name = "level", offset = 42, type = "u16", note = "1 to 4" },
  { name = "listed", offset = 46, type = "u8", note = "1 listed while locked, 2 never" },
  { name = "any", offset = 47, type = "u8", note = "0 both conditions, else either" },
  { name = "condition_0", offset = 48, type = "bytes", count = 20, note = "an EventCondition" },
  { name = "condition_1", offset = 68, type = "bytes", count = 20, note = "an EventCondition" },
  { name = "race_kind", offset = 88, type = "u16", note = "0 to 5 (Race::SetUpRival); 3 has the rivals' rivals followed" },
  { name = "location_offset", offset = 90, type = "u8", note = "a kind 4 or 5 race's location offset" },
  { name = "counts_owned", offset = 91, type = "u8", note = "1 counts for RaceEvent::FirstOwned" },
  { name = "rival_0", offset = 92, type = "u16", note = "three rival item ids (-1 ends), +92 to +96" },
  { name = "rival_1", offset = 94, type = "u16" },
  { name = "rival_2", offset = 96, type = "u16" },
  { name = "available", offset = 100, type = "bytes", count = 20, note = "the availability condition (an EventCondition, Items::Available)" },
  { name = "build", offset = 160, type = "bytes", count = 2812, note = "a car build (Car::FromBuild)" },
  { name = "unknown_180", offset = 180, type = "u16", note = "Race::SetUpRival" },
  { name = "unknown_182", offset = 182, type = "u8", note = "Race::SetUpRival" },
