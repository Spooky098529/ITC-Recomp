# The schema of docs/functions/type2-screens.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# Four of the type 2 mode's screen machines (src/type2_screens/): the hub
# (the mode block's +0, UI movie 0), the spec sheet (+56624, movie 9), the
# build screen's machine (+0x1BF20, movie 6) and the license plate editor
# (+0x20A70, movie 26). Each machine's blocks are VirtualAlloc'ed by its
# Create:
# - its page object (28 bytes) is a PageObject (menu-helpers.toml); the
#   measure files them as "new<28>@Type2Hub::Create",
#   "new<28>@PlateEditor::Create", "new<28>@BuildScreen::Create" and
#   "new<28>@PowerGraphScreen::Create" (to add to PageObject's measures);
# - the hub's and the spec sheet's menus (68 bytes) are FrontEndMenu
#   (menu-helpers.toml): "new<68>@Type2Hub::Create" and
#   "new<68>@PowerGraphScreen::Create";
# - the plate editor's and the build screen's menu lists (72 bytes) are
#   MenuList (race-screens.toml): "new<72>@PlateEditor::Create",
#   "new<72>@BuildScreen::Create" and "new<72>@BuildScreen::Create#2";
# - the garage car the hub copies for the spec sheet's car data
#   ("sub_8218D708.r3": +12 the id, +1568, +1892) is car-makers.toml's
#   GarageCar.
# The spec sheet's machine is also power-graph.toml's SpecSheetMachine
# ("sub_821B8F60.r3"): one object, described here as SpecSheet.

# The hub's machine: a StateMachine (game-modes.toml) with a word of its own
# after it, as the type 2 mode's other machines. The measure also files
# under "Type2Hub" the hub's data (Type2HubData: +0 to +447, through the
# helpers given it in r3): it fits `transitions` but isn't the machine's (a
# measure fault).
[Type2Hub]
measure = "Type2Hub"
size = 9620
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's); the measure also files Type2HubData's words here" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32" },
  { name = "loaded", offset = 9608, type = "u32", note = "1 once movies 0, 9, 10 and both image lists are loaded (WaitForLoad)" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: Create and WaitForLoad go to state 9; the mode's Init sets 1" },
  { name = "delete_movie", offset = 9616, type = "u32", note = "nonzero: Unload deletes movie 0 (UiMovies::Delete) and clears `loaded`" },
]

# The hub's data ([0x826D8418]: VirtualAlloc'ed for 68 bytes, used up to
# +447; docs/known-data.md). The measure joins it with the machine
# ("Type2Hub"), so this type has no measure name of its own.
[Type2HubData]
size = 448
origin = "allocated"
fields = [
  { name = "set_up", offset = 0, type = "u32", note = "1 once set up (SetUpStatus); Reenter's transition 4 when set, else 0" },
  { name = "quitting", offset = 4, type = "u32", note = "set by Choose for item 7 (the quit question); the machine to state 14 on the destroy" },
  { name = "stand_model", offset = 8, type = "u32", note = "GarageStage::ReloadModel's answer (Update): the stand drawn when set" },
  { name = "car_refused", offset = 12, type = "u32", note = "1 when the selected garage car's spec has byte +771 1 (items 1 and 2 refused; FillMenu)" },
  { name = "busy_shown", offset = 16, type = "u32", note = "the stand's busy marker shown (ShowBusy, HideBusy)" },
  { name = "unknown_20", offset = 20, type = "u32", note = "0 from Create, Start, Unload, Destroy; 1 from message 48" },
  { name = "dialog_step", offset = 24, type = "u32", note = "the dialogs' step (OnDialogDone)" },
  { name = "dialog_answer", offset = 28, type = "u32", note = "the dialog's answer: 0 OnYes, 1 OnNo" },
  { name = "images", offset = 32, type = "bytes", count = 184, note = "the first list: 46 pointers to Type2HubImage (assets 22696 +)" },
  { name = "image_count", offset = 216, type = "u32" },
  { name = "images2", offset = 220, type = "bytes", count = 184, note = "the second list: 46 pointers to Type2HubImage (assets 22741 +)" },
  { name = "image2_count", offset = 404, type = "u32" },
  { name = "image_bits", offset = 408, type = "u32", note = "the images' bit set (46 bits, two words; MarkNoticeImages)" },
  { name = "image_bits2", offset = 412, type = "u32" },
  { name = "notice2", offset = 416, type = "bytes", count = 12, note = "the second list's notice found (NextNotice2: a 12-byte save entry)" },
  { name = "notice2_read", offset = 416, type = "u32" },
  { name = "notice2_table", offset = 420, type = "u32" },
  { name = "record_string", offset = 424, type = "u32", note = "the notice2's third word: the record's string (7527 + it, SetRecordText); -1 from Create" },
  { name = "notice", offset = 428, type = "bytes", count = 12, note = "the first list's notice found (NextNotice: a 12-byte save entry)" },
  { name = "notice_read", offset = 428, type = "u32" },
  { name = "notice_table", offset = 432, type = "u32", note = "the data table (DataTables::Entry56)" },
  { name = "notice_entry", offset = 436, type = "u32", note = "the entry; -1 none (Create)" },
  { name = "movie_image", offset = 440, type = "u32", note = "movie 0's object's +36, kept by Start, put back by Unload and Close" },
  { name = "movie_image2", offset = 444, type = "u32", note = "movie 0's object's +32, kept and put back with it" },
]

# A notice image's texture record (12 bytes, VirtualAlloc'ed by ImageLoaded).
[Type2HubTexture]
measure = "new<12>@Type2Hub::ImageLoaded"
size = 12
origin = "allocated"
fields = [
  { name = "texture", offset = 0, type = "u32", note = "XPR::GetTexture(0)" },
  { name = "width", offset = 4, type = "u32", note = "level 0's (Texture::GetLevelDesc)" },
  { name = "height", offset = 8, type = "u32" },
]

# A notice image record (16 bytes, VirtualAlloc'ed by LoadNoticeImage, one
# a list; the archive's callback ImageLoaded fills it).
[Type2HubImage]
measures = ["new<16>@Type2Hub::LoadNoticeImage", "new<16>@Type2Hub::LoadNoticeImage#2", "Type2Hub::ImageLoaded.r6", "Type2Hub.+32", "Type2Hub.+220", "Type2Hub.+220.+4"]
size = 16
origin = "allocated"
fields = [
  { name = "loaded", offset = 0, type = "u32", note = "1 once ImageLoaded ran" },
  { name = "index", offset = 4, type = "u32", note = "the image (0 to 45)" },
  { name = "texture", offset = 8, type = "ptr", to = "Type2HubTexture" },
  { name = "xpr", offset = 12, type = "u32", note = "XPR::Create's 24-byte block" },
]

# The type 2 mode (type2-mode.md) as these machines' handlers see it (r4):
# only its message ring, which they post to.
[Type2ScreensMode]
measures = ["Type2Hub::OpenSelected.r4", "Type2Hub::Close.r4", "Type2Hub::OnDialogDone.r4", "PlateEditor::Close.r4", "BuildScreen::Close.r4", "PowerGraphScreen::Close.r4", "Screen::LeaveToHub.r4"]
size = 812
origin = "embedded"
fields = [
  { name = "messages", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (id, two words)" },
  { name = "message_count", offset = 804, type = "u32" },
  { name = "message_start", offset = 808, type = "u32", note = "the ring's first slot" },
]

# The license plate editor's machine: a StateMachine with its words after
# it. The measure also files under "PlateEditor" its data (PlateEditorData,
# +0 to +72), the plate RandomPlate writes (r4: bytes +1 to +11), the menu
# list's +20 and the page handlers' mode (+804, +808): they fit
# `transitions` but aren't the machine's (a measure fault).
[PlateEditor]
measure = "PlateEditor"
size = 9616
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's)" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "UpdatePage sets the data's next_state here" },
  { name = "loaded", offset = 9608, type = "u32", note = "1 once movie 26 is loaded (WaitForLoad)" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: Create and WaitForLoad go to state 9" },
]

# A license plate (20 bytes): the plate editor's two in its data, a garage
# car's +1568 (the dealer copies the editor's into the bought car's +1780).
# The measure meets it only through the editor's data, so this type has no
# measure name of its own.
[Type2Plate]
size = 20
origin = "embedded"
fields = [
  { name = "unknown_0", offset = 0, type = "u8" },
  { name = "region", offset = 1, type = "u8", note = "0 to 13 (strings 5411 +)" },
  { name = "digits", offset = 2, type = "bytes", count = 3, note = "0 to 9, 10 blank" },
  { name = "chars", offset = 5, type = "bytes", count = 7, note = "0 to 37 (strings 5425 +; 10 probably a separator)" },
]

# The license plate editor's data ([0x826D8438], 76 bytes, VirtualAlloc'ed
# by PlateEditor::Create; docs/known-data.md). Joined with the machine by
# the measure ("PlateEditor"), so no measure name of its own.
[PlateEditorData]
size = 76
origin = "allocated"
fields = [
  { name = "unknown_0", offset = 0, type = "u32", note = "0 from Create" },
  { name = "plate", offset = 4, type = "bytes", count = 20, note = "the plate being edited (a Type2Plate)" },
