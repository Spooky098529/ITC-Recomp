  { name = "day", offset = 32, type = "u32", note = "save data +6100, at most 999" },
  { name = "groups", offset = 36, type = "bytes", count = 182112, note = "56 BuildGroup of 3,252 bytes" },
  { name = "builds", offset = 182148, type = "bytes", count = 20800, note = "400 BuildRecord of 52 bytes (+0x2C784)" },
  { name = "shown_groups", offset = 202948, type = "bytes", count = 224, note = "pointers to the category's groups shown (+0x318C4)" },
  { name = "shown_group_count", offset = 203172, type = "u32", note = "+0x319A4" },
  { name = "build_list", offset = 203176, type = "bytes", count = 3212, note = "the chosen group's builds (a BuildSlotList, +0x319A8)" },
  { name = "category", offset = 206388, type = "u32", note = "+0x32634" },
  { name = "group_selection", offset = 206392, type = "u32", note = "the groups' list's selection kept" },
  { name = "group_scroll", offset = 206396, type = "u32" },
  { name = "build_selection", offset = 206400, type = "u32", note = "the builds' list's selection kept" },
  { name = "build_scroll", offset = 206404, type = "u32" },
  { name = "stand_selection", offset = 206408, type = "u32", note = "the stand's list's (for the details)" },
  { name = "stand_scroll", offset = 206412, type = "u32" },
  { name = "unknown_206416", offset = 206416, type = "u32" },
  { name = "number", offset = 206420, type = "u32", note = "the state-2 builds as a percentage (probably), shown in digits (+0x32654)" },
  { name = "opened", offset = 206424, type = "u32", note = "Fill: whether a kind-3 group has builds; 0: animation 81 played on opening (+0x32658)" },
  { name = "car_shown", offset = 206428, type = "u32", note = "a car shown on the stand (1 on level 2; +0x3265C)" },
  { name = "stand_model", offset = 206432, type = "u32", note = "GarageStage::ReloadModel's answer, then the stand drawn (+0x32660)" },
  { name = "build_shown", offset = 206436, type = "u32", note = "+0x32664" },
  { name = "busy_shown", offset = 206440, type = "u32", note = "the stand's busy marker shown (+0x32668)" },
