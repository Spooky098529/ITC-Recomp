  { name = "chars", offset = 9, type = "bytes", count = 7, note = "plate +5 to +11" },
  { name = "confirm_selection", offset = 20, type = "u32", note = "the confirmation's selection (plate +16)" },
  { name = "start_plate", offset = 24, type = "bytes", count = 20, note = "the plate it starts from (a Type2Plate)" },
  { name = "car_class", offset = 44, type = "u32", note = "CarDealer::CheckLimits' class (RandomPlate's r3, not read)" },
  { name = "make_random", offset = 48, type = "u32", note = "LoadPlate makes the start plate at random when set" },
  { name = "column", offset = 52, type = "u32", note = "the cursor's column" },
  { name = "edited", offset = 56, type = "u32", note = "the digit or character edited" },
  { name = "char_line_kind", offset = 60, type = "u32", note = "CharLineKind's answer (ShowCharLine)" },
  { name = "region_rows", offset = 64, type = "u32", note = "the region menu's rows (5)" },
  { name = "char_rows", offset = 68, type = "u32", note = "the character menu's rows (4)" },
  { name = "next_state", offset = 72, type = "u32", note = "the state UpdatePage puts the machine in; 21 none" },
]

# The build screen's machine: a StateMachine with its words after it. The
