# A wave bank (XWB) in memory: its header, as WaveBankView::Init reads it.
[CarSoundWaveBank]
measure = "new<?>@RaceSounds::Begin"
size = 44
origin = "allocated"
# A blob (E5 step 5, 2026-11-24): the race's effects bank (asset 22889), read
# whole by Archive::Load into the buffer RaceSounds::Begin (hand port) made
# with XPhysicalAlloc, now schema::CarSoundWaveBank::New with the file's size;
# its waves' XMA data read by our FFmpeg through guest::Pointer
# (hooks/xma.cpp); freed by RaceSounds::Unload's XPhysicalFree.
# E5 step 7 (2026-11-24): the other wave banks too, never read by the
# renderer: RaceSounds::Init's slot buffers (hand port, New), bank pair 2's
# 3 MiB block (SoundGlobals::Init, models::AllocPhysicalExBlob) and the other
# bank pairs' (BankPair::Load's lifted XPhysicalAlloc, returning at
# 0x821179F0, the size rounded up to 2 KB in r3; freed by BankPair's
# release, XPhysicalFree at 0x82117BF0).
storage = "blob"
blob_alloc = [{ call = 0x821179F0, reg = "r3" }]
fields = [
  { name = "data_offset", offset = 8, type = "u32", note = "the bank data's offset" },
  { name = "entries_offset", offset = 16, type = "u32", note = "the entries' offset" },
