# A wave's 24-byte entry (the view's +16, by the wave).
[CarSoundWaveEntry]
measure = "WaveBankView.+16"
size = 24
origin = "allocated"
fields = [
  { name = "unknown_0", offset = 0, type = "u32" },
  { name = "format", offset = 4, type = "u32", note = "bits 0-1 the codec (0 PCM), 2-4 the channels, 5-22 the rate, 31 16-bit samples" },
