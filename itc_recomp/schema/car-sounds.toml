origin = "allocated"
fields = [
  { name = "flags", offset = 0, type = "u32", note = "0x20000 compact (one format for every wave, +84)" },
  { name = "count", offset = 4, type = "u32", note = "the waves" },
  { name = "compact_format", offset = 84, type = "u32" },
