# The schema of docs/functions/car-sounds.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The car sounds: seven 1,264-byte car sounds at [0x826C5C3C] (operator
# new[], the count 7 16 bytes before the first), each an X3DAudio listener,
# emitter, cone and DSP settings, its output maps and eleven sound parts over
# a voice holder; the wave bank views they play from; X3DAudio's structures
# (the 360's older layout). Hand port in src/car_sounds/ and
# src/hooks/car_sounds.cpp. Embedded objects are `bytes` fields of the type
# that holds them, named by their own type in the note.

# One racer's sounds (1,264 bytes). CarSounds::Destroy's r3 is the array's
# first element (the measure's "CarSounds"), whose count is 16 bytes before.
[CarSound]
measure = "CarSound"
measures = ["CarSounds", "CarSound::UpdateVoices.r3", "CarSound::Pause.r3", "CarSound::Clear.r3", "CarSound::Resume.r3"]
size = 1264
origin = "allocated"
storage = "host"
fields = [
  { name = "array_count", offset = -16, type = "bytes", count = 4, note = "the first element only: CarSoundArray's count (7), read as the array's count (no member: outside the sound; CarSoundArray(base, array_count_address()).count())" },
  { name = "tunnel_reverb", offset = 0, type = "u32", note = "the submix's reverb state: 1 the block 0x826166F8 set (the vehicle's +5314 bit 1, probably a tunnel), 0 the block 0x82616638" },
  { name = "listener", offset = 4, type = "bytes", count = 48, note = "an X3DAudioListener; its cone pointer is the emitter's +0 (+52). Not an embed (the emitter's cone would be a second layout entry at +52): its floats below, which X3DAudioListener's dual view reads" },
  { name = "x3d_listener_front_x", offset = 4, type = "f32" },
  { name = "x3d_listener_front_y", offset = 8, type = "f32" },
  { name = "x3d_listener_front_z", offset = 12, type = "f32" },
  { name = "x3d_listener_top_x", offset = 16, type = "f32" },
  { name = "x3d_listener_top_y", offset = 20, type = "f32" },
  { name = "x3d_listener_top_z", offset = 24, type = "f32" },
  { name = "x3d_listener_position_x", offset = 28, type = "f32" },
  { name = "x3d_listener_position_y", offset = 32, type = "f32" },
  { name = "x3d_listener_position_z", offset = 36, type = "f32" },
  { name = "x3d_listener_velocity_x", offset = 40, type = "f32" },
  { name = "x3d_listener_velocity_y", offset = 44, type = "f32" },
  { name = "x3d_listener_velocity_z", offset = 48, type = "f32" },
  { name = "emitter", offset = 52, type = "bytes", count = 92, note = "an X3DAudioEmitter (its cone pointer +52 points at +144)" },
  { name = "emitter_object", offset = 52, type = "embed", to = "X3DAudioEmitter" },
  { name = "cone", offset = 144, type = "bytes", count = 32, note = "an X3DAudioCone" },
  { name = "cone_object", offset = 144, type = "embed", to = "X3DAudioCone" },
  { name = "dsp", offset = 176, type = "bytes", count = 48, note = "an X3DAudioDspSettings: +176 the matrix (24 bytes from operator new[]), +184 1 source, +188 6 destination channels, +200 the reverb level, +204 the Doppler factor" },
  { name = "dsp_object", offset = 176, type = "embed", to = "X3DAudioDspSettings" },
  { name = "reverb_map", offset = 224, type = "bytes", count = 48, note = "six {channel byte, gain float} pairs: the reverb level times the volume" },
  { name = "output_map", offset = 272, type = "bytes", count = 48, note = "six {channel byte, gain float} pairs: the matrix times the volume" },
  { name = "reverb_map_count", offset = 320, type = "u8", note = "6" },
  { name = "reverb_map_pointer", offset = 324, type = "u32", note = "+224" },
  { name = "output_map_count", offset = 328, type = "u8", note = "6" },
  { name = "output_map_pointer", offset = 332, type = "u32", note = "+272" },
  { name = "sends_0_kind", offset = 336, type = "u8", note = "0" },
  { name = "sends_0", offset = 340, type = "u32", note = "+328" },
  { name = "sends_1_kind", offset = 344, type = "u8", note = "1" },
  { name = "sends_1", offset = 348, type = "u32", note = "+320" },
  { name = "output", offset = 352, type = "u64", note = "the DSP output: the 8 bytes the parts' updates are given as r5 (+352 2, +356 +336)" },
  { name = "output_count", offset = 352, type = "u8", note = "2" },
  { name = "output_sends", offset = 356, type = "u32", note = "+336" },
  { name = "emitter_position_x", offset = 368, type = "f32", note = "the emitter's position as a vector (x, y, z, w; stvx and lvx), last tick's for the velocity" },
  { name = "emitter_position_y", offset = 372, type = "f32" },
  { name = "emitter_position_z", offset = 376, type = "f32" },
  { name = "emitter_position_w", offset = 380, type = "f32" },
  { name = "listener_position_x", offset = 384, type = "f32", note = "the listener's position as a vector (x, y, z, w), last tick's for the velocity" },
  { name = "listener_position_y", offset = 388, type = "f32" },
  { name = "listener_position_z", offset = 392, type = "f32" },
  { name = "listener_position_w", offset = 396, type = "f32" },
  { name = "vehicle", offset = 400, type = "ptr", to = "Vehicle", note = "0 when the car sound has no racer" },
  { name = "index", offset = 404, type = "u8", note = "the car's index, 0 to 6" },
  { name = "engine", offset = 408, type = "bytes", count = 176, note = "a CarSoundEngine" },
  { name = "engine_object", offset = 408, type = "embed", to = "CarSoundEngine" },
  { name = "hits", offset = 584, type = "bytes", count = 68, note = "a CarSoundHits" },
  { name = "hits_object", offset = 584, type = "embed", to = "CarSoundHits" },
  { name = "tires", offset = 652, type = "bytes", count = 84, note = "a CarSoundTires (its voice holder at +676)" },
  { name = "tires_object", offset = 652, type = "embed", to = "CarSoundTires" },
  { name = "gear", offset = 736, type = "bytes", count = 56, note = "a CarSoundGear (sub_8210EBF0, probably the gear change)" },
  { name = "gear_object", offset = 736, type = "embed", to = "CarSoundGear" },
  { name = "roll", offset = 792, type = "bytes", count = 48, note = "a CarSoundRoll" },
  { name = "roll_object", offset = 792, type = "embed", to = "CarSoundRoll" },
  { name = "events", offset = 840, type = "bytes", count = 48, note = "a CarSoundEvents (sub_8210ECF0)" },
  { name = "events_object", offset = 840, type = "embed", to = "CarSoundEvents" },
  { name = "fade", offset = 888, type = "bytes", count = 64, note = "a CarSoundFade (sub_8210EEE0)" },
  { name = "fade_object", offset = 888, type = "embed", to = "CarSoundFade" },
  { name = "turbo", offset = 952, type = "bytes", count = 64, note = "a CarSoundTurbo (probably)" },
  { name = "turbo_object", offset = 952, type = "embed", to = "CarSoundTurbo" },
  { name = "wind", offset = 1016, type = "bytes", count = 56, note = "a CarSoundWind" },
  { name = "wind_object", offset = 1016, type = "embed", to = "CarSoundWind" },
  { name = "horn", offset = 1072, type = "bytes", count = 64, note = "a CarSoundHorn (probably)" },
  { name = "horn_object", offset = 1072, type = "embed", to = "CarSoundHorn" },
  { name = "pass_by", offset = 1136, type = "bytes", count = 56, note = "a CarSoundPassBy" },
  { name = "pass_by_object", offset = 1136, type = "embed", to = "CarSoundPassBy" },
  { name = "volume_curve_points", offset = 1192, type = "bytes", count = 48, note = "the emitter's volume curve: six {distance, value} float pairs" },
  { name = "volume_curve", offset = 1240, type = "bytes", count = 8, note = "an X3DAudioCurve over +1192 (six points), the emitter's +64" },
  { name = "volume_curve_object", offset = 1240, type = "embed", to = "X3DAudioCurve" },
  { name = "live", offset = 1248, type = "u32", note = "1 once CarSounds::SetBanks gave it its banks; 0 stopped" },
  { name = "engine_gain", offset = 1252, type = "f32", note = "1.0; EngineSound::Update's f2" },
  { name = "last_doppler", offset = 1256, type = "f32", note = "the last tick's Doppler factor (+204)" },
  { name = "passed_close", offset = 1260, type = "u32", note = "1 the tick a car passed close (PassBySound::Update's r6)" },
]

# The array's block (operator new[] of 8,864 bytes in CarSounds::Init).
[CarSoundArray]
measure = "new<8864>@CarSounds::Init"
size = 8864
origin = "allocated"
storage = "host"
fields = [
  { name = "count", offset = 0, type = "u32", note = "7 (operator new[]'s count; CarSounds::Destroy reads it at the first sound's -16)" },
  { name = "sounds", offset = 16, type = "bytes", count = 8848, note = "seven CarSounds (the embedded sound)" },
  { name = "sound", offset = 16, type = "embed", to = "CarSound", count = 7 },
]

# The voice holder: the 40-byte base of every sound part (vtable 0x82010B5C;
# the engine layers' at their +44).
[CarSoundVoiceHolder]
size = 40
origin = "embedded"
storage = "host"
vtable = 0x82010B5C
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82010B5C" },
  { name = "voices", offset = 4, type = "bytes", count = 16, note = "four XAudio source voices by slot (0 a free slot)" },
  { name = "voice_count", offset = 20, type = "u32" },
  { name = "paused", offset = 24, type = "bytes", count = 16, note = "four words: which voices were playing when paused" },
]

# What every sound part but the engine and the tires starts with: its voice
# holder, its bank view and the car's index (PlayOnce's callers read the
# view at the part's +40).
[CarSoundPart]
size = 48
origin = "embedded"
storage = "host"
fields = [
  { name = "holder", offset = 0, type = "bytes", count = 40, note = "a CarSoundVoiceHolder" },
  { name = "voice_holder", offset = 0, type = "embed", to = "CarSoundVoiceHolder" },
  { name = "view", offset = 40, type = "ptr", to = "CarSoundWaveBankView", note = "the effects' bank" },
  { name = "index", offset = 44, type = "u8", note = "the car's index" },
]

# The engine (car sound +408): two layers, +0 the main one and +84 the
# pitched one (EngineLayer::UpdatePitched).
[CarSoundEngine]
measure = "new<8864>@CarSounds::Init@+16@+408"
measures = ["CarSound@+408"]
size = 176
origin = "embedded"
storage = "host"
vtable = 0x82008018
fields = [
  { name = "layer", offset = 0, type = "bytes", count = 84, note = "a CarSoundEngineLayer (from the second wave bank view)" },
  { name = "pitched_layer", offset = 84, type = "bytes", count = 84, note = "a CarSoundEngineLayer (from the first wave bank view)" },
  { name = "layer_object", offset = 0, type = "embed", to = "CarSoundEngineLayer" },
  { name = "pitched_layer_object", offset = 84, type = "embed", to = "CarSoundEngineLayer" },
  { name = "load", offset = 168, type = "f32", note = "the load, eased toward the throttle's target (probably)" },
  { name = "idle_speed", offset = 172, type = "f32", note = "the speed without a vehicle: up by 10 a tick, back to 800 past 7,000" },
]

# An engine layer (84 bytes, vtable 0x82008018), its voice holder at +44.
[CarSoundEngineLayer]
measure = "EngineLayer"
measures = ["EngineLayer::Update.r3", "EngineLayer::Start.r3"]
size = 84
origin = "embedded"
storage = "host"
vtable = 0x82008018
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82008018" },
  { name = "table", offset = 4, type = "ptr", to = "CarSoundEngineTable", note = "the car's sound parameters (CarSounds::SetBanks; 0 none)" },
  { name = "table_copy", offset = 8, type = "u32", note = "the same pointer" },
  { name = "table_volume", offset = 12, type = "u32", note = "the table's first word" },
  { name = "table_volume_copy", offset = 16, type = "u32", note = "the same word" },
  { name = "amounts", offset = 20, type = "bytes", count = 24, note = "a float per table entry: the volume's amount from its first curve" },
  { name = "holder", offset = 44, type = "bytes", count = 40, note = "a CarSoundVoiceHolder: one voice per table entry" },
  { name = "voice_holder", offset = 44, type = "embed", to = "CarSoundVoiceHolder" },
]

# An engine layer's table: the car's sound parameters ([[0x82616318 + 16 i]
# + 4 j], the main layer's at +820).
[CarSoundEngineTable]
measure = "EngineLayer::Update.r3.+4"
size = 548
origin = "image"
fields = [
  { name = "volume_scale", offset = 0, type = "u32", note = "an integer: the volume's scale (times 1/128)" },
  { name = "entries", offset = 4, type = "bytes", count = 544, note = "CarSoundEngineEntry records of 136 bytes, while the entry's id is above -1" },
]

# An engine table's entry (136 bytes): one voice.
[CarSoundEngineEntry]
size = 136
origin = "image"
fields = [
  { name = "id", offset = 0, type = "u32", note = "-1 (or below) ends the table" },
  { name = "pitch_scale", offset = 4, type = "u32", note = "an integer, SetPitchScaled's r9" },
  { name = "volume_curve", offset = 8, type = "bytes", count = 64, note = "eight (x, y) float pairs, ended by an x at most -1.0" },
  { name = "pitch_curve", offset = 72, type = "bytes", count = 64, note = "eight (x, y) float pairs" },
]

# The two wave bank views EngineSound::Start is given.
[CarSoundEngineViews]
measure = "EngineSound::Start.r5"
size = 8
origin = "embedded"
fields = [
  { name = "pitched_layer_view", offset = 0, type = "ptr", to = "CarSoundWaveBankView" },
  { name = "layer_view", offset = 4, type = "ptr", to = "CarSoundWaveBankView" },
]

