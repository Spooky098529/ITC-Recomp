# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The tuning screen: the front end's tuning shop (the type 2 mode block's
# +19792), its part tables, its command queue, the vinyl and sticker
# editors' state (docs/known-data.md, "tuning screen"; src/tuning_screen/).
#
# For the lead: tuning-machine.toml's TuningMachine is the same object (the
# screen's own machine at +9604 to +9616; the measure split it by the
# functions' names), as is the queue there (new<28>@TuningMachine::Create)
# and TuningCommandQueue here. Fields past +36828 are measure faults.

