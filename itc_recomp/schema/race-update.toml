# The schema of docs/functions/race-update.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The race's update (src/race_update/): the race scene at [0x826D82D4]
# (RaceScene, made by RaceScene::Create, race-scene.md), its seven car
# slots and its light set. The race scene's machine and the glows'
# parameters are race-scene.toml's.
#
# Left out of the seed (other areas' types, to join there):
# - Car.+16 is a pool 7 scene model (the slot's +0; its +4296 and +4300 are
#   the block's +8 and +12, car-draw.toml's CarDrawBlock): the measure names
#   Car::TickUpdate's r3, the car slots (the scene's +16), "Car".
# - RaceScene.+31152, +31156 and +31160 are ScreenObjects (screen-objects.md;
#   +24 running).
# - Vehicle::Get.ret.+272 is car-physics.toml's CarData (+164, the wheel
#   set-ups at +880 + 96k).
# - Viewport.+4 is camera-modes.toml's Viewport (the viewports' second,
#   [[0x826C2CE8] + 4]).
# Measure faults (reported): RaceScene also holds the racer record's
# (race-setup.toml's Car) halfword +0, word +12 and bytes +1569 to +1580,
# which Car::TickUpdate and RaceScene::VaryCar read on the car; they fit no
# field (+1569 to +1580 fall in `car_slots`).

# The race scene (31,168 bytes, [0x826D82D4]; known-data.md's "0x826D82D4").
[RaceScene]
measure = "RaceScene"
size = 31168
origin = "allocated"
fields = [
  { name = "scenery", offset = 0, type = "ptr", to = "Scenery", note = "the course scenery's manager ([0x826C551C], set by RaceScene::LoadScenery)" },
  { name = "car_slot_count", offset = 16, type = "u32", note = "the car slots' count (7); Car::TickUpdate's r3 is this word's address" },
  { name = "car_slots", offset = 32, type = "bytes", count = 30016, note = "seven RaceCarSlots of 4,288 bytes, by vehicle index" },
  { name = "lights", offset = 30064, type = "bytes", count = 1076, note = "the light set (RaceLights)" },
  { name = "screen_object", offset = 31152, type = "ptr", to = "ScreenObject", note = "the race's screen object (1024 x 576; 0 when not made)" },
  { name = "screen_object_first", offset = 31156, type = "ptr", to = "ScreenObject", note = "split screen: player 1's screen object" },
  { name = "screen_object_second", offset = 31160, type = "ptr", to = "ScreenObject", note = "split screen: player 2's screen object" },
  { name = "fault_car_pick", offset = 0, type = "u16", note = "measure fault: Car::TickUpdate's halfword +0 of the car (the racer record, race-setup's Car: the paint pick), joined with the scene" },
  { name = "fault_car_12", offset = 12, type = "u32", note = "measure fault: RaceScene::VaryCar's r3 is a car (the racer record, race-setup's Car), its word +12 (64 picks the +1580 byte), joined with the scene" },
]

# One car slot (4,288 bytes, the scene's +32 + 4,288 v; RaceScene::RemakeCarModel's r5).
[RaceCarSlot]
measure = "RaceScene::RemakeCarModel.r5"
size = 4288
origin = "embedded"
fields = [
  { name = "model", offset = 0, type = "ptr", to = "SceneModel", note = "its pool 7 scene model (ScenePools::SetUpB's; 0 none)" },
  { name = "record", offset = 16, type = "bytes", count = 4244, note = "its scene model record (car-makers.toml's SceneModelRecord, from SceneModelRecord::FromCar)" },
  { name = "record_kind", offset = 16, type = "u32", note = "the record's +0: 3 traffic" },
  { name = "record_block", offset = 32, type = "u32", note = "the record's +16 (the model block): 0 or 7 on traffic sets the block's +592" },
  { name = "pool_index", offset = 4272, type = "s32", note = "its pool 7 index (ScenePools::ClaimB; -1 none)" },
]

# The light set (1,076 bytes, the race scene's +30064; RaceLights::SetUp).
[RaceLights]
measure = "RaceLights"
size = 1076
origin = "embedded"
fields = [
  { name = "count", offset = 0, type = "u32", note = "the entries of kind 1 or 2 (11)" },
  { name = "kind1_count", offset = 4, type = "u32", note = "3" },
  { name = "kind2_count", offset = 8, type = "u32", note = "8" },
  { name = "entries", offset = 16, type = "bytes", count = 1056, note = "eleven RaceLightEntries of 96 bytes" },
  { name = "unknown_1072", offset = 1072, type = "u32", note = "0 at SetUp" },
]

# One light entry (96 bytes, eleven at the light set's +16; the measure sees them as the set's).
[RaceLightEntry]
size = 96
origin = "embedded"
fields = [
  { name = "kind", offset = 0, type = "u32", note = "1 directional (entries 0 to 2), 2 (3 to 10; probably spot lights)" },
  { name = "direction", offset = 16, type = "bytes", count = 16, note = "the direction (earlier taken for the color): normalized into the scene lights' 0x8296B950 by RaceLights::Update" },
  { name = "second", offset = 32, type = "bytes", count = 16, note = "copied to 0x8296B980" },
  { name = "third", offset = 48, type = "bytes", count = 16, note = "copied to 0x8296B9B0" },
  { name = "fourth", offset = 64, type = "bytes", count = 16, note = "kind 2" },
  { name = "cone", offset = 80, type = "bytes", count = 16, note = "kind 2: the cosines of two angles (probably the cone's outer and inner)" },
]

[globals]
race_data = { address = 0x826C5B2C, type = "ptr", to = "RaceData", note = "the race data: +4 the course, +32 the mode, +48 the racer records (3,936 bytes), +0x59614 the human cars, +0x59620 the stages, +0x59AE8 the racer records' list, +0xA3AF0 the split mode (4 split screen)" }
scenery_configs = { address = 0x82602EA0, type = "bytes", count = 32, note = "the race's scenery configurations' two words, 8 bytes an entry (0 to 2 by mode, 3 courses 8 to 10)" }
light_directions = { address = 0x8296B950, type = "bytes", count = 48, note = "the scene lights' directions, 16 bytes a kind 1 entry" }
light_second = { address = 0x8296B980, type = "bytes", count = 48, note = "the kind 1 entries' +32" }
light_third = { address = 0x8296B9B0, type = "bytes", count = 48, note = "the kind 1 entries' +48" }
light_origin = { address = 0x8265ED00, type = "bytes", count = 16, note = "(0, 0, 0, 1) from RaceLights::Update" }
camera_pass0 = { address = 0x826BAC00, type = "bytes", count = 592, note = "camera pass 0 (cameras.toml's CameraPass): +400 and +416 the two points Car::TickUpdate takes a direction of" }
car_scene = { address = 0x826C2E44, type = "ptr", to = "CarScene", note = "the car scene (car-draw.toml's CarScene)" }
racers = { address = 0x826D82F4, type = "ptr", to = "RaceManager", note = "the racers' manager: +2308 the racers" }
viewports = { address = 0x826C2CE8, type = "ptr", to = "Viewports", note = "the viewports (camera-modes.toml's Viewports): +8 nonzero in split screen" }
input_records = { address = 0x826C5B30, type = "bytes", count = 28, note = "the vehicles' input records' pointers by vehicle index (+0 the flags: 0x8 brake, 0x100 high beams)" }
followed = { address = 0x826C7824, type = "u32", note = "0 for player 2 followed (two human cars)" }
wheel_load_scale = { address = 0x820021E8, type = "f32", note = "2.0 (probably): the wheels' load scale" }
slip_high = { address = 0x8200979C, type = "f32", note = "a wheel's slip above it: level 2 (not read from the image)" }
slip_low = { address = 0x820097A0, type = "f32", note = "a wheel's slip above it: level 1 (not read from the image)" }
speed_scale = { address = 0x820086EC, type = "f32", note = "1/300: the screen object's speed from the km/h" }
one = { address = 0x82000A30, type = "f32", note = "1.0 (copied as a word by RaceLights::Update and UploadDirectional)" }
zero = { address = 0x82000A34, type = "f32", note = "0.0" }
