# The schema of docs/functions/type67-screens.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 6 and 7 modes' list, panel and node screens (src/type67_screens/),
# their vtables, the list part, the node tables, the group pair and the
# screen blocks. Embedded objects are `bytes` with the words the code
# reaches through the outer offsets named beside them (an embedded MenuList
# is race-screens.toml's). Left to other areas (this area's report):
# the dispatchers the Back, PickCar, OpenPowerGraph and AskQuit slots post
# to ("Type6ListScreen::Back.r4" and 11 more) are boot-mode.toml's
# ModeDispatcher; "CourseRecords::Of.ret" is car-settings.toml's
# CourseRecord; "PanelScreen.+9644" is car-list.toml's PanelSet.

# The list screens' base (ListScreen, vtable 0x82011218; docs/known-data.md's
# "type 6 and 7 list, panel and node screens"): a screen machine at +4, a
# page block at +9644, its UI movie's nodes and named animations' ids.
# The derived lists below repeat these fields (no inheritance in the schema).
# "ListScreen.+9892" is the toggle's two animations reached by index.
[ListScreen]
measures = ["ListScreen", "ListScreen.+9892"]
size = 10144
origin = "embedded"
vtable = 0x82011218
