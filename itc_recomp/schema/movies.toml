# The schema of docs/functions/movies.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The movie class (`Movie`, vtable 0x82002910) the app keeps at 0x826C1CDC,
# its wrapper into the movie library linked into the game (`MovieWrapper`,
# vtable 0x8206CC90) and the library's player; then the library's own
# objects (`MovieLib*`), met only by the library's ~615 functions, which no
# longer run with --play_movies_with_ffmpeg (docs/native-movies.md): not
# read, their fields unknown.
#
# Met here but other areas' types (not described here; their measures to
# add there): Movie::Movie.r4 (app-start-up's AppSetUpBlock),
# Movie::Movie.r4.+0 and Movie::OnMessage.r4 (AppRunLoop), Movie::OnMessage.r4.+0
# (AppRunLoopVtable, slots +20 and +24), Movie::OnMessage.r5
# (AppRunLoopEvent), Movie.+4 (AppFrameworkInterface), Movie.+4.+0
# (AppFrameworkInterfaceVtable), Movies and Movies.+0 (app-states' App and
# its vtable: Movies::Set's r3 is the app, its slot 11 at +44).

# The movie class (312 bytes, operator new in App::App; Movie::Movie). Its
# +12 to +47 is a command (the open's, run on a worker by Movie::Play: +12
# its vtables, +24 its status, +36 its 12-byte delegate {vtable, object,
# function}), its +48 the path, its +308 the state.
[Movie]
measures = ["Movie", "sub_820AE808.r3", "sub_820AE818.r3", "sub_820AE9F8.r3"]
size = 312
origin = "allocated"
vtable = 0x82002910
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "MovieVtable", note = "0x82002910" },
  { name = "framework_interface", offset = 4, type = "ptr", to = "AppFrameworkInterface", note = "the set-up block's +4 (the app's +8): slot +8 by Movie::Play, +12 by OnTick, +16 by Open and Release" },
  { name = "wrapper", offset = 8, type = "ptr", to = "MovieWrapper", note = "the 8-byte MovieWrapper, or 0" },
  { name = "command_vtable", offset = 12, type = "u32", note = "the open's command: 0x820066DC (0x82000EB8 put back by the destructor)" },
  { name = "command_vtable_4", offset = 16, type = "u32", note = "0x82000AB4 then 0x82002908 (0x82000BA8, then 0x82000AB4 put back)" },
  { name = "unknown_20", offset = 20, type = "u32", note = "the command's +8: 0" },
  { name = "command_status", offset = 24, type = "u32", note = "the command's +12: 0, 3 once done (the slots test it)" },
  { name = "unknown_28", offset = 28, type = "u8", note = "the command's +16: 0" },
  { name = "unknown_29", offset = 29, type = "u8", note = "the command's +17: 1" },
  { name = "unknown_30", offset = 30, type = "u8", note = "the command's +18: 0" },
  { name = "unknown_32", offset = 32, type = "u32", note = "the command's +20: Movie::Play stores a word of its frame (+100)" },
  { name = "delegate_vtable", offset = 36, type = "u32", note = "the command's delegate: 0x82002850 (0x82000ABC put back)" },
  { name = "delegate_object", offset = 40, type = "ptr", to = "Movie", note = "0, then the movie (Movie::Play)" },
  { name = "delegate_function", offset = 44, type = "fn", note = "0, then 0x820AE7F8 (calls the movie's slot 8, Movie::Open)" },
  { name = "path", offset = 48, type = "bytes", count = 260, note = "the movie's path (strncpy'd by Movie::Play)" },
  { name = "state", offset = 308, type = "u32", note = "0 none, 1 loaded or ended, 2 playing, 3 paused" },
  { name = "fault_strncpy_0", offset = 0, type = "u8", note = "measure fault: strncpy's r3 is the movie + 48 (path), joined with the movie at +0" },
  { name = "fault_strncpy_1", offset = 1, type = "u8", note = "measure fault: strncpy's second byte store (path's +1)" },
]

