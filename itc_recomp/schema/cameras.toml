# The schema of docs/functions/cameras.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The graphics library's camera class (Camera, vtable 0x82001EC0), the game's
# 21 camera passes built on it (592 bytes each from 0x826BAC00), and the
# app's second camera class over it (AppCamera, the app's +120, and its
# 832-byte camera). The viewports at [0x826C2CE8] are camera-modes.toml's
# (Viewport). Vectors are described lane by lane, with their two doublewords
# beside the lanes (the originals copy them with ld/std); matrices as bytes.
# Hand ports: src/cameras/, src/hooks/cameras.cpp, src/app_start_up/app_camera.cpp.

# A camera pass: a Camera (+0 to +399) and the pass's own fields. The 21 are
# at 0x826BAC00 (CamerasGlobals::passes), made once at boot by CameraPasses::Init;
# the measure's Camera is the passes met through the camera class's methods.
[CameraPass]
measures = ["CameraPass", "Camera"]
size = 592
origin = "embedded"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "CameraVtable", note = "0x82001EC0 (Camera); 0x820027B0 for AppCameraCamera" },
  { name = "view", offset = 16, type = "bytes", count = 64, note = "the view matrix (4x4 floats, row-major, row vectors)" },
  { name = "projection", offset = 80, type = "bytes", count = 64, note = "the projection (Camera::BuildProjection)" },
  { name = "view_projection", offset = 144, type = "bytes", count = 64, note = "view x projection (Matrix::Multiply)" },
  { name = "view_built", offset = 208, type = "bytes", count = 64, note = "Camera::Update's view as built, then copied to +16" },
  { name = "position_xy", offset = 272, type = "u64", note = "the position Camera::Update builds the view from (w 1.0); x and y as one doubleword (the originals' ld/std copies)" },
  { name = "position_x", offset = 272, type = "f32", note = "the position Camera::Update builds the view from (w 1.0)" },
  { name = "position_y", offset = 276, type = "f32" },
  { name = "position_zw", offset = 280, type = "u64", note = "z and w as one doubleword" },
  { name = "position_z", offset = 280, type = "f32" },
  { name = "position_w", offset = 284, type = "f32" },
  { name = "angles_xy", offset = 288, type = "u64", note = "the Euler angles: x turns by RotateX, y by RotateY, z by RotateZ (negated); x and y as one doubleword (the originals' ld/std copies)" },
  { name = "angles_x", offset = 288, type = "f32", note = "the Euler angles: x turns by RotateX, y by RotateY, z by RotateZ (negated)" },
  { name = "angles_y", offset = 292, type = "f32" },
  { name = "angles_zw", offset = 296, type = "u64", note = "z and w as one doubleword" },
  { name = "angles_z", offset = 296, type = "f32" },
  { name = "angles_w", offset = 300, type = "f32" },
  { name = "unknown_304", offset = 304, type = "bytes", count = 64, note = "a 4x4 matrix, probably (Camera::Camera sets its rows' fourth words to 1.0)" },
  { name = "field_of_view", offset = 368, type = "f32", note = "radians, wrapped into [-pi, pi]" },
  { name = "view_scale", offset = 372, type = "f32", note = "Camera::Update: +380 x 0.5 / the half field of view's cosine polynomial x its sine polynomial" },
  { name = "width", offset = 376, type = "f32", note = "the viewport's width" },
  { name = "height", offset = 380, type = "f32", note = "the viewport's height" },
  { name = "near", offset = 384, type = "f32", note = "the near plane" },
  { name = "far", offset = 388, type = "f32", note = "the far plane" },
  { name = "aspect", offset = 392, type = "f32", note = "width / height" },
  { name = "eye_xy", offset = 400, type = "u64", note = "the eye (CameraPass::FromViewport: a viewport entry's +16); x and y as one doubleword (the originals' ld/std copies)" },
  { name = "eye_x", offset = 400, type = "f32", note = "the eye (CameraPass::FromViewport: a viewport entry's +16)" },
  { name = "eye_y", offset = 404, type = "f32" },
  { name = "eye_zw", offset = 408, type = "u64", note = "z and w as one doubleword" },
  { name = "eye_z", offset = 408, type = "f32" },
  { name = "eye_w", offset = 412, type = "f32" },
  { name = "target_xy", offset = 416, type = "u64", note = "the target; x and y as one doubleword (the originals' ld/std copies)" },
  { name = "target_x", offset = 416, type = "f32", note = "the target" },
  { name = "target_y", offset = 420, type = "f32" },
  { name = "target_zw", offset = 424, type = "u64", note = "z and w as one doubleword" },
  { name = "target_z", offset = 424, type = "f32" },
  { name = "target_w", offset = 428, type = "f32" },
  { name = "up_xy", offset = 432, type = "u64", note = "the up; x and y as one doubleword (the originals' ld/std copies)" },
  { name = "up_x", offset = 432, type = "f32", note = "the up" },
  { name = "up_y", offset = 436, type = "f32" },
  { name = "up_zw", offset = 440, type = "u64", note = "z and w as one doubleword" },
  { name = "up_z", offset = 440, type = "f32" },
  { name = "up_w", offset = 444, type = "f32" },
  { name = "roll", offset = 448, type = "f32", note = "Matrix::RotateZ's angle on the view" },
  { name = "forward_xy", offset = 464, type = "u64", note = "CameraPass::Update: target - eye, normalized (w 1.0); x and y as one doubleword (the originals' ld/std copies)" },
  { name = "forward_x", offset = 464, type = "f32", note = "CameraPass::Update: target - eye, normalized (w 1.0)" },
  { name = "forward_y", offset = 468, type = "f32" },
  { name = "forward_zw", offset = 472, type = "u64", note = "z and w as one doubleword" },
  { name = "forward_z", offset = 472, type = "f32" },
  { name = "forward_w", offset = 476, type = "f32" },
  { name = "up_again", offset = 480, type = "bytes", count = 16, note = "CameraPass::Update: the forward crossed with +432, normalized (stvx)" },
  { name = "viewport_x", offset = 496, type = "u32" },
  { name = "viewport_y", offset = 500, type = "u32" },
  { name = "viewport_width", offset = 504, type = "u32", note = "pixels (Camera::SetViewportSize's width)" },
  { name = "viewport_height", offset = 508, type = "u32", note = "pixels; CameraPass::SetZoom reads it signed" },
  { name = "unknown_512", offset = 512, type = "u32", note = "0 (CameraPass::Init)" },
  { name = "zoom", offset = 516, type = "f32", note = "CameraPass::SetZoom: the field of view is atan(height x 0.5 / zoom)" },
  { name = "unknown_520", offset = 520, type = "f32", note = "the float at 0x82000A30 (CameraPass::Init)" },
  { name = "unknown_524", offset = 524, type = "f32", note = "the float at 0x82000A30, 0x82001FD0 for type 0 (CameraPass::Init)" },
  { name = "unknown_528", offset = 528, type = "f32", note = "the float at 0x82000A34 (CameraPass::Init)" },
  { name = "unknown_532", offset = 532, type = "f32", note = "the float at 0x82001FD8 (CameraPass::Init)" },
  { name = "unknown_536", offset = 536, type = "f32", note = "the float at 0x82001FD4 (CameraPass::Init)" },
  { name = "unknown_540", offset = 540, type = "f32", note = "the float at 0x82001FD4 (CameraPass::Init)" },
