# The camera class's vtable (0x82001EC0; AppCameraCamera's 0x820027B0 has the same
# slots 0 to 2). [826BB540] is pass 4's vtable word.
[CameraVtable]
measures = ["CameraPass.+0", "AppCamera.+28.+0", "[826BB540]"]
size = 20
origin = "file"
fields = [
  { name = "set_viewport_size", offset = 0, type = "fn", note = "slot 0: Camera::SetViewportSize (sub_82593500)" },
  { name = "set_field_of_view", offset = 4, type = "fn", note = "slot 1: Camera::SetFieldOfView (sub_82593278)" },
  { name = "update", offset = 8, type = "fn", note = "slot 2: Camera::Update (sub_82593568)" },
  { name = "slot_3", offset = 12, type = "fn", note = "slot 3: sub_825C8390 in AppCameraCamera's vtable" },
  { name = "destructor", offset = 16, type = "fn", note = "slot 4: sub_8209FB80, never run" },
]

