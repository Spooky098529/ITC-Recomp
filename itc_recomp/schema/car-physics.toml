  { name = "updating", offset = 56, type = "u32", note = "1 during CollisionWorld::Update" },
  { name = "query_count", offset = 60, type = "u32", note = "n (32)" },
  { name = "hits", offset = 64, type = "ptr", to = "CollisionHit", note = "2n hit records (the raw hits)" },
  { name = "merged_hits", offset = 68, type = "ptr", to = "CollisionHit", note = "their second half (the merged hits)" },
]

# The collision objects' block: operator new[]'s count header, the objects from +16.
[CollisionObjectBlock]
measure = "new<4294967295>@CollisionWorld::Create"
size = 16
origin = "allocated"
fields = [
  { name = "count", offset = 0, type = "u32" },
]

# A collision object as the collision world walks it (the same object as
# CollisionObject, vtable 0x82002A94: to join with its owner's type). The
# measure joins the world's +68 with the objects' block (+16).
[CollisionWorldObject]
measure = "new<72>@CollisionWorld::Create.+20"
measures = ["new<72>@CollisionWorld::Create.+24"]
size = 320
origin = "allocated"
fields = [
  { name = "array_count", offset = -16, type = "u32", note = "the block's count header (the first object's -16)" },
  { name = "vtable", offset = 0, type = "ptr", to = "CollisionWorldObjectVtable" },
  { name = "body", offset = 16, type = "ptr", to = "RigidBody" },
  { name = "shape", offset = 20, type = "u32", note = "the vehicle's +344 box" },
  { name = "shape_record", offset = 32, type = "bytes", count = 80, note = "an embedded shape record" },
  { name = "lowest_travel", offset = 144, type = "f32", note = "minus the lowest wheel travel" },
  { name = "push", offset = 160, type = "bytes", count = 16, note = "the largest push per axis" },
  { name = "pair_torque", offset = 176, type = "bytes", count = 16, note = "the summed torque from pairs this tick" },
  { name = "push_count", offset = 192, type = "u32" },
  { name = "push_scale", offset = 208, type = "bytes", count = 16, note = "a per-axis scale of the push-out" },
  { name = "torque_scale", offset = 224, type = "f32" },
  { name = "next", offset = 228, type = "ptr", to = "CollisionWorldObject", note = "in the world's active or free list" },
  { name = "previous", offset = 232, type = "ptr", to = "CollisionWorldObject" },
  { name = "unknown_236", offset = 236, type = "u32" },
  { name = "first_contact", offset = 240, type = "ptr", to = "CollisionContact" },
  { name = "groups", offset = 244, type = "u32", note = "its own groups" },
  { name = "collides_with", offset = 248, type = "u32" },
  { name = "mask", offset = 252, type = "u32" },
  { name = "response_bits", offset = 256, type = "u32" },
  { name = "push_out_bits", offset = 260, type = "u32" },
  { name = "first_pair", offset = 264, type = "ptr", to = "CollisionPair" },
  { name = "owner_id", offset = 268, type = "u32", note = "objects with the same nonzero id don't pair" },
  { name = "no_queries", offset = 272, type = "u32" },
  { name = "unknown_276", offset = 276, type = "u32" },
  { name = "box_friction", offset = 280, type = "u32", note = "set: friction from the +344 object alone" },
  { name = "unmoved", offset = 284, type = "u32", note = "0 after a move" },
  { name = "moved", offset = 288, type = "u32" },
  { name = "push_out", offset = 304, type = "bytes", count = 16, note = "this pass's push-out" },
]

# The collision object's vtable (0x82002A94).
[CollisionWorldObjectVtable]
measure = "new<72>@CollisionWorld::Create.+24.+0"
size = 4
origin = "image"
fields = [
  { name = "deleting_destructor", offset = 0, type = "fn", note = "slot 0 (0x820B9110)" },
]

# A pair of collision objects (32 bytes in the world's +36). The measure files
# CollisionWorld::LinkPair's and the like's pair under "CollisionWorld".
[CollisionPair]
measures = ["CollisionPair", "CollisionWorld", "CollisionWorld.+4", "CollisionWorld.+4.+8", "CollisionWorld.+8", "CollisionWorld.+12"]
size = 32
origin = "allocated"
fields = [
  { name = "a_previous", offset = 0, type = "ptr", to = "CollisionPair", note = "the previous pair on A's list" },
  { name = "b_previous", offset = 4, type = "ptr", to = "CollisionPair" },
  { name = "a_next", offset = 8, type = "ptr", to = "CollisionPair" },
  { name = "b_next", offset = 12, type = "ptr", to = "CollisionPair" },
  { name = "a", offset = 16, type = "ptr", to = "CollisionWorldObject" },
  { name = "b", offset = 20, type = "ptr", to = "CollisionWorldObject" },
  { name = "separated_face", offset = 24, type = "u32", note = "0 when made, then the face that last separated the boxes" },
  { name = "next_check", offset = 28, type = "f32", note = "the next time to check it" },
  { name = "object_groups", offset = 244, type = "u32", note = "CollisionPair::Respond's object (its +244: the measure's)" },
  { name = "object_response_bits", offset = 256, type = "u32", note = "the measure's, as +244" },
  { name = "object_push_out_bits", offset = 260, type = "u32", note = "the measure's, as +244" },
  { name = "object_owner_id", offset = 268, type = "u32", note = "CollisionWorld::AddPairs' object (the measure's)" },
]

# A contact on a collision object (from its +240, linked by +68; the world's +48).
[CollisionContact]
# measures from CollisionObjectContact (vehicle-accessors), merged at the integration
measures = ["new<4294967295>@CollisionWorld::Create#4", "CollisionWorld::NewContact.ret",
  "Contact", "CollisionObject.+240.+68"]
size = 80
origin = "allocated"
fields = [
  { name = "other", offset = 0, type = "u32", note = "the other object" },
  { name = "flags", offset = 4, type = "u32" },
  { name = "position", offset = 16, type = "bytes", count = 16 },
  { name = "normal", offset = 32, type = "bytes", count = 16, note = "the hit's normal" },
  { name = "push_direction", offset = 48, type = "bytes", count = 16 },
  { name = "strength", offset = 64, type = "f32", note = "the approach speed into the surface" },
  { name = "next", offset = 68, type = "ptr", to = "CollisionContact" },
  { name = "push_direction_x", offset = 48, type = "f32", note = "from CollisionObjectContact (vehicle-accessors)" },
  { name = "push_direction_y", offset = 52, type = "f32", note = "from CollisionObjectContact (vehicle-accessors)" },
]

# A hit record (80 bytes, the world's +64 and +68; written by the track's queries).
[CollisionHit]
measures = ["new<4294967295>@CollisionWorld::Create#3", "new<4294967295>@CollisionWorld::SetQueryCapacity", "CollisionRecords::Merge.r4", "CollisionWorld::Create.r6", "WallQuery.+8"]
size = 80
origin = "allocated"
fields = [
  { name = "point", offset = 0, type = "bytes", count = 16 },
  { name = "normal", offset = 16, type = "bytes", count = 16, note = "probably the surface normal" },
  { name = "push", offset = 32, type = "bytes", count = 16, note = "the push direction" },
  { name = "depth", offset = 48, type = "f32" },
  { name = "depth_2", offset = 52, type = "f32", note = "the depth again (walls)" },
  { name = "surface_bits", offset = 56, type = "u32", note = "0x07000000" },
  { name = "key", offset = 60, type = "u32", note = "hits with the same key are merged" },
  { name = "time", offset = 64, type = "f32", note = "2.0 from the wall query" },
]

# CollisionObject::Respond's flag word (the first query's skip case).
[CollisionSkipFlag]
measure = "CollisionObject::Respond.r6"
size = 4
origin = "frame"
fields = [
  { name = "set", offset = 0, type = "u32" },
]

# The vehicle's collision box's vtable (BoxShape, 0x82002B30).
[VehicleBoxVtable]
measure = "Vehicle.+344.+0"
size = 4
origin = "image"
fields = [
  { name = "deleting_destructor", offset = 0, type = "fn", note = "slot 0" },
]

