# The schema of docs/functions/car-physics.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The car physics: the vehicle, its wheels and axles, the rigid body, the car
# data and the collision world (src/car_physics/). Vectors (16 bytes) and
# matrices (64) are bytes fields: the code passes their addresses to the
# vector library and the matrix math.

# The vehicle (a racer's car in the race world): its physics state, its wheels
# and axles, the embedded car data (+3376), its track positions and status.
# Shared with vehicle.md, ai-drivers.md, the HUDs and the sounds (docs/known-data.md's
# "vehicle" rows). The measure also files the car data's own accesses here
# (+272's pointee is the car data at +3376, +2144's the axle records at +1888 and
# +2016, +2160's the car data's axle records, Vehicle::SetupFromCar's and
# ApplyTuning's r3 the car data): the fields marked so are those.
[Vehicle]
measure = "Vehicle"
measures = ["Vehicle::UpdateDrivenAxle.ret", "Vehicle::Get.ret", "AiDriver.+160", "Vehicle.+2160", "Vehicle.+2144"]
size = 6268
origin = "embedded"
fields = [
  { name = "body_row0", offset = 0, type = "bytes", count = 16, note = "the body matrix's row 0, w 0.0 (Vehicle::SyncFromBody); the car's forward axis is -row 0" },
  { name = "body_row1", offset = 16, type = "bytes", count = 16, note = "row 1 (up), w 0.0" },
  { name = "body_row2", offset = 32, type = "bytes", count = 16, note = "row 2, w 0.0" },
  { name = "speed", offset = 48, type = "f32", note = "the speed (m/s), the body's +160" },
  { name = "unknown_52", offset = 52, type = "f32" },
  { name = "unknown_56", offset = 56, type = "f32", note = "only Vehicle::SetupFromCar's (the car data's +56: the measure's)" },
  { name = "angular_velocity", offset = 64, type = "bytes", count = 16, note = "the body's angular velocity" },
  { name = "unknown_80", offset = 80, type = "f32", note = "set by Vehicle::ApplyForces' tip check" },
  { name = "unknown_84", offset = 84, type = "f32", note = "set by Vehicle::ApplyForces' tip check" },
  { name = "roll", offset = 88, type = "f32", note = "probably the roll (Vehicle::ProbeGround's last dot product)" },
