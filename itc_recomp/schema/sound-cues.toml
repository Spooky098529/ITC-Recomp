measures = ["sub_8259CC80.r4", "Listener::SetOrientation.r4", "Listener::SetOrientation.r5", "Listener::SetPosition.r4"]
size = 12
origin = "embedded"
fields = [
  { name = "x", offset = 0, type = "f32" },
  { name = "y", offset = 4, type = "f32" },
  { name = "z", offset = 8, type = "f32" },
]

# --- The audio engine and XACT's engine ---

# The manager's +16: the game's XACT and X3DAudio state (AudioEngine::Start3D
# sub_8259CE10; the start-up sub_8259D1F0, files-and-saves.md). A measure
# fault: X3DAudioInitialize's handle (r5, the engine's +12 or 0x826C5C90) is
# joined with the engine at +0, so the handle's words show at +0 to +12 too
# (fault_* below).
[AudioEngine]
measures = ["AudioEngine", "sub_8259D1F0.r3.+28"]
size = 100
origin = "embedded"
fields = [
  { name = "settings", offset = 0, type = "u32", note = "the global settings (TXR_XACT.xgs) read whole (also the fault's handle: speaker count)" },
  { name = "settings_size", offset = 4, type = "u32", note = "its size (also the fault's handle: LFE speaker)" },
