  { name = "top_z", offset = 20, type = "f32" },
  { name = "position_x", offset = 24, type = "f32", note = "(0, 0, [0x82001FD8]) at first" },
  { name = "position_y", offset = 28, type = "f32" },
  { name = "position_z", offset = 32, type = "f32" },
  { name = "velocity_x", offset = 36, type = "f32" },
  { name = "velocity_y", offset = 40, type = "f32" },
  { name = "velocity_z", offset = 44, type = "f32" },
  { name = "param_0", offset = 48, type = "f32", note = "[0x82002A0C] at first; AudioManager::SetListenerParams's (slot 28, not seen in play)" },
  { name = "param_1", offset = 52, type = "f32", note = "[0x820027A4] at first; Listener::SetFloat52's" },
]

# sub_8259CC80's r3: an emitter (+36 its position) or the listener (+36 its
# velocity).
[SoundVector36Target]
measure = "sub_8259CC80.r3"
size = 48
origin = "embedded"
fields = [
  { name = "vector_x", offset = 36, type = "f32" },
  { name = "vector_y", offset = 40, type = "f32" },
  { name = "vector_z", offset = 44, type = "f32" },
]

# A vector (three floats) given by address to the listener's and emitter's
