# The schema of docs/functions/sound-cues.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The sound manager's objects below it (the manager itself, AudioManager, is
# menu-sounds.toml's): its Sounds (PlayingSound) and their emitters
# (SoundEmitter), the bank pairs and their holders, the listener, the audio
# engine (the manager's +16: the game's XACT and X3DAudio state), XACT's
# engine object as far as the wrapper and XACT3CreateEngine meet it, the
# Sounds' list, the bank vector, the delegate clone and the words the
# manager's methods are given by address. Left out (the measure files them
# here, but they're the manager, menu-sounds.toml's AudioManager and its
# vtable, split by the measure): sub_82119188.r3 and its +0 (the manager and
# its vtable's slot +92), sub_82118930.r3 (+1516, +1520) and
# sub_82119018.r3 (+1532).

# --- The Sounds and their emitters ---

# A playing cue (24 bytes, Sound::Sound sub_82117348; the game's Sound class).
[PlayingSound]
measure = "Sound"
size = 24
origin = "allocated"
fields = [
  { name = "owner", offset = 0, type = "u32", note = "the manager's +8 interface (its slot +4 GetSoundBank; +8 and +12 the 3D state and the listener)" },
  { name = "emitter", offset = 4, type = "ptr", to = "SoundEmitter", note = "its emitter (300 bytes)" },
  { name = "flags", offset = 8, type = "u32", note = "bytes +8 to +11 as one word (Sound::Sound's clear)" },
  { name = "is_3d", offset = 8, type = "u8", note = "3D: X3DAudio's calculation each update (never set in play)" },
  { name = "loop", offset = 9, type = "u8", note = "played again once stopped" },
  { name = "was_playing", offset = 10, type = "u8" },
  { name = "start_requested", offset = 11, type = "u8", note = "Sound::Start; cleared when Sound::Update plays the cue" },
  { name = "handle", offset = 12, type = "u32", note = "Sound::SetHandle (only the handle list's Sounds, menu-sounds.md)" },
  { name = "bank_index", offset = 16, type = "u32" },
  { name = "cue_index", offset = 20, type = "u32" },
]

# A Sound's emitter (300 bytes, Emitter::Emitter sub_8259C9B0): the XACT cue,
# an X3DAudio emitter at +8 in the 360's layout (no inner radius; car-sounds'
# X3DAudioEmitter), its cone at +100 and azimuth at +132, then from +136 a
# block handed to the cue with each prepare.
[SoundEmitter]
measure = "Emitter"
size = 300
origin = "allocated"
fields = [
  { name = "cue", offset = 0, type = "ptr", to = "EmitterCue", note = "the XACT cue (0 none)" },
  { name = "unknown_4", offset = 4, type = "f32" },
  { name = "cone", offset = 8, type = "u32", note = "the X3DAudio emitter's cone pointer: this emitter's +100" },
  { name = "fault_8_f32", offset = 8, type = "f32", note = "read as a float (probably a measure fault: another object joined)" },
  { name = "front_x", offset = 12, type = "f32", note = "front (0, 0, 1)" },
  { name = "front_y", offset = 16, type = "f32" },
  { name = "front_z", offset = 20, type = "f32" },
  { name = "top_x", offset = 24, type = "f32", note = "top (0, 1, 0)" },
  { name = "top_y", offset = 28, type = "f32" },
  { name = "top_z", offset = 32, type = "f32" },
  { name = "position_x", offset = 36, type = "f32", note = "Sound::SetPosition's (sub_8259CC80)" },
  { name = "position_y", offset = 40, type = "f32" },
  { name = "position_z", offset = 44, type = "f32" },
  { name = "velocity_x", offset = 48, type = "f32" },
  { name = "velocity_y", offset = 52, type = "f32" },
  { name = "velocity_z", offset = 56, type = "f32" },
  { name = "channel_count", offset = 60, type = "u32", note = "1" },
  { name = "channel_radius", offset = 64, type = "f32", note = "0" },
  { name = "channel_azimuths", offset = 68, type = "u32", note = "this emitter's +132" },
  { name = "volume_curve", offset = 72, type = "u32", note = "0: the library's default" },
  { name = "lfe_curve", offset = 76, type = "u32" },
  { name = "lpf_direct_curve", offset = 80, type = "u32" },
  { name = "lpf_reverb_curve", offset = 84, type = "u32" },
  { name = "reverb_curve", offset = 88, type = "u32" },
  { name = "curve_distance_scaler", offset = 92, type = "f32", note = "1" },
  { name = "doppler_scaler", offset = 96, type = "f32", note = "1" },
  { name = "cone_inner_angle", offset = 100, type = "f32", note = "the cone (0, 0, 0, 1, 0, 1, 0, 1): probably no cone" },
  { name = "cone_outer_angle", offset = 104, type = "f32" },
  { name = "cone_inner_volume", offset = 108, type = "f32" },
  { name = "cone_outer_volume", offset = 112, type = "f32" },
  { name = "cone_inner_lpf", offset = 116, type = "f32" },
  { name = "cone_outer_lpf", offset = 120, type = "f32" },
  { name = "cone_inner_reverb", offset = 124, type = "f32" },
  { name = "cone_outer_reverb", offset = 128, type = "f32" },
  { name = "azimuth", offset = 132, type = "f32", note = "the one channel's azimuth (0)" },
  { name = "cue_properties", offset = 136, type = "bytes", count = 14, note = "the cue's GetProperties (xact.md's sub_825C5790): category, track count, priority, the first wave's index, a duration, the channel count" },
  { name = "unknown_152", offset = 152, type = "f32", note = "1.0 (not read)" },
  { name = "unknown_156", offset = 156, type = "f32", note = "1.0 (not read)" },
  { name = "map_0_index", offset = 164, type = "u8", note = "six (index byte, 1.0) pairs from +164 (not read: probably an output map)" },
  { name = "map_0_gain", offset = 168, type = "f32" },
  { name = "map_1_index", offset = 172, type = "u8" },
  { name = "map_1_gain", offset = 176, type = "f32" },
  { name = "map_2_index", offset = 180, type = "u8" },
  { name = "map_2_gain", offset = 184, type = "f32" },
  { name = "map_3_index", offset = 188, type = "u8" },
  { name = "map_3_gain", offset = 192, type = "f32" },
  { name = "map_4_index", offset = 196, type = "u8" },
  { name = "map_4_gain", offset = 200, type = "f32" },
  { name = "map_5_index", offset = 204, type = "u8" },
  { name = "map_5_gain", offset = 208, type = "f32" },
  { name = "map_count", offset = 212, type = "u8", note = "6: the map's count" },
  { name = "map", offset = 216, type = "u32", note = "this emitter's +164: the map's pairs" },
  { name = "single_map_index", offset = 220, type = "u8", note = "a one-pair map: index 0 (not read)" },
  { name = "single_map_gain", offset = 224, type = "f32", note = "1.0" },
  { name = "single_map_count", offset = 268, type = "u8", note = "1" },
  { name = "single_map", offset = 272, type = "u32", note = "this emitter's +220" },
  { name = "unknown_276", offset = 276, type = "u8", note = "0 (not read)" },
  { name = "map_descriptor", offset = 280, type = "u32", note = "this emitter's +212 (not read)" },
  { name = "unknown_284", offset = 284, type = "u8", note = "1 (not read)" },
  { name = "single_map_descriptor", offset = 288, type = "u32", note = "this emitter's +268 (not read)" },
  { name = "unknown_292", offset = 292, type = "u8", note = "1 (not read)" },
  { name = "unknown_296", offset = 296, type = "u32", note = "this emitter's +276 (not read)" },
]

# The XACT cue as the emitter's methods meet it (xact.md's XACTCue). A
# measure fault: the slots of the cue's vtable (cue +0) are filed on the cue
# itself, one level up, so +4 to +60 below are the vtable's.
[EmitterCue]
measure = "Emitter.+0"
size = 64
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "the cue's vtable (and, through the fault, its slot 0: probably Play)" },
  { name = "fault_stop", offset = 4, type = "fn", note = "the vtable's slot +4: probably Stop (Emitter::Stop, with 1: at once)" },
  { name = "fault_get_state", offset = 8, type = "fn", note = "the vtable's slot +8: probably GetState (Emitter::IsNotStopped, IsPrepared)" },
  { name = "fault_destroy", offset = 12, type = "fn", note = "the vtable's slot +12: probably Destroy (Emitter::DestroyCue)" },
  { name = "fault_get_properties", offset = 60, type = "fn", note = "the vtable's slot +60: GetProperties (Emitter::Prepare, into the emitter's +136)" },
]

# The XACT sound bank as Emitter::Prepare meets it (the holder's +8; xact.md's
# XACTSoundBank).
[EmitterSoundBank]
measure = "Emitter::Prepare.r4.+8"
size = 4
origin = "allocated"
fields = [
  { name = "vtable", offset = 0, type = "ptr", to = "EmitterSoundBankVtable" },
]

[EmitterSoundBankVtable]
measure = "Emitter::Prepare.r4.+8.+0"
size = 8
origin = "image"
fields = [
  { name = "prepare", offset = 4, type = "fn", note = "probably Prepare (the cue index, flags 0, time 0, the cue into the emitter's +0)" },
]

# Emitter::Prepare's cue index, by address (16 bits).
[EmitterCueIndex16]
measure = "Emitter::Prepare.r5"
size = 2
origin = "embedded"
fields = [
  { name = "index", offset = 0, type = "u16" },
]

# --- The bank pairs and their holders ---

# A loaded wave bank and sound bank (112 bytes, BankPair::BankPair
# sub_82117D08). Its first 36 bytes are the command base the manager's handler
# at +1584 also is (menu-sounds.toml's AudioManager: handler_*).
[SoundBankPair]
measure = "BankPair"
size = 112
origin = "allocated"
vtable = 0x820066DC
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x820066DC (0x82000EB8, the base's, first)" },
  { name = "vtable2", offset = 4, type = "u32", note = "0x82002908 (0x82000AB4, then 0x82000BA8, first)" },
  { name = "command_8", offset = 8, type = "u32", note = "the command base's +8, 0" },
  { name = "command_12", offset = 12, type = "u32", note = "the command base's +12, 0 (the manager's handler runs sub_82094B10 at 3)" },
  { name = "command_flag_16", offset = 16, type = "u8", note = "0" },
  { name = "command_flag_17", offset = 17, type = "u8", note = "1" },
  { name = "command_flag_18", offset = 18, type = "u8", note = "0" },
  { name = "delegate_vtable", offset = 24, type = "u32", note = "0x82002850 (0x82000ABC first)" },
  { name = "delegate_28", offset = 28, type = "u32", note = "0" },
  { name = "delegate_32", offset = 32, type = "u32", note = "0" },
  { name = "owner", offset = 36, type = "u32", note = "the manager's +4 interface (its slot +12 GetEngine)" },
  { name = "name", offset = 40, type = "bytes", count = 28, note = "a std::string" },
  { name = "skip_wave_bank", offset = 68, type = "u8", note = "1 skips the wave bank's load (probably one loaded elsewhere)" },
  { name = "release_requested", offset = 69, type = "u8", note = "BankPair::Release" },
  { name = "wave_bank_holder", offset = 72, type = "ptr", to = "WaveBankHolder" },
  { name = "sound_bank_holder", offset = 76, type = "ptr", to = "SoundBankHolder" },
  { name = "bank_index", offset = 80, type = "u32" },
  { name = "wave_bank_file_id", offset = 84, type = "u32" },
  { name = "sound_bank_file_id", offset = 88, type = "u32" },
  { name = "wave_bank_size", offset = 92, type = "u32" },
  { name = "sound_bank_size", offset = 96, type = "u32" },
  { name = "wave_bank_buffer", offset = 100, type = "u32", note = "XPhysicalAlloc's (bank 2: [0x826C5C88])" },
  { name = "sound_bank_buffer", offset = 104, type = "u32", note = "operator new[]'s (bank 2: [0x826C5C8C])" },
  { name = "wave_bank_loaded", offset = 108, type = "u8" },
  { name = "sound_bank_loaded", offset = 109, type = "u8" },
]

# A bank pair's wave bank holder (28 bytes, WaveBankHolder::WaveBankHolder
# sub_8259D418).
[WaveBankHolder]
measures = ["WaveBankHolder", "BankPair.+72"]
size = 28
origin = "allocated"
fields = [
  { name = "buffer", offset = 0, type = "u32" },
  { name = "size", offset = 4, type = "u32" },
  { name = "wave_bank", offset = 8, type = "u32", note = "the XACT wave bank" },
  { name = "handle", offset = 12, type = "u32", note = "a file handle, -1 for none (always, in play)" },
]

# A bank pair's sound bank holder (12 bytes, SoundBankHolder::SoundBankHolder
# sub_8259D3D8; Emitter::Prepare's r4).
[SoundBankHolder]
measures = ["SoundBankHolder", "Emitter::Prepare.r4"]
size = 12
origin = "allocated"
fields = [
  { name = "buffer", offset = 0, type = "u32" },
  { name = "size", offset = 4, type = "u32" },
  { name = "sound_bank", offset = 8, type = "ptr", to = "EmitterSoundBank", note = "the XACT sound bank" },
]

# A slot of the manager's bank vector, by address (a bank pair or 0).
[BankPairSlot]
measures = ["sub_82118438.r3", "sub_82118930.r3.+1516"]
size = 4
origin = "embedded"
fields = [
  { name = "pair", offset = 0, type = "ptr", to = "SoundBankPair" },
]

# --- The listener ---

# The manager's +1456 (56 bytes, Listener::Listener sub_8259D478): an X3DAudio
# listener (car-sounds' X3DAudioListener) and two floats.
[SoundListener]
measure = "Listener"
size = 56
origin = "embedded"
fields = [
  { name = "front_x", offset = 0, type = "f32", note = "front (0, 0, 1)" },
  { name = "front_y", offset = 4, type = "f32" },
  { name = "front_z", offset = 8, type = "f32" },
  { name = "top_x", offset = 12, type = "f32", note = "top (0, 1, 0)" },
