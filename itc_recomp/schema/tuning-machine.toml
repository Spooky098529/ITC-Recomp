# The type 2 mode (type2-mode.md) as the machine's handlers see it (r4):
# only its message ring, which they post to.
[TuningMachineMode]
measures = ["TuningMachine::Close.r4", "TuningMachine::OnDialogClosed.r4"]
size = 812
origin = "embedded"
fields = [
  { name = "messages", offset = 204, type = "bytes", count = 600, note = "50 messages of 12 bytes (id, two words)" },
  { name = "message_count", offset = 804, type = "u32" },
  { name = "message_start", offset = 808, type = "u32", note = "the ring's first slot" },
]

[globals]
float_zero = { address = 0x82000A34, type = "u32", note = "0.0 (as bits)" }
float_one = { address = 0x82000A30, type = "u32", note = "1.0 (as bits)" }
axle_factor = { address = 0x820021E8, type = "f32", note = "the axles' factor in the weight (2.0 probably)" }
torque_scale = { address = 0x8200ADA0, type = "f32", note = "the torque shown's scale" }
fade_in_passes = { address = 0x82001BEC, type = "u32", note = "ScreenFades::FadeIn's pass count" }
