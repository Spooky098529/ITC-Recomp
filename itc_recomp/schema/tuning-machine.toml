# The schema of docs/functions/tuning-machine.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 2 mode's tuning screen machine: the tuning screen itself (the
# type 2 mode block's +19792), its +9604 the machine's state
# (src/tuning_machine/). Its fields are in docs/known-data.md ("tuning
# screen").
#
# The seed's other types aren't described here:
# - "new<28>@TuningMachine::Create" is the screen's command queue
#   ([+10036], 28 bytes, VirtualAlloc'ed by Create): menu-helpers.toml's
#   PageObject (a measure name to add there).
# - "new<68>@TuningMachine::Create" is the category menu ([+10040]) and
#   the second menu ([+10044]), 68 bytes each: menu-helpers.toml's
#   FrontEndMenu (a measure name to add there).
# - "UiMovies::Find.ret.+0.+28.+636" (movie 14's texture slot 159, its +0
#   the placeholder texture DecalImages::SavePlaceholders14 keeps) is
#   tuning-pages.toml's UiMovieTexture (a measure name to add there).

# The tuning screen as its machine's handlers see it (r3). The measure
# files the screen's TuningScreen:: functions under "TuningScreen"
# (tuning-screen.md's) and the machine's handlers under "TuningMachine":
# one object, to merge into tuning-screen.toml's type (this one's names
# follow docs/known-data.md as that one's should).
[TuningMachineScreen]
measure = "TuningMachine"
size = 36828
origin = "embedded"
fields = [
  { name = "transitions", offset = 0, type = "bytes", count = 9600, note = "200 transitions, 48 bytes each (StateMachine's); the measure's +0 to +12 are ZeroRecord16's record (+30800, +30816), a measure fault" },
  { name = "transition_count", offset = 9600, type = "u32" },
  { name = "state", offset = 9604, type = "u32", note = "the machine's state: 1 open the movies, 2 wait for them, 9 wait for message 12, 4 start, 5 running, 8 unloading, 7 closing, 6 done" },
  { name = "movies_loaded", offset = 9608, type = "u32", note = "movies 2, 13 and 14 loaded" },
  { name = "reenter", offset = 9612, type = "u32", note = "nonzero: wait for message 12 after loading (1 from the mode's Init)" },
  { name = "delete_movies", offset = 9616, type = "u32", note = "nonzero: Unload deletes movies 2, 13 and 14" },
  { name = "screen_state", offset = 9652, type = "u32", note = "the screen's state, 3 to 58 (3 TUNING SHOP MAIN, 4 the category menu, 9 CONF BUY, 10 the money short, 11 CONF EQUIP, ...)" },
