# The schema of docs/functions/second-set.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The second set of the car scene's object pools (src/second_set/): its
# objects (pool 0 the car model, 2 the cockpit body, 3 the interior, 5 the
# wheels, 6 the traffic body; pool 1 the parts is load-poll.toml's
# SceneParts, pool 4 the light kit scene-models.toml's SceneLightKit, pool 7
# the scene model scene-models.toml's SceneModel), their 240-byte point
# records, the cockpit's, interior's and wheels' point blocks (the parts',
# light kit's and traffic body's are car-draw.toml's PartsPoints, LightPoints
# and TrafficPoints), the scene model's 736-byte block and the wheels' morph.
#
# As in car-draw.toml, the measure meets a point block through each group's
# functions (r3 the group), so a point block type holds both the block's own
# words and the words its groups hold at the same offsets from their own
# start (records at +240k or +16 + 240k). Arrays (the records, a group, a
# matrix) are `bytes`: an element is a view at `<field>_address() + n x its
# size` (SecondSetPointRecord for a record).

# Pool 0 of the second set: a car model (3,744 bytes, vtable 0x82005130,
# SceneCarModel::SceneCarModel sub_820DB770), a PoolNode at +0.
[SceneCarModel]
measure = "SceneCarModel"
size = 3744
origin = "allocated"
vtable = 0x82005130
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82005130; the pool objects' base 0x82004F90 before ~PoolNode" },
  { name = "state", offset = 16, type = "u32", note = "the pool object's: 0 free, 3 in use" },
  { name = "index", offset = 20, type = "u32", note = "its index in the pool (-1 from the constructor)" },
  { name = "car_model", offset = 24, type = "ptr", to = "SecondSetFirstSetObject", note = "the first set's car model (car-models.toml's CarModel); handed back by ScenePools::ReleaseA with its +20" },
  { name = "car_record", offset = 32, type = "bytes", count = 3696, note = "the 3,696-byte car record (scene-models.toml's CarRecord)" },
  { name = "scene", offset = 3728, type = "ptr", to = "CarScene", note = "the car scene (0 when reset)" },
]

# A first set's object a second set object holds (the car model's +24, the
# scene model's +5084 pool 4 object) as the releases read it: its pool index.
[SecondSetFirstSetObject]
measures = ["SceneCarModel.+24", "SceneModel.+5084"]
size = 24
origin = "embedded"
fields = [
  { name = "index", offset = 20, type = "u32", note = "its index in its pool (ScenePools::ReleaseA's r5, ReleaseB's)" },
]

