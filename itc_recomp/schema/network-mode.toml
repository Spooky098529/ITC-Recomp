  { name = "ta_course", offset = 38560, type = "bytes", count = 9640, note = "index 5, NetTaCourse" },
  { name = "power_graph", offset = 48200, type = "bytes", count = 9640, note = "index 14, PowerGraphScreen12 (type2-screens.md)" },
