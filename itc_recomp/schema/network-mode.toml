  { name = "first_shown", offset = 135184, type = "u32", note = "+0x21010: the first screen's index (Init)" },
  { name = "next_answer", offset = 135188, type = "u64", note = "+0x21014: the next mode's 8-byte answer (NextMode, handed over by Teardown)" },
