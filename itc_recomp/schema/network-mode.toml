# The schema of docs/functions/network-mode.md's objects (docs/e5-native.md, step 2):
# seeded by tools/schema_seed.py from the measure, then edited by hand.
# Field types: u8 u16 u32 u64 s8 s16 s32 f32 f64, ptr (with `to`), fn
# (a function's address), bytes (with `count`). `measure` is the type's
# name in tools/type_map.py's tables.
#
# The type 12 mode (the Xbox Live mode, unreachable since 2026-11-14): the
# mode, its 135,208-byte block of fourteen screen machines, the machines'
# words, the mode select's data, the ranking's data and the network
# session (src/network_mode/).
#
# Not described here, other areas' types the measure filed here:
# - the menus (new<68>@NetModeSelect::Create, @NetRanking::Create#2,
#   @Type12Screen3::Create, @Type12Dialog10::Create,
#   @Type12Dialog12::Create) are menu-helpers.toml's FrontEndMenu, and the
#   page object (new<28>@NetModeSelect::Create) its PageObject: their
#   measure names belong in those types' `measures` (for the lead).

# The type 12 mode (852 bytes, ModeType12::ModeType12; vtable 0x82006C6C):
# the game mode's base (boot-mode.toml's GameMode), then the block. The
# measure joins it with the 8-byte next-mode answer its delegate functions
# get (r3: +0 a byte, +4 a word, as GameMode's answer_*) and with its +32
# interface (Interrupt, ForceExit and Resume get the mode + 32: their +808,
# +812 and +816 are the mode's ring count, ring start and block).
[ModeType12]
measures = ["ModeType12", "ModeType12::LeaveScreen.r4", "ModeType12::NextMode.r4",
            "ModeType12::Teardown.r4", "ModeType12::WaitForLoads.r4",
            "ModeType12::WaitForShown.r4"]
size = 852
origin = "allocated"
vtable = 0x82006C6C
fields = [
  { name = "vtable", offset = 0, type = "u32", note = "0x82006C6C" },
  { name = "answer_changed", offset = 0, type = "u8", note = "measure fault: the next-mode answer's byte +0 (the delegate functions' r3), not the mode's" },
  { name = "delegate_ptr", offset = 4, type = "u32", note = "the delegate at +8, 0 when none (also the answer's +4 by the measure's join)" },
  { name = "delegate_vtable", offset = 8, type = "u32", note = "the delegate: vtable 0x82010FA0" },
  { name = "delegate_object", offset = 12, type = "u32", note = "the delegate's object: the mode" },
  { name = "delegate_function", offset = 16, type = "fn", note = "the delegate function's thunk (Mode::Slot8Thunk, NextModeThunk, Slot10Thunk to Slot12Thunk)" },
  { name = "delegate_adjustment", offset = 20, type = "u32" },
  { name = "vtable32", offset = 32, type = "u32", note = "the +32 interface's vtable 0x82006C60 (Interrupt, ForceExit, Resume)" },
  { name = "handlers", offset = 36, type = "bytes", count = 200, note = "the dispatcher (+36, ModeDispatcher): 50 handler pointers (the fourteen machines)" },
  { name = "handler_count", offset = 236, type = "u32" },
  { name = "ring", offset = 240, type = "bytes", count = 600, note = "the dispatcher's ring: 50 messages of 12 bytes (id, two words); the +32 interface's +808 and +812 are ring_count and ring_start" },
  { name = "ring_count", offset = 840, type = "u32" },
  { name = "ring_start", offset = 844, type = "u32" },
  { name = "block", offset = 848, type = "ptr", to = "NetModeBlock", note = "the block, VirtualAlloc'ed by Init (the +32 interface's +816)" },
  { name = "select_loaded", offset = 9608, type = "u32", note = "measure fault: AllLoaded's r3 is the block (NetModeBlock): the mode select's loaded word" },
  { name = "screen1_loaded", offset = 19248, type = "u32", note = "measure fault: the block's screen 1 (+9640) loaded word, read by AllLoaded" },
  { name = "screen3_loaded", offset = 28888, type = "u32", note = "measure fault: the block's screen 3 (+19280) loaded word, read by AllLoaded" },
]

# The mode's block (135,208 bytes at the mode's +848, VirtualAlloc'ed by
# ModeType12::Init, freed by ModeType12::Release; known-data.md's "type 12
# mode block"): fourteen machines (NetMachine) by ModeType12::Machine's
# index, then the mode's words.
[NetModeBlock]
measures = ["new<135208>@ModeType12::Init", "ModeType12.+816", "ModeType12::Teardown.r4.+848"]
size = 135208
origin = "allocated"
fields = [
  { name = "mode_select", offset = 0, type = "bytes", count = 9640, note = "index 0, NetModeSelect" },
